# KillBill RBAC.
#
# TWO principals, deliberately. The app under test and the grader used to share
# `orbit-admin`, whose role is `*:*` -- so the agent authenticated as the same
# principal that verifies its work, on a store the task's whole premise rests on
# ("an invoice must exist in killbill, and a confirmation the app returns to
# itself does not count"). The evidence store was writable at full privilege by
# the thing being evidenced.
#
# The app cannot be denied account and invoice writes: creating them IS the task.
# What it does not need is everything else -- tenant configuration, catalog
# upload, user administration, or any admin-only endpoint. `vela-app` is scoped
# to exactly the three operations the brief names (create an account, look one
# up by externalKey, raise an invoice), and `orbit-admin` stays with the grader.
[users]
orbit-admin = kb-admin-9c41f7be, root
vela-app = kb-app-5d83e0a7, storefront

[roles]
root = *:*
storefront = account:*, invoice:*, payment:*
