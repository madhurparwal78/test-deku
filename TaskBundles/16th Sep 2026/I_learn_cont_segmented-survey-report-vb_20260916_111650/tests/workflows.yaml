- id: visitor_reads_a_chapter_with_every_claim_beside_its_chart
  purpose: "A visitor with no account opens the cover, goes straight to chapter one and reads findings whose headings, charts, text equivalents and source lines come from one dataset"
  substeps:
    - kind: browser
      do: "Open / signed out and observe a solid near-black title block reading Studio Signals with 2026 beneath it, over a drifting gradient ground scattered with captioned tiles"
      cov: C-FE-01, C-FE-02
    - kind: browser
      do: "Scroll the cover and observe the contents listing 01 Tools, 02 Craft and 03 Teams each with a reading time, then the case-study set as seven numbered cards"
      cov: C-FE-03, C-FE-04
    - kind: browser
      do: "Choose Read the Report and observe 01 Tools opening directly, with the sidebar rail listing How often designers use AI, What is in the stack, How the stack moved and the three closers"
      cov: C-UF-01, C-CF-01
    - kind: browser
      do: "Observe the first finding with the heading 46% use AI tools every day, up 16 points since 2025., a chart of five options with Every day first, and the table The figures behind this chart beneath it"
      cov: C-CF-02, C-FE-05
    - kind: browser
      do: "Observe the source line naming the Studio Signals survey, 2026 wave, all respondents and base 869, followed by Directional, not a benchmark. See methodology. as a link"
      cov: C-CF-03, C-CF-04
    - kind: browser
      do: "Scroll to the end of the chapter and observe the rail marking Relevant posts & resources as current, Key takeaways listing three linked headings, and a next control reading 02 . Craft with no previous control"
      cov: C-CF-05, C-CF-06
    - kind: pytest
      test: test_output.py::test_the_report_lists_three_chapters_in_reading_order_with_nine_findings
      category: core_outcome
      weight: 5
      cov: C-CF-07, C-DC-01
    - kind: pytest
      test: test_output.py::test_every_heading_for_all_respondents_matches_its_regenerated_template
      critical: true
      category: core_outcome
      weight: 5
      cov: C-CF-08, C-CF-09
    - kind: pytest
      test: test_output.py::test_the_chapter_markup_carries_each_heading_source_line_and_figures_table
      category: presentation
      weight: 1
      cov: C-CF-10, C-FE-06
    - kind: pytest
      test: test_output.py::test_key_takeaways_repeat_each_findings_heading_in_order
      category: business_rule
      weight: 3
      cov: C-CF-11, C-DC-02
    - kind: pytest
      test: test_output.py::test_the_reading_time_is_a_whole_number_of_minutes_with_charts_excluded
      category: presentation
      weight: 1
      cov: C-CF-12
    - kind: pytest
      test: test_output.py::test_the_first_chapter_has_no_previous_control_and_the_last_has_no_next
      category: business_rule
      weight: 3
      cov: C-CF-13
    - kind: pytest
      test: test_output.py::test_the_rail_marks_one_current_entry_programmatically
      category: presentation
      weight: 1
      cov: C-UX-01
    - kind: pytest
      test: test_output.py::test_reduced_motion_renders_every_chart_at_its_final_values
      category: presentation
      weight: 1
      cov: C-UX-02
