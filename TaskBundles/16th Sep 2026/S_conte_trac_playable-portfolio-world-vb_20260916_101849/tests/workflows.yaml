- id: visitor_crosses_the_opening_into_the_world
  purpose: "A first visitor crosses the loading screen, the home title and the welcome screen into the world"
  substeps:
    - kind: browser
      do: "Open the Vireo home screen and confirm the loading screen is never blank and never static, a small paper figure in a wide hat walking on the spot in a pool of warm light beneath the word LOADING"
      cov: C-CF-114, C-CF-115
    - kind: browser
      do: "Confirm one tip of advice sits at the bottom of the loading screen, the tips stacked in one place, and read the display title Où sommeillent les Îles with the subtitle naming a Creative Developer"
      cov: C-FE-20, C-CF-137, C-CF-138
    - kind: browser
      do: "Confirm the home screen is a lit live diorama of a small wooden cottage on a dark grassy hill with the title set over the scene, and that the band between the subtitle and Voyager carries no text and no control"
      cov: C-OV-07, C-CF-132, C-CF-150
    - kind: browser
      do: "Confirm Voyager leads as the one pill on the screen while Contact is a quiet underlined word, then press the Enter key and confirm the Bienvenue screen tells a recruiter what the product is inside a softly rounded centred panel"
      cov: C-UX-29, C-UX-28, C-CF-144, C-OV-08, C-FE-25
    - kind: browser
      do: "Press Voyager again and confirm the world arrives, handing the visitor a small character on a hill with a cottage in a continuous world of folded paper and card, running rather than a frozen photograph"
      cov: C-OV-04, C-OV-03, C-CF-136, C-UX-50
    - kind: browser
      do: "Confirm the interface is a small quiet frame around the paper world, letting the world be seen first, with no navigation bar, no cards and no footer"
      cov: C-UX-01, C-UX-49
