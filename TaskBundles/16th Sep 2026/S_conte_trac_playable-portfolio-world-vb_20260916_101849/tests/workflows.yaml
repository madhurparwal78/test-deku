- id: visitor_signs_the_orchard_board_after_a_run
  purpose: "A visitor walks from the menu boards to the orchard, plays a run and puts a name on the public board"
  substeps:
    - kind: browser
      do: "Open the Menu, open Classements and choose La Cueillette, watch the board deal itself out one row at a time, and read the title between the two rules running to the panel edges with the star marks over the first three ranks"
      cov: C-CF-211, C-FE-41, C-CF-216
    - kind: browser
      do: "Press Partir, and at the orchard keeper La gardienne du verger press Parler, read the line about soixante secondes and choose Commencer, then confirm the clock sits top centre with the Pommes tally bottom centre and the clock the larger of the two"
      cov: C-CF-76, C-CF-198
    - kind: browser
      do: "Open the Menu, choose Terminer la course, and confirm the receipt shows one row per item with a silhouette of the game picture crushed to black, an italic label over the count and the Total set three row-gaps below at half again the size"
      cov: C-CF-208, C-FE-40
    - kind: browser
      do: "Press Continuer, confirm the name form slides in from the opposite side only after the last board row lands, and that the form sits on a translucent light pill with the field underlined rather than boxed"
      cov: C-CF-212, C-FE-44
    - kind: browser
      do: "Type the name Camille Nomade into Votre nom, press Envoyer, and confirm your own entry shows above the board tinted and glowing gently on and off"
      cov: C-CF-218
