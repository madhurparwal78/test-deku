      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_loading_word_is_set_in_the_body_face_before_scripts_run
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_home_screen_writes_its_title_before_offering_the_way_in
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_instruction_screen_carries_its_three_lines_and_caption
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_home_title_is_accessible_and_lets_the_pointer_through
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_contact_is_the_only_outbound_link
