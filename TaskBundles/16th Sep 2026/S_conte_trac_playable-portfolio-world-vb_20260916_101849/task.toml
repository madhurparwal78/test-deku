schema_version = "1.4"

[task]
name = "deku/playable-portfolio-world-vb"
version = "1.0.0"
description = "Playable portfolio world where a visitor walks a paper-craft island, plays four minigames at their keepers and puts one name per finished run on a live public leaderboard"
authors = [
  "kaustubh.dalvi@ethara.ai",
  "kunal.singh.int5@ethara.ai"
]
uuid_v5 = "5b2ded2e-72f7-53e6-9a32-ea14e8ed41d8"
keywords = ["greenfield", "solo_founder", "typescript", "postgres", "tracker-log", "leaderboard"]

[metadata]
category     = "Greenfield"
sub_category = "solo_founder"

domain          = "content-publishing"
pattern         = "tracker-log"
service_profile = "P1-db"

language     = "typescript"
archetype    = "playable-portfolio-world"
variant      = "b"
task_code    = "S_conte_trac_playable-portfolio-world-vb_20260916_101849"
naming_scheme = "task-code-v1"
grader_version = "0.22.0"
rubric_version = "1"
capability_flags = "aesthetic"
design_direction = "companion"
launch_surface = "form_validation,meta_tags,mobile_viewport,single_cta,social_preview"
variant_axes = ["critical_depth", "spec_sections"]
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 200
tokens_expected = 8000000
contributor_id  = "kunal.singh.int5@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true

difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", SEED_PASSWORD = "${SEED_PASSWORD:-deku-demo-pw-2026}", DEKU_SERVICE_BACKEND = "postgres" }

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"

[[artifacts]]
source      = "/app"
destination = "app"
