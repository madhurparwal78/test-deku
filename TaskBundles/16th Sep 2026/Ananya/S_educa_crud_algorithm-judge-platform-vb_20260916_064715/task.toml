schema_version = "1.4"

[task]
name = "deku/algorithm-judge-platform-vb"
version = "1.0.0"
description = "A practice platform whose filterable catalogue of algorithm problems is solved in an in-page editor and judged against hidden cases under a time and memory limit."
authors = [
  "kaustubh.dalvi@ethara.ai",
  "ananya.tandon.int43@ethara.ai"
]
uuid_v5 = "f96726a4-a4af-554c-8b2f-d348d223d126"
keywords = ["greenfield", "solo_founder", "typescript", "postgres", "algorithm-judge"]

[metadata]
category     = "Greenfield"
sub_category = "solo_founder"
domain          = "education-courses"
pattern         = "crud-catalog"
service_profile = "P1-db"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = ""
task_code       = "S_educa_crud_algorithm-judge-platform-vb_20260916_064715"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "colour_contrast,favicon,no_broken_links,single_cta,social_preview"
grader_version  = "0.22.0"
language     = "typescript"
archetype    = "algorithm-judge-platform"
variant      = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 170
tokens_expected = 7000000
contributor_id  = "ananya.tandon.int43@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SEED_PASSWORD = "deku-demo-pw-2026" }

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"


[[artifacts]]
source      = "/app"
destination = "app"
