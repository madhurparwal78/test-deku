- id: visitor_enters_title_sequence_and_chooses_a_gallery
  purpose: "A visitor falls through the landing title sequence into the gallery chooser and reaches an introduction by pointer and by keyboard"
  substeps:
    - kind: browser
      do: "On the landing observe HOLLYWOOD set largest in a muted grey beneath the partner titles AURA and Gazette"
      cov: C-CF-26
    - kind: browser
      do: "Observe the small ring turning beneath the two-line subtitle before the landing is scrolled"
      cov: C-CF-28
    - kind: browser
      do: "Scroll the landing a little and observe the ring nudged aside across the first moments of scrolling"
      cov: C-FE-27
    - kind: browser
      do: "Scroll the title sequence on the landing until the gallery chooser settles with two covers under Choose which gallery you want to explore"
      cov: C-OV-01
    - kind: browser
      do: "Press the AURA cover and arrive at the AURA introduction route"
    - kind: browser
      do: "Return to the landing, move keyboard focus to the Gazette cover and press Enter to reach the Gazette introduction by keyboard"
      cov: C-CF-34
    - kind: pytest
      test: test_output.py::test_every_exhibition_route_answers_for_a_signed_out_visitor
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_document_titles_name_each_exhibition_route
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_landing_copy_carries_lockup_subtitle_and_prompt
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_chooser_covers_link_to_both_introductions
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_landing_carries_no_menu_control
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_routes_arrive_server_rendered_with_their_copy
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_lockup_connector_names_pinyon_script
      category: presentation
      weight: 1

- id: visitor_reads_an_introduction_and_goes_to_the_gallery
  purpose: "A visitor reads the AURA wall text and advances into the AURA gallery"
  substeps:
