      do: "Open the AURA introduction and observe the introduction heading stacked as THE, NEW, HOLLYWOOD with one word per line"
      cov: C-CF-38
    - kind: browser
      do: "Scroll the manifesto into view and read the credit Photographs by Celine Armand beneath it"
