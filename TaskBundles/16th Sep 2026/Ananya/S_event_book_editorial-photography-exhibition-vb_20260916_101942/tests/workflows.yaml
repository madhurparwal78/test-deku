      do: "Open the AURA gallery and observe the AURA wordmark upright in a muted grey serif over a near-black ground, with Scroll to explore shown in capitals above it"
      cov: C-CF-53, C-CF-52
    - kind: browser
      do: "Scroll down the column and observe the gallery header carrying the text controls View and Menu slide away out of view on the downward scroll"
