      cov: C-FE-30
    - kind: browser
      do: "Scroll the AURA introduction from top to bottom and observe no tumbling title sequence of planes runs there, since the title sequence exists only on the landing route"
      cov: C-FE-28
    - kind: browser
      do: "Press Go to Gallery on the AURA introduction and arrive at the AURA gallery"
      cov: C-CF-49
