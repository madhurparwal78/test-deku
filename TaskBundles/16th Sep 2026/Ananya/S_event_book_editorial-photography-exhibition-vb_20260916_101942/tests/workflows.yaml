      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_manifesto_body_holds_16px_narrow_and_20px_wide
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_type_never_steps_at_a_breakpoint
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_introduction_heading_holds_50px_narrow_and_100px_wide
