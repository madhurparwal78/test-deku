- id: visitor_reads_first_chapter_end_to_end
  purpose: "A first-time visitor opens the title screen, picks chapter 1 from the record rack, reads panel by panel and follows the next-track face"
  substeps:
    - kind: browser
      do: "Open / in a fresh browser session and observe the first-load screen with a faint ghost wordmark, the hero's head in the middle and a stepped rule filling from the left in soft orange on a pale paper ground; then observe the title screen with one read now button that pops in from nothing, drawn as a large near-black capsule with a cream label near the bottom, buttons popping in, a slowly spinning record above the centre, a night scene behind with a sky, a moon, a city silhouette, a vegetable field, a stage with speakers, fireflies and three characters, and the header, footer and fullscreen control in cream while the EN FR language selector stays a dark neutral"
      cov: C-CF-89, C-CF-93, C-UX-08, C-UX-13, C-UX-47, C-FE-22, C-FE-24, C-FE-26, C-FE-27
    - kind: browser
      do: "Press the read now button and observe the rack at /chapters with the select a chapter heading and the header wordmark Doudou Fever as two lines of heavy lowercase lettering; observe the rack sleeves pop in as a curved carousel with the centred sleeve facing forward and the others turned slightly away, each sleeve a near-black capsule with white text; observe open sleeves 01.welcome to Varny, 02.under pressure and 03.sheep don't sleep, locked sleeves for chapters 4 and 5 drawn as lighter grey capsules with a padlock, and no sleeve for the draft chapter 6"
      cov: C-OV-01, C-CF-90, C-CF-95, C-UX-10, C-UX-11, C-UX-46, C-FE-07, C-FE-28, C-FE-29
    - kind: browser
      do: "Press the 01.welcome to Varny sleeve and observe every sleeve shrink away, then during chapter loading the caption Next track is loading... over a slow charcoal gradient with the name line 01. welcome to Varny, with the language selector turned cream; observe the reader drawing the panel layers in the canvas and a capsule at the bottom that looks like a music player with the cover, the title, the subtitle and a white progress line, pulsing gently until the chapter has streamed, with timecode 01:01; press the right arrow key four times and observe the timecode 01:05"
      cov: C-OV-02, C-CF-115, C-CF-116, C-CF-117, C-CF-118, C-UF-29, C-UX-09, C-UX-48, C-UX-52, C-FE-37, C-FE-38
    - kind: browser
      do: "At timecode 01:05 observe the next track face repeating the next chapter title under pressure; press the face and observe the address /chapter/2 with the reader at timecode 02:01"
      cov: C-CF-135, C-UF-30
    - kind: browser
      do: "From the reader press the chapters header link and observe the timeline capsule tip back and shrink away before the rack of sleeves appears"
      cov: C-UX-49
    - kind: browser
      do: "In chapter 1 press read as text and observe the chapter shown as an ordered list of panel descriptions whose first entry reads Doudou steps off the night bus into Varny."
      cov: C-CF-142, C-CF-143, C-UF-36
    - kind: browser
      do: "Open /chapters?debug=1&gui=1&stats=1 and observe the same rack of sleeves as /chapters with the select a chapter heading, and no debug query parameters panel, frame-rate counter or wireframe drawn over the scene"
      cov: C-CN-12
