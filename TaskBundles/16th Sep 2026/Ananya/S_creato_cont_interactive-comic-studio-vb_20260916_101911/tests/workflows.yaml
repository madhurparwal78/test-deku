- id: about_legal_and_surprise
  purpose: "A visitor reads the about story and the legal notice, and the surprise opens and closes as pinned"
  substeps:
    - kind: browser
      do: "Visit /, /chapters, /chapter/1, /about and /legal and observe that no page offers comments, a social feed, a store, a checkout, advertising, an audio player, or any form offering to mail the visitor a link or a notification"
