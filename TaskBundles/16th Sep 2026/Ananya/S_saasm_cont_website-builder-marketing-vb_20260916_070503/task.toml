keywords = ["greenfield", "solo_founder", "typescript", "postgres", "minio", "website-builder"]

[metadata]
category     = "Greenfield"
sub_category = "solo_founder"

domain          = "saas-micro-tools"
pattern         = "content-publishing"
service_profile = "P4-db-storage"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = ""
task_code       = "S_saasm_cont_website-builder-marketing-vb_20260916_070503"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "custom_404,favicon,single_cta,social_preview,terms_page"
