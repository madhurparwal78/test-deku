- id: developer_signs_up_and_lands_on_overview
  purpose: A new developer creates an account and arrives at the console overview in a workspace of their own
  substeps:
    - kind: browser
      do: Open the signup route, enter a fresh address, a password and a display name, then land on the console overview
      cov: C-RL-07 (earned: the substep signs up from the public route with no invitation, which is what open signup looks like)
    - kind: browser
      do: Observe the overview offering an empty state that names the missing sending domain and offers the action that adds one
      cov: C-UF-03
    - kind: browser
      do: Observe the workspace switcher at the top of the rail listing every workspace membership this person holds
      cov: C-CF-52
    - kind: pytest
      test: test_output.py::test_signup_creates_person_carrying_display_name
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_login_returns_access_token
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_duplicate_signup_address_is_rejected
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_a_password_below_the_stated_minimum_length_is_refused
      category: validation
      weight: 3

- id: admin_adds_and_verifies_a_sending_domain
  purpose: An admin adds a sending domain, reads back the records to publish, and requests a verification pass that resolves each record on its own
  substeps:
    - kind: browser
      do: Sign in as admin@example.com and open the domain list, then the add-domain route
    - kind: browser
      do: Enter docs.northwind.example.com and observe the record table carrying a type, a host, a value and a status on every row
    - kind: browser
      do: Observe a skeleton in place while the domain record data is in flight rather than an indefinite spinner
      cov: C-UF-04
    - kind: pytest
      test: test_output.py::test_adding_domain_creates_pending_domain
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_created_domain_generates_three_publication_records
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_domain_whose_records_read_correct_becomes_verified
      category: business_rule
      weight: 3
    - kind: browser
      do: Press the verification control on the pending domain and observe the record that was missing change its own status
    - kind: browser
      do: Observe the domain still reading pending while one record remains missing, with the failing record named
    - kind: pytest
      test: test_output.py::test_verification_pass_refreshes_every_record_status
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_an_admin_verifies_a_sending_domain
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_deleting_a_domain_keeps_every_message_already_sent
      category: data_integrity
      weight: 5

- id: admin_mints_credential_and_copies_secret_once
  purpose: An admin mints a scoped credential, copies the secret from the one panel that shows it, and finds the row carrying its prefix
  substeps:
    - kind: browser
      do: Open the credentials route and mint a credential named Production sender with the sending scope
    - kind: browser
      do: Observe the panel showing the secret once, dismiss it, then observe the new row carrying its prefix beside never as its last used time
    - kind: pytest
      test: test_output.py::test_minting_credential_returns_the_secret_exactly_once
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_listing_credentials_omits_every_secret
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_revoked_credential_presented_for_sending_is_denied
      category: security
      weight: 5

- id: developer_sends_first_message_and_watches_delivery
  purpose: A developer hands a message to the sending interface and watches it settle into delivered in the log
  substeps:
    - kind: browser
      do: Open the emails log and observe the newest message at the top carrying its state chip with the state word beside the glyph
    - kind: browser
      do: Open that message and observe the identifier with a copy control beside the envelope
    - kind: pytest
      test: test_output.py::test_sending_interface_accepts_a_message_from_a_verified_domain
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_the_reserved_delivered_address_produces_a_delivered_event
      category: notification
      weight: 3
    - kind: pytest
      test: test_output.py::test_retrieving_a_message_returns_its_current_state
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_cancelling_a_queued_message_reaches_the_canceled_state
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_every_external_identifier_carries_a_type_prefix
      category: data_integrity
      weight: 5

- id: reserved_and_ordinary_recipients_reach_their_outcomes
  purpose: The three reserved recipient addresses drive a delivered, a bounced and a complained outcome, while an ordinary recipient receives real mail over SMTP
  substeps:
    - kind: browser
      do: Filter the emails log to bounced and open the seeded bounced message to read its diagnostic with a plain-language reading beneath
    - kind: browser
      do: Observe the timeline rows carrying a glyph, an event name in plain words and the exact instant
    - kind: pytest
      test: test_output.py::test_the_reserved_bounced_address_produces_a_diagnostic
      category: notification
      weight: 3
    - kind: pytest
      test: test_output.py::test_the_reserved_complained_address_produces_a_complaint_event
      category: notification
      weight: 3
    - kind: pytest
      test: test_output.py::test_a_send_to_a_suppressed_address_is_refused_before_queueing
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_a_deferred_message_records_its_attempt_number
      category: data_integrity
      weight: 5
    - kind: browser
      do: Open a delivered message and observe the envelope naming the recipient beside the sending domain
    - kind: browser
      do: Observe the rendered body panel showing the message content inside its own isolated frame
    - kind: pytest
      test: test_output.py::test_an_ordinary_recipient_receives_real_mail
      critical: true
      category: notification
      weight: 5
    - kind: pytest
      test: test_output.py::test_reserved_relay_addresses_stay_unmetered
      category: business_rule
      weight: 3

- id: duplicate_and_concurrent_sends_admit_at_most_one_message
  purpose: A repeated send and two simultaneous sends under one idempotency key each leave exactly one message behind
  substeps:
    - kind: browser
      do: Open the emails log after a repeated send and observe a single row for that recipient rather than two
    - kind: pytest
      test: test_output.py::test_replayed_idempotency_key_produces_no_second_message_row
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_replayed_idempotency_key_carrying_a_different_body_is_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_send_missing_the_idempotency_key_header_is_refused
      category: validation
      weight: 3
    - kind: browser
      do: Open the audience route and observe one contact row for the repeated address rather than a duplicate pair
    - kind: pytest
      test: test_output.py::test_two_simultaneous_sends_under_one_key_admit_exactly_one_message
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_two_simultaneous_contact_creates_admit_exactly_one_row
      category: data_integrity
      weight: 5

- id: invalid_send_requests_are_refused
  purpose: A send that breaks a stated rule is refused before anything is queued, naming every failing field
  substeps:
    - kind: browser
      do: Observe the domain detail route stating that sending from a pending domain is not yet possible
    - kind: browser
      do: Observe the refusal rendered in place on the console route with the rest of the screen still usable
      cov: C-UF-05 (earned: the refusal is read where it is rendered, with the surrounding route still usable)
    - kind: pytest
      test: test_output.py::test_send_from_an_unverified_domain_is_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_an_unknown_field_on_a_write_is_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_a_validation_failure_reports_every_failing_field
      category: validation
      weight: 3

- id: member_write_actions_are_denied
  purpose: A member is refused every action that changes the plumbing: minting a credential, and sending a broadcast to a live audience
  substeps:
    - kind: browser
      do: Sign in as member@example.com and observe the credentials route showing the list with its mint control disabled
    - kind: pytest
      test: test_output.py::test_a_member_minting_a_credential_writes_no_credential_row
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_a_credential_minting_another_credential_is_denied
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_a_sending_scope_credential_reading_domains_is_denied
      category: security
      weight: 5
    - kind: browser
      do: As member@example.com compose a broadcast against Launch List and observe a request-send control in place of a send control
    - kind: browser
      do: Observe the composed broadcast reading as a draft in the broadcast list afterwards
    - kind: pytest
      test: test_output.py::test_a_member_sending_a_broadcast_leaves_the_broadcast_unsent
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_a_member_composes_a_broadcast_draft
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_an_owner_changes_the_workspace_plan
      category: security
      weight: 5

- id: unauthenticated_and_cross_workspace_requests_are_denied
