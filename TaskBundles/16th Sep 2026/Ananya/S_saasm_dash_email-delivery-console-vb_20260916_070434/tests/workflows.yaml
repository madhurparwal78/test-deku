      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_a_pinned_credential_sending_from_another_domain_is_refused
      category: security
      weight: 5
    - kind: browser
      do: Open a console route with no session and observe the sign-in route carrying the path that was asked for
      cov: C-UF-01
    - kind: browser
      do: Sign in, then open the login route again and observe the console overview in place of a sign-in form
      cov: C-UF-02
    - kind: pytest
      test: test_output.py::test_console_request_carrying_no_bearer_token_is_denied
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_wrong_password_login_is_denied
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_an_unauthorized_call_is_rejected_as_a_client_error
      category: security
      weight: 5

- id: log_filters_and_timeline_read_server_side
