- id: visitor_sets_and_runs_a_tock
  purpose: A visitor sets a tock on the hero dial, runs it to completion and recolours the watch
  substeps:
    - kind: browser
      do: Open the home page, select 30 min in the timer setter, then press Run a tock and confirm the hero dial fills its tock and says Tock complete
      cov: C-UF-05
    - kind: browser
      do: Press the Navy swatch below the hero dial and confirm the swatch shows pressed and the whole dial turns navy
      cov: C-UF-06
