schema_version = "1.4"

[task]
name = "deku/internal-tools-builder-vb"
version = "1.0.0"
description = "Marketing site and governed internal-tools console: resources, apps, queries, components, permission groups, environments, immutable versions and releases, row predicates and column masks, and a hash-chained audit trail, where a builder connects a database, binds a table and a form to a query on a canvas, publishes an approved release, and a support operator runs it against production records under a group whose explicit deny no allow can overcome, on postgres and mailpit"
authors = [
  "utsav.jain@ethara.ai" ,
  "aniket.tyagi24@ethara.ai"
]
uuid_v5 = "0ce36709-9cf6-5f3c-b59d-f753d0d97b7b"
keywords = ["greenfield", "enterprise", "typescript", "postgres", "mailpit", "crud-catalog", "analytics-reporting"]

[metadata]
category     = "Greenfield"
sub_category = "enterprise"

domain          = "analytics-reporting"
pattern         = "crud-catalog"
service_profile = "P2-db-email"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = "aesthetic"
task_code       = "E_analy_crud_internal-tools-builder-vb_20260916_054546"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "alt_text,favicon,meta_tags,security_headers,sitemap_robots"
grader_version  = "0.22.0"

language     = "typescript"
archetype    = "internal-tools-builder"
variant      = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 200
tokens_expected = 7000000
contributor_id  = "aniket.tyagi24@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"
email   = "mailpit"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:girder-local-dev-71c4@postgres:5432/deku}", DB_URL = "${DB_URL:-postgresql://deku_app:girder-local-dev-71c4@postgres:5432/deku}", SMTP_HOST = "${SMTP_HOST:-mailpit}", SMTP_PORT = "${SMTP_PORT:-1025}", SMTP_USER = "${SMTP_USER:-}", SMTP_PASS = "${SMTP_PASS:-}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:girder-local-dev-71c4@postgres:5432/deku}", EMAIL_INBOX_API_URL = "${EMAIL_INBOX_API_URL:-http://mailpit:8025}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_EMAIL = "mailpit" }

[delivery]
format         = "harbor"
schema_version = "1.4"
reward_path    = "/logs/verifier/reward.json"
reward_key     = "reward"
reward_range   = [0.0, 1.0]
reward_full    = 1.0
network_policy = "public"

[[artifacts]]
source      = "/app"
destination = "app"
