      do: Sign in as builder@example.com, open Order Desk in the editor, save a canvas change and confirm the editor states the saved version rather than silently replacing an earlier save
      cov: C-CF-116, C-RL-04, C-RL-15, C-CF-11
    - kind: pytest
      test: test_output.py::test_stale_base_version_hash_is_refused_with_the_conflict
      critical: true
      category: data_integrity
      weight: 5
      cov: C-CF-50

