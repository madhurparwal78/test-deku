      weight: 1
      cov: C-CF-147, C-TR-26, C-CF-148, C-CF-152

- id: not_found_and_search_never_expose_a_draft
  purpose: The not-found route escapes the requested path and search returns published routes only
  substeps:
    - kind: browser
      do: Open an address that resolves to nothing, confirm the message names the requested path as text, the header and footer render, and the falling-blocks game shows its keyboard bindings beside each action
      cov: C-CF-175, C-CF-174, C-CF-141, C-CF-60
    - kind: pytest
      test: test_output.py::test_not_found_route_escapes_the_requested_path
      category: security
      weight: 5
      cov: C-CF-175
    - kind: pytest
      test: test_output.py::test_search_answers_a_closed_state_and_hides_drafts
      category: security
      weight: 5
      cov: C-CF-173

- id: workspace_catalog_is_scoped_at_the_server
  purpose: The app list and the palette offer only what the caller may open, and a new app lands as a draft
  substeps:
    - kind: browser
      do: Sign in as operator2@example.com, open /console and confirm the app card grid shows Order Desk alone, then open the command palette and confirm it offers no draft app
      cov: C-CF-13, C-RL-15, C-CF-14, C-DM-10
    - kind: pytest
      test: test_output.py::test_app_catalog_lists_only_apps_the_caller_may_open
      critical: true
      category: security
      weight: 5
      cov: C-CF-08
    - kind: pytest
      test: test_output.py::test_command_palette_targets_exclude_what_the_caller_cannot_reach
      category: security
      weight: 5
      cov: C-CF-13, C-CF-14
    - kind: pytest
      test: test_output.py::test_app_creation_lands_a_draft_carrying_no_release
      category: business_rule
      weight: 3
      cov: C-CF-12

- id: empty_state_reads_differently_from_a_refusal
  purpose: An empty list and a refusal are distinguishable, and a sign-in refusal reveals nothing about the address
  substeps:
    - kind: browser
      do: Sign in as builder@example.com, open Refund Desk in the editor and confirm the release list states that nothing is released yet rather than showing a refusal, then sign out and attempt a sign-in with an address that has no account and confirm the message matches a wrong password
      cov: C-CF-02, C-CF-04, C-CF-11, C-DM-22
    - kind: pytest
      test: test_output.py::test_environments_are_ordered_staging_then_production
      category: business_rule
      weight: 3
      cov: C-CF-83
    - kind: pytest
      test: test_output.py::test_signin_refusal_is_identical_for_unknown_and_wrong
      category: security
      weight: 5
      cov: C-CF-02

