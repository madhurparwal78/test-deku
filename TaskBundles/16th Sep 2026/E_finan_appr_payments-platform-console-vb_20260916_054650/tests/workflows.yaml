- id: storefront_chrome_and_the_type_scale
  purpose: The shared chrome, the drawn icons, the leaning dividers and the composed demonstrations read as the companion describes them
  substeps:
    - kind: browser
      do: On the country home confirm the heaviest step of the type scale carries the headings while the ordinary body step carries body copy, both lighter than a conventional pairing
      cov: C-FE-03, C-FE-04, C-FE-07
    - kind: browser
      do: Open the developer band and confirm the code sample is set in the code face the brief names, distinct from the interface family
      cov: C-FE-05
    - kind: browser
      do: Confirm every icon is geometry drawn in the page rather than a fetched file, keeping its stroke crisp when the page is magnified
      cov: C-FE-08
    - kind: browser
      do: At a phone width press the menu control and confirm it becomes a cross by rotating two coincident bars rather than swapping one shape for another
      cov: C-FE-09
    - kind: browser
      do: Hover each of the four disclosures in turn and confirm one shared panel resizes between them rather than four separate panels opening
      cov: C-FE-10
    - kind: browser
      do: Hover a disclosure, then move the pointer on a diagonal path from the trigger into the panel, and confirm the hover intent survives the gap
      cov: C-FE-11
    - kind: browser
      do: Scroll the country home and confirm the section dividers lean rather than sitting level, with no seam showing where two bands meet
      cov: C-FE-12
    - kind: browser
      do: On a product route confirm the running demonstration is composed from markup rather than played as a video, staying sharp at any size
      cov: C-FE-13
    - kind: browser
      do: Read the dark statistics band and confirm each gradient numeral carries a solid fallback colour so no figure can render as nothing
      cov: C-FE-14
    - kind: browser
      do: Confirm the fake browser window inside a demonstration never becomes fully opaque, staying slightly translucent over the page behind
      cov: C-FE-15
