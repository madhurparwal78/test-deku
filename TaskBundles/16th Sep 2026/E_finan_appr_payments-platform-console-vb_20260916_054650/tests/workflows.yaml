      cov: C-UF-20
    - kind: browser
      do: Open the gated analytics product route and confirm the pricing band renders a note in place of prices while the route stays fully readable
      cov: C-CF-64
    - kind: pytest
      test: test_output.py::test_empty_filtered_queue_returns_empty_array
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_home_route_carries_pinned_hero_copy
      category: presentation
      weight: 1
