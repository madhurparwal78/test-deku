- id: support_refunds_within_ceiling
  purpose: A support operator signs in, opens a payment beside its detail pane, and refunds an amount inside their own ceiling
  substeps:
    - kind: browser
      do: Sign in at /signin as support@example.com with the seeded password, whose one membership lands straight on the Northbeam Retail organisation home rather than on a chooser
      cov: C-UF-10, C-UF-17
    - kind: browser
      do: Open the refund composer at its own dedicated address beneath the Corvid Motors payment, read the refundable remainder, then close the composer
      cov: C-UF-13
    - kind: pytest
      test: test_output.py::test_login_returns_bearer_token
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_wrong_password_is_refused
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_refund_within_ceiling_is_persisted
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_me_lists_every_membership
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_accounts_lists_only_memberships_held
      category: security
      weight: 5

- id: support_refund_above_ceiling_becomes_request
  purpose: A refund larger than the operator's ceiling turns into a request that holds no money
  substeps:
    - kind: browser
      do: As support@example.com open the Kaufhaus payment, open the refund composer, enter a refund amount above the caller's own ceiling, and read the refusal offered in its place
      cov: C-CF-13
    - kind: browser
      do: Write a justification under the prompt asking why the refund is needed because approvers will read it, submit the request, then confirm the payment now carries a pending badge
      cov: C-CF-16
    - kind: pytest
      test: test_output.py::test_refund_above_ceiling_requires_approval
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_refund_request_is_created_pending
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_pending_request_moves_no_balance
      critical: true
      category: data_integrity
      weight: 5

- id: finance_approves_refund_request
  purpose: A second person approves the waiting request and the balance falls by exactly the refund amount
  substeps:
    - kind: browser
      do: Sign in as finance@example.com, whose two memberships land on the account chooser served at /accounts, then choose Northbeam Retail
      cov: C-UF-11, C-UF-16
    - kind: browser
      do: Open the approval queue, confirm requests are ordered soonest to expire first, then select the waiting request to read the raiser, the raiser's own ceiling and the justification
      cov: C-CF-20
    - kind: browser
      do: Approve the waiting request, then watch the money that stayed still while the refund request was pending finally move on the decision
      cov: C-OV-03
    - kind: pytest
      test: test_output.py::test_approval_executes_exactly_one_refund
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_rejected_request_writes_no_refund
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_withdrawn_request_is_closed_by_its_requester
      category: business_rule
      weight: 3

- id: support_cannot_approve_request_denied
  purpose: A support session is refused the approve endpoint at the API and the waiting request is untouched
  substeps:
    - kind: browser
      do: Sign in as support@example.com, open the approval queue of northbeam, and read a waiting request without being offered any way to decide it
      cov: C-CF-23
    - kind: pytest
      test: test_output.py::test_support_cannot_approve_request_denied
      critical: true
      category: security
      weight: 5

- id: requester_self_approval_forbidden
  purpose: The person who raised a request cannot approve it, whatever role they hold
  substeps:
    - kind: pytest
      test: test_output.py::test_self_approval_is_forbidden
