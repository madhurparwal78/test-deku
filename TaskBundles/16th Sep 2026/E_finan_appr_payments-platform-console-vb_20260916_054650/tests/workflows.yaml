  substeps:
    - kind: pytest
      test: test_output.py::test_concurrent_approvals_produce_one_refund
      critical: true
      category: data_integrity
      weight: 5

- id: duplicate_refund_key_is_a_no_op
  purpose: A replayed idempotency key moves the balance once, and a changed body under one key is refused
  substeps:
