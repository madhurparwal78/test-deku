      test: test_output.py::test_idempotent_refund_replay_creates_no_second_row
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_idempotency_conflict_on_changed_body
      category: validation
      weight: 3

- id: expired_request_cannot_be_approved
  purpose: A request older than its lifetime is expired when it is next read and can no longer execute
  substeps:
