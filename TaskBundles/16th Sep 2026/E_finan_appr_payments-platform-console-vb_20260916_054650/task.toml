version = "1.0.0"
description = "India storefront and scoped console of a payments and financial infrastructure platform: product routes priced in rupees with an availability gate, guides and customer stories, a lead form, and behind a sign-in an organisation's payments, double-entry ledger, balances, payouts, disputes, API credentials, webhook endpoints and hash-chained audit log across sandbox and live, over a three-role refund approval chain where a support operator raises a refund above their ceiling, a different finance operator approves it, a pending request holds no money, a self-approval and a lower role are refused, and a double approval still moves the balance once, on postgres and keycloak"
uuid_v5 = "c9242d3a-2846-5dda-b098-a9cb701a5531"
authors = [
    "utsav.jain@ethara.ai",
    "aniket.tyagi24@ethara.ai",
