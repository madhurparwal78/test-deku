- id: "author_drafts_and_submits_a_release"
  purpose: "An author writes a release on a division they hold and submits it into the review chain"
  substeps:
    - kind: browser
      do: "Sign in at the console as author@example.com and confirm the rail lists Calder Trading and Calder Capital and nothing else"
      cov: "C-UF-23"
    - kind: browser
      do: "Open the create route, write a Trading release with a title, a standfirst and a body, and save it as a draft"
      cov: ""
    - kind: browser
      do: "Submit the trading release and confirm the review rail moves to legal_review and the record is removed from the drafts queue"
      cov: "C-UF-24, C-UF-25"
    - kind: pytest
      test: test_output.py::test_a_draft_created_by_an_author_starts_in_draft
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_an_edit_produces_a_new_revision_and_keeps_the_old_one
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_me_returns_the_callers_memberships
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_a_seeded_release_has_a_stable_block_identifier_across_revisions
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_a_block_type_outside_the_permitted_set_is_refused_at_write
      category: validation
      weight: 3

- id: "legal_and_compliance_clear_a_release"
