    - kind: browser
      do: "Open the contact route, read the headline, the control and the address block, watch the band of repeated wordmarks and the turning object, and select the copy underneath the object. Confirm that the two social destinations read Instagram, Behance"
      cov: "C-FE-146"
    - kind: pytest
