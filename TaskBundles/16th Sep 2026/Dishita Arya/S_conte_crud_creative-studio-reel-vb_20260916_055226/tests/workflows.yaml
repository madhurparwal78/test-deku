      do: "Open the contact route, read the headline, the control and the address block, watch the band of repeated wordmarks and the turning object, and select the copy underneath the object. Confirm that nothing on the contact route is vertically centred; the contact address block is set upright rather than italic; the contact band's wordmarks are knocked out of a red block; the contact band translates continuously, wrapping by one repeat width; the contact block reads contact@vesper.works, 14 Kiln Street, E2 8HD London"
