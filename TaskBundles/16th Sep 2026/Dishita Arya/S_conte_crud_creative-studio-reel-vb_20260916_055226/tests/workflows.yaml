      category: "presentation"
      weight: 1
    - kind: browser
      do: "Follow the footer's legal rule to the imprint and privacy page, read its measured column, then follow the terms link and read the same column. Confirm that the legal column is left-aligned against the gutter rather than centred; the legal column honours the source text's own line breaks; the legal paragraphs are the only justified text in the product; the newsletter placeholder reads your@email.com above the control Subscribe; the footer legal links read Imprint & Privacy plus Terms"
      cov: "C-FE-103, C-FE-104, C-FE-105, C-FE-147, C-FE-148"
    - kind: browser
      do: "Follow the footer's legal rule to the imprint and privacy page, read its measured column, then follow the terms link and read the same column. Confirm that the product refuses to print every route except the legal routes, the journal body"
      cov: "C-UX-51"
    - kind: pytest
      test: "test_output.py::test_privacy_and_terms_pages_are_served"
      category: "presentation"
      weight: 1
    - kind: browser
      do: "Open an address that matches nothing, read the sheared numerals against the diagonal, and follow the way home. Confirm that the not-found numerals shear apart along the diagonal; the not-found diagonal band pulses faintly rather than holding still; the not-found screen reads Page not found above a control reading back home; the not-found screen carries no footer"
      cov: "C-FE-106, C-FE-107, C-FE-108, C-FE-109"
    - kind: pytest
      test: "test_output.py::test_not_found_route_answers_not_found_with_its_own_page"
      category: "validation"
      weight: 3
- id: "visitor_subscribes_to_the_journal"
  purpose: "A visitor subscribes from the footer and the address is stored once"
