- id: "visitor_reads_the_home_route"
  purpose: "A visitor reads the whole home route, from the opening curtain to the red foot of the page"
  substeps:
    - kind: browser
      do: "Open the home route, let the opening curtain finish, and scroll from the pinned opening through the manifesto, the four-project run, the practice fields, the client wall, the awards wall and the latest entries to the footer. Confirm that the app serves a public studio site together with a private client area on one origin; the home route presents nine blocks in one continuous scroll; the home route serves four audiences from four different blocks; the home opening pins four superimposed layers inside one full-height block; the opening media swells slightly, fading out, holding that end state"
      cov: "C-OV-01, C-OV-02, C-OV-07, C-FE-63, C-FE-64"
    - kind: browser
      do: "Open the home route, let the opening curtain finish, and scroll from the pinned opening through the manifesto, the four-project run, the practice fields, the client wall, the awards wall and the latest entries to the footer. Confirm that the scroll indicator appears once at the top, never returning; the four project items each fill one screen inside a clipping block; the navigator's thumbnail column, label column carry one shared travel; the navigator's label column fades at its top edge, its bottom edge; only the navigator's active row takes pointer events"
      cov: "C-FE-65, C-FE-67, C-FE-68, C-FE-69, C-FE-70"
    - kind: browser
      do: "Open the home route, let the opening curtain finish, and scroll from the pinned opening through the manifesto, the four-project run, the practice fields, the client wall, the awards wall and the latest entries to the footer. Confirm that the four practice fields carry a numeral, a two-line title, a short body; the practice field divider disappears above the desktop width; the client wall takes no pointer events anywhere in the block; each client mark carries its owner's name as its accessible name; An award caption holds its two authored lines without reflowing"
      cov: "C-FE-71, C-FE-72, C-FE-73, C-FE-74, C-FE-75"
    - kind: browser
      do: "Open the home route, let the opening curtain finish, and scroll from the pinned opening through the manifesto, the four-project run, the practice fields, the client wall, the awards wall and the latest entries to the footer. Confirm that the latest-entries band takes a fixed proportion of its own width above the desktop width; the footer meets the last tile with no gap, no separator; the wordmark layer is fixed at the top left, padded by the gutter of its width; the navigation row occupies exactly the right half of the screen above the desktop width; the footer field is the signal red, present on the home, archive, journal routes"
      cov: "C-FE-76, C-FE-77, C-FE-16, C-FE-17, C-FE-25"
    - kind: browser
      do: "Open the home route, let the opening curtain finish, and scroll from the pinned opening through the manifesto, the four-project run, the practice fields, the client wall, the awards wall and the latest entries to the footer. Confirm that the footer carries a main column, a links column, an address column; the footer wordmark drifts sideways below the desktop width, spanning the page above; A signed-out visitor reads every public route; the graded journey ends with a curator reading the client's order with the client's note"
      cov: "C-FE-26, C-FE-27, C-RL-01, C-UF-28"
    - kind: browser
      do: "Read the chrome that follows every route, the wordmark at the top left, the three navigation controls, the menu button on a narrow window, the scroll marker, the opening loader and the route curtain. Confirm that the wordmark is set edge to edge across the window twice on the home route; every wordmark stroke is a parallelogram sheared about the vertical at the page's angle; wordmark counters are cut as parallel slots rather than as curves; the curtain mark is two sheared blades stacked with a diagonal gap between; the tiling lockup closes the seam between repeats"
      cov: "C-FE-11, C-FE-12, C-FE-13, C-FE-14, C-FE-15"
    - kind: browser
      do: "Read the chrome that follows every route, the wordmark at the top left, the three navigation controls, the menu button on a narrow window, the scroll marker, the opening loader and the route curtain. Confirm that the mobile panel rows read PROJECTS, SIGNALS, CONTACT, then the two social destinations; the native scrollbar is replaced by a fixed rail taking no pointer events; the scroll rail fades in during a gesture, then fades out again; the opening loader is two diagonal half-curtains, a counter, a compressed wordmark; the two loader curtain halves overlap by a hair so no line of page shows through"
      cov: "C-FE-22, C-FE-23, C-FE-24, C-FE-28, C-FE-29"
    - kind: browser
      do: "Read the chrome that follows every route, the wordmark at the top left, the three navigation controls, the menu button on a narrow window, the scroll marker, the opening loader and the route curtain. Confirm that the loader counter converges a live percentage against a fixed full figure; the loader wordmark fills in from the left in step with progress; the loader stops animating near completion rather than easing the last stretch; the route curtain sweeps the same diagonal on a tighter curve, carrying the mark; the wordmark sits under the navigation, over the scroll marker"
      cov: "C-FE-30, C-FE-31, C-FE-32, C-FE-33, C-UX-20"
    - kind: browser
      do: "Read the chrome that follows every route, the wordmark at the top left, the three navigation controls, the menu button on a narrow window, the scroll marker, the opening loader and the route curtain. Confirm that the control has resting, pointed-at, pressed, focused, unavailable states; unavailable is never signalled by colour alone; the control's fill arrives faster than its ink changes; the control's outline changes colour only, never width; A section declares one accent that every control inside reads"
      cov: "C-UX-22, C-UX-23, C-UX-24, C-UX-25, C-UX-26"
    - kind: browser
      do: "Read the icon set and the section label that opens every block, then read the control in all of its variants. Confirm that six glyphs exist, every one drawn as inline vector geometry; the arrow is one closed filled outline rather than a line plus a caret; the outbound arrow marks the contact address, the social destinations, the legal link; A six-pointed asterisk in an outlined box opens every section on every route; the menu bars fold into a cross about the bar already centred when closed"
      cov: "C-FE-03, C-FE-04, C-FE-05, C-FE-06, C-FE-07"
    - kind: browser
      do: "Read the icon set and the section label that opens every block, then read the control in all of its variants. Confirm that the scroll indicator is a mouse body with a wheel dot inside a dashed ring; the not-found numerals are one path filled in the signal red; A seventh glyph keeps one constant stroke measure expressed as a fraction of its canvas; the section labels read Projects, Services, Clients, Awards, Latest Signals, Newsletter, Work, Blog, Your reel, Sign in, Reels; the control's label is drawn twice so the second copy arrives with the fill"
      cov: "C-FE-08, C-FE-09, C-FE-10, C-FE-34, C-FE-35"
    - kind: browser
      do: "Read the icon set and the section label that opens every block, then read the control in all of its variants. Confirm that the control's icon well is drawn twice so a fresh arrow arrives from the left; where there is no pointer, a control whose readable state is its filled state stays filled; the control has resting, pointed-at, pressed, focused, unavailable states; unavailable is never signalled by colour alone; the client area adds no colour, no curve, no spacing step, no type step, no icon"
      cov: "C-FE-36, C-FE-38, C-UX-22, C-UX-23, C-FE-111"
    - kind: browser
      do: "Read the icon set and the section label that opens every block, then read the control in all of its variants. Confirm that the product builds no second grid system; the product builds no modal or dialog layer; the product builds no rich text editor, no spinner, no icon library, no theme switcher"
      cov: "C-FE-131, C-FE-132, C-FE-134"
    - kind: browser
      do: "Read the product's look, the three inks and their roles, the one type family at two regimes, the square corners, the single media gap, the frosting behind every control. Confirm that the product is built to one north star, a visitor believes the studio can make something rare; the register is consumer editorial, never an operational dashboard; A second red one step hotter marks emphasis inside project introduction copy only; three translucent tints exist, a panel fill, a rule line, one divider; type is one grotesque at three cuts, with no italic, no second family"
      cov: "C-UX-01, C-UX-02, C-UX-06, C-UX-07, C-UX-09"
    - kind: browser
      do: "Read the product's look, the three inks and their roles, the one type family at two regimes, the square corners, the single media gap, the frosting behind every control. Confirm that journal body copy is set visibly looser than display type; display sizes grow smoothly between two anchor widths rather than stepping; small uppercase labels never grow at any width; every heading honours the line breaks its copy was written with; one gap separates every two pieces of media at every width"
      cov: "C-UX-10, C-UX-11, C-UX-12, C-UX-13, C-UX-17"
    - kind: browser
      do: "Read the product's look, the three inks and their roles, the one type family at two regimes, the square corners, the single media gap, the frosting behind every control. Confirm that every fractional tile subtracts its own share of that gap; sections are separated by space rather than by dividing rules; the opening headline reads Creative Innovation then and Digital Futures; the manifesto block carries one sentence about brands being felt, explored, remembered; the practice headline reads Fields of Practice"
      cov: "C-UX-18, C-UX-19, C-FE-135, C-FE-136, C-FE-137"
    - kind: browser
      do: "Read the product's look, the three inks and their roles, the one type family at two regimes, the square corners, the single media gap, the frosting behind every control. Confirm that the four practice fields are numbered 01 to 04 with the titles given; the four award captions hold their two authored lines each; the twelve client marks are seeded in the order listed"
      cov: "C-FE-138, C-FE-139, C-FE-140"
    - kind: browser
      do: "Read the home route with script disabled, confirming the content is in the first response and every internal link still works, then re-enable script and watch one scroll subscriber drive every moving surface. Confirm that the app is a server-rendered multi-page product built on Express with Nunjucks; alpine.js progressively enhances the filter row, the tile expand, the reel editing; A route's content is present in the first response; A visitor with script disabled reads every public route; the app fetches nothing from outside its own origin"
      cov: "C-TR-01, C-TR-02, C-TR-03, C-TR-04, C-TR-12"
    - kind: browser
      do: "Read the home route with script disabled, confirming the content is in the first response and every internal link still works, then re-enable script and watch one scroll subscriber drive every moving surface. Confirm that every picture is generated in the browser from a seed derived from a slug; the same project always produces the same generated picture; the particle form is a subdivided icosahedron with displaced vertices, flat normals; the contact object's parts keep the prefixes Shell, WindShield, Vent, Sticker, Trim; the app runs exactly one scroll subscriber"
      cov: "C-TR-13, C-TR-14, C-TR-15, C-TR-16, C-TR-17"
    - kind: browser
      do: "Read the home route with script disabled, confirming the content is in the first response and every internal link still works, then re-enable script and watch one scroll subscriber drive every moving surface. Confirm that the scroll subscriber reads all geometry first, then writes every derived value; every transition names the properties each transition applies to; media loads only once within one viewport height of the visible area; at most two pieces of moving media play at once; all moving media is muted, playing inline"
      cov: "C-TR-18, C-TR-19, C-TR-20, C-TR-21, C-TR-22"
    - kind: browser
      do: "Read the home route with script disabled, confirming the content is in the first response and every internal link still works, then re-enable script and watch one scroll subscriber drive every moving surface. Confirm that both real-time surfaces stop rendering when the document is hidden; the real-time surfaces reduce resolution before dropping a frame; the real-time surface is never removed entirely; the five particle lighting values are read once at start from one configuration source; no control surface for the lighting values is reachable in the running product"
      cov: "C-TR-23, C-TR-24, C-TR-25, C-TR-26, C-TR-27"
    - kind: browser
      do: "Watch a headline reveal as it enters view, then scroll back up and watch the same headline un-reveal. Confirm that four curve roles carry every movement in the product; every named motion moment is built, from the control fill to the category pan; reduced motion stops continuous movement at its first frame; reduced motion applies every reveal at once, keeping the text readable; reduced motion keeps every response to a direct action"
      cov: "C-UX-27, C-UX-30, C-UX-31, C-UX-32, C-UX-33"
    - kind: browser
      do: "Watch a headline reveal as it enters view, then scroll back up and watch the same headline un-reveal. Confirm that the letterform lean, the curtain split, the contact band share one angle; the diagonal is defined against the height of the window rather than its width; A revealing word rises half its own height as its window travels; the resting travel of a revealing word is instantaneous with a delay; the paragraph reveal carries emphasis by hue at the surrounding boldness"
      cov: "C-UX-34, C-UX-35, C-FE-40, C-FE-41, C-FE-42"
    - kind: browser
      do: "Watch a headline reveal as it enters view, then scroll back up and watch the same headline un-reveal. Confirm that only two named keyframe sets exist, the travelling window, the foot band drift; the diagonal is authored once, shared by loader, curtain, not-found, denied; the diagonal degrades to a straight vertical split on a very tall window; scaling works in three regimes, a fixed low anchor, an interpolation, a fixed high anchor; the page gutter steps at the tablet breakpoint, then becomes proportional above the desktop breakpoint"
      cov: "C-FE-43, C-FE-44, C-FE-45, C-FE-01, C-FE-02"
    - kind: browser
      do: "Watch the particle field behind the manifesto, move the pointer across it, then scroll past the manifesto and watch the field stop being drawn. Confirm that wheel input is interpolated so the document approaches its target rather than jumping; native scroll stays the source of truth for anchors, keyboard paging, assistive technology; the app releases native overflow if the interpolation layer has not mounted; every media surface moves against the page at one shared factor of scroll speed; A parallax wrapper is over-scanned so the depth factor never reveals an edge"
      cov: "C-FE-46, C-FE-47, C-FE-48, C-FE-49, C-FE-50"
    - kind: browser
      do: "Watch the particle field behind the manifesto, move the pointer across it, then scroll past the manifesto and watch the field stop being drawn. Confirm that the navigator's label, thumbnail, destination come from one computed index; the rolling label runs two copies one line apart so the loop has no seam; the particle field places instances evenly over a sphere by a spiral distribution; each particle instance carries its own orientation, velocity, size, drift speed; the particle field is fully populated on its first frame rather than marching in"
      cov: "C-FE-51, C-FE-52, C-FE-53, C-FE-54, C-FE-55"
    - kind: browser
      do: "Watch the particle field behind the manifesto, move the pointer across it, then scroll past the manifesto and watch the field stop being drawn. Confirm that A single pointer-driven lamp in the signal red is the only light in the scene; each particle carries a wide soft sheen plus a small hard hot spot; the lamp lags the pointer by interpolating a small fraction each frame; the particle field is not drawn at all when the manifesto block is off screen; the development lamp marker is never visible in the shipped product"
      cov: "C-FE-56, C-FE-57, C-FE-58, C-FE-59, C-FE-60"
    - kind: browser
      do: "Watch the particle field behind the manifesto, move the pointer across it, then scroll past the manifesto and watch the field stop being drawn. Confirm that the contact object's environment counter-rotates against the object; the contact object takes no pointer events, leaving the copy selectable"
      cov: "C-FE-61, C-FE-62"
    - kind: browser
      do: "Read the home route at a narrow viewport, then with reduced motion requested, then with the keyboard alone. Confirm that all text meets the WCAG AA contrast bar against the ground behind the text; the first focusable element on every route is a skip control; the mobile panel traps focus, releasing on Escape to the button that opened the panel; meaning is never carried by colour alone; one polite live region per route carries exactly four kinds of message"
      cov: "C-UX-36, C-UX-40, C-UX-41, C-UX-42, C-UX-43"
    - kind: browser
      do: "Read the home route at a narrow viewport, then with reduced motion requested, then with the keyboard alone. Confirm that the product is dark only, surviving a forced-colours mode; the opening headline's region carries a darkening layer over a bright picture; the layout holds at every width between the three named widths; at a narrow viewport nothing overflows sideways; the media gap, the control height, the label size, the icon size never change with width"
      cov: "C-UX-44, C-UX-45, C-UX-46, C-UX-47, C-UX-48"
    - kind: browser
      do: "Read the home route at a narrow viewport, then with reduced motion requested, then with the keyboard alone. Confirm that every hover effect is gated on a device with a pointer; full-height surfaces use a height the page computes, rewritten on every resize; the product refuses to print every route except the legal routes, the journal body; the reel row's drag handle is absent below the desktop width; the client wall steps from three columns to four to six"
      cov: "C-UX-49, C-UX-50, C-UX-51, C-FE-121, C-FE-122"
    - kind: browser
      do: "Read the home route at a narrow viewport, then with reduced motion requested, then with the keyboard alone. Confirm that the awards wall steps from two columns to four; the journal grid steps from one column to two to three; sign-in rows stay stacked at every width; A short landscape window drops the opening headline a step, keeping the wordmark's width; focus order follows document order on every route"
      cov: "C-FE-123, C-FE-124, C-FE-125, C-FE-126, C-FE-127"
    - kind: browser
      do: "Read the home route at a narrow viewport, then with reduced motion requested, then with the keyboard alone. Confirm that the home navigator comes after the project run in the document; A fixed overlay carrying no action is absent from the focus order; the whole reel workflow is reachable without a pointer"
      cov: "C-FE-128, C-FE-129, C-FE-130"
    - kind: pytest
      test: "test_output.py::test_app_contract_surfaces_are_present"
      category: "presentation"
      weight: 1
    - kind: pytest
      test: "test_output.py::test_public_route_titles_are_distinct"
      category: "presentation"
      weight: 1
- id: "visitor_browses_filters_and_shares_the_archive"
  purpose: "A visitor reads the project archive, narrows it to one practice field, expands a half tile and shares the filtered address as a link"
  substeps:
    - kind: browser
      do: "Open the archive, read the mosaic of full-width and half-width tiles, then expand a half tile and watch the row beside it move while the rows below hold still. Confirm that the active filter control holds its fill permanently; A tile expand grows a layer inside the tile, never the tile itself; An expanding tile moves no tile on a row below the expanding tile; An expanding tile fades out its own label control; the expanded state is reachable, reversible by keyboard"
      cov: "C-FE-79, C-FE-82, C-FE-83, C-FE-84, C-FE-85"
    - kind: browser
      do: "Open the archive, read the mosaic of full-width and half-width tiles, then expand a half tile and watch the row beside it move while the rows below hold still. Confirm that the archive's closing block blends one wash rising from its bottom edge"
      cov: "C-FE-86"
    - kind: browser
      do: "Read the archive copy, the headline, the five filter labels, the fifteen project titles with their subtitles, and the closing block. Confirm that the fifteen projects carry the titles, slugs, subtitles, practice fields listed; the shared closing block reads The best projects start with a good conversation. above Let's talk; the archive's closing headline reads Let's shape what's next in digital together; every message is a short declarative sentence with no exclamation mark, no apology, no emoji"
      cov: "C-FE-141, C-FE-143, C-FE-144, C-FE-150"
    - kind: pytest
      test: "test_output.py::test_seeded_projects_are_persisted_rows_in_authored_order"
      critical: true
      category: "data_integrity"
      weight: 5
    - kind: pytest
      test: "test_output.py::test_category_filter_is_a_membership_test_over_stored_rows"
      category: "business_rule"
      weight: 3
    - kind: pytest
      test: "test_output.py::test_seed_rows_are_not_duplicated_on_a_second_read"
      category: "data_integrity"
      weight: 5
    - kind: browser
      do: "Filter the archive from half way down the page, confirm the page does not jump, copy the address and open it in a fresh window. Confirm that activating a filter does not scroll the page; filtering pushes a history entry; the app reads the address once on first paint, then sets the filter to match; the app renders a filter control only for a practice field with published members"
      cov: "C-CF-35, C-CF-36, C-CF-37, C-CF-38"
    - kind: browser
      do: "Filter to a practice field with no published members and read the empty surface, then watch a slow load show placeholders at the size of what replaces them, force a load to fail and read the failure surface, then pull the network out mid-edit and read the offline strip. Confirm that every collection has an empty surface built from a mark, one line, one optional control; A filtered archive with no members offers a control reading Show all projects; A filtered journal with no members offers a control reading Show all entries; An empty signed-in reel reads Your reel is empty with Browse projects; related entries, the client wall, the awards wall are not rendered when empty"
      cov: "C-UF-14, C-UF-15, C-UF-16, C-UF-17, C-UF-18"
    - kind: browser
      do: "Filter to a practice field with no published members and read the empty surface, then watch a slow load show placeholders at the size of what replaces them, force a load to fail and read the failure surface, then pull the network out mid-edit and read the offline strip. Confirm that every loading surface is a placeholder at exactly the size of the element replaced; A failed load offers a control reading Try again; A row that lost its project reads No longer available, keeping only its remove control; losing the connection raises a strip reading You are offline; A held reel edit reads You are offline. Changes will be saved"
      cov: "C-UF-19, C-UF-20, C-UF-21, C-UF-22, C-UF-23"
    - kind: browser
      do: "Filter to a practice field with no published members and read the empty surface, then watch a slow load show placeholders at the size of what replaces them, force a load to fail and read the failure surface, then pull the network out mid-edit and read the offline strip. Confirm that held writes replay in order when the connection returns; A send with no connection is blocked, reading Could not send. Your reel is safe; A surface never shows two states at once; An error renders a surface rather than a blank page"
      cov: "C-UF-24, C-UF-25, C-UF-26, C-UF-27"
    - kind: pytest
      test: "test_output.py::test_unknown_category_value_is_treated_as_absent"
      category: "validation"
      weight: 3
- id: "visitor_reads_a_project_case_study"
  purpose: "A visitor opens one project and finds the next project already underneath it"
  substeps:
    - kind: browser
      do: "Open a project from the archive and read its opening, its introduction with the practice fields beside it, its media run, its credit list, and scroll off the bottom into the next project. Confirm that the project opening carries a half-opacity measurement copy hidden from assistive technology; project body media runs at four widths, each subtracting its share of the gap; A video player expresses progress as a transform rather than as a width; A credit row carries the role on the left, the name on the right, both uppercase; A credit row rule is drawn thinner than a hairline"
      cov: "C-FE-87, C-FE-88, C-FE-89, C-FE-90, C-FE-91"
    - kind: browser
      do: "Open a project from the archive and read its opening, its introduction with the practice fields beside it, its media run, its credit list, and scroll off the bottom into the next project. Confirm that the next project is a fixed layer revealed as the main block scrolls off"
      cov: "C-FE-92"
    - kind: pytest
      test: "test_output.py::test_project_detail_row_carries_intro_and_credits"
      category: "business_rule"
      weight: 3
    - kind: pytest
      test: "test_output.py::test_unknown_project_slug_is_refused_as_not_found"
      category: "validation"
      weight: 3
