- id: visitor_copies_the_install_line_and_reaches_the_manual
  purpose: "A visitor copies the install line from the opening of the tour, reaches the module grid and follows a tile into the documentation"
  substeps:
    - kind: browser
      do: "Open the tour, read the opening headline as it assembles from its own words and characters, copy the install line with its copy control before the stage beside the line has filled, then follow the secondary call into the second stop"
      cov: C-UF-21, C-CF-22, C-CF-23
    - kind: pytest
      test: test_output.py::test_page_tour_leads_with_one_primary_action_and_its_install_line
      critical: true
      category: core_outcome
      weight: 5
    - kind: browser
      do: "Confirm the install line sits outside the stage so the line remains usable when the scene never loads"
      cov: C-CF-24, C-CF-26
    - kind: pytest
      test: test_output.py::test_page_tour_stops_are_in_the_document_at_all_times
      category: presentation
      weight: 1
    - kind: browser
      do: "Scroll the tour to its twelfth stop, reach the grid of twelve module tiles, point at one tile and watch that module's coloured arc light on the instrument above, then follow the tile into that module's documentation route"
      cov: C-CF-28, C-CF-31, C-CF-32
    - kind: pytest
      test: test_output.py::test_page_tour_tile_hover_lights_the_module_arc
      category: presentation
      weight: 1
    - kind: browser
      do: "Look at each module tile in the grid closing the tour and confirm the tile carries a colour dot in its own module's brightest step beside the module name set in the monospace at uppercase"
      cov: C-CF-29, C-CF-30
    - kind: browser
      do: "Scroll the tour downwards through several stops and then upwards again, confirming every stop transition reverses exactly rather than replaying"
      cov: C-CF-21
    - kind: pytest
      test: test_output.py::test_page_tour_stop_is_driven_by_scroll_and_reverses
      category: business_rule
      weight: 3
    - kind: browser
      do: "Walk the surface and confirm that the tour's module grid lays four rows of three tiles at a wide width, and that a split headline carries the intact original string as its accessible name"
      cov: C-FE-36, C-UX-28
    - kind: browser
      do: "Walk the surface and confirm that every stop's text sits in the document at all times, and that a stop change is not announced"
      cov: C-UX-29, C-UX-30
    - kind: browser
      do: "Walk the surface and confirm that the heart particles blend additively so an overlap brightens, and that the particle glow has no radius in its base state"
      cov: C-FE-19, C-FE-20

- id: tour_survives_a_scene_that_cannot_run
  purpose: "With no rendering context the tour keeps its ring, its graduation marks, its coloured arcs and its whole narrative"
  substeps:
    - kind: pytest
      test: test_output.py::test_page_scene_degrades_to_the_drawn_ring
      critical: true
      category: core_outcome
      weight: 5
    - kind: browser
      do: "With the scene unavailable confirm the ring, the graduation marks and the coloured arcs render alone while the headlines behave normally"
      cov: C-CF-50, C-CF-51
    - kind: pytest
      test: test_output.py::test_page_reduced_motion_holds_a_still_instrument
      category: business_rule
      weight: 3
    - kind: browser
      do: "Under a sustained frame-rate drop confirm no further object is loaded, and that the degradation state of the scene is recorded as an event"
      cov: C-CF-52, C-CF-55
    - kind: browser
      do: "Set a preference against movement, reload the tour, and confirm the instrument holds one still frame rather than disappearing while every stop's content appears in its final state"
      cov: C-CF-48, C-CF-49, C-UX-21

- id: reader_walks_the_whole_manual_on_the_pager_alone
  purpose: "A reader walks from the first page of the first module to the last page of the last module without returning to the tree"
  substeps:
    - kind: pytest
      test: test_output.py::test_pager_walks_the_whole_flattened_tree_across_module_boundaries
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_first_page_has_no_previous_and_the_last_page_has_no_next
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_seeded_pages_carry_a_gapless_flattened_sequence
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_in_section_list_is_generated_from_the_content_store
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_page_anchors_are_unique_and_a_missing_anchor_lands_at_the_top
      category: data_integrity
      weight: 5
    - kind: browser
      do: "Read a documentation page, press the pager's next control at the end of a module's last page and arrive at the first page of the next module, then read the generated list of the module's sibling pages beneath the body"
      cov: C-UF-22, C-CF-98
    - kind: browser
      do: "Open a page with no children and confirm no in-section list is shown, then open the page with no demo and confirm no placeholder panel is shown"
      cov: C-CF-99, C-CF-100
    - kind: browser
      do: "Confirm the current page is marked as current in the tree rather than merely coloured, and that every subheading in the article carries a stable anchor"
      cov: C-UX-35, C-CF-87
    - kind: pytest
      test: test_output.py::test_page_pager_names_its_destination_and_omits_the_edges
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_documentation_routes_are_complete_documents_under_one_origin
      category: core_outcome
      weight: 5
    - kind: browser
      do: "Walk the surface and confirm that a specimen block carries its source in the monospace on a recessed ground, and that a long specimen line scrolls sideways inside its block"
      cov: C-CF-333, C-CF-335
    - kind: browser
      do: "Walk the surface and confirm that a specimen block's text is selectable, and that the copy control sits at the specimen block's top right behind a backdrop blur"
      cov: C-CF-337, C-CF-341
    - kind: browser
      do: "Walk the surface and confirm that the copy control swaps to a confirmation mark, then reverts, and that the copy confirmation is announced to assistive technology"
      cov: C-CF-342, C-CF-347
    - kind: browser
      do: "Walk the surface and confirm that on a touch device the copy control is permanently visible, and that a specimen block sits on a step of the hole ramp"
      cov: C-CF-349, C-FE-35
    - kind: browser
      do: "Walk the surface and confirm that every hover effect carries a non-hover equivalent on a touch device"
      cov: C-UX-27

