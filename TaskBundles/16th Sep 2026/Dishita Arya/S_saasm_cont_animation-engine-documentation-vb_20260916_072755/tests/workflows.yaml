      cov: C-CF-61, C-CF-62
    - kind: browser
      do: "Confirm the demo column carries one panel per page in the current module, each panel carrying a label strip holding the page name in the monospace at uppercase"
      cov: C-CF-66, C-CF-67
    - kind: browser
      do: "Activate a tree row and watch the article scroll to that page, then move between demonstration panels directly with the two steppers in the header"
      cov: C-CF-73, C-CF-74
    - kind: pytest
      test: test_output.py::test_page_demo_panel_outside_the_window_does_not_run
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_seeded_modules_carry_their_order_family_object_and_tile
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeded_badges_name_two_modules_and_carry_an_expiry
      category: data_integrity
      weight: 5
    - kind: browser
      do: "Scroll the article of a module's page and watch that page become current in the module tree while its demonstration panel becomes current in the middle column, then activate another panel and watch the article scroll to that page"
      cov: C-CF-70, C-CF-71, C-CF-72
    - kind: browser
      do: "Set a preference against movement, open a documentation page, and confirm each demonstration panel renders a static first frame rather than looping"
      cov: C-CF-86
    - kind: browser
      do: "Walk the surface and confirm that the current demo panel lifts its ground to the module's dimmest step, and that the demo panel gap is zero, so panels butt against each other"
      cov: C-FE-37, C-FE-06
    - kind: browser
      do: "Walk the surface and confirm that the in-section list carries a fixed heading above the sibling rows, and that the tree, the demo column, the article are distinct named landmarks"
      cov: C-FE-60, C-UX-34
    - kind: browser
      do: "Walk the surface and confirm that code blocks are themed outside the family system, and that a documentation section rebinds one alias of eight steps to one family"
      cov: C-UX-10, C-UX-08

