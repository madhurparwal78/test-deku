      do: "Watch the preview run four cells, one animating and three ghosted at successive offsets, with the onion skin showing the trail of previous positions"
      cov: C-CF-157, C-CF-158
    - kind: browser
      do: "Confirm duration, loop delay and the two opacity endpoints are each a slider paired with a numeric field, and that an editor readout is drawn in the seven-segment form"
