    - kind: browser
      do: "Open / at the site root and read the loader holding the wordmark alone on paper cream, never returning on a later navigation inside the site; then the hero headline assembling word by word out of a soft blur, its lede sentence, the signal-coloured store pill and the quieter ghost pill beside it, which is the page's one primary action against every secondary one"
