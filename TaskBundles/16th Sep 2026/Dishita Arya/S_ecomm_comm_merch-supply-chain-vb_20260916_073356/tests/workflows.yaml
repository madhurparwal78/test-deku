- id: "visitor_reads_the_site_and_starts_a_project"
  purpose: "A visitor reads every public route, throws the pill pile, filters the catalogue and opens a brief"
  substeps:
    - kind: browser
      do: "Open the landing route and let the intro reel finish, then read the header pill and the hero. Confirm that The intro reel plays once per session; The intro reel never blocks navigation to another route"
      cov: "C-CF-09, C-CF-10"
    - kind: browser
      do: "Scroll the landing route through its bands to the footer. Confirm that The footer carries four columns over the copyright line on every route; Each public route leads with one primary action distinct from every secondary one"
      cov: "C-CF-13, C-CF-14"
    - kind: browser
      do: "Throw the pill pile with the pointer and watch the heap settle. Confirm that The hero carries a backer endorsement chip, the display headline, the two-line standfirst, the mascot; Pills stay readable at rest"
      cov: "C-CF-15, C-CF-18"
    - kind: browser
      do: "Ask the browser for reduced motion, reload the landing route, and read the page at rest. Confirm that The pills' words are present as an ordinary list for assistive technology; The simulation stops stepping once off screen"
      cov: "C-CF-21, C-CF-24"
    - kind: browser
      do: "Open the catalogue and work the category chips at a wide window and at a narrow one. Confirm that The simulation is torn down on navigation; A catalogue card carries a generated image, the title, a from-price, a minimum order quantity"
      cov: "C-CF-25, C-CF-29"
    - kind: browser
      do: "Open the landing route and let the intro reel finish, then read the header pill and the hero. Confirm that Stacking follows a closed ladder that nothing is introduced outside of; A four-step ink-alpha ladder carries hairlines, dividers, secondary text, the card shadow"
      cov: "C-FE-04, C-FE-05"
    - kind: browser
