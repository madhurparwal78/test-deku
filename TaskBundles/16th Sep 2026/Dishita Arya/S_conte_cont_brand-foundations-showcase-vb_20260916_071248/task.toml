domain          = "content-publishing"
pattern         = "content-publishing"
service_profile = "P4-db-storage"
variant_axes    = ["spec_sections", "critical_depth"]
capability_flags = "aesthetic"
design_direction = "companion"
launch_surface  = "mobile_viewport,no_broken_links,single_cta,sitemap_robots,social_preview"
task_code     = "S_conte_cont_brand-foundations-showcase-vb_20260916_071248"
naming_scheme = "task-code-v1"
