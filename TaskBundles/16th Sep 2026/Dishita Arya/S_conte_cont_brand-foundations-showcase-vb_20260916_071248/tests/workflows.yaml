- id: "the_reveals_and_the_motion_character_hold_the_scroll_contract"
  purpose: "Every reveal is scrubbed against scroll position, un-plays on the way back up, and moves on one eased family"
  substeps:
    - kind: browser
      do: "Scroll a chapter down slowly and then back up slowly, watching the lines, the parenthetical tags, the arrow glyphs, the logo lockups, and how each of them moves. Confirm that Body copy splits into lines, each line rising into place as the line's opacity rises; scrubs the line reveal against scroll position rather than triggering the reveal on an intersection; Scrolling backward un-plays every reveal rather than replaying the reveal forward; Lines within a block stagger, so a paragraph assembles line by line; line splitter re-splits on resize; parenthetical eyebrow rides a shorter ladder slightly after the lines the eyebrow labels."
      cov: "C-CF-57, C-CF-58, C-CF-59, C-CF-60, C-CF-61, C-CF-62"
    - kind: browser
      do: "Scroll a chapter down slowly and then back up slowly, watching the lines, the parenthetical tags, the arrow glyphs, the logo lockups, and how each of them moves. Confirm that A control holds two copies of the arrow glyph; Both arrow layers move by one glyph height on hover, on focus, on a carousel advance; arrow rolls rather than fades; A logo lockup is revealed by a clip wipe from the lockup's bottom edge, fully clipped to fully open; inner content of a logo lockup counter-translates, so the lockup holds position as the window opens; Wheel input, touch input drive one eased virtual scroll position."
      cov: "C-CF-63, C-CF-64, C-CF-65, C-CF-66, C-CF-67, C-CF-68"
    - kind: browser
      do: "Scroll a chapter down slowly and then back up slowly, watching the lines, the parenthetical tags, the arrow glyphs, the logo lockups, and how each of them moves. Confirm that Every scrubbed timeline reads the one eased scroll position; scroll smoothing pauses for as long as the full-screen menu is open, resuming on close; Scroll progress comes from a marker element's position relative to the viewport rather than from an absolute document offset; A chapter of any height lands the chapter's reveals, the chapter's colour on the right sections; route mask plays once on a route change rather than being scrubbed; carousel enter, the carousel leave play once rather than being scrubbed."
      cov: "C-CF-69, C-CF-70, C-CF-71, C-CF-72, C-CF-73, C-CF-74"
    - kind: browser
      do: "Scroll a chapter down slowly and then back up slowly, watching the lines, the parenthetical tags, the arrow glyphs, the logo lockups, and how each of them moves. Confirm that One house ease-out is the dominant curve, carrying the reveal transforms, a slow-out settle easing off at the end; A sine ease-out carries the colour, background moves; A symmetric sine ease-in-out carries transitions that come, go the same way; A standard curve carries interface state changes; A quad ease-out carries the slower, longer transforms; A cubic ease-in-out carries the long colour sweep."
      cov: "C-UX-37, C-UX-38, C-UX-39, C-UX-40, C-UX-41, C-UX-42"
