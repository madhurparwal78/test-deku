schema_version = "1.4"

[task]
name = "deku/connected-workspace-platform-vb"
version = "1.0.0"
uuid_v5 = "06e13f35-3011-50da-9a2f-f7df7623fdfe"
description = "A connected workspace where teamspaces hold page trees and shared database views, one asked authorization decision governs every read, and a published page reaches anonymous readers while its unpublished siblings stay closed."
authors = [
  "abhishek.shaw@ethara.ai",
  "dishita.aryaint17@ethara.ai",
]
keywords = ["greenfield", "enterprise", "python", "postgres", "minio"]

[metadata]
category     = "Greenfield"
sub_category = "enterprise"
domain          = "it-devtools"
pattern         = "content-publishing"
service_profile = "P4-db-storage"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = ""
design_direction = "companion"
launch_surface = "custom_404,favicon,no_broken_links,no_frontend_secrets,security_headers"
task_code     = "E_itdev_cont_connected-workspace-platform-vb_20260916_053702"
naming_scheme = "task-code-v1"
grader_version = "0.22.0"
language     = "python"
archetype    = "connected-workspace-platform"
variant      = "b"
difficulty   = ""
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 200
tokens_expected = 8000000
contributor_id  = "dishita.aryaint17@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"
storage = "minio"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-deku}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-minioadmin}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-minio-root-3d81f7a2}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-deku}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-minioadmin}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-minio-root-3d81f7a2}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_STORAGE = "minio" }

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"

[[artifacts]]
source      = "/app"
destination = "app"
