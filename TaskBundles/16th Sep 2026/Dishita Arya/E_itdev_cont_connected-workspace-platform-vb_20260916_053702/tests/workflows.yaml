- id: member_edits_a_page_block_by_block
  purpose: A member signs in, inserts a block, reorders the tree, and the stored page matches what the editor showed
  substeps:
    - kind: browser
      do: Sign in at /login as member@example.com with deku-demo-pw-2026 and open Engineering Handbook from the Teamspaces section of the sidebar
      cov: C-UF-01
    - kind: browser
      do: Type a paragraph at the end of the page, drag the to-do block above it, then reload and confirm the order held
      cov: C-CF-43
    - kind: pytest
      test: test_output.py::test_block_insert_edit_and_move_are_persisted_as_rows
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_page_row_persisted_matches_what_the_page_endpoint_returned
      category: data_integrity
      weight: 5

- id: member_publishes_a_page_to_the_web
  purpose: Publishing reports the public page count and serves the page anonymously at its slug
  substeps:
    - kind: browser
      do: As member@example.com open Engineering Handbook, choose Share, choose to publish, and read the child-page count in the confirmation
      cov: "C-CF-115 (earned: the journey opens on this surface, so the step walks the ask even where the wording differs), C-CF-116 (earned: the journey opens on this surface, so the step walks the ask even where the wording differs)"
    - kind: browser
      do: Open /site/engineering-handbook in a signed-out browser and confirm the page renders
    - kind: pytest
      test: test_output.py::test_publish_reports_the_public_page_count_and_serves_the_slug
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_published_route_renders_a_title_and_a_description
      category: business_rule
      weight: 3

- id: unpublished_page_is_denied_to_an_anonymous_reader
  purpose: An unpublished page and its attachment stay closed to anyone signed out
  substeps:
    - kind: browser
      do: Signed out, open the public address of a page that has been unpublished and confirm the product answers gone rather than showing the workspace
      cov: C-CF-121
    - kind: pytest
      test: test_output.py::test_unpublish_makes_the_public_address_gone
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_anonymous_request_for_an_unpublished_seeded_page_is_not_found
      category: security
      weight: 5

- id: explicit_deny_denies_one_member_and_nobody_else
