- id: tampered_or_replayed_message_is_never_trusted
  purpose: Tampered, replayed and reordered messages are handled safely, safety numbers agree and change, and timed messages vanish
  substeps:
    - kind: browser
      do: "Sign in at `/login` as `user3@example.com` with password `deku-demo-pw-2026`, entering the same password whenever `/unlock` asks, open `/chats/nova`, open the safety number and verify sixty digits appear in twelve groups of five"
      cov: C-RL-09, C-CF-134
    - kind: browser
      do: "In the conversation with `nova`, set the disappearing-message timer to 1 hour and verify the conversation header shows the timer"
      cov: C-CF-139, C-CF-137
    - kind: pytest
      test: test_output.py::test_tampered_ciphertext_dropped_with_notice_never_shown
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_replayed_reordered_and_delayed_messages_show_once_in_order
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_safety_numbers_match_and_identity_change_blocks_send
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_disappearing_timer_removes_message_from_both_browsers
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_photo_video_and_file_attachments_arrive_sealed
      category: business_rule
      weight: 3

- id: group_membership_conflict_admits_one_change
  purpose: A group is created in the browser, and at the API exactly one of two simultaneous changes wins and only current members receive messages
  substeps:
    - kind: browser
      do: "Sign in at `/login` as `user4@example.com` with password `deku-demo-pw-2026`, entering the same password whenever `/unlock` asks, open the New group dialog, create the group `Weekend Hike` from the name with the username `nova`, and verify the group conversation lists two members"
      cov: C-RL-10, C-CF-97
    - kind: browser
      do: "In `Weekend Hike`, open the composer sticker picker, send the `Wave` sticker from the built-in pack and verify a new message for the `Wave` sticker appears in the conversation"
      cov: C-CF-106
    - kind: pytest
      test: test_output.py::test_simultaneous_same_revision_group_changes_admit_one_winner
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_group_message_reaches_current_members_only
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_member_who_is_not_admin_denied_removing_others
      category: security
      weight: 5

- id: person_calls_from_group_and_conversation_then_signs_out
  purpose: A person starts a group voice call and a one-to-one video call, the called side rings and closes, then signs out
  substeps:
    - kind: browser
      do: "Sign in at `/login` as `user4@example.com` with password `deku-demo-pw-2026`, entering the same password whenever `/unlock` asks, open the `Weekend Hike` group, start a voice call from the group conversation header and verify the call screen opens with a hang-up control, hang up, then open `/chats/nova`, start a video call from the conversation header and verify the call screen opens naming `nova`"
      cov: C-CF-88, C-CF-112, C-CF-113
    - kind: browser
      do: "Open `/settings/devices`, sign out, confirm when asked for confirmation, and verify Beacon returns to `/login`"
      cov: C-CF-120, C-UX-12
    - kind: pytest
      test: test_output.py::test_voice_message_call_ringing_and_read_receipt
      category: business_rule
      weight: 3
