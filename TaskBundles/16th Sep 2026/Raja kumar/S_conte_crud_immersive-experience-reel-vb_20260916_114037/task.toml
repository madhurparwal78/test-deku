]
uuid_v5 = "804cc479-7816-548b-af23-be3fd64fd467"
keywords = ["greenfield", "solo_founder", "python", "postgres", "mailpit", "showcase", "reels"]

[metadata]
category     = "Greenfield"
sub_category = "solo_founder"
domain          = "content-publishing"
pattern         = "crud-catalog"
service_profile = "P2-db-email"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = "aesthetic"
task_code       = "S_conte_crud_immersive-experience-reel-vb_20260916_114037"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "custom_404,meta_tags,privacy_page,social_preview,spam_protection"
grader_version  = "0.22.0"
rubric_version  = "1"
language     = "python"
archetype    = "immersive-experience-reel"
variant      = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 200
