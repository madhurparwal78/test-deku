[metadata.services]
backend = "postgres"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0

network_mode  = "public"
allowed_hosts = []

env = { APP_PUBLIC_PORT = "4173", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev-2026@postgres:5432/daykin}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev-2026@postgres:5432/daykin}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 30.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 5400.0

env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-admin-dev-2026@postgres:5432/daykin}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DEKU_SERVICE_BACKEND = "postgres" }

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"

[delivery.images]
main = "mcr.microsoft.com/playwright/python:v1.49.1-noble@sha256:42e251ec3238672c931be6c3565ff279690ae072c3e22058128d0412494f6866"
postgres = "postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412"

[[artifacts]]
source      = "/app"
destination = "app"
