      do: Open /universe and count the awards shown in the awards list
    - kind: browser
      do: Open /roadmap and verify the dated cards show the same awards in the same date format
    - kind: browser
      do: Open /games and verify the carousel shows ten covers with Shaking first and Love last
    - kind: browser
      do: Open /puzzle and verify it offers the way back to the hub plus a next and a previous game
    - kind: browser
      do: Open /memory, press start, click three face-down cards in quick succession, and verify no more than two cards are face up at once
