- id: resolver_is_pure_arithmetic_in_any_year
  purpose: A day and a month resolve to sixteen members by arithmetic that never consults the clock, and impossible pairs are refused
  substeps:
    - kind: browser
      do: Open / and type 29 into the day field and 02 into the month field of the birthday finder, then verify sixteen characters are shown, one for each of the sixteen series
    - kind: browser
      do: Type 31 into the day field and 04 into the month field, read the refusal, then change the month to 01 and verify the same day 31 now resolves
    - kind: pytest
      test: test_output.py::test_leap_day_resolves_to_ordinal_sixty
      category: core_outcome
      critical: true
      weight: 5
    - kind: pytest
      test: test_output.py::test_resolution_is_pure_and_repeatable
      category: business_rule
      critical: true
      weight: 5
    - kind: pytest
      test: test_output.py::test_last_day_of_cycle_resolves_and_carries_a_colour
      category: business_rule
      critical: true
      weight: 5
    - kind: pytest
      test: test_output.py::test_thirty_first_of_april_refused_january_accepted
      category: validation
      critical: true
      weight: 5
    - kind: pytest
      test: test_output.py::test_out_of_range_day_and_month_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_the_finder_resolves_the_leap_day_whatever_year_the_device_believes
      category: business_rule
      critical: true
      weight: 5

