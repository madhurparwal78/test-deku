services:
  main:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PUBLIC_PORT:-4173}:4173"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    restart: unless-stopped
    environment:
      POSTGRES_USER: deku_admin
      POSTGRES_PASSWORD: deku-admin-dev-2026
      POSTGRES_DB: daykin
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deku_admin -d daykin && PGPASSWORD=deku-local-dev-2026 psql -h 127.0.0.1 -U deku_app -d daykin -c 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s
