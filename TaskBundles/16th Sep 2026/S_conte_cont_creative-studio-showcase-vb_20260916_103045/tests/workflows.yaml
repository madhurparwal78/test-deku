- id: visitor_scrolls_the_home_route_from_the_hero_to_the_closing_panel
  purpose: "A visitor with no account scrolls the home route from the white hero to the closing panel and reads every band in order"
  substeps:
    - kind: browser
      do: "Open / signed out and observe the studio initial and its apostrophe centred alone on a white screen while the home route loads"
      cov: C-FE-01, C-UF-01
    - kind: browser
      do: "Observe the hero on the white ground, the two-line headline Not a style, a perspective. and Because Naught' is Everythin'., one filled black book a call pill, and the full Naught' wordmark filling the width"
      cov: C-FE-02, C-FE-03, C-FE-04, C-UX-01
    - kind: browser
      do: "Scroll past the hero and observe the ground turn black at the band boundary and stay black, with the header mark inverting rather than disappearing"
      cov: C-UX-02, C-FE-05, C-CF-01
    - kind: browser
      do: "Observe the headline pairs Most brands produce content. with We prefer ideas., then Good brands communicate. with Great brands surprise., each line rising from behind its own edge"
      cov: C-FE-06, C-FE-07, C-UX-03
    - kind: browser
      do: "Observe the step aside band, the label ( The step aside ) beside four prose lines beginning In a world of infinite images, the rare thing is, with a media panel running to the right edge"
      cov: C-FE-08, C-FE-09, C-FE-10
    - kind: browser
      do: "Scroll through the fourth band and observe the word works assembling out of five scattered letters that converge and grow into one word"
      cov: C-FE-11, C-FE-12
    - kind: browser
      do: "Observe the featured rail with five cards in two staggered columns, each an uppercase monospace eyebrow, a one-sentence tagline and a cover uncovering diagonally, then View all ( 07 ), the copyright and Sound"
      cov: C-CF-02, C-FE-13, C-FE-14, C-UX-04
    - kind: browser
      do: "Scroll through the showreel band and observe the film growing from a small framed picture on the wall of a rendered room until the film fills the window, with no caption on the band"
      cov: C-FE-15, C-FE-16
    - kind: browser
      do: "Observe the studio band label ( The Studio ), the prose continuing an empty space open enough to become anything, and the separate two-line block or something unexpected. arriving late"
      cov: C-FE-17, C-FE-18, C-FE-19
    - kind: browser
      do: "Observe Forms follow perspective. filling the width, then We design beside the five services each after a circular bullet, then the people heading Naught' without people with two groups of names"
      cov: C-FE-20, C-FE-21, C-FE-22
    - kind: browser
      do: "Scroll to the foot and observe the closing line Let's start and from naught', the two outlined pills, Linkedin Instagram Behance one per line, and the white wordmark cropped by the bottom edge"
      cov: C-FE-23, C-FE-24, C-FE-25
    - kind: browser
      do: "Scroll back up through the featured rail and observe every reveal and wipe playing backwards exactly and stopping where the scroll stops"
      cov: C-UX-05, C-UX-06, C-FE-26
    - kind: pytest
      test: test_output.py::test_the_home_route_is_served_to_a_visitor_with_no_session
      category: core_outcome
      weight: 5
      cov: C-OV-01, C-UF-02
    - kind: pytest
      test: test_output.py::test_the_services_endpoint_returns_the_five_services_in_order
      category: data_integrity
      weight: 5
      cov: C-DM-01, C-DC-01
    - kind: pytest
      test: test_output.py::test_the_people_endpoint_returns_founders_and_management_then_creative_partners_in_order
      category: data_integrity
      weight: 5
      cov: C-DM-02, C-DC-02
    - kind: pytest
      test: test_output.py::test_the_settings_endpoint_returns_the_stored_byline_contact_and_copyright_range
      category: data_integrity
      weight: 5
      cov: C-DM-03, C-DC-03
    - kind: pytest
      test: test_output.py::test_the_home_route_featured_rail_count_reads_the_published_catalogue_length
      category: business_rule
      weight: 3
      cov: C-CF-03
    - kind: pytest
      test: test_output.py::test_the_home_route_markup_carries_every_band_headline_in_order
      category: core_outcome
      weight: 5
      cov: C-CF-04
    - kind: pytest
      test: test_output.py::test_the_home_route_markup_omits_the_reference_editor_leftovers
      category: presentation
      weight: 1
      cov: C-CN-01
    - kind: pytest
      test: test_output.py::test_the_health_route_answers_ok
      category: core_outcome
      weight: 5
      cov: C-DC-04
- id: visitor_reads_the_works_index_and_opens_a_case_study
  purpose: "The works index lists the seven published case studies under a title-size copyright masthead, and a card opens its case study"
  substeps:
    - kind: browser
      do: "Open /works and observe the black masthead with Works on the left and ©24 . 26 on the right at the same size, both rising one glyph at a time"
      cov: C-CF-05, C-FE-27, C-UX-07
    - kind: browser
      do: "Observe seven cards below the masthead in two staggered columns whose gap opens as the page scrolls, each card the same eyebrow, tagline and cover card as the home rail"
      cov: C-FE-28, C-FE-29
