      do: "Point at a works index card and observe the label VIEW growing from nothing centred on the pointer, then shrinking back when the pointer leaves"
      cov: C-FE-30, C-UX-08
    - kind: browser
      do: "Observe each card image drifting a few pixels inside its frame against the page as the card passes, without reading as a parallax"
