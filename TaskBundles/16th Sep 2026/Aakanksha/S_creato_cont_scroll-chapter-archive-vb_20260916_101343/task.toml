schema_version = "1.4"

[task]
name = "deku/scroll-chapter-archive-vb"
version = "1.0.0"
description = "A cinematic scroll story with a personal frame archive: a public visitor scrolls a studio's published ten-chapter story whose posters are stored as objects in MinIO, a signed-in member captures frames into a server-held archive that travels across devices, reorders them and publishes ordered sets as guided routes, and a curator publishes chapters and features or hides routes, while a draft chapter and its poster stay private until published and every member and curator endpoint is authorized server-side"
authors = [
    "utsav.jain@ethara.ai",
    "aakanksha.sharma@ethara.ai",
]
uuid_v5 = "07ab0ed3-4a58-5a04-8cf6-59a3c8b79da7"
keywords = ["greenfield", "solo_founder", "creator-monetization", "content-publishing", "python", "postgres", "minio"]

[metadata]
category            = "Greenfield"
sub_category        = "solo_founder"
domain              = "creator-monetization"
pattern             = "content-publishing"
archetype           = "scroll-chapter-archive"
variant             = "b"
service_profile     = "P4-db-storage"
task_code           = "S_creato_cont_scroll-chapter-archive-vb_20260916_101343"
naming_scheme       = "task-code-v1"
language            = "python"
grader_version      = "0.22.0"
capability_flags    = "aesthetic"
design_direction    = "companion"
launch_surface      = "cookie_choice,meta_tags,no_frontend_secrets,security_headers,social_preview"
rubric_version      = "1"
canary_present      = true
contributor_id      = "aakanksha.sharma@ethara.ai"
variant_axes        = ["spec_sections", "critical_depth"]

spec_sections_given = [
  "overview", "roles", "features", "flow", "uiux",
  "techrequirements", "datamodel", "constraints", "contract",
]

reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"
turns_expected       = 120
tokens_expected      = 4000000
created_at           = "2026-09-16"

[metadata.services]
backend = "postgres"
storage = "minio"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 2
memory_mb         = 4096
storage_mb        = 10240
build_timeout_sec = 900.0
network_mode      = "public"
allowed_hosts     = []
env = { APP_PUBLIC_PORT = "4173", DATABASE_URL = "${DATABASE_URL:-postgresql://studio:deku-local-dev@postgres:5432/studio}", DB_URL = "${DB_URL:-postgresql://studio:deku-local-dev@postgres:5432/studio}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-deku}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-deku-access-3d81}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-deku-secret-3d81f7a2}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -U studio"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "shared"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://studio:deku-local-dev@postgres:5432/studio}", DB_URL = "${DB_URL:-postgresql://studio:deku-local-dev@postgres:5432/studio}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://postgres:deku-local-dev@postgres:5432/studio}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-deku}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-deku-access-3d81}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-deku-secret-3d81f7a2}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_STORAGE = "minio" }

[delivery]
format         = "harbor"
schema_version = "1.4"
reward_path    = "/logs/verifier/reward.json"
reward_key     = "reward"
reward_range   = [0.0, 1.0]
reward_full    = 1.0
network_policy = "public"

[[artifacts]]
source      = "/app"
destination = "app"
