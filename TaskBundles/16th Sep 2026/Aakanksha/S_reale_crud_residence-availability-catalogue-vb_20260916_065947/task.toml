[environment]
os                = "linux"
cpus              = 2
memory_mb         = 4096
storage_mb        = 10240
build_timeout_sec = 900.0
network_mode      = "public"
allowed_hosts     = []
env = { APP_PUBLIC_PORT = "4173", DATABASE_URL = "${DATABASE_URL:-postgresql://estate:deku-local-dev@postgres:5432/estate}", DB_URL = "${DB_URL:-postgresql://estate:deku-local-dev@postgres:5432/estate}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-deku}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-deku-access-3d81}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-deku-secret-3d81f7a2}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -U estate"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "shared"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://estate:deku-local-dev@postgres:5432/estate}", DB_URL = "${DB_URL:-postgresql://estate:deku-local-dev@postgres:5432/estate}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://postgres:deku-local-dev@postgres:5432/estate}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-deku}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-deku-access-3d81}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-deku-secret-3d81f7a2}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_STORAGE = "minio" }

[delivery]
