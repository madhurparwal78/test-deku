schema_version = "1.4"

[task]
name = "deku/residence-availability-catalogue-vb"
version = "1.0.0"
description = "A marketing and availability catalogue for a boutique gated development of twenty-five Mediterranean apartments: a public visitor browses the released apartments, filters and sorts them by typology, bedroom count and interior area, opens one to read floor plans stored as objects in MinIO, and submits a callback request recording the chosen apartment and contact details, while a seeded sales role reads the callback requests and manages availability, and a coming-soon apartment and its floor plan stay private until released and every sales endpoint is authorized server-side"
authors = [
    "utsav.jain@ethara.ai",
    "aakanksha.sharma@ethara.ai",
]
uuid_v5 = "75efa799-fcc8-532c-98d3-f1ae95d2aec2"
keywords = ["greenfield", "solo_founder", "real-estate-listings", "crud-catalog", "python", "postgres", "minio"]

[metadata]
category            = "Greenfield"
sub_category        = "solo_founder"
domain              = "real-estate-listings"
pattern             = "crud-catalog"
archetype           = "residence-availability-catalogue"
variant             = "b"
service_profile     = "P4-db-storage"
task_code           = "S_reale_crud_residence-availability-catalogue-vb_20260916_065947"
naming_scheme       = "task-code-v1"
language            = "python"
grader_version      = "0.22.0"
capability_flags    = "aesthetic"
design_direction    = "companion"
launch_surface      = "alt_text,colour_contrast,cookie_choice,meta_tags,mobile_viewport"
rubric_version      = "1"
