schema_version = "1.4"

[task]
name = "deku/agentic-coding-platform-vb"
version = "1.0.0"
description = "Public marketing site and account surface of a coding agent sold to developers and engineering organisations: a fixed chrome and five-column footer over home, six product routes, two model routes, a benchmark leaderboard and plot, a client-only value calculator, a filtered marketplace of plugins and automations, teams, enterprise, a four-plan seven-tier pricing ladder, platform-resolved downloads, a changelog and four legal routes, plus signup, workspaces, seats, invitations by mail, subscriptions carried into killbill under a pinned external key, and an append-only usage meter with an allowance, an overage and a spend limit, on postgres, killbill and mailpit"
uuid_v5 = "1973ca5e-ac5e-559f-8997-f67291f69517"
authors = ["utsav.jain@ethara.ai", "aniket.tyagi24@ethara.ai"]
keywords = ["greenfield", "solo_founder", "python", "postgres", "mailpit", "killbill", "crud-catalog", "saas-micro-tools"]

[metadata]
category         = "Greenfield"
sub_category     = "solo_founder"
domain           = "saas-micro-tools"
pattern          = "crud-catalog"
service_profile  = "P5-db-pay-email"
variant_axes     = ["critical_depth", "spec_sections"]
capability_flags = "aesthetic"
design_direction = "companion"
rubric_version   = "1"
language         = "python"
archetype        = "agentic-coding-platform"
variant          = "b"
task_code        = "S_saasm_crud_agentic-coding-platform-vb_20260916_053425"
naming_scheme    = "task-code-v1"
grader_version   = "0.22.0"
launch_surface   = "custom_404,meta_tags,mobile_viewport,no_frontend_secrets,sitemap_robots"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 180
tokens_expected = 7000000
contributor_id  = "aniket.tyagi24@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend  = "postgres"
email    = "mailpit"
payments = "killbill"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode      = "public"
allowed_hosts     = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", SMTP_HOST = "${SMTP_HOST:-mailpit}", SMTP_PORT = "${SMTP_PORT:-1025}", SMTP_USER = "${SMTP_USER:-}", SMTP_PASS = "${SMTP_PASS:-}", PAYMENTS_API_URL = "${PAYMENTS_API_URL:-http://killbill:8080}", PAYMENTS_API_KEY = "${PAYMENTS_API_KEY:-orbit-labs}", PAYMENTS_API_SECRET = "${PAYMENTS_API_SECRET:-orbit-labs-secret-9f14c73e}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "shared"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", EMAIL_INBOX_API_URL = "${EMAIL_INBOX_API_URL:-http://mailpit:8025}", PAYMENTS_API_URL = "${PAYMENTS_API_URL:-http://killbill:8080}", PAYMENTS_API_KEY = "${PAYMENTS_API_KEY:-orbit-labs}", PAYMENTS_API_SECRET = "${PAYMENTS_API_SECRET:-orbit-labs-secret-9f14c73e}", PAYMENTS_ADMIN_USER = "${PAYMENTS_ADMIN_USER:-admin}", PAYMENTS_ADMIN_PASSWORD = "${PAYMENTS_ADMIN_PASSWORD:-password}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_EMAIL = "mailpit", DEKU_SERVICE_PAYMENTS = "killbill" }

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"

[[artifacts]]
source      = "/app"
destination = "app"
