      cov: C-CF-131, C-CF-132, C-CF-133, C-CF-134
    - kind: pytest
      test: test_output.py::test_publish_gate_refuses_a_record_whose_media_is_deriving
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_chapter_scene_index_outside_the_range_is_refused
      category: validation
      weight: 3

