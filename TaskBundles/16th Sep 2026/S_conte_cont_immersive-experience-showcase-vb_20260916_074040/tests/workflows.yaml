- id: visitor_falls_through_the_home_reel
  purpose: A visitor arrives on the home route, sits through a loader reporting real progress, and falls through the curated reel of three entries
  substeps:
    - kind: browser
      do: Open the home route and watch the loader print a climbing figure beside its rail under the hint reading Scroll down, then read the opening statement arriving as the four separate word nodes Innovative, digital, experiences and studio
      cov: C-UF-01, C-FE-02, C-FE-03
    - kind: browser
      do: Watch the loader rail scale from the completed byte fraction the resource manager reports rather than resting on a fraction, then read the stalled loader sentence beside its control reading Continue with the lighter version
      cov: C-FE-04, C-FE-05, C-FE-06, C-FE-07
    - kind: browser
      do: Scroll the reel and observe a hard flick pulling the camera back, blowing the entry titles up and dropping every interface control
      cov: C-UX-01, C-FE-08, C-FE-09
    - kind: pytest
      test: test_output.py::test_home_reel_returns_the_curated_entries_in_order
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_publishing_a_further_project_leaves_the_home_reel_unchanged
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_reel_entry_whose_project_is_withdrawn_disappears
      category: business_rule
      weight: 3

- id: visitor_opens_a_case_study_and_launches_the_live_site
  purpose: A visitor opens a published case study, reads the headline with the discipline row, and follows the outbound link, which is recorded as an outbound click rather than as a sale
  substeps:
    - kind: browser
      do: Open the case study route for the seeded reel project and read the headline, the discipline row and the three actions
      cov: C-UF-02, C-FE-10, C-FE-11, C-FE-12
    - kind: browser
      do: Follow the outbound control reading Launch website and confirm a new browsing context opens carrying no referrer and no opener relationship, then open the case study seeded with no live address and confirm the outbound control is absent rather than dead
      cov: C-CF-115, C-UF-03, C-CF-116
    - kind: pytest
      test: test_output.py::test_project_detail_endpoint_carries_blocks_disciplines_and_the_reel_relation
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_outbound_click_records_the_slug_and_nothing_identifying
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_disciplines_endpoint_returns_the_vocabulary_in_position_order
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_discipline_outside_the_vocabulary_is_refused
      category: validation
      weight: 3

- id: visitor_plays_the_backstage_reel
  purpose: A visitor opens the behind the scenes overlay on the seeded case study, sees its subtitles render by default, and returns to the case study on the escape key
  substeps:
    - kind: browser
      do: Press the action reading See backstage and watch the overlay open with subtitle text rendering from the opening frame
      cov: C-UF-04, C-CF-117, C-CF-118
    - kind: browser
      do: Press the escape key so the open overlay closes and focus returns to the opening control, then open a case study carrying no reel and confirm the control opening a reel is absent there
      cov: C-UX-02, C-UX-03, C-CF-119
    - kind: pytest
      test: test_output.py::test_reel_endpoint_answers_not_found_for_an_unpublished_project
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_reel_section_carrying_audio_without_a_subtitle_cannot_be_stored
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_section_of_zero_duration_is_refused_on_write
      category: validation
      weight: 3

- id: visitor_leaves_an_email_address
  purpose: A visitor opens the footer panel, submits an address, and the confirmation names the address submitted
  substeps:
    - kind: browser
      do: Open the footer list control, read the consent line, and observe the submit sitting at the hidden opacity until the field carries an address
      cov: C-FE-13, C-FE-14, C-FE-15
    - kind: browser
      do: Submit a well formed address and read the accepted message naming that address, submit a malformed one and read the validation line beside the field, then read the rate limited message about too many attempts and the temporary failure message about something going wrong at our end
      cov: C-FE-16, C-FE-17, C-FE-18, C-FE-19
    - kind: pytest
      test: test_output.py::test_subscriber_intake_answers_the_same_for_a_new_and_a_known_address
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_malformed_address_is_refused_and_writes_nothing
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_consent_record_carries_the_instant_and_the_text_version
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_decoy_field_submission_is_refused_and_writes_nothing
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_confirmation_token_is_single_use_and_stored_as_a_hash
      category: security
      weight: 5

- id: visitor_reaches_the_project_index
  purpose: The project index lists every published case study as a typographic column whose hover recedes the siblings rather than brightening the row
  substeps:
    - kind: browser
      do: Open the project index route, point at one row, and observe every other row receding with a hairline growing in under the name pointed at, the recovery from that dimming running about twice as slowly as the dimming
      cov: C-UF-05, C-UX-04, C-UX-05, C-UX-06
    - kind: browser
      do: Read one index row taking the full width with its items aligned to the end, its project type column right aligned in a narrow span at the secondary opacity beside the title in the serif, then read the empty index line reading Nothing published yet
      cov: C-FE-20, C-FE-21, C-FE-22, C-CF-120
    - kind: pytest
      test: test_output.py::test_project_index_endpoint_lists_only_published_records
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_index_order_is_a_stable_sort_on_a_normalising_key
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_seeded_catalogue_is_stored_as_the_declared_row_counts
      category: data_integrity
      weight: 5

- id: visitor_opens_an_unmatched_address
  purpose: An address matching no route renders the product's own error view with the full chrome and answers not found
  substeps:
    - kind: browser
      do: Open an address that matches no route and read the headline reading That page has moved on beside the action reading See all projects, with the navigation control, the scene and the footer all present
      cov: C-CF-121, C-CF-122, C-CF-123, C-FE-23
    - kind: pytest
      test: test_output.py::test_retired_path_resolves_permanently_in_one_hop
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_health_endpoint_answers_ready
      category: presentation
      weight: 1

- id: visitor_follows_a_retired_path
  purpose: A retired path resolves permanently and in one hop to its case study
  substeps:
    - kind: browser
      do: Open one of the seeded retired paths and confirm a single permanent hop lands on the case study route, then read the server error copy and the offline copy
      cov: C-UF-06, C-CF-124, C-CF-125, C-CF-126
    - kind: pytest
      test: test_output.py::test_unpublished_record_route_answers_not_found
      critical: true
      category: security
      weight: 5

- id: producer_writes_a_draft_and_cannot_publish
  purpose: A producer signs in, edits a draft, mints a preview token, and is refused by the server when attempting to publish
  substeps:
    - kind: browser
      do: Open the console sign in route, sign in as the seeded producer with the seeded password taken from the credentials file at the application root, then open the record editor for the record awaiting sign off
      cov: C-UF-07, C-UF-08, C-UF-09, C-UF-10
    - kind: browser
      do: Open the home reel order route as that producer and observe a refusal rather than a read only copy, then read the console as a dense surface with stable positions
      cov: C-UX-07, C-UX-08, C-UF-11, C-UF-12
    - kind: pytest
      test: test_output.py::test_producer_publish_transition_is_denied_and_state_is_unchanged
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_producer_reordering_the_home_reel_is_denied
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_role_is_read_from_the_session_rather_than_the_request_body
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_stale_version_save_is_rejected_as_a_conflict
      category: data_integrity
      weight: 5

- id: preview_token_opens_the_draft_in_a_fresh_context
  purpose: A minted preview token opens the unpublished record in a fresh context and nothing else does
  substeps:
    - kind: browser
      do: Open the draft reader route carrying the minted token in a fresh browsing context, confirm the preview token is a read only capability bound to one record identifier along with one content state, then open the same route carrying no token and read the not found surface
      cov: C-UF-15, C-UF-16, C-CF-135, C-CF-136
    - kind: pytest
      test: test_output.py::test_preview_token_is_verified_on_the_server
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_guessed_or_mismatched_preview_token_answers_not_found
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_preview_token_is_stored_as_a_hash
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_minted_preview_token_is_returned_once
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_preview_response_refuses_indexing_and_is_never_cached
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_draft_record_is_absent_from_every_public_endpoint
      critical: true
      category: security
      weight: 5

- id: editor_publishes_the_record_and_the_index_grows
  purpose: An editor publishes the record awaiting sign off, the index grows by one entry, and the publish log carries a new row naming the routes invalidated
  substeps:
    - kind: browser
      do: Sign in as the seeded editor, move the record awaiting sign off to the live state so the index carries seventeen entries, then open the console publish log route and confirm the publish rebuilt exactly the routes the change touches
      cov: C-UF-13, C-UF-14, C-CF-127
    - kind: browser
      do: Read the new row naming the routes invalidated and confirm a first publish rebuilds that project along with the index, a change to the home reel order rebuilds the home page, and a change to the global record rebuilds every route, then confirm the console shows exactly what will change before any withdrawal
      cov: C-CF-128, C-CF-129, C-CF-130, C-TR-07
    - kind: pytest
      test: test_output.py::test_editor_publish_transition_moves_the_record
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_publish_log_row_is_written_for_every_transition
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_publish_log_exposes_no_removal_path
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_revoked_preview_token_answers_not_found_immediately
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_slug_is_immutable_after_a_first_publish
      category: business_rule
      weight: 3

- id: editor_is_stopped_by_the_publish_gate
