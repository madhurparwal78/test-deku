- id: consent_gates_third_party_loading
  purpose: No third party tag loads before an affirmative consent and withdrawing consent stops the sending within the same page view
  substeps:
    - kind: browser
      do: Arrive on the home route and confirm no third party script, pixel, frame or beacon loads before an explicit affirmative consent, read the consent overlay offering accept and reject at equal prominence without displacing the page, then withdraw the decision from the footer
      cov: C-CF-140, C-CF-141, C-CF-142, C-CF-143
    - kind: pytest
      test: test_output.py::test_no_credential_appears_in_what_the_browser_downloads
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_security_headers_are_present_on_every_response
      category: security
      weight: 5

- id: launch_surface_is_served
  purpose: The privacy notice, the studio story, the sitemap and the robots file are all served and the credentials file names the seeded accounts
  substeps:
    - kind: browser
      do: Open the privacy notice route and read the processors, the single data class, the retention and the version, confirming a production build is served rather than a development server
      cov: C-UF-17, C-CF-137, C-CF-138, C-DC-05
    - kind: browser
      do: Open the studio story route and one studio chapter route, confirm every form field validates inline by naming the field that failed and writing nothing on a refusal, then read the credentials file at the application root
      cov: C-UF-18, C-UF-19, C-CF-139, C-DC-06
    - kind: pytest
      test: test_output.py::test_sitemap_lists_published_routes_and_robots_refuses_the_preview
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_anonymous_console_call_is_denied_by_the_server
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_login_failure_wording_does_not_distinguish_the_two_causes
      category: security
      weight: 5
