domain          = "creative-personal"
pattern         = "content-publishing"
service_profile = "P4-db-storage"
variant_axes    = ["spec_sections", "critical_depth"]
capability_flags = "aesthetic"
task_code       = "I_creati_cont_drivable-portfolio-world-vb_20260916_062657"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "cookie_choice,no_broken_links,page_view_log,single_cta,spam_protection"
