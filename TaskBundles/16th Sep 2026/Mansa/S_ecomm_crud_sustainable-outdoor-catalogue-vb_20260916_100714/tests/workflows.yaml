      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_quotation_confirmation_email_lists_every_item
      critical: true
      category: notification
      weight: 5
    - kind: pytest
      test: test_output.py::test_quotation_lead_reaches_delivered
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_quotation_staff_notification_omits_fiscal_number
      category: notification
      weight: 3
    - kind: pytest
      test: test_output.py::test_quotation_confirmation_is_sent_exactly_once
      category: notification
      weight: 3
    - kind: pytest
      test: test_output.py::test_quotation_line_positions_are_contiguous
