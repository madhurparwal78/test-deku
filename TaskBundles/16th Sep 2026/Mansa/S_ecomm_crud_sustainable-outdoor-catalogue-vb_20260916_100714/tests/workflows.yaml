- id: specifier_configures_and_requests_a_quotation
  purpose: "A specifier filters the catalogue, configures two products, saves them and sends the wishlist as a quotation request that is stored line by line and confirmed by email"
  substeps:
    - kind: browser
      do: "Open /en/products without signing in, since a visitor never signs in to use any public feature, choose Golf in by Collections and Signage in by Products, and confirm the counter reads Showing 2 of 20 Results"
      cov: C-OV-07
    - kind: browser
      do: "Open Tee Sign Heritage and press the bookmark; confirm the modal headed Personalise your product opens over the page without any account, the address never changes, and the modal offers size, structure, colour, display, laminate colour in that order with no option axis constraining another, so the configuration never appears in the address and is never linkable"
      cov: C-RL-01, C-CF-139, C-CF-140, C-CF-142, C-CF-143, C-CF-155, C-CN-09
    - kind: browser
      do: "Choose M, Galvanised steel, Anthracite grey RAL7016, HPL + and Dark green, press the modal primary control to add the configuration, confirm the modal closes with focus returned to the opening control, the adding confirmation shows the product name with an undo control and a draining bar without taking focus, the header wishlist count updates, and that Escape or the back gesture closes the options modal without adding when it is reopened"
      cov: C-CF-150, C-CF-151, C-CF-152, C-CF-162, C-CF-163, C-CF-165, C-UF-06
    - kind: browser
      do: "Open Plaza Bench Long, open its options modal, confirm the display axis and laminate axis are absent because an axis with no values is absent, choose size 2000, and add; confirm adding with no other option chosen is accepted"
      cov: C-CF-144, C-CF-149
    - kind: browser
      do: "Open /en/wishlist and confirm two rows, each wishlist row showing the render, the title, the collection, the chosen option names and a remove control, with the populated wishlist offering Request a quotation"
      cov: C-CF-171, C-CF-173
    - kind: browser
      do: "Press Request a quotation and confirm the quotation modal opens over the current route without changing the path, shows the tabs Contact, Wishlist and Files, shows the wishlist inline above the fields First Name, Last Name, Email, Role, Industry, Country, City and NIF, and asks Some products have BIM/3D files available, are you interested? without the files checkbox triggering any download"
      cov: C-CF-181, C-CF-182, C-CF-183, C-CF-184, C-CF-215, C-UF-05
    - kind: browser
      do: "Fill the quotation fields, tick the privacy box and send the configured wishlist as a quotation request; confirm the quotation confirmation shows a VQ- reference, receives focus, says a full copy is on its way by email, that the wishlist clears only after the confirmation renders, and that reopening /en/wishlist shows the emptied wishlist with a line naming the reference"
      cov: C-OV-04, C-CF-217, C-CF-220, C-CF-221, C-CF-222, C-UF-11
