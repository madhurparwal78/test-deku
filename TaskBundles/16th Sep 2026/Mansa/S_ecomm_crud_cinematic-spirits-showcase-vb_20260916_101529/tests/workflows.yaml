      weight: 3
    - kind: pytest
      test: test_output.py::test_terms_page_is_reachable_and_linked
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_cookie_choice_survives_a_reload
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_favicon_is_served_and_declared
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_sitemap_lists_public_routes_and_robots_points_to_it
