  purpose: "The public launch surface exists: terms, cookie choice, favicon, sitemap, previews, the still page and the refusal routes"
  substeps:
    - kind: browser
      do: "Answer No on the age panel, read ACCESS DENIED with the legal age line, press GO BACK and confirm the question returns, then answer Yes, reload, and confirm the age answer was never remembered across the full page load, is kept neither on the server nor in the browser, and that full page loads of /terms, /unsupported, /sign-in/verify and /alerts/cancel skip the age question"
      cov: C-CF-57, C-CF-58, C-CF-59, C-CF-60, C-CN-03
    - kind: browser
      do: "Resize the window to an upright handset shape and confirm the rotate panel covers everything including the age panel, then resize it to a sideways handset shape and confirm the film runs"
      cov: C-CF-50
    - kind: browser
      do: "Open the terms page from the footer Legal link and confirm it states the conditions of use, the legal drinking age requirement and what the product keeps about a visitor, and confirm no analytics or advertising banner appears on any page"
