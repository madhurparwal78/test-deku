- id: visitor_drives_the_film_end_to_end
  purpose: "A visitor confirms their age and drives the woodcut film through both held gestures to the collection and back"
  substeps:
    - kind: browser
      do: "Open the app at its public address, watch the drawn loader report progress rather than a fixed timer, then answer Yes on the age panel and watch the header bar appear only after the loader has gone"
      cov: C-CF-52, C-CF-61
    - kind: browser
      do: "Reload, confirm the age panel offers Yes and No and that scrolling does nothing behind the panel before an answer is chosen"
      cov: C-CF-55, C-CF-56
    - kind: browser
      do: "Scroll through the story and confirm the page itself never scrolls, the hooded figure walks through mist in comic panels, the monolith rises under a hatched moon, the portal fills the frame as a deep red disc of engraved rings with a life-size hand reaching in from the right, the columns fracture against flat red as the figure lifts off the floor, the colonnade opens in paper white, a flick keeps travelling then settles, and a full pass takes a couple of minutes and every one of the eighteen chapters is reachable by driving the story; confirm one continuous rendered scene fills the whole window across the eighteen chapters, and that wheel, trackpad, touch and key input all move the same story position"
      cov: C-OV-04, C-OV-05, C-CF-22, C-CF-24, C-CF-27, C-CF-32, C-CF-33, C-CF-34, C-CF-36, C-CF-37, C-CN-07
    - kind: browser
      do: "While scrolling, confirm the mark, header pill and audio meter stay on screen in every chapter, the ground changes between ink, paper and red with the house mark flipping between white and black exactly at a chapter change, a small drawn mark trails the mouse a beat behind, and figures breathe only while the story is still"
      cov: C-UX-13, C-FE-01, C-FE-02, C-FE-17, C-FE-27
    - kind: browser
      do: "At the reaching hand, push the wheel against the gate and confirm the story resists and springs back, wait and confirm the gate never completes alone, release early and confirm the portal settles back, then press and drag and watch the portal rings widen until the story releases"
      cov: C-CF-62, C-CF-63, C-CF-65, C-CF-66
    - kind: browser
      do: "At the pedestal pick the mint bottle and confirm the robe later takes the mint tint and the carousel opens on mint; at the tilted bottle, confirm the scene shows what to do even before reading the prompt, press and hold to fill the glass, release halfway and confirm the fill stays, finish the pour and confirm the glass never overfills and that the pour gate releases the story when the glass is full"
      cov: C-CF-69, C-CF-70, C-CF-71, C-CF-72, C-CF-74
    - kind: browser
      do: "Reload, answer the age panel with the keyboard, confirm the audio control is the first element reached, step the story with arrow and page keys, jump with Home and End to either end, and satisfy the portal gate with the confirm key plus arrow keys"
      cov: C-CF-28, C-CF-67, C-CF-87
    - kind: browser
      do: "Press Toggle audio, confirm the drones, jazz and wind come up and follow the story backwards when scrolling back, the portal hum grows with dragging, small back-and-forth scrolling at a boundary does not repeat one-off sounds, going idle ducks the interaction sounds and brings the bed forward, words light from the scrolling with sound off, silencing is instant at the master and survives chapter changes, and every sound is synthesised in the browser rather than played from a file"
      cov: C-CF-79, C-CF-80, C-CF-81, C-CF-82, C-CF-83, C-CF-84, C-CF-85, C-FE-19
    - kind: browser
      do: "Press EXPERIENCE from the collection and confirm the story glides back to the first frame with the header, the ground and the mix restored, the age panel does not return, a completed gate is not asked for again, the story position shows no rubber band at either end, the film returns to the same place after the tab is hidden and shown again, no replay control exists anywhere in the film, and the film keeps working with the four additions unreachable"
      cov: C-CF-23, C-CF-26, C-CF-38, C-CF-43, C-CF-44, C-CF-45, C-CF-75, C-TR-07, C-TR-08
    - kind: pytest
      test: test_output.py::test_health_endpoint_reports_ready
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_home_page_html_carries_the_story_text
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_home_page_html_names_every_control
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_content_document_lists_eighteen_chapters_in_order
      category: business_rule
      weight: 3

