      do: "Confirm the pages offer no messaging, comments, reviews, font editor, statistics panel or surface editor, and use the browser's network view to confirm the film ships no image, model, font atlas or sound file and draws its pictures and sounds itself, that on a throttled machine the film simplifies itself before falling to the still page, that generated assets stay under four megabytes, that the only backing services in use are PostgreSQL and Mailpit, and that the app stays responsive with many stored allocations, venues, sessions and rituals; confirm the footer offers INSTAGRAM, hello@example.com, Legal and Tastings with Legal opening /terms, and that a signed-out request for /host goes to /sign-in"
      cov: C-UF-02, C-UF-03, C-TR-06, C-TR-09, C-TR-13, C-TR-14, C-CN-05, C-CN-08, C-CN-09
    - kind: pytest
      test: test_output.py::test_unsupported_route_states_the_refusal
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_still_page_lists_product_data
