- id: visitor_reads_a_published_entry
  purpose: A visitor with no account opens a published entry and reads it end to end
  substeps:
    - kind: browser
      do: Open the home route and follow Docs into the documentation portal
    - kind: pytest
      test: test_output.py::test_published_entry_is_readable_by_anyone
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_list_endpoints_return_top_level_arrays
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_health_route_answers_ready
      category: presentation
      weight: 1
    - kind: browser
      do: Follow Changelog from the header and read the newest entry end to end
    - kind: browser
      do: Open the glossary and follow a related-term chip to another entry
    - kind: pytest
      test: test_output.py::test_app_is_reachable_and_serves_the_api_on_one_origin
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_every_named_route_answers
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_public_routes_render_without_client_code
      critical: true
      category: core_outcome
      weight: 5
- id: visitor_compares_plans_and_signs_up
  purpose: A visitor compares the four plans, signs up, and lands on the dashboard
  substeps:
    - kind: browser
      do: Open the pricing route and read the four plan cards, then flip the Pro card to Annual
    - kind: pytest
      test: test_output.py::test_plans_endpoint_returns_the_four_plans
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_pricing_ladders_match_the_plan_document
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_pricing_cards_carry_the_plan_attribute
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_open_signup_creates_a_reader
      critical: true
      category: core_outcome
      weight: 5
    - kind: browser
      do: Scroll the pricing comparison matrix and read a graduated price ladder
    - kind: browser
      do: Press Sign up and create an account with a new address
    - kind: pytest
      test: test_output.py::test_blog_index_carries_its_categories_and_dates
      category: presentation
      weight: 1
- id: reader_provisions_a_first_instance
  purpose: A signed-in reader creates an application and watches its instance reach a live state
  substeps:
    - kind: browser
      do: Sign in as reader@example.com and create the application Taskflow
    - kind: pytest
      test: test_output.py::test_instance_reaches_live_through_provisioning
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_publishable_key_is_unique_across_instances
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeded_accounts_sign_in_with_the_corpus_password
      critical: true
      category: security
      weight: 5
    - kind: browser
      do: Read the publishable key on the live instance row
    - kind: pytest
      test: test_output.py::test_user_readme_lists_every_seeded_account
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_reserved_directories_exist_and_are_empty
      category: presentation
      weight: 1
- id: author_publishes_an_entry_with_an_image
  purpose: An author drafts an entry, attaches an image, publishes, and the rendition appears with it
  substeps:
    - kind: browser
      do: Sign in as author@example.com and open the studio library table
    - kind: pytest
      test: test_output.py::test_entry_asset_object_key_follows_the_pinned_scheme
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_uploaded_bytes_are_stored_in_the_bucket_and_nowhere_else
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_publish_writes_the_rendition_in_the_same_operation
      critical: true
      category: business_rule
      weight: 5
    - kind: pytest
      test: test_output.py::test_rendition_index_enumerates_every_published_entry
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_duplicate_upload_is_idempotent
      category: data_integrity
      weight: 5
    - kind: browser
      do: Attach the same image twice to one entry and count the attachments listed
    - kind: browser
      do: Press New entry, fill the slide-over, attach an image and save the draft
    - kind: browser
      do: Press Publish and read the confirmation banner in the studio row
    - kind: pytest
      test: test_output.py::test_entry_redirects_and_role_landings
      critical: true
      category: security
      weight: 5
- id: draft_is_denied_to_everyone_but_its_author
  purpose: An unpublished entry stays unreadable on its route to every caller except its own author
  substeps:
    - kind: pytest
      test: test_output.py::test_draft_entry_is_denied_to_an_anonymous_visitor
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_draft_entry_is_denied_to_a_reader
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_draft_entry_is_denied_to_a_second_author
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_draft_rendition_is_denied_to_a_second_author
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_draft_image_is_denied_to_a_second_author
      critical: true
      category: security
      weight: 5
    - kind: browser
      do: Sign in as author2@example.com and open the other author's draft address
    - kind: browser
      do: Open the draft address while signed out and read the refusal
- id: reader_cannot_write_to_the_library
  purpose: A reader calling an author-only endpoint is refused and the library is unchanged
  substeps:
    - kind: pytest
      test: test_output.py::test_reader_cannot_create_a_library_entry
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_author_cannot_provision_an_application
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_reader_cannot_read_another_accounts_applications
      critical: true
      category: security
      weight: 5
    - kind: browser
      do: Open the dashboard as one reader and look for another account's application
    - kind: browser
      do: Sign in as reader@example.com and look for an authoring control in the chrome
- id: concurrent_publish_leaves_one_winner
  purpose: Two simultaneous publishes claiming one slug settle on exactly one published entry
  substeps:
    - kind: pytest
      test: test_output.py::test_concurrent_publish_yields_exactly_one_winner
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_rejected_publish_leaves_no_partial_state
      critical: true
      category: data_integrity
      weight: 5
    - kind: browser
      do: Open the studio and confirm one published entry holds the contested slug
- id: invalid_entry_payload_is_refused
  purpose: An entry payload missing a required field is refused as a client error
  substeps:
    - kind: pytest
      test: test_output.py::test_invalid_entry_payload_is_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_duplicate_signup_is_refused_and_creates_nothing
      category: validation
      weight: 3
    - kind: browser
      do: Submit the slide-over with the title left blank and read the inline refusal
- id: bot_submission_is_rejected_by_the_application_form
  purpose: A decoy-filled or rapidly repeated startup application is refused and stores nothing
  substeps:
    - kind: pytest
      test: test_output.py::test_startup_application_with_a_filled_decoy_is_refused
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_repeated_startup_application_is_refused
      category: security
      weight: 5
    - kind: browser
      do: Open the startup programme route signed in and submit the application form
