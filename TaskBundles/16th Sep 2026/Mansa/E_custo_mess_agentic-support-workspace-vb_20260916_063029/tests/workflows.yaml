  purpose: The seeded workspace, teams and conversations exist as stored rows carrying their workspace identifier
  substeps:
    - kind: browser
      do: Sign in as admin@example.com and observe the workspace name Northwind Trading with the teams Billing Support and Technical Support listed on the teams settings screen
      cov: C-DM-10
    - kind: pytest
      test: test_output.py::test_the_seeded_workspace_and_teams_exist_as_stored_rows
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_every_tenant_scoped_row_carries_a_workspace_identifier
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_the_store_and_the_mail_server_are_the_named_providers
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_the_seeded_conversation_rows_survive_a_second_read
      category: data_integrity
      weight: 5
    - kind: browser
      do: Route a conversation to a team as admin@example.com and observe the assignment recorded as an audit entry naming the acting principal, the principal kind and the action, with no path that edits it
      cov: C-CF-69
    - kind: pytest
      test: test_output.py::test_every_write_leaves_an_audit_record_that_cannot_be_removed
      critical: true
      category: data_integrity
      weight: 5


- id: an_invalid_part_kind_is_refused_and_the_thread_is_unchanged
  purpose: Bad input is refused as a client error and nothing is written
  substeps:
