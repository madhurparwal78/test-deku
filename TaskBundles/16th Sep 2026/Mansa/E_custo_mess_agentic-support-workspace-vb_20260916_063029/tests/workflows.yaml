      do: Open Refund for duplicate charge and submit an empty reply, observing the invalid call rejected as a client error rather than as a server error and never as a silent success, with an inline message naming the field while the thread stays unchanged
      cov: C-DC-13
    - kind: pytest
      test: test_output.py::test_an_invalid_part_kind_is_refused_and_stores_nothing
      critical: true
      category: validation
      weight: 5
    - kind: pytest
      test: test_output.py::test_an_unknown_address_answers_not_found_with_the_products_own_page
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_no_billing_or_outbound_endpoint_exists_in_the_workspace
      category: business_rule
      weight: 3
