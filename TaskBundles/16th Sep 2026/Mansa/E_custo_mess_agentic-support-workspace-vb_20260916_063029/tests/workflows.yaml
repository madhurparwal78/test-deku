      cov: C-CF-66
    - kind: pytest
      test: test_output.py::test_an_internal_collection_article_stays_off_the_public_help_surface
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_the_public_help_collections_listing_returns_a_top_level_array
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_the_favicon_is_served_and_declared_in_the_document_head
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_every_public_route_declares_a_title_a_description_and_a_preview_image
      category: presentation
      weight: 1

- id: publishing_an_article_stores_a_new_version_each_time
  purpose: Publishing writes a new version rather than mutating one, and only an administrator may do it
  substeps:
    - kind: browser
      do: Sign in as admin@example.com, open the knowledge hub, open the article Resetting your password and publish it again, observing a new version listed with a change note
      cov: C-CF-40
    - kind: pytest
      test: test_output.py::test_publishing_an_article_twice_stores_two_versions
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_a_manager_cannot_route_a_conversation_outside_the_teams_they_lead
      category: security
      weight: 5

- id: service_level_targets_are_recorded_and_breached_at_most_once
  purpose: A conversation records the matched policy, keeps its first response moment and records one breach per target
  substeps:
    - kind: browser
      do: Open the service level settings screen as manager@example.com and observe the Standard support policy with its first response target and its resolution target in minutes
      cov: C-DM-13, C-CF-44
    - kind: pytest
      test: test_output.py::test_the_seeded_service_level_policy_is_recorded_on_a_conversation
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_the_first_response_moment_is_recorded_once
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_a_service_level_breach_is_recorded_once_for_one_conversation
      category: data_integrity
      weight: 5

- id: manager_reads_a_report_scoped_to_the_teams_they_lead
  purpose: The resolution report answers for the reader's own reach and states how fresh it is
  substeps:
    - kind: browser
      do: Sign in as manager@example.com, open the reports screen and observe the resolution rate split into agent resolved and human resolved, the response times given as the median plus the ninety-fifth percentile rather than as a mean, and the time zone with the age of the data stated
      cov: C-UF-13, C-CF-62, C-CF-64, C-CF-65
    - kind: pytest
      test: test_output.py::test_the_resolution_report_totals_differ_between_a_manager_and_an_admin
      critical: true
      category: business_rule
      weight: 5
    - kind: pytest
      test: test_output.py::test_the_resolution_report_states_its_timezone_and_the_age_of_the_data
      category: presentation
      weight: 1

