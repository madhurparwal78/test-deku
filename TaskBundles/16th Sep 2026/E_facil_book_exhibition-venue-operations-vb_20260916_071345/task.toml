schema_version = "1.4"

[task]
name = "deku/exhibition-venue-operations-vb"
version = "1.0.0"
description = "Trilingual public site and operations console for a 40,000 square metre exhibition campus: combinable halls, licensed capacity per layout and per combination, ranked options with a challenge window and atomic confirmation, phases that occupy space, a floor-plan planner validating against fire exits and rigging loads, accreditation with evidence expiry and cascading revocation, per-phase entrance modes with a degraded door, occupancy computed on the space graph, services with cut-offs, invoicing in integer minor units and a published public calendar, on postgres"
authors = [
  "utsav.jain@ethara.ai" ,
  "aniket.tyagi24@ethara.ai"
]
uuid_v5 = "3048957b-9381-5287-9c42-c8fa3aa3a216"
keywords = ["greenfield", "enterprise", "typescript", "postgres", "booking-scheduling", "facilities-assets"]

[metadata]
category     = "Greenfield"
sub_category = "enterprise"

domain          = "facilities-assets"
