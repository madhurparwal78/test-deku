env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:verwick-local-dev-4f2b@postgres:5432/deku}", DB_URL = "${DB_URL:-postgresql://deku_app:verwick-local-dev-4f2b@postgres:5432/deku}" }

[environment.healthcheck]
