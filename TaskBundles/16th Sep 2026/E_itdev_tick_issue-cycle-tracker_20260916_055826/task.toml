schema_version = "1.4"

[task]
name = "deku/issue-cycle-tracker"
version = "1.0.0"
description = "An internal issue tracker for one software team: members file issues carrying a priority, a label and an estimate; leads triage an unassigned inbox, assign an owner and group issues into time-boxed cycles shown as a board of named workflow states; moving an issue notifies its assignee by email, and every mutation is authorized server-side, backed by PostgreSQL and mailpit."
authors = [
    "utsav.jain@ethara.ai",
    "aakanksha.sharma@ethara.ai",
]
uuid_v5 = "87f9cda0-4388-5cf0-b622-236cd95e5a16"
keywords = ["greenfield", "enterprise", "it-devtools", "ticketing-queue", "issue-cycle-tracker", "python", "postgres", "mailpit"]

[metadata]
category            = "Greenfield"
sub_category        = "enterprise"
domain              = "it-devtools"
pattern             = "ticketing-queue"
archetype           = "issue-cycle-tracker"
design_direction    = "companion"
variant             = "a"
service_profile     = "P2-db-email"
variant_axes        = []
task_code           = "E_itdev_tick_issue-cycle-tracker_20260916_055826"
naming_scheme       = "task-code-v1"
language            = "python"
grader_version      = "0.22.0"
capability_flags    = "aesthetic,concurrency_hardening"
launch_surface      = "colour_contrast,mobile_viewport,no_frontend_secrets,page_view_log,security_headers"
canary_present      = true

spec_sections_given = [
  "overview",
  "roles",
  "features",
  "flow",
  "uiux",
  "techrequirements",
  "datamodel",
  "constraints",
  "contract",
]

reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"
turns_expected       = 120
tokens_expected      = 4500000
contributor_id       = "aakanksha.sharma@ethara.ai"
created_at           = "2026-09-16"

[metadata.services]
backend = "postgres"
email   = "mailpit"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode      = "public"
allowed_hosts     = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/cadence}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/cadence}", SMTP_HOST = "${SMTP_HOST:-mailpit}", SMTP_PORT = "${SMTP_PORT:-1025}", SMTP_USER = "${SMTP_USER:-}", SMTP_PASS = "${SMTP_PASS:-}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "shared"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/cadence}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/cadence}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/cadence}", EMAIL_INBOX_API_URL = "${EMAIL_INBOX_API_URL:-http://mailpit:8025}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_EMAIL = "mailpit" }

[delivery]
format         = "harbor"
schema_version = "1.4"
reward_path    = "/logs/verifier/reward.json"
reward_key     = "reward"
reward_range   = [0.0, 1.0]
reward_full    = 1.0
network_policy = "public"

[[artifacts]]
source      = "/app"
destination = "app"
