- id: visitor_browses_the_uneven_index
  purpose: A visitor lands on the fixed-frame home page and browses the ten cards where their records place them
  substeps:
    - kind: browser
      do: Open the home page, press Work in the frame and open the nDrive card from the index
    - kind: pytest
      test: test_output.py::test_app_serves_pages_and_api_on_one_origin
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_health_route_answers_ready
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_projects_list_the_ten_seeded_cards_in_order
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_home_page_renders_the_copy_deck_server_side
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_home_index_cards_carry_their_order_attribute
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_index_cards_start_on_their_recorded_columns
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_project_media_descriptions_are_present_and_not_titles
      category: presentation
      weight: 1
    - kind: browser
      do: Scroll past the index, through the held Innovate with purpose band, to the contact band and watch the four closing words alternate sides
    - kind: browser
      do: On a phone-width window open the Menu button, choose Work and confirm the menu closes on the index
- id: visitor_reads_a_long_case_study
  purpose: A visitor opens nDrive, jumps to a heading from the contents drawer and reads the metadata footer
  substeps:
    - kind: browser
      do: Open nDrive from the index and read the article through to its footer
    - kind: pytest
      test: test_output.py::test_published_case_study_reads_with_derived_fields
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_case_study_page_renders_heading_anchors_and_footer
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_long_case_studies_carry_their_heading_counts
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_almanac_mono_offers_the_download_link
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_code_block_line_numbers_cannot_be_selected
      category: presentation
      weight: 1
    - kind: browser
      do: Open Wasm design utils, press COPY on a code block and read the label change to COPIED
    - kind: browser
      do: On a phone-width window follow the Home link in the nDrive footer back to the home page
    - kind: browser
      do: Open Coast Icon from the index and confirm its page loads with its title and footer
- id: visitor_opens_a_stub_and_follows_every_link
  purpose: A visitor opens the unfinished Teamharbor page and lands on the not-found page from an unknown address
  substeps:
    - kind: browser
      do: Open Teamharbor from the index and read the work-in-progress notice above the metadata footer
    - kind: pytest
      test: test_output.py::test_stub_case_study_renders_notice_without_body
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_every_internal_link_resolves
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_unknown_address_renders_the_not_found_page
      category: presentation
      weight: 1
    - kind: browser
      do: Open the address /nothing-here, read the not-found line and press Back to the index
    - kind: browser
      do: From the home statement follow the Kindling link and confirm the Kindling case study opens
- id: friend_unlocks_field_notes_with_its_code
  purpose: A friend enters the Field Notes passcode and reads the article for the rest of the session
  substeps:
    - kind: browser
      do: Open /field-notes, type the digits 2, 7, 1 and 8 into the four slots and read the article that appears
    - kind: browser
      do: Reload /field-notes and confirm the article is still shown without entering the code again
    - kind: pytest
      test: test_output.py::test_correct_passcode_is_admitted_with_a_session_grant
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_passcode_slots_submit_on_the_fourth_digit
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_user_readme_states_the_passcodes
      category: presentation
      weight: 1
- id: gated_article_denied_without_its_code
  purpose: A stranger without the code sees only the passcode screen and one wrong try is refused
  substeps:
    - kind: pytest
      test: test_output.py::test_gated_article_is_denied_without_a_grant
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_wrong_passcode_and_unknown_gate_answer_alike
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_wrong_code_clears_the_slots_in_the_page
      category: validation
      weight: 3
    - kind: browser
      do: In a fresh session open /field-notes, type 1, 3, 7 and 9 once, and read the message that replaces the prompt
- id: passcode_attempts_limit_and_invalid_input
  purpose: Malformed codes are refused and repeated refusals on one path are locked out
  substeps:
    - kind: pytest
      test: test_output.py::test_malformed_passcode_is_rejected_as_invalid
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_refused_attempts_are_rate_limited
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_rate_limited_answer_shows_the_lock_message
      category: presentation
      weight: 1
    - kind: browser
      do: In a fresh session open /field-notes and confirm the passcode prompt is shown instead of the article
- id: visitor_cannot_reach_the_studio
  purpose: A visitor, or a friend holding only the Field Notes grant, is refused by every studio endpoint
  substeps:
    - kind: browser
      do: In a fresh session open /studio and confirm only the passcode screen is shown
    - kind: pytest
      test: test_output.py::test_studio_endpoints_are_denied_without_the_studio_grant
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_field_notes_grant_is_scoped_to_its_path
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_release_ends_the_grant
      category: security
      weight: 5
- id: draft_is_denied_everywhere
  purpose: The seeded draft and every draft figure stay invisible to visitors on every surface
  substeps:
    - kind: pytest
      test: test_output.py::test_draft_case_study_is_indistinguishable_from_an_unknown_slug
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_draft_card_is_unlisted_everywhere
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_draft_figure_is_denied_to_visitors
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_gated_figure_needs_its_grant
      category: security
      weight: 5
    - kind: browser
      do: In a fresh session open /tidewater and confirm the not-found page is shown with no draft title
    - kind: browser
      do: Open the home page index and confirm no card titled Tidewater Sketchbook is shown
- id: owner_unlocks_the_studio_and_previews_drafts
  purpose: The owner enters the studio code, sees every case study and reads the page-view record
  substeps:
    - kind: browser
      do: Open /studio, type the digits 5, 0, 9 and 3 and read the Case studies table and the Page views list
    - kind: pytest
      test: test_output.py::test_studio_page_shows_the_gate_until_unlocked
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_studio_grant_previews_drafts_and_the_gated_article
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_page_view_is_recorded_for_the_owner
      critical: true
      category: data_integrity
      weight: 5
    - kind: browser
      do: Open Index preview in the studio sidebar and confirm the seeded cards are drawn there
    - kind: browser
      do: Press Lock studio and confirm the passcode screen returns at /studio
- id: owner_publishes_a_case_study_with_a_figure
  purpose: The owner writes a case study, uploads a figure, places its card, publishes it, marks it a stub and holds it
  substeps:
    - kind: browser
      do: Open /studio, enter 5093, press New case study, fill the inline row and the editor, upload a figure with alternative text, set the card to column 1 spanning 4 at position 12, and press Publish
    - kind: pytest
      test: test_output.py::test_publish_lists_the_card_and_opens_the_page
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_figure_upload_is_stored_in_the_bucket_at_the_pinned_key
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_figure_bytes_stream_back_unchanged
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_stub_lists_the_card_with_the_notice_state
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_hold_withdraws_page_card_and_figures
      critical: true
      category: security
      weight: 5
    - kind: browser
      do: Press Hold as draft on the new case study, confirm, and check the home index no longer shows its card
    - kind: browser
      do: Press Mark as stub on the same case study and confirm its row now shows the stub status
- id: concurrent_publish_conflict_at_one_position
  purpose: Two drafts claiming one index position never both end up listed
  substeps:
    - kind: pytest
      test: test_output.py::test_concurrent_publish_at_one_position_has_one_winner
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_rejected_publish_leaves_the_loser_a_draft
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_moving_a_listed_card_onto_a_taken_position_is_refused
      category: data_integrity
      weight: 5
    - kind: browser
      do: Open /studio, enter 5093, give a draft the position already held by Kindling, press Publish and confirm the draft stays a draft
- id: invalid_case_study_input_is_refused
  purpose: Bad placements, missing fields and bad slugs are refused, and derived fields follow their rules
  substeps:
    - kind: pytest
      test: test_output.py::test_invalid_placement_is_refused_and_writes_nothing
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_incomplete_case_study_is_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_invalid_or_reserved_or_taken_slug_is_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_heading_slugs_follow_the_pinned_rule
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_character_count_is_derived_from_the_body
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_slug_change_leaves_a_permanent_redirect
      category: data_integrity
      weight: 5
    - kind: browser
      do: Open /studio, enter 5093, press New case study, give it the slug studio and confirm no case study with that slug is created
- id: duplicate_or_invalid_figure_upload_is_refused
  purpose: A repeated upload stores one object and an invalid upload stores nothing
  substeps:
    - kind: pytest
      test: test_output.py::test_duplicate_figure_upload_creates_one_object
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_figure_without_alt_text_is_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_figure_upload_refusals_name_their_reason
      category: validation
      weight: 3
    - kind: browser
      do: Open /studio, enter 5093, open a draft and try to upload a figure with the alternative text left empty, then read the refusal
- id: frame_theme_and_sound_persist
  purpose: The frame controls work as buttons, the theme persists, sound starts off and the layout holds at every width
  substeps:
    - kind: browser
      do: Press THEME[A] in the frame, reload the home page and confirm the dark theme is still applied, then press the A key to switch back
    - kind: pytest
      test: test_output.py::test_theme_control_toggles_and_survives_a_reload
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_sound_control_starts_off
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_pointer_readout_follows_the_pointer
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_chrome_controls_are_buttons
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_home_scrolls_an_inner_element_with_the_keyboard
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_reduced_motion_holds_the_band_to_one_screen
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_narrow_viewport_has_no_sideways_overflow
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_home_page_loads_no_binary_asset
      category: business_rule
      weight: 3
    - kind: browser
      do: Narrow the window to phone width, open the Menu button and use Contact to reach the contact band
    - kind: browser
      do: Press the sound control twice and confirm the page keeps working with no error
- id: seeded_content_is_stored_once
  purpose: The profile, the cards, the case studies and the hashed passcodes are seeded exactly once
  substeps:
    - kind: pytest
      test: test_output.py::test_seeded_rows_exist_once_with_hashed_passcodes
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_site_profile_carries_the_copy_deck
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_reserved_directories_exist_and_are_empty
      category: presentation
      weight: 1
    - kind: browser
      do: Open the home page and confirm the owner's contact address and three social links are shown in the contact band
