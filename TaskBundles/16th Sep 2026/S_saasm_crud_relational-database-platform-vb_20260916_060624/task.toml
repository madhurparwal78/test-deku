schema_version = "1.4"

[task]
name = "deku/relational-database-platform-vb"
version = "1.0.0"
description = "A multi-tenant relational database workspace for teams who build their own tools without writing production code: workspaces holding bases, bases holding tables of records, nineteen field types across stored, linked and computed behaviour, sixteen rollup aggregations with COUNT, COUNTA and COUNTALL distinct, a twelve-function formula language whose dependency graph recomputes only the reached set across tables, three view types that are each a live query with type-specific filtering to three nesting levels, ten sort levels and three grouping levels, collaborative, personal and locked view modes, five collaboration roles resolved over a workspace grant and an additive base grant where the more permissive wins and a base grant never demotes, an append-only operation log with a strictly increasing per-base sequence from which record history and historical reads are derived rather than stored, replay verification that names the first diverging sequence, and declarative write-time guards evaluated after recomputation that refuse a write with their author's own message and leave nothing behind"
authors = [
  "utsav.jain@ethara.ai",
  "anuj.soni@ethara.ai",
]
uuid_v5 = "adc9000c-9021-5ee0-b26e-91989d746182"
keywords = ["greenfield", "solo_founder", "typescript", "postgres", "saas-micro-tools", "crud-catalog"]

[metadata]
category     = "Greenfield"
sub_category = "solo_founder"

domain          = "saas-micro-tools"
pattern         = "crud-catalog"
service_profile = "P1-db"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = ""
task_code       = "S_saasm_crud_relational-database-platform-vb_20260916_060624"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface  = "favicon,no_broken_links,privacy_page,single_cta,social_preview"
grader_version  = "0.22.0"

language     = "typescript"
archetype    = "relational-database-platform"
variant      = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 190
tokens_expected = 6500000
contributor_id  = "anuj.soni@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true

difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", DEKU_SERVICE_BACKEND = "postgres" }

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"

[[artifacts]]
source      = "/app"
destination = "app"
