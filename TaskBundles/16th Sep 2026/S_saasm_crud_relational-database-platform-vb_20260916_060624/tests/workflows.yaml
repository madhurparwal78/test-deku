- id: member_signs_in_and_opens_the_base_editor
  purpose: A seeded member signs in, reaches the workspaces they hold a role in, and opens a base
  substeps:
    - kind: browser
      do: Sign in at /login as editor@example.com and land on the /workspaces route listing the workspaces the account holds a role in
      cov: C-UF-03
    - kind: pytest
      test: test_output.py::test_health_endpoint_answers_two_hundred
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_login_returns_a_bearer_token
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_every_seeded_account_signs_in_with_the_pinned_password
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_credentials_file_is_written_at_the_app_root
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_reserved_directories_exist_and_are_empty
      category: presentation
      weight: 1
    - kind: browser
      do: Open the base editor route for Campaign Planning and land on the first view of the first table, with the record list beside the selected record detail in a split pane
      cov: C-UF-04
    - kind: browser
      do: Request the base editor route unauthenticated, land on the login route, sign in, and return to the route originally requested
      cov: C-UF-07, C-UF-08
    - kind: browser
      do: Sign out and confirm the old bearer token stops working, then read the root route redirect for a signed-in account and for an unknown visitor
      cov: C-UF-09, C-UF-01, C-UF-02
    - kind: browser
      do: Sign in as owner2@example.com and read the workspaces list, which returns only the workspaces this caller holds a grant in: Harbourline Studio is listed and Northfield Commercial is absent
      cov: C-CF-16
    - kind: pytest
      test: test_output.py::test_workspace_role_is_reported_for_each_seeded_account
      category: security
      weight: 5

- id: editor_edits_a_cell_and_the_row_is_persisted
  purpose: An editor changes a cell in a grid view and the stored row matches what the grid displayed after a reload
  substeps:
    - kind: browser
      do: Change the Budget cell on Autumn Lantern in the Campaigns grid, press Enter, reload the page, and read the same amount in the grid and in the record detail beside it
      cov: C-UF-11
    - kind: pytest
      test: test_output.py::test_cell_written_through_the_api_is_persisted_and_survives_a_re_read
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_stored_row_matches_the_record_endpoint_for_every_seeded_campaign
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeded_deliverable_rows_are_stored_in_the_database
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_computed_values_are_returned_on_every_record_row
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeding_is_idempotent_across_a_re_read
      category: data_integrity
      weight: 5
    - kind: browser
      do: Open the command palette, type a table name, jump to it, create a record in the slide-over panel over the current surface, and read the new row at the bottom of the grid
      cov: C-UF-18, C-FE-09
    - kind: browser
      do: Read the Campaigns grid header row staying put as the body scrolls down, and the primary column staying put as the body scrolls sideways
      cov: C-FE-03, C-FE-04

