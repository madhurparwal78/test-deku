- id: view_filters_sorts_and_groups_a_live_query
  purpose: A view is a live query whose filter, sort and group configuration changes what is shown
  substeps:
    - kind: browser
      do: Add two conditions joined by AND to the Campaigns grid view and read the count of 2 beside the filter control in the toolbar
      cov: C-UF-17, C-FE-02
    - kind: browser
      do: Switch the record surface between grid, gallery and kanban and confirm the surface carries the attribute naming the view type
      cov: C-FE-11
    - kind: pytest
      test: test_output.py::test_kanban_view_stacks_by_exactly_one_single_select_field
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_group_on_a_computed_field_refuses_a_direct_create
      category: validation
      weight: 3
    - kind: browser
      do: Filter the Campaigns grid to nothing and read the filtered-to-nothing state naming the filter responsible, then read the written empty state of a list holding no records
      cov: C-UF-20, C-UF-19
    - kind: browser
      do: Read the summary row pinned at the bottom of the grid carrying a per-column aggregate
      cov: C-FE-05
    - kind: browser
      do: Group the Campaigns grid by Stage and read a group header carrying its value, its record count and its collapse state
      cov: C-FE-06
    - kind: browser
      do: Move the grid selection with the arrow keys, advance with tab, begin editing with Enter and cancel with Escape, following the keyboard navigation a spreadsheet teaches
      cov: C-UX-23
    - kind: browser
      do: Read the Campaigns grid at the short row height where rows sit tight so a full table fits one screen
      cov: C-UX-11

- id: view_modes_lock_configuration
