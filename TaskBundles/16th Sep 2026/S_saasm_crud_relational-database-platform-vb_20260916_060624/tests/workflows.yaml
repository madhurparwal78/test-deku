      do: Open the base history route and read the operation log newest first, with the sequence, the moment and the account on each row
      cov: C-UF-06
    - kind: pytest
      test: test_output.py::test_operation_sequence_is_gapless_within_the_base
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_operation_log_row_is_never_updated_or_deleted
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_two_simultaneous_writes_take_two_different_sequences
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_auto_numbers_stay_unique_under_concurrent_creation
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_replay_verification_agrees_with_the_stored_rows
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_empty_operations_page_after_the_newest_sequence
      category: validation
      weight: 3

- id: historical_read_rebuilds_the_table_as_of_a_sequence
  purpose: Reading the table as of a sequence returns the values of that moment with computed fields recomputed
  substeps:
    - kind: browser
      do: Pick an operation in the base history, open the table as of that sequence, and read the full-width band naming the historical mode with every editing affordance gone from the grid
      cov: C-UF-15, C-FE-08
    - kind: pytest
      test: test_output.py::test_historical_read_returns_the_values_stored_at_that_sequence
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_historical_read_recomputes_computed_fields_from_rebuilt_values
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_historical_read_refuses_every_change
      category: validation
      weight: 3
    - kind: browser
      do: Open a record route and read the history of that record newest first, naming who changed which field from what to what
      cov: C-UF-16, C-FE-07
    - kind: pytest
      test: test_output.py::test_record_history_reads_back_a_change_that_was_stored
      category: data_integrity
      weight: 5
    - kind: browser
      do: Read the base editor root attribute naming the mode: it takes live on a live table and history under a historical read
      cov: C-FE-12

- id: blocking_guard_refuses_and_leaves_nothing_behind
  purpose: A blocking guard refuses the write in its author's own words and leaves no trace at all
  substeps:
    - kind: browser
      do: Tick Done on a deliverable whose Estimate is empty and read the guard message in an inline banner that stays until it is dismissed, then reload and find Done still unticked
      cov: C-UF-13
    - kind: pytest
      test: test_output.py::test_blocking_guard_refuses_the_write_with_its_authored_message
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_blocking_guard_leaves_no_stored_row_and_appends_no_operation
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_guard_refuses_a_direct_request_exactly_as_it_refuses_the_grid
      category: data_integrity
      weight: 5
    - kind: browser
      do: Read the guard refusal banner attribute naming the guard mode, which takes blocking on a refused write and advisory on an allowed one
      cov: C-FE-15

- id: advisory_guard_records_a_violation
  purpose: An advisory guard allows the write and keeps its violation listed until the data stops violating
  substeps:
    - kind: browser
      do: Open the guards panel route and read the advisory guard with its outstanding violation listed under it, and read the confirmation a destructive action asks for before removing a guard
      cov: C-UF-05, C-FE-10
    - kind: pytest
      test: test_output.py::test_advisory_guard_allows_the_write_and_records_a_violation
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_seeded_guards_carry_their_authored_messages
      category: business_rule
      weight: 3

