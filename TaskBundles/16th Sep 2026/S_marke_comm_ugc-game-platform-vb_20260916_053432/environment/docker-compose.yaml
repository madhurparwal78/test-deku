services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_USER: deku_admin
      POSTGRES_PASSWORD: deku-local-dev
      POSTGRES_DB: deku
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
      - kavora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deku_admin -d deku && PGPASSWORD=deku-local-dev psql -h 127.0.0.1 -U deku_app -d deku -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.30.6
    environment:
      MP_MAX_MESSAGES: "500"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/messages > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  killbill:
    image: killbill/killbill:0.24.21
    environment:
      KB_org_killbill_dao_url: jdbc:mysql://killbill-db:3306/killbill
      KB_org_killbill_dao_user: root
      KB_org_killbill_dao_password: kbdb-root-5c92e4a1
      KB_org_killbill_billing_osgi_dao_url: jdbc:mysql://killbill-db:3306/killbill
      KB_org_killbill_billing_osgi_dao_user: root
      KB_org_killbill_billing_osgi_dao_password: kbdb-root-5c92e4a1
    depends_on:
      killbill-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/1.0/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  killbill-init:
    image: curlimages/curl:8.11.1
    depends_on:
      killbill:
        condition: service_healthy
    volumes:
      - ./killbill-init.sh:/killbill-init.sh:ro
    entrypoint: >
      /bin/sh -c "
        /bin/sh /killbill-init.sh &&
        tail -f /dev/null
      "

  killbill-db:
    image: killbill/mariadb:0.24
    environment:
      MYSQL_ROOT_PASSWORD: kbdb-root-5c92e4a1
    volumes:
      - kavora-killbill-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  main:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4173:4173"
    environment:
      PAYMENTS_ADMIN_USER: admin
      PAYMENTS_ADMIN_PASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy

volumes:
  kavora-postgres-data:
  kavora-killbill-data:
