- id: visitor_signs_up_behind_the_age_gate
  purpose: A visitor gives a date of birth first, then a username, and lands signed in with the band already applied
  substeps:
    - kind: browser
      do: Open / and read the signup card: Birthday sits above Username, above Password, above Gender (optional)
      cov: C-CF-04, C-FE-02, C-FE-03
    - kind: browser
      do: Confirm every control on the signup form takes one height from the control scale, then fill Month, Day and Year, a username, and a password of at least eight characters, and press Sign Up
      cov: C-UX-02
    - kind: browser
      do: Read the charts surface that opens and confirm the header shows the signed-in member
    - kind: pytest
      test: test_output.py::test_signup_persists_a_stored_identity_row
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_signup_stores_the_date_of_birth_rather_than_a_band
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_child_band_is_derived_for_the_seeded_child_account
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_adult_band_is_derived_for_a_fresh_adult_signup
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_leap_day_birth_date_resolves_a_band
      category: business_rule
      weight: 3
- id: signup_with_invalid_input_is_rejected
  purpose: A signup that breaks a stated rule is refused inline with the field named and nothing written
  substeps:
    - kind: browser
      do: Open / and submit the signup card with a six-character password
    - kind: browser
      do: Read the inline message under the Password field naming the field at fault, confirm the failure colour is the mid, vivid red that appears nowhere else, and confirm the reserved slot held the layout still
      cov: C-CF-124, C-CF-26, C-UX-04
    - kind: pytest
      test: test_output.py::test_short_password_signup_is_refused_as_invalid
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_signup_carrying_the_decoy_field_is_refused
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_repeated_signup_attempts_in_quick_succession_are_refused
      category: security
      weight: 5
- id: member_signs_in_by_more_than_one_route
  purpose: The login surface offers a password route and an emailed code route, and both reach the charts surface
  substeps:
    - kind: browser
      do: As an anonymous visitor ask for the protected route /kredz, land on /login, and confirm the card heading reads Log in to Kavora above Log In, Email Me a One-Time Code and Quick Sign-in
      cov: C-FE-04, C-UF-01
    - kind: browser
      do: Sign in as player@example.com with the seeded password and land on /charts
    - kind: browser
      do: Open /settings/sessions, read the enrolled credentials list, then sign out and confirm signing out ends that session alone
      cov: C-UF-03
    - kind: pytest
      test: test_output.py::test_login_answers_with_an_access_token
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_credential_kinds_are_enrolled_and_revocable
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_one_time_code_email_reaches_the_account_inbox
      category: notification
      weight: 3
    - kind: pytest
      test: test_output.py::test_reused_one_time_code_is_refused
      category: security
      weight: 5
