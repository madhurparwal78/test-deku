schema_version = "1.4"

[task]
name = "deku/merch-supply-chain-vb"
version = "1.0.0"
uuid_v5 = "80c0cce1-005b-524b-8689-881d0c93b2ed"
description = "A marketing site for an end to end merch service and the operations console behind it, where a brief becomes factory quotes, sampled runs land in two warehouses, and a gated storefront sells them through customs, tax and returns."
authors = [
  "abhishek.shaw@ethara.ai",
  "dishita.aryaint17@ethara.ai",
]
keywords = ["greenfield", "solo_founder", "python", "postgres", "mailpit", "killbill", "merch", "supply-chain"]

[metadata]
category     = "Greenfield"
sub_category = "solo_founder"
domain          = "ecommerce-retail"
pattern         = "commerce-checkout"
service_profile = "P5-db-pay-email"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = "aesthetic,concurrency_hardening"
design_direction = "companion"
launch_surface  = "custom_404,no_broken_links,sitemap_robots,social_preview,terms_page"
task_code     = "S_ecomm_comm_merch-supply-chain-vb_20260916_073356"
naming_scheme = "task-code-v1"
grader_version = "0.22.0"
language     = "python"
archetype    = "merch-supply-chain"
variant      = "b"
difficulty   = ""
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 200
tokens_expected = 7500000
contributor_id  = "dishita.aryaint17@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"
email = "mailpit"
payments = "killbill"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", SMTP_HOST = "${SMTP_HOST:-mailpit}", SMTP_PORT = "${SMTP_PORT:-1025}", SMTP_USER = "${SMTP_USER:-}", SMTP_PASS = "${SMTP_PASS:-}", PAYMENTS_API_URL = "${PAYMENTS_API_URL:-http://killbill:8080}", PAYMENTS_API_KEY = "${PAYMENTS_API_KEY:-orbit-labs}", PAYMENTS_API_SECRET = "${PAYMENTS_API_SECRET:-orbit-labs-secret-9f14c73e}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", EMAIL_INBOX_API_URL = "${EMAIL_INBOX_API_URL:-http://mailpit:8025}", PAYMENTS_API_URL = "${PAYMENTS_API_URL:-http://killbill:8080}", PAYMENTS_API_KEY = "${PAYMENTS_API_KEY:-orbit-labs}", PAYMENTS_API_SECRET = "${PAYMENTS_API_SECRET:-orbit-labs-secret-9f14c73e}", PAYMENTS_ADMIN_USER = "${PAYMENTS_ADMIN_USER:-admin}", PAYMENTS_ADMIN_PASSWORD = "${PAYMENTS_ADMIN_PASSWORD:-password}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_PAYMENTS = "killbill", DEKU_SERVICE_EMAIL = "mailpit" }

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"

[[artifacts]]
source      = "/app"
destination = "app"
