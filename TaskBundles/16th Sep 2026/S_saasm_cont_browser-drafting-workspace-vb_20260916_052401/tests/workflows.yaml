      do: Open the sign-in page, follow the footer link to the privacy page, return, then open the signup form and follow its terms link
    - kind: browser
      do: Walk every public address and an unknown one, and confirm no route shows a blank screen or an unhandled error
      cov: C-UF-12
    - kind: browser
      do: Narrow a public page to a phone width and confirm it reflows to one readable column
      cov: C-UX-26
    - kind: pytest
      test: test_output.py::test_privacy_page_linked_from_public_footer
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_terms_page_linked_from_signup_form
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_sitemap_lists_every_public_route
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_robots_file_references_the_sitemap
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_public_routes_declare_distinct_social_previews
      category: presentation
