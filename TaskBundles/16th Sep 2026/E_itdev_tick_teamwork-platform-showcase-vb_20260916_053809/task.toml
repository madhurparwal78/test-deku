schema_version = "1.4"

[task]
name = "deku/teamwork-platform-showcase-vb"
version = "1.0.0"
description = "Marketing estate and work console of a multi-product work management platform: sixteen public routes with three header chromes, a scroll-pinned home journey, a client-computed graduated pricing table, a faceted template catalogue, and a signed-in split-pane board where dragging a work item writes a transition, appends an immutable history entry, runs the automation rule bound to that transition and notifies the new assignee over postgres and mailpit"
uuid_v5 = "d920c9b4-2498-5001-972f-e7f54ff4f20e"
authors = [
    "utsav.jain@ethara.ai",
    "aniket.tyagi24@ethara.ai",
]
keywords = ["greenfield", "enterprise", "python", "postgres", "mailpit", "ticketing-queue", "it-devtools"]

[metadata]
category             = "Greenfield"
sub_category         = "enterprise"
domain               = "it-devtools"
pattern              = "ticketing-queue"
archetype            = "teamwork-platform-showcase"
variant              = "b"
variant_axes         = ["critical_depth", "spec_sections"]
service_profile      = "P2-db-email"
task_code            = "E_itdev_tick_teamwork-platform-showcase-vb_20260916_053809"
naming_scheme        = "task-code-v1"
grader_version       = "0.22.0"
launch_surface       = "favicon,page_view_log,single_cta,social_preview,terms_page"
capability_flags     = "aesthetic"
design_direction     = "companion"
rubric_version       = "1"
language             = "python"
spec_sections_given  = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected       = 200
tokens_expected      = 8000000
contributor_id       = "aniket.tyagi24@ethara.ai"
created_at           = "2026-09-16"
canary_present       = true
difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.22.0"

[metadata.services]
backend = "postgres"
email   = "mailpit"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode      = "public"
allowed_hosts     = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", SMTP_HOST = "${SMTP_HOST:-mailpit}", SMTP_PORT = "${SMTP_PORT:-1025}", SMTP_USER = "${SMTP_USER:-}", SMTP_PASS = "${SMTP_PASS:-}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "shared"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", EMAIL_INBOX_API_URL = "${EMAIL_INBOX_API_URL:-http://mailpit:8025}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_EMAIL = "mailpit" }

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"

[[artifacts]]
source      = "/app"
destination = "app"
