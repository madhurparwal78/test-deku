services:
  main:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4173:4173"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_USER: deku_admin
      POSTGRES_PASSWORD: deku-local-dev
      POSTGRES_DB: deku
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h postgres -p 5432 -q -U deku_admin -d deku"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 60
  mailpit:
    image: axllent/mailpit:v1.30.6
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
