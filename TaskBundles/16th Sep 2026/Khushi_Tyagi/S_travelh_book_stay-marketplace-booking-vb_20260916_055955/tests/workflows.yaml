    - kind: pytest
      test: test_output.py::test_link_grid_is_present_in_the_server_markup
      category: presentation
      weight: 1

- id: new_guest_signs_up_and_sees_an_empty_trip_list
  purpose: A fresh account can sign up, sees an empty trips list, and a duplicate address is refused
  substeps:
