      cov: C-RL-08, C-UF-06
    - kind: browser
      do: Open the account route and confirm language, region and display currency are three independent account settings, with the application single tenant, one set of listings and no organisations
      cov: C-CF-60, C-CN-01
    - kind: browser
      do: Confirm the four seeded accounts guest@example.com, guest2@example.com, host@example.com and host2@example.com each sign in
      cov: C-RL-09
    - kind: pytest
      test: test_output.py::test_empty_trips_list_is_an_empty_array
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_signup_refuses_a_duplicate_address
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_refund_quote_precedes_the_cancellation
      category: business_rule
      weight: 3
