- id: app_is_reachable_and_healthy
  purpose: The deployed app answers on its public address and reports ready
  substeps:
    - kind: browser
      do: Open the app's public address and confirm the landing page renders rather than an error page
    - kind: browser
      do: Watch the running product and confirm starts from the environment image with no manual step
      cov: C-DC-06
    - kind: browser
      do: Watch the running product and confirm serves a production build behind a static or preview server
      cov: C-DC-10
    - kind: pytest
