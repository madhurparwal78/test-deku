      do: Read the header, the footer and a product page for any control that edits the catalogue
    - kind: browser
      do: Open a collection with a facet value the storefront never offers and read the refusal
    - kind: browser
      do: Open a product address that names no watch in the catalogue and read the not found page
    - kind: browser
      do: Check that no authentication scheme, no session store and no user token exists in the product, and that the cart token is an opaque session identifier rather than a credential
