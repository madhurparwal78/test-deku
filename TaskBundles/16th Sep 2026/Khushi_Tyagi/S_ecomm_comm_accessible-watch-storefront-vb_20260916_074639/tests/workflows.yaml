      test: test_output.py::test_security_headers_are_present_on_every_response
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_invalid_facet_value_is_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_unknown_collection_and_product_answer_as_not_found
      category: validation
      weight: 3

