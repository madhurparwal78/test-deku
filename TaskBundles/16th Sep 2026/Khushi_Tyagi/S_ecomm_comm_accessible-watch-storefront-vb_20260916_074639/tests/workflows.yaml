    - kind: pytest
      test: test_output.py::test_upsell_is_never_the_only_line_in_a_cart
      category: validation
      weight: 3

- id: the_checkout_summary_matches_the_cart
  purpose: The checkout restates the cart without adding a line or dropping one
  substeps:
    - kind: browser
      do: Build a cart of two colourways and open the checkout from the cart
    - kind: browser
      do: Read the order summary on the checkout and compare its lines against the cart lines
    - kind: browser
      do: Read the total the summary states against the subtotal the cart stated
    - kind: browser
      do: Read the empty cart page, its centred heading, the continue shopping control beneath, the account line, and the footer that follows with no minimum height stranding it on a route of one viewport
      cov: C-CF-209 C-CF-210 C-CF-211 C-CF-212 C-OV-10
    - kind: browser
      do: Read the populated cart page heading row, the three column headings the cart table carries, and the totals block with its estimated total, its discount code field and its reassurance cluster, then read the checkout masthead and confirm the checkout carries no announcement bar, no navigation, no footer and no currency selector, and read the summary lines it renders
      cov: C-CF-213 C-CF-214 C-CF-216 C-CF-217 C-CF-218 C-CF-219 C-CF-220 C-CF-221 C-CF-222 C-CF-237
    - kind: pytest
      test: test_output.py::test_checkout_summary_equals_the_cart_line_for_line
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_completed_checkout_clears_the_cart
      category: business_rule
      weight: 3

- id: a_guest_checkout_opens_one_billing_account
  purpose: A completed guest order opens exactly one account in the billing platform
  substeps:
    - kind: browser
      do: Open the checkout from a cart holding one watch and type a delivery address and a contact address
    - kind: browser
      do: Submit the checkout and read the order reference the confirmation states
    - kind: browser
      do: Return to the cart and read the empty cart the completed order left behind
    - kind: pytest
      test: test_output.py::test_checkout_creates_exactly_one_billing_account_for_the_order
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_an_order_reference_the_shop_never_issued_has_no_billing_account
      category: security
      weight: 5

- id: a_duplicate_order_opens_no_second_billing_account
  purpose: Re-submitting one order reference leaves one billing account behind it
  substeps:
    - kind: browser
      do: Submit a checkout and read the order reference the confirmation states
    - kind: browser
      do: Return to the confirmation address a second time and read what the storefront states about the order
    - kind: browser
      do: Read the cart after the second visit and observe no second order forming
    - kind: pytest
      test: test_output.py::test_resubmitting_an_order_creates_no_second_billing_account
      critical: true
      category: data_integrity
      weight: 5

