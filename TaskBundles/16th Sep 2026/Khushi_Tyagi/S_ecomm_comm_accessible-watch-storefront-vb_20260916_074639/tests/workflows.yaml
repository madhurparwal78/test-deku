- id: browse_the_catalogue_and_page_through_it
  purpose: A visitor opens the catch-all collection and moves through its numbered pages
  substeps:
    - kind: browser
      do: Open the catch-all collection and read the product count stated above the grid
    - kind: browser
      do: Read the first grid row and count the product cards the page serves before the numbered pagination
    - kind: browser
      do: Use the numbered pagination to open the seventh page and read the products it serves
    - kind: browser
      do: Return to the first page by the numbered pagination and read the same products the first visit served
    - kind: pytest
      test: test_output.py::test_catch_all_reports_one_hundred_and_seventy_four_products
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_pagination_is_numbered_and_addressable
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_repeated_identical_collection_request_is_stable
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_every_sort_option_is_accepted
      category: validation
      weight: 3

- id: narrow_a_collection_by_facet_and_sort_it
  purpose: A visitor narrows a collection by availability and reorders what survives
  substeps:
    - kind: browser
      do: Select the in stock availability facet and read the reduced product count the collection states
    - kind: browser
      do: Reload the address the facet selection produced and read the same narrowed collection
    - kind: browser
      do: Reorder the narrowed collection by price from low to high and read the order of the prices served
    - kind: browser
      do: Read the control row, the filter disclosure on the left, the sort control listing its options and the result count on the right, and the facet panel with its reset control and its remove-all control, then read the grid rows and observe a taller card that pushes the next row down rather than the rows being height-matched
      cov: C-CF-130 C-CF-131 C-CF-132 C-CF-134 C-CF-135 C-FE-80 C-CF-143
    - kind: browser
      do: Open the catch-all collection and read the availability facet with its in stock count and its out of stock count against the products it reports
      cov: C-CF-133
    - kind: pytest
      test: test_output.py::test_sort_and_filter_survive_in_the_address
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_facet_counts_sum_to_the_collection_total
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_stored_availability_matches_the_facet_counts
      category: data_integrity
      weight: 5

- id: the_seeded_catalogue_is_stored_and_served
  purpose: The catalogue the storefront serves is the catalogue the store holds
  substeps:
    - kind: browser
      do: Open the catch-all collection and read the maker name printed on each product card
    - kind: browser
      do: Open a curated collection from the navigation and read the products it holds
    - kind: browser
      do: Open a product from that collection and read the colourway prices its swatches carry
    - kind: browser
      do: Read the five colourways on the rebel-face watch, the diamond-scale watch and the business watch, the handle, the maker, the model and the compare-at each carries, and which colourway in each set is unavailable
      cov: C-CF-202 C-CF-203 C-CF-204 C-CF-206 C-CF-207 C-CF-208
    - kind: browser
      do: Read the imagery the build generates, that no binary ships, the deterministic generator seeded on a handle, the same handle that produces the same watch, the visibly different watches different handles produce, the banner type set rather than drawn, the review photographs, the payment marks kept abstract, and the video slot
      cov: C-FE-88 C-FE-89 C-FE-90 C-FE-92 C-FE-96 C-FE-98 C-FE-101 C-FE-102
    - kind: pytest
      test: test_output.py::test_seeded_catalogue_rows_are_persisted_in_the_store
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_variant_prices_and_availability_are_stored_per_variant
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_the_catalogue_carries_several_maker_names
      category: business_rule
      weight: 3

- id: read_a_product_card_and_its_from_price
  purpose: A card states the cheapest colourway a buyer can actually have
  substeps:
    - kind: browser
      do: Open the catch-all collection and read the price line on a card whose colourways cost different amounts
    - kind: browser
      do: Read the struck-through original beside the sale price on the same card
    - kind: browser
      do: Read the star row and the review count above the price on a card that carries a rating
    - kind: browser
      do: Read a card that carries no rating and observe the card below it rising to meet it
    - kind: browser
      do: Read the badges on a card, the sale badge first, the promotional badge second, and the sold-out line that replaces the price on an unavailable product, and read the rating row on a card carrying a rating and on one carrying none with the height the row reserves
      cov: C-CF-102 C-CF-103 C-CF-104 C-CF-105 C-FE-72
    - kind: pytest
      test: test_output.py::test_from_price_names_the_cheapest_available_variant
      critical: true
      category: business_rule
      weight: 5
    - kind: pytest
      test: test_output.py::test_card_rating_is_nullable_and_never_reserved
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_home_products_are_served_with_their_originals_and_badges
      category: business_rule
      weight: 3

- id: open_a_product_and_pick_a_colourway
  purpose: A visitor opens a watch and selects the colourway they want
  substeps:
    - kind: browser
      do: Open a product and read the gallery, the title, the price and the specification panel
    - kind: browser
      do: Select a colourway swatch and read the price and the image the selection produces
    - kind: browser
      do: Select a second colourway swatch and read the price the second selection produces
    - kind: browser
      do: Read the information column above the buy control and the order of the breadcrumb, the title, the rating value with its star row and its review count, the offer line, the price pair and the shipping line, then read the media the deeply specified product carries, open a frame into its modal, and read the counter with its current number and its total
      cov: C-CF-154 C-CF-158 C-CF-159 C-CF-162 C-CF-205 C-CF-151 C-FE-75 C-FE-76
    - kind: browser
      do: Read the buy control wording, the wallet control, the buy control drawn as a submit, the accelerated payment paths the control reveals, and its pending state between a press and the confirmation, then read the trust strip beneath the buy control and the four reassurances in its row
      cov: C-CF-180 C-CF-182 C-CF-183 C-CF-184 C-CF-185 C-CF-186 C-CF-187
    - kind: browser
      do: Read the description column, its feature heading, its inclusions heading, its closing heading, the six feature leads, and the inclusions read out for the watch
      cov: C-CF-189 C-CF-190 C-CF-191 C-CF-192 C-CF-193
    - kind: browser
      do: Read the heading that opens the related rail and the reviews band with its review link and its carousel, and open the three collapsible panels covering shipping, the warranty and returns and compare their source against the editorial pages covering the same ground
      cov: C-CF-196 C-CF-198 C-CF-201 C-CF-195
    - kind: pytest
      test: test_output.py::test_product_payload_carries_its_colourways_with_their_own_prices
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_a_product_with_two_priced_colourways_is_served_intact
      category: business_rule
      weight: 3

- id: a_sold_out_colourway_stays_on_the_page
  purpose: An unavailable colourway is shown as unavailable rather than removed
  substeps:
    - kind: browser
      do: Open a product holding an unavailable colourway and read the swatch grid it serves
    - kind: browser
      do: Select the unavailable colourway and read the price, the image and the sold out wording
    - kind: browser
      do: Select an available colourway on the same product and read the buy control it offers
    - kind: browser
      do: Read the stock line and its three states, read the struck swatch wording, then select an unavailable colourway and read the buy control it offers
      cov: C-CF-177 C-CF-178 C-CF-179 C-FE-77
    - kind: pytest
      test: test_output.py::test_unavailable_colourway_is_served_rather_than_removed
      category: business_rule
      weight: 3

- id: switch_the_display_currency
  purpose: A visitor reads the same watch in a second currency
  substeps:
    - kind: browser
      do: Open a product and read its price in the currency the storefront opens in
    - kind: browser
      do: Switch the display currency from the header control and read the converted price
    - kind: browser
      do: Read the struck-through original on the same product in the second currency
    - kind: browser
      do: Return to the collection and read the same product card in the second currency
    - kind: browser
      do: Read the currency selector in the lower left through a scroll, open its list by keyboard and close it by escape, and read the shadow its popover casts
      cov: C-CF-249 C-CF-250 C-CF-251 C-FE-37 C-FE-38
    - kind: pytest
      test: test_output.py::test_prices_convert_by_one_rate_in_one_pass
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_one_product_costs_the_same_on_two_surfaces
      category: data_integrity
      weight: 5

- id: add_to_the_cart_and_adjust_the_quantities
  purpose: A visitor builds a cart of two colourways and changes a quantity
  substeps:
    - kind: browser
      do: Add a colourway to the cart at a quantity of two and read the count on the header cart control
    - kind: browser
      do: Open the cart and read the line, its colourway, its quantity and its line total
    - kind: browser
      do: Add a second colourway and read the two lines the cart holds in the order they were added
    - kind: browser
      do: Raise the quantity on the second line and read the subtotal the cart restates
    - kind: browser
      do: Read the drawer heading with its unit count, the empty drawer line with its continue shopping control, the drawer checkout control with its subtotal, and the checkout summary line, then read the variant caption on a cart line and a line whose product carries no options
      cov: C-CF-24 C-CF-25 C-CF-26 C-CF-30 C-CF-31 C-CF-32
    - kind: pytest
      test: test_output.py::test_cart_unit_count_sums_quantities_rather_than_lines
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_cart_line_order_is_insertion_order
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_cart_survives_a_reload_on_the_same_token
      category: data_integrity
      weight: 5

- id: the_shipping_upsell_is_a_product_rather_than_a_fee
  purpose: The cart upsell is an ordinary catalogue product a buyer may decline
  substeps:
    - kind: browser
      do: Open a cart holding one watch and read the shipping protection upsell offered beneath the lines
    - kind: browser
      do: Add the shipping protection upsell and read the line it adds and the subtotal it raises
    - kind: browser
      do: Remove the shipping protection upsell and read the subtotal returning to its earlier amount
    - kind: pytest
