allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://volari_app:vs-app-pw-2026@postgres:5432/volari_shop}", SMTP_HOST = "${SMTP_HOST:-mailpit}", SMTP_PORT = "${SMTP_PORT:-1025}", SMTP_USER = "${SMTP_USER:-}", SMTP_PASS = "${SMTP_PASS:-}", PAYMENTS_API_URL = "${PAYMENTS_API_URL:-http://killbill:8080}", PAYMENTS_API_KEY = "${PAYMENTS_API_KEY:-orbit-labs}", PAYMENTS_API_SECRET = "${PAYMENTS_API_SECRET:-orbit-labs-secret-9f14c73e}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_EMAIL = "mailpit", DEKU_SERVICE_PAYMENTS = "killbill" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "shared"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://volari_app:vs-app-pw-2026@postgres:5432/volari_shop}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://volari_owner:vs-owner-pw-2026@postgres:5432/volari_shop}", EMAIL_INBOX_API_URL = "${EMAIL_INBOX_API_URL:-http://mailpit:8025}", PAYMENTS_API_URL = "${PAYMENTS_API_URL:-http://killbill:8080}", PAYMENTS_API_KEY = "${PAYMENTS_API_KEY:-orbit-labs}", PAYMENTS_API_SECRET = "${PAYMENTS_API_SECRET:-orbit-labs-secret-9f14c73e}", PAYMENTS_ADMIN_USER = "${PAYMENTS_ADMIN_USER:-admin}", PAYMENTS_ADMIN_PASSWORD = "${PAYMENTS_ADMIN_PASSWORD:-password}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_EMAIL = "mailpit", DEKU_SERVICE_PAYMENTS = "killbill" }

[delivery]
