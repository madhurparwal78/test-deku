[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 1800.0

network_mode  = "public"
allowed_hosts = []

env = { APP_PUBLIC_PORT = "4173", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/mercato}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/mercato}", AUTH_ISSUER_URL = "${AUTH_ISSUER_URL:-http://keycloak:8080/realms/mercato}", AUTH_CLIENT_ID = "${AUTH_CLIENT_ID:-mercato-app}", AUTH_CLIENT_SECRET = "${AUTH_CLIENT_SECRET:-mercato-secret-2026}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0

env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/mercato}", AUTH_ADMIN_TOKEN = "${AUTH_ADMIN_TOKEN:-deku_admin:deku-local-dev}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_AUTH = "keycloak", DEKU_SETTLE_SECONDS = "2" }

[[artifacts]]
source      = "/app"
destination = "app"
