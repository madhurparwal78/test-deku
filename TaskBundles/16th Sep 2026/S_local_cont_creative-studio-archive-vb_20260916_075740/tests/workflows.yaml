- id: visitor_sends_a_work_inquiry
  purpose: A stranger opens the contact block, expands the form beside the studio address, sends a brief and reads the confirmation in place of the form
  substeps:
    - kind: browser
      do: Reach the contact block and find the studio address leading it at display size, with the qualifier beneath it and a control offering to send a brief instead
      cov: C-CF-43
    - kind: browser
      do: Press the control that expands the form, fill every field, press send, and read the confirmation copy rendered in place of the form
      cov: C-CF-49
    - kind: browser
      do: Send a brief from the contact block, read the confirmation on the screen, then find that no email is sent by the product anywhere in the flow
      cov: C-CN-01
    - kind: pytest
      test: test_output.py::test_an_accepted_work_inquiry_is_stored_with_its_first_event
      critical: true
      category: core_outcome
      weight: 5
