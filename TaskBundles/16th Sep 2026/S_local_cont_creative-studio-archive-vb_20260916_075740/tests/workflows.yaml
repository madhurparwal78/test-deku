      do: Point at a case card and watch its veil lift to fully clear, then press the card and watch it grow to fill the window
      cov: C-FE-20
    - kind: browser
      do: Read the case that opened, press the control at the right edge to reach the neighbouring case, then press the escape key to close and find the sequence at the reading position it held
      cov: C-FE-08
    - kind: browser
      do: Scroll to the end of the case stack and find the archive card rendered last, styled as a case card is styled
      cov: C-CF-21
    - kind: pytest
      test: test_output.py::test_cases_returns_only_published_cases_ordered_by_stack_order
