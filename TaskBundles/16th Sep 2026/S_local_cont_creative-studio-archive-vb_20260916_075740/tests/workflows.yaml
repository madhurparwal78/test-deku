      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_case_detail_returns_its_neighbouring_slugs
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_first_and_last_cases_carry_no_neighbour_beyond_the_stack
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_case_body_carries_blocks_of_seven_kinds_only
