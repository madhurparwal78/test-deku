- id: visitor_reads_the_home_sequence
  purpose: A stranger opens the studio site, reads its eight ordered blocks end to end, moves through them from the fixed menu, and finds the privacy page from the footer of the route
  substeps:
    - kind: browser
      do: Open the home route, let the arrival counter run to its end, then read down the sequence: the hero, the studio seal, the services run, the selected cases heading, the case stack, the awards board, the contact block, the footer, in that stored order
      cov: C-CF-03, C-OV-01
    - kind: browser
      do: Read the hero and find four display lines stacked over each other, each arriving one character at a time a beat behind the line above
      cov: C-CF-07
    - kind: browser
      do: Read the services run beneath the seal and find the eight disciplines set in their stored order, one per line on a narrow window
      cov: C-CF-08
    - kind: browser
      do: Press the four in-page menu labels one after another, watching the reader move down the page without the address changing on any of them
      cov: C-CF-10
    - kind: browser
      do: Reach the footer, find the privacy page linked from it, open the privacy page, then return with the browser back
      cov: C-CF-80
    - kind: browser
      do: Point at every marked control on the home route and find each image carrying alternative text, with a decorative image declaring itself decorative
      cov: C-CF-79
    - kind: pytest
      test: test_output.py::test_health_reports_status_once_the_app_is_ready
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_page_returns_the_enabled_sequence_blocks_in_order
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_each_sequence_block_carries_its_data_block_value
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_each_menu_label_carries_its_data_menu_value
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_the_document_element_carries_data_mode_sequence_on_the_home_route
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_every_public_route_renders_a_complete_document_from_the_server
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_the_served_document_carries_every_word_before_any_script_runs
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_the_services_list_carries_the_eight_disciplines_in_order
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_a_list_endpoint_returns_a_top_level_json_array
      category: presentation
      weight: 1

- id: visitor_opens_a_case_from_the_stack
  purpose: A stranger reads the numbered case stack, opens one case, walks sideways to its neighbour, and comes back to the reading position they left
  substeps:
