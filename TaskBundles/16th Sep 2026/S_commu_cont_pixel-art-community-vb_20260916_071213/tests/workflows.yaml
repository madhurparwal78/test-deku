    - kind: browser
      do: Confirm the chrome shows its reduced entry set on the home route and its full set elsewhere, with the segmented drawing control reading as one pill cut into three. Confirm: the chrome carries a reduced entry set on the home route; the chrome carries the full entry set on every other route; the segmented drawing control is one pill cut into three segments; the chrome bar is fixed at the top, unchanged by scrolling.
      cov: C-FE-01, C-FE-02, C-FE-03, C-FE-04
    - kind: browser
      do: Open the drawer and confirm fourteen entries each pair an icon with a label, and that the button, Escape and the scrim all close it. Confirm: the drawer carries fourteen entries each an icon beside a label; the drawer closes by the button, by Escape, by a click on the scrim; the iconography is closed at twenty-eight inline marks.
      cov: C-FE-05, C-FE-06, C-FE-08
    - kind: browser
      do: Trigger the offline, storage-failure and conflict states and confirm each carries its own plain message rather than generic error text. Confirm: nine system messages carry the product honesty commitments unsoftened.
      cov: C-FE-16
    - kind: browser
      do: Open /notifications with no session and confirm the sign-in modal appears, that signing in returns to it, and that signing out lands on the home route. Confirm: the route /notifications requires a bearer session; a protected route reached without a session opens the sign-in modal; signing in returns the visitor to the remembered intended route; signing out returns the visitor to the home route; an expired token leaves the editor running with local saving intact.
      cov: C-UF-09, C-UF-10, C-UF-11, C-UF-12, C-UF-13
    - kind: browser
      do: Sign in with an unknown address and with a wrong password and confirm both answer the same way. Confirm: the unknown-account path returns the same message as the wrong-password path; signup never reveals whether an address is already registered.
      cov: C-CF-03, C-CF-04
    - kind: browser
      do: Confirm every internal link on every public route resolves and that no two routes share a title or a description. Confirm: every internal link on every public route resolves; every public route carries a title plus a description of its own.
      cov: C-CF-170, C-CF-171
    - kind: browser
      do: Read the page source of a public route and confirm no credential, token or object-store key is present anywhere the browser downloads. Confirm: no credential appears in anything the browser downloads; no secret value reaches the client bundle, the markup, a source map.
      cov: C-TR-10, C-TR-11
    - kind: browser
      do: Confirm the served pages arrive as complete HTML on first paint, that the API answers under the same origin, and that no third-party script, font binary or external stylesheet is requested. Confirm: rendered pages are built with SolidStart; the JSON API is served by Express under the /api prefix; the browser receives complete HTML for every route on first paint; no third-party script ships with the application; no external network call is made at runtime; no font binary, icon font, external stylesheet ships; no binary asset ships with the build; the HTTP API is served on the same origin under the /api prefix.
      cov: C-TR-01, C-TR-02, C-TR-03, C-TR-12, C-TR-13, C-TR-14, C-TR-16, C-DC-03
    - kind: browser
      do: Confirm the app reads its datastore and its object store from the environment and reaches no other backing service. Confirm: relational data is persisted in PostgreSQL read from DATABASE_URL; no second database, cache, queue, object store, identity provider is introduced; no backing service is downloaded, installed, compiled, started; no edge function is used.
