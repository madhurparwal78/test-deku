- id: published_artwork_lands_in_the_object_store
  purpose: Publishing writes real bytes to the bucket under the pinned key scheme, with renditions
  substeps:
    - kind: pytest
      test: test_output.py::test_published_artwork_object_exists_in_the_bucket
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_object_key_follows_the_pinned_scheme
      category: data_integrity
      weight: 5
    - kind: pytest
