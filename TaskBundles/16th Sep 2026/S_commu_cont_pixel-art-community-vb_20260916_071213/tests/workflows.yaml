      category: data_integrity
      weight: 5
    - kind: browser
      do: Import a still image beyond the size limit and one whose name disagrees with its contents, and confirm the refusals name the real reason. Confirm: an imported still image is at most 20MB; upload format is decided from the leading bytes rather than the file name.
      cov: C-CF-87, C-CF-88
    - kind: browser
      do: Publish two unrelated small pieces that collide perceptually and confirm both survive with a review raised rather than either being removed. Confirm: each piece stores a cryptographic hash plus a perceptual hash; a perceptual hash match never removes a piece by itself.
      cov: C-CF-134, C-CF-135
    - kind: browser
      do: Confirm every placeholder is generated pixel art with a visible grid, that an avatar is a seeded identicon, that the mark is pixel art, and that advertising space is reserved and empty. Confirm: the artwork placeholder is generated deterministically from the piece id; the artwork placeholder is real pixel art with a visible grid; an animated placeholder is a four-frame loop from the same generator; an avatar is a seeded identicon deterministic from the account id; the brand mark is generated as pixel art rather than as a smooth vector; advertising space is reserved as an empty bordered region.
      cov: C-TR-17, C-TR-18, C-TR-19, C-TR-20, C-TR-21, C-TR-22

- id: counters_are_derived_from_their_rows
