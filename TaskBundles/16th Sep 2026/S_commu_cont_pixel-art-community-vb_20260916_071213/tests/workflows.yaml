      cov: C-CF-97, C-CF-109, C-DM-16
    - kind: browser
      do: Remove a piece and reinstate it, confirming the original date, the counters and its place in the remix chain all come back. Confirm: reinstating a piece restores the original publication time; reinstating a piece restores the counters plus the remix lineage place; every moderation action appends a row carrying the predecessor hash; the moderation audit chain verifies end to end after concurrent actions; a moderation action row carries the predecessor hash plus its own hash.
