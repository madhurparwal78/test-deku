- id: listing_pages_only_published_products
  purpose: "A model listing fills every page with published products, reports honest totals and pages by page number"
  substeps:
    - kind: browser
      do: "Open /list/arbor/arbone-16-pro and confirm the heading reads ARBOR ARBONE 16 PRO PHONE CASES with a chip reading Model: Arbone 16 Pro under the filter bar"
      cov: "C-UF-01, C-FE-06"
    - kind: browser
      do: "Open / as a first time visitor, answer the cookie question, reload the page, and confirm the cookie question is not asked again"
      cov: "C-CF-61"
    - kind: browser
      do: "On / scroll down past the header and confirm the header scrolls away rather than sticking, and that the hero title alone is set in the wide display face"
      cov: "C-FE-01, C-UX-10"
    - kind: browser
      do: "On / choose the Bags chip under SHOP BY CATEGORY and confirm the rail beneath changes while the address stays on /, and that the active hero bullet fills like a timer"
      cov: "C-FE-02, C-FE-03"
    - kind: pytest
      test: test_output.py::test_health_route_answers_ready
      category: presentation
      weight: 1
      cov: "C-DC-03, C-DC-01 (earned: the health route answers at the public app address), C-DC-04 (earned: the health route answers from the started image without any step taken by hand), C-DC-05 (earned: the health route answers after the session that started the server has ended), C-DC-06 (earned: the health route answers from outside the app's own loopback interface)"
    - kind: pytest
      test: test_output.py::test_listing_first_page_is_full_after_unpublished_are_excluded
      critical: true
      category: data_integrity
      weight: 5
      cov: "C-CF-17, C-TR-02 (earned: a full first page with no unpublished handle is what selecting before paging produces)"
    - kind: pytest
      test: test_output.py::test_listing_total_count_and_next_page_on_every_page
      category: data_integrity
      weight: 5
      cov: "C-TR-03, C-CF-24 (earned: three pages of twenty four, twenty four and twelve are the page size observed), C-DM-05 (earned: the model case listing is walked page by page to 60 products in 24, 24 and 12)"
    - kind: pytest
      test: test_output.py::test_listing_newest_sort_orders_by_sequence
      category: business_rule
      weight: 3
      cov: "C-CF-23"
    - kind: pytest
      test: test_output.py::test_generated_basics_rows_match_the_rule
      category: business_rule
      weight: 3
      cov: "C-DM-01, C-DM-02"
    - kind: pytest
      test: test_output.py::test_published_catalogue_counts_across_categories
      category: data_integrity
      weight: 5
      cov: "C-DM-03, C-DM-04 (earned: the phone-cases category total is asserted to be 399 across the category sweep)"
    - kind: pytest
      test: test_output.py::test_seeding_twice_duplicates_no_product_row
      critical: true
      category: data_integrity
      weight: 5
      cov: "C-DM-14"
    - kind: pytest
      test: test_output.py::test_api_prefix_serves_json_on_the_app_origin
      category: presentation
      weight: 1
      cov: "C-DC-02, C-DC-08 (earned: the device models list endpoint is asserted to carry its rows under items)"

