services:
  main:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PUBLIC_PORT:-4173}:4173"
    depends_on:
      postgres:
        condition: service_healthy
      killbill:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  postgres:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: deku_admin
      POSTGRES_PASSWORD: deku-local-dev
      POSTGRES_DB: deku
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deku_admin -d deku && PGPASSWORD=deku-local-dev psql -h 127.0.0.1 -U deku_app -d deku -c 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  killbill:
    image: killbill/killbill:0.24.21@sha256:e6b6ab4a0e6287ebf57aafa2d5f22cfa6250dfa056682c74d7c208b4a39d0c9b
    environment:
      KB_org_killbill_dao_url: jdbc:mysql://killbill-db:3306/killbill
      KB_org_killbill_dao_user: root
      KB_org_killbill_dao_password: kbdb-root-5c92e4a1
      KB_org_killbill_billing_osgi_dao_url: jdbc:mysql://killbill-db:3306/killbill
      KB_org_killbill_billing_osgi_dao_user: root
      KB_org_killbill_billing_osgi_dao_password: kbdb-root-5c92e4a1
    depends_on:
      killbill-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/1.0/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  killbill-init:
    image: curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
    depends_on:
      killbill:
        condition: service_healthy
    volumes:
      - ./killbill-init.sh:/killbill-init.sh:ro
    entrypoint: >
      /bin/sh -c "
        /bin/sh /killbill-init.sh &&
        tail -f /dev/null
      "

  killbill-db:
    image: killbill/mariadb:0.24@sha256:921e17f2ce804746d8fb2546249760b242e21d6f3398c6326a8a0901742b536a
    environment:
      MYSQL_ROOT_PASSWORD: kbdb-root-5c92e4a1
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/messages > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
