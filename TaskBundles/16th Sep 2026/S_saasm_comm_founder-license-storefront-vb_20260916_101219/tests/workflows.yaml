      do: "Open /download, type a new email address into the email field, tick the consent checkbox and press Join the beta, then observe that the form is replaced in place by a Check your inbox panel naming the submitted address, suggesting the spam folder and showing Resend link disabled with a visible count down from 60 seconds"
      cov: "C-UF-38, C-UF-39, C-UF-40, C-UF-41"
