- id: visitor_reads_the_home_storefront
  purpose: "A visitor opens the home route and reads the product argument end to end"
  substeps:
    - kind: browser
      do: "Open / and read the hero: the headline Any prompt, one keystroke away., the three key caps Cmd, Shift and Space, the sub-headline, the note Free during beta. No card required., and the two actions labelled Join beta and Try the hotkey"
      cov: "C-FE-145"
    - kind: browser
      do: "Scroll down the home route and read the window mockup of the Blueprint Library: a sidebar, a search field, a list of rows and a detail strip beside them, then the three numbered packet cards under their header card"
      cov: "C-FE-137, C-FE-162"
    - kind: browser
      do: "Scroll to the injection history ledger and read its six rows, each one a timestamp with a Blueprint name, an arrow, a target application and a detail reading Quick copy or a file count, under the label Demonstration data"
      cov: "C-FE-164, C-FE-121"
    - kind: pytest
      test: test_output.py::test_home_sections_render_in_the_pinned_order_without_scripts
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_home_instrument_copy_and_bullets_are_pinned
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_home_comparison_renders_as_a_real_table
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_home_pricing_and_help_copy_is_pinned
      category: presentation
      weight: 1
- id: visitor_registers_for_the_beta
