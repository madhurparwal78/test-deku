schema_version = "1.4"

[task]
name = "deku/subscription-spend-tracker-vb"
version = "1.0.0"
uuid_v5 = "9b3b2444-68dc-56ba-9d4d-1b81b12d21a7"
description = "A private subscription tracker whose editorial marketing site and account-backed ledger share one origin, with exact multi-currency arithmetic, calendar-correct renewal dates and exactly-once reminders."
authors = [
  "abhishek.shaw@ethara.ai",
  "dishita.aryaint17@ethara.ai",
]
keywords = ["greenfield", "individual", "typescript", "postgres", "personal-finance"]

[metadata]
category     = "Greenfield"
sub_category = "individual"
domain          = "personal-finance"
pattern         = "tracker-log"
service_profile = "P1-db"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = "aesthetic,concurrency_hardening,data_scale"
design_direction = "companion"
launch_surface  = "colour_contrast,meta_tags,single_cta,social_preview,terms_page"
task_code     = "I_perso_trac_subscription-spend-tracker-vb_20260916_054233"
naming_scheme = "task-code-v1"
grader_version = "0.22.0"
language     = "typescript"
archetype    = "subscription-spend-tracker"
variant      = "b"
difficulty   = ""
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 260
tokens_expected = 8000000
contributor_id  = "dishita.aryaint17@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", DEKU_SERVICE_BACKEND = "postgres" }

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"

[[artifacts]]
source      = "/app"
destination = "app"
