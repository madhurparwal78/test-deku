      cov: C-CF-108 C-CF-109 C-CN-12
    - kind: browser
      do: Move from the case facts step to the hero step and observe the earlier step answers kept
      cov: C-CF-108 (earned: the step walks from one create step to the next and reads back what the previous step captured)
