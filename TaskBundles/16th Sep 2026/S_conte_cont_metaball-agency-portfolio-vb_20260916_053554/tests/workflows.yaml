      test: test_pytest.py::test_abandoned_create_sequence_creates_no_project
      critical: true
      category: data_integrity
      weight: 5
      cov: C-CF-109
    - kind: pytest
      test: test_pytest.py::test_uploaded_hero_lands_in_the_bucket_under_the_key_scheme
      critical: true
      category: data_integrity
      weight: 5
      cov: C-CF-110
    - kind: pytest
      test: test_pytest.py::test_every_seeded_hero_is_an_object_in_the_bucket
      critical: true
      category: data_integrity
      weight: 5
      cov: C-DM-10 C-DM-28
    - kind: pytest
      test: test_pytest.py::test_every_seeded_portrait_is_an_object_in_the_bucket
