      category: data_integrity
      weight: 5
      cov: C-DM-11 (earned: the test reads every project_media row and asserts each names a key under the one scheme, which is the row-is-the-only-record rule)
    - kind: browser
      do: Open a published case and observe its gallery of stills rendered from the object store
      cov: C-CF-110 C-CF-111 C-TR-06
