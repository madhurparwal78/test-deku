- id: visitor_reads_the_home_route_end_to_end
  purpose: A visitor opens the home route and travels its six strands over the moving mass
  substeps:
    - kind: browser
      do: Open the home route and observe the headline rows Interactive, Experiences with Us and for Active Growth already in place over a moving coloured mass
      cov: C-OV-03 C-FE-44
    - kind: browser
      do: Scroll the home route and observe each strand ending at a View more control pointing at its own index
      cov: C-FE-04 C-FE-78
    - kind: browser
      do: Observe the four discipline names Digital, Movie, Spatial and Brand set inside the stacked diagram
      cov: C-CF-86 C-FE-50
    - kind: pytest
      test: test_pytest.py::test_health_endpoint_returns_ready
      critical: true
      category: core_outcome
      weight: 5
      cov: C-TR-09
    - kind: pytest
      test: test_pytest.py::test_reserved_directories_and_credential_file_are_declared
      category: presentation
      weight: 1
      cov: C-DC-20
- id: visitor_retunes_the_persistent_simulation
  purpose: A visitor opens the settings panel, changes the mass and finds the change surviving a route change
  substeps:
    - kind: browser
      do: Open the control in the left margin and observe the settings panel growing from the control while the page goes soft behind the panel
      cov: C-CF-19 C-FE-39 C-FE-40
    - kind: browser
      do: Observe the nine labelled controls Background, Sphere colour one, Sphere colour two, Angular damping, Linear damping, Return force, Movement range, Strength and Diffuse
      cov: C-CF-21 C-CF-22 C-CF-23 C-CF-24 C-CF-25
    - kind: browser
      do: Drag the Movement range slider and observe the mass changing within one frame with no flash and no restart
      cov: C-CF-32 C-CF-11
    - kind: browser
      do: Change a colour well, navigate to the project index and observe the colour well change surviving the route change
      cov: C-CF-33 C-CF-09 C-OV-05
    - kind: browser
      do: Reload the page and observe every simulation default restored
      cov: C-CF-34
    - kind: pytest
      test: test_pytest.py::test_list_endpoints_return_top_level_json_arrays
      category: presentation
      weight: 1
      cov: C-DC-12 C-DC-14
    - kind: browser
      do: Open the settings panel from the keyboard and observe focus moving into the settings panel
      cov: C-CF-36
    - kind: browser
      do: Press Escape and observe the settings panel closing and focus returning to the opening control
      cov: C-CF-37 C-CF-38
    - kind: browser
      do: Tab through the open settings panel and observe focus staying trapped inside the panel
      cov: C-CF-39
    - kind: browser
      do: Scroll the panel control list and observe the list dissolving into the panel ground at both edges rather than being cut off
      cov: C-CF-44 C-FE-41
    - kind: pytest
      test: test_pytest.py::test_english_edition_serves_every_public_route
      category: business_rule
      weight: 3
      cov: C-UF-02
- id: visitor_opens_a_case_from_the_project_index
