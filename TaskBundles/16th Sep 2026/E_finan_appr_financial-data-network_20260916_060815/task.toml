domain              = "finance-accounting"
pattern             = "approval-workflow"
archetype           = "financial-data-network"
variant             = "a"
service_profile     = "P3-db-auth"
task_code           = "E_finan_appr_financial-data-network_20260916_060815"
naming_scheme       = "task-code-v1"
grader_version      = "0.22.0"
design_direction    = "glass-depth"
