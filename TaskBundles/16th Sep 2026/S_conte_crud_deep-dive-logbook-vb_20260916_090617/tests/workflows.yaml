- id: visitor_takes_the_dive_from_the_loader_down_to_the_contact_deck
  purpose: "A visitor with no account passes the entry gate, sinks through all six scenes and reaches the contact deck"
  substeps:
    - kind: browser
      do: "Open / signed out and observe the loader showing the bracketed waiting label, a status line reading Loading 3D experience and a meter made of slash characters"
      cov: C-FE-07, C-FE-08, C-FE-09
    - kind: browser
      do: "Wait for the gate and observe the bracketed welcome salutation above a solid control reading Dive into the experience with Enter without audio pinned near the bottom of the screen"
      cov: C-CF-89, C-CF-90, C-CF-91, C-FE-11, C-FE-12
    - kind: pytest
      test: test_output.py::test_the_dive_route_is_served_to_a_visitor_with_no_session
      category: core_outcome
      weight: 5
      cov: C-RL-13
    - kind: pytest
      test: test_output.py::test_the_scenes_endpoint_returns_six_scenes_in_index_order_with_slug_name_and_field_of_view
      category: data_integrity
      weight: 5
      cov: C-DC-01
    - kind: browser
      do: "Activate Enter without audio and observe the surface scene carrying the name Ines Marlow across the top and the bracketed descend prompt along the bottom"
      cov: C-FE-13, C-UF-14
    - kind: browser
      do: "Gesture down once and observe the introduction sentence reading Ines Marlow is a Software Engineer arriving over the water"
      cov: C-FE-14
    - kind: pytest
      test: test_output.py::test_the_projects_endpoint_returns_four_projects_in_position_order_every_one_at_the_works_scene
      category: data_integrity
      weight: 5
      cov: C-CF-92, C-DM-03
    - kind: browser
      do: "Gesture down to the about scene and observe the discipline sentence, the line reading based in Portugal and the affiliation carrying a triple slash before Kelp Studio"
      cov: C-FE-16, C-FE-17
    - kind: browser
      do: "Gesture down to the contact deck and observe eight destinations listed as words, the sign off reading Thanks for visiting and a bracketed frame counter"
      cov: C-FE-22, C-FE-23
    - kind: pytest
      test: test_output.py::test_gesturing_above_the_surface_leaves_the_dive_at_scene_zero_without_wrapping_to_the_last_scene
      category: business_rule
      weight: 3
      cov: C-CF-82
    - kind: pytest
      test: test_output.py::test_gesturing_below_the_contact_deck_leaves_the_dive_at_the_last_scene_without_wrapping_to_the_surface
      category: business_rule
      weight: 3
      cov: C-CF-83
    - kind: browser
      do: "Observe the depth mark travelling down the right edge as the dive descends and the three header words Works Message Contact arriving after the introduction"
      cov: C-CF-84, C-CF-96, C-FE-05, C-FE-06, C-UF-06
    - kind: pytest
      test: test_output.py::test_the_health_route_answers_two_hundred_once_the_scenes_and_projects_are_loaded
      category: core_outcome
      weight: 5
      cov: C-TR-18
