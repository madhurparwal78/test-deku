      weight: 5
      cov: C-CF-28
    - kind: pytest
      test: test_output.py::test_losing_concurrent_claim_is_refused_as_a_conflict_naming_the_holder
      category: data_integrity
      weight: 5
      cov: C-CF-29
    - kind: pytest
      test: test_output.py::test_concurrent_claims_record_exactly_one_claimed_history_row
      category: data_integrity
      weight: 5
      cov: C-CF-30
    - kind: pytest
      test: test_output.py::test_fault_history_entries_are_unchanged_after_a_later_decision
      category: data_integrity
      weight: 5
      cov: C-DM-08

