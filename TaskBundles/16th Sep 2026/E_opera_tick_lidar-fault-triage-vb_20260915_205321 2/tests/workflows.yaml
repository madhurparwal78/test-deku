- id: engineer_confirms_the_top_fault_and_the_owner_is_emailed
  purpose: An engineer claims and confirms the most severe fault, the fault leaves the queue and the site owner receives one email
  substeps:
    - kind: browser
      do: Open the app and sign in at /login as the engineer with the credentials written to /app/USER_README.md
      cov: C-CF-01, C-DC-07 (earned: signing in with the documented credentials proves the file carries them), C-DM-02 (earned: the seeded accounts are read from /app/USER_README.md to sign in)
    - kind: browser
      do: Open the queue, open the seeded crack at Harrow Ridge Wind Farm at the top, claim it, confirm it and send the email to the owner
      cov: C-UF-05, C-DM-11 (earned: the seeded crack at Harrow Ridge Wind Farm is the first of the three seeded open faults)
    - kind: browser
      do: Open /console and find the overview count of confirmed faults for wind turbines raised by one per asset class
      cov: C-CF-44
    - kind: pytest
      test: test_output.py::test_confirmed_fault_is_stored_confirmed_with_a_history_entry_and_leaves_the_queue
      critical: true
      category: core_outcome
      weight: 5
      cov: C-OV-03
    - kind: pytest
      test: test_output.py::test_confirmed_fault_sends_one_email_to_the_site_owner
      critical: true
      category: notification
      weight: 5
      cov: C-OV-02
    - kind: pytest
      test: test_output.py::test_confirmation_email_subject_begins_with_confirmed_fault_at_the_site_name
      category: notification
      weight: 3
      cov: C-CF-40

- id: concurrent_claims_on_one_fault_admit_exactly_one_claimant
  purpose: Simultaneous claims produce one claimant, one refusal naming the holder, one claimed history entry
  substeps:
