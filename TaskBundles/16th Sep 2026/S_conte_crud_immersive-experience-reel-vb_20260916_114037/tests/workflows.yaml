      critical: true
      category: security
      weight: 5
      cov: "C-RL-02, C-RL-03, C-RL-04 (earned: the visitor's GET /api/me and GET /api/accounts both answer 401), C-DC-12 (earned: each refusal is a 401 client error), C-TR-12 (earned: the refusals are read as 401 unauthenticated or 403 forbidden)"
