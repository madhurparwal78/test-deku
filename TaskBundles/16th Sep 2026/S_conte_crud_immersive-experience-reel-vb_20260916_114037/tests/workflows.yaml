- id: entry_scene_reads_as_text_and_keys
  purpose: "A visitor arrives at the entry scene, reads every word as text and enters the reel by key and by button"
  substeps:
    - kind: browser
      do: "Open / and wait for the loading field to finish; confirm the question What are you looking for? sits above five links reading -> games, -> multiplayer, -> XR / VR / AI, -> installations and -> websites, that a SCROLL DOWN button sits above the question, and that the entry carries no menu and no footer"
      cov: "C-CF-18, C-CF-16, C-OV-01 (earned: the visitor reaches /work from the entry state without a document load)"
    - kind: browser
      do: "On /, click the -> games link and confirm the address becomes /work?category=games, the reel lists only games projects, and the intent links collapse to -> games plus a control that clears the category"
      cov: "C-CF-17, C-CF-15"
    - kind: browser
      do: "Open /work and confirm the projects are listed one row each in a single column, each row showing a title above a metadata line such as 2014 / Nimbus / installation, and that sorting is offered as three capsules reading recent, oldest and title with no dropdown select anywhere on the page"
      cov: "C-CF-20, C-CF-43, C-CN-02 (earned: the reel page is read for a dropdown select), C-CF-21"
    - kind: browser
      do: "On /work, click the Rally row; confirm the address becomes /work/rally with the metadata line 2014 / Nimbus / installation, then click <- Close and confirm the address returns to /work"
      cov: "C-CF-51, C-UF-08"
    - kind: browser
      do: "On /, press the Toggle Audio button and confirm the button text changes from Toggle Audio OFF to Toggle Audio ON; then press the Next track control in the ticker and confirm the ticker names a different track in the form title--Halcyon Works"
      cov: "C-CF-85"
    - kind: pytest
      test: test_output.py::test_health_route_answers_ready
      category: presentation
      weight: 1
      cov: "C-TR-01, C-DC-03, C-DC-01 (earned: the health route answers at APP_PUBLIC_URL), C-DC-02 (earned: the health route answers under /api on the app origin), C-DC-04 (earned: the verifier reaches the app from outside its container), C-DC-05 (earned: the app still answers after the agent session ended)"
    - kind: pytest
      test: test_output.py::test_entry_state_offers_five_intent_links_as_text
      critical: true
      category: core_outcome
      weight: 5
      cov: "C-CF-13, C-CF-14, C-CF-15, C-CF-09 (earned: the question and the intent labels are read from the document text), C-FE-01 (earned: WORK and CONTACT are read as the chrome capsule's text)"
    - kind: pytest
      test: test_output.py::test_scroll_down_button_and_arrow_key_enter_the_reel
      critical: true
      category: business_rule
      weight: 5
      cov: "C-CF-03, C-CF-06, C-CF-01 (earned: a marker set before the state change survives it, so the document never reloaded), C-CF-12 (earned: an assertive live region names the reel state after entering it), C-OV-01 (earned: the visitor reaches /work from the entry state without a document load)"
    - kind: pytest
      test: test_output.py::test_interface_text_follows_the_exact_type_scale
      critical: true
      category: presentation
      weight: 5
      cov: "C-UX-05"
    - kind: pytest
      test: test_output.py::test_tab_never_advances_the_scene
      category: business_rule
      weight: 3
      cov: "C-CF-05"
    - kind: pytest
      test: test_output.py::test_document_never_scrolls_on_public_routes
      category: presentation
      weight: 1
      cov: "C-CF-02"
    - kind: pytest
      test: test_output.py::test_audio_starts_off_and_the_setting_survives_a_reload
      category: presentation
      weight: 1
      cov: "C-CF-81 (earned: the first control in document order reads Toggle Audio), C-CF-82 (earned: the toggle reads OFF on the first visit before any press), C-CF-83"
    - kind: pytest
      test: test_output.py::test_ticker_names_the_track_with_two_hyphens
      category: presentation
      weight: 1
      cov: "C-CF-84, C-FE-03"

- id: scene_without_render_context_stays_usable
  purpose: "A machine with no render context, a phone and a cold project address all still reach the whole site, and nothing is fetched from another origin"
  substeps:
    - kind: browser
      do: "Open /contact and confirm the page shows the heading Contact, the studio address hello@example.com, three social marks, an enquiry form and the ASK ME ANYTHING... assistant input, with a line saying the form is for somebody who wants a record of what they sent and the assistant is for somebody who wants an answer now"
      cov: "C-CF-60, C-CF-59"
    - kind: browser
      do: "On /contact type Are you a person, and what is your email address? into the ASK ME ANYTHING... input and submit; confirm an answer appears in a panel in plain words that does not claim to be a person and does not ask for an email address, then press Escape and confirm the panel closes"
      cov: "C-CF-74, C-CF-75, C-CF-68"
    - kind: pytest
      test: test_output.py::test_missing_render_context_keeps_every_word_usable
      critical: true
      category: business_rule
      weight: 5
      cov: "C-CF-10, C-CF-11, C-UF-13"
    - kind: pytest
      test: test_output.py::test_public_pages_fetch_nothing_from_another_origin
      critical: true
      category: business_rule
      weight: 5
      cov: "C-CN-01, C-OV-05 (earned: no request leaves the app origin, so no third-party analytics script loads), C-OV-04 (earned: no image or media request is made while the public pages load), C-FE-10 (earned: no image request is made while the public pages load)"
    - kind: pytest
      test: test_output.py::test_phone_width_never_scrolls_sideways
      category: presentation
      weight: 1
      cov: "C-UX-09, C-UX-08 (earned: the Next track control is hidden on the project view at phone width)"
    - kind: pytest
      test: test_output.py::test_project_address_opens_cold_and_escape_returns_to_the_reel
      critical: true
      category: business_rule
      weight: 5
      cov: "C-CF-07, C-CF-04, C-CF-08, C-CF-46 (earned: the title, metadata line, description, Project Link and Close control are read on the project), C-CF-49 (earned: the Rally metadata line is read on the project view), C-CF-67 (earned: the ASK ME ANYTHING... placeholder is read on the project view), C-UF-08"

