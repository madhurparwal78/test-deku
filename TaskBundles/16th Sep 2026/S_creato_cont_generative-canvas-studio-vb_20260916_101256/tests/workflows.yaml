- id: visitor_plays_the_replay_then_generates_a_first_asset
  purpose: "A visitor plays the advertising graph, edits a node, signs up into that graph and generates a first output"
  substeps:
    - kind: browser
      do: "Open the home page, press E-commerce then Advertising among the switching verticals and observe the outgoing graph cross-fade with the wire pulses running on, observe the transport offering Play, Pause, Step forward, Step back plus a scrub track, then press Step forward until the readout reads Rank 5 of 5"
