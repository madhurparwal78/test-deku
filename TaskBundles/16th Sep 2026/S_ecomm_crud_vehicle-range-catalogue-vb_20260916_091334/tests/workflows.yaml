- id: app_is_reachable_and_healthy
  purpose: The deployed app answers on its public address and reports ready
  substeps:
    - kind: browser
      do: Open the app's public address and confirm the home route renders rather than an error page
    - kind: pytest
      test: test_output.py::test_health_endpoint_reports_ready
      critical: true
      category: core_outcome
      weight: 5
      cov: C-TR-07
    - kind: pytest
      test: test_output.py::test_seeded_range_holds_six_families_and_ninety_two_variants
      critical: true
      category: data_integrity
      weight: 5
      cov: C-CF-02

    - kind: browser
      do: "Drive the running product and confirm that the app is reachable at `APP_PUBLIC_URL`"
      cov: C-DC-01
    - kind: browser
      do: "Drive the running product and confirm that the port mapping is `APP_PUBLIC_PORT` to the container-internal `4173`"
      cov: C-DC-02
    - kind: browser
      do: "Drive the running product and confirm that the HTTP API is served on the same origin under `/api`"
      cov: C-DC-03
    - kind: browser
      do: "Drive the running product and confirm that the app starts from the environment image with no manual steps"
      cov: C-DC-04
    - kind: browser
      do: "Drive the running product and confirm that credentials are written to `/app/USER_README.md`"
      cov: C-DC-05
    - kind: browser
      do: "Drive the running product and confirm that reserved `.browser_screenshots/`, `.downloads/` directories exist at the app root, empty"
      cov: C-DC-06
    - kind: browser
      do: "Drive the running product and confirm that A production build is served, never a dev server"
      cov: C-DC-07
    - kind: browser
      do: "Drive the running product and confirm that the server keeps running after the session ends, is not a child of the shell"
      cov: C-DC-08
    - kind: browser
      do: "Drive the running product and confirm that the server binds `0.0.0.0` rather than loopback"
      cov: C-DC-09
    - kind: browser
      do: "Drive the running product and confirm that no persistent volumes, no fixed container names, no custom networks"
      cov: C-DC-10
    - kind: browser
      do: "Drive the running product and confirm that list endpoints return a top-level JSON array"
      cov: C-DC-11
    - kind: browser
      do: "Drive the running product and confirm that an invalid or unauthorized call is rejected as a client error, never a server error, never a silent success"
      cov: C-DC-12
    - kind: browser
      do: "Drive the running product and confirm that the graded endpoints are those listed in the API shapes table"
      cov: C-DC-16
    - kind: browser
      do: "Drive the running product and confirm that all timestamps are UTC"
      cov: C-DM-02 (earned: the step reads the stored timestamps back and confirms the zone)
    - kind: browser
      do: "Drive the running product and confirm that A promotion stores a `row_key` of `highlight` or `discover`"
      cov: C-DM-07
    - kind: browser
      do: "Drive the running product and confirm that the highlight consumption disclaimer is a field on the row rather than on any card"
      cov: C-DM-08
    - kind: browser
      do: "Drive the running product and confirm that an owner email is unique, case-insensitive"
      cov: C-DM-09
    - kind: browser
      do: "Drive the running product and confirm that markets cover all seven regions, `international-en` is marked the default locale"
      cov: C-DM-15
    - kind: browser
      do: "Drive the running product and confirm that six promotions are seeded, three in each row"
      cov: C-DM-16
    - kind: browser
      do: "Drive the running product and confirm that the password `deku-demo-pw-2026` works at login, is written into `/app/USER_README.md`"
      cov: C-DM-18
    - kind: browser
      do: "Drive the running product and confirm that the product is a public marketing, range-browsing site for one car maker"
      cov: C-OV-01
    - kind: browser
      do: "Drive the running product and confirm that A family is the unit the home route presents; a variant is the unit the overview lists"
      cov: C-OV-02
    - kind: browser
      do: "Drive the running product and confirm that the product sells nothing: no cart, no price, no checkout anywhere in the product"
      cov: C-OV-03
    - kind: browser
      do: "Drive the running product and confirm that the one thing an anonymous visitor accumulates is a comparison set"
      cov: C-OV-04
    - kind: browser
      do: "Drive the running product and confirm that the one thing an account adds is saving a comparison set under a name"
      cov: C-OV-05
