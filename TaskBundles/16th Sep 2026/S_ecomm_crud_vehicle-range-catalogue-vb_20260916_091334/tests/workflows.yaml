    - kind: browser
      do: Confirm no sort control exists anywhere on the route
      cov: C-CF-25
    - kind: browser
      do: Tick variants until the comparison cap is reached and confirm the remaining boxes are disabled rather than hidden
      cov: C-CF-59
    - kind: pytest
      test: test_output.py::test_overview_offers_no_sort_control
      category: business_rule
      weight: 3
      cov: C-CF-26 (earned: the assertion that no control reorders the results is what leaves the stored house order in force)
    - kind: browser
      do: "Drive the running product and confirm that the site ships one language, one market-neutral international locale"
      cov: C-CN-01
    - kind: browser
      do: "Drive the running product and confirm that no profile, no preferences, no password reset, no email of any kind"
