schema_version = "1.4"

[task]
name = "deku/vehicle-range-catalogue-vb"
version = "1.0.0"
description = "Public vehicle range catalogue whose facet counts are derived against the other facets only, with a query-string comparison set and per-owner saved comparisons"
authors = [
  "kaustubh.dalvi@ethara.ai",
  "khushi.tyagi@ethara.ai"
]
uuid_v5 = "94daec53-9d61-5904-861f-1e77f29ca059"
keywords = ["greenfield", "solo_founder", "python", "postgres", "catalogue", "facets"]

[metadata]
category     = "Greenfield"
sub_category = "solo_founder"
domain          = "ecommerce-retail"
pattern         = "crud-catalog"
service_profile = "P1-db"
variant_axes    = ["spec_sections", "critical_depth", "data_shape"]
capability_flags = "aesthetic"
task_code       = "S_ecomm_crud_vehicle-range-catalogue-vb_20260916_091334"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "colour_contrast,cookie_choice,privacy_page,security_headers,sitemap_robots"
grader_version  = "0.22.0"
language     = "python"
archetype    = "vehicle-range-catalogue"
variant      = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 200
tokens_expected = 5000000
contributor_id  = "khushi.tyagi@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", DEKU_SERVICE_BACKEND = "postgres" }

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"

[delivery.images]
main = "node:20-bookworm-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0"
postgres = "postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412"

[[artifacts]]
source      = "/app"
destination = "app"
