- id: app_is_reachable_and_titled
  purpose: The deployed app answers its health route from outside the container, serves a production build that outlives the session, and carries the whole fixture after an idempotent seed
  substeps:
    - kind: browser
      do: Open the app at APP_PUBLIC_URL in a browser with no install step, confirm the home document renders, and confirm the production build serves on the container-internal port bound to every address rather than to loopback. Confirm the app started from the environment image with no manual step
      cov: C-DC-06, C-OV-01
    - kind: browser
      do: Confirm the server runs detached so it outlives the build session, then confirm the credentials file at the app root names both seeded addresses with the seeded password and that both reserved directories exist empty
      cov: C-DC-10
    - kind: browser
      do: Confirm the app declares no edge function, no persistent volume, no fixed container name and no custom network, starts no copy of PostgreSQL or the mail provider, introduces no second database, cache, queue, object store, identity provider or mail vendor, and reaches each backing service at its environment variable
      cov: C-DC-12, C-DC-13, C-DC-14, C-TR-11, C-TR-12
    - kind: pytest
      test: test_output.py::test_health_route_returns_ok
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_production_bundle_is_served
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_api_is_served_on_the_same_origin_under_api
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_request_logs_reach_stdout
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_reserved_directories_exist_and_are_empty
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_credentials_file_names_both_seeded_accounts
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_rows_persist_in_postgres
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeding_twice_does_not_duplicate_rows
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeded_accounts_carry_their_names_and_roles
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_three_windows_are_seeded_at_their_stated_shapes
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeded_enquiry_is_proposed_with_two_messages
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_exactly_one_studio_account_exists
      category: notification
      weight: 3
    - kind: pytest
      test: test_output.py::test_studio_recovery_and_notification_addresses_are_distinct
      category: presentation
      weight: 1

