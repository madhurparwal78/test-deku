- id: visitor_reads_the_home_document
  purpose: The home document renders the hero, the about section and the selected-work preview on alternating grounds under the fixed chrome
  substeps:
    - kind: browser
      do: Open the home document and confirm it carries the hero, then the about section, then the selected-work preview, in that order. Confirm the first screen renders before the display faces arrive, carrying the stroked eyebrow, the filled name beneath it, the location line with its three-segment drawn bar, and the slowly fading scroll prompt last of all
      cov: C-CF-13, C-TR-26, C-UF-01
    - kind: browser
      do: Press Home and About and confirm each updates the fragment without loading a new page, then press Work and Contact and confirm each updates the path. Reload directly on the About fragment and confirm the document scrolls to that section rather than landing at the top
      cov: C-CF-18, C-CF-19
    - kind: browser
      do: Read the sound control in the chrome, confirm it states its own current state, confirm sound is off by default, and confirm no confirmation or error anywhere is carried by sound alone
      cov: C-CF-21, C-CN-04, C-UX-58
    - kind: browser
      do: Scroll to the about section and confirm the pale sheet slides up over the dark hero, the statement reveals word by word, the figure and its label sit beside it, the three services follow, and the project media below the first screen loads only as the document reaches it
      cov: C-FE-23, C-TR-27
    - kind: browser
      do: Reach the horizontally scrolling tool band, confirm each mark carries an accessible name, confirm the band is hidden from assistive technology as a group, and confirm it stops auto-scrolling while it is being touched
      cov: C-FE-24, C-UX-62
    - kind: pytest
      test: test_output.py::test_services_list_is_array
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_social_links_are_seeded_in_order
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_meta_endpoint_returns_stored_version_and_local_time
      category: presentation
      weight: 1

- id: visitor_reads_the_work_index
  purpose: The nine projects appear as rules and rows on the home page and as staggered pills on the work route, from one record set
  substeps:
    - kind: browser
      do: Open the work route and confirm the fixed chrome survives the route change without a full page load, the nine projects render as staggered title and description pills, and the route label rises into place
      cov: C-CF-14, C-TR-02, C-UF-02
    - kind: browser
      do: Read the work index count and confirm it states the number of published projects
      cov: C-CF-26
    - kind: browser
