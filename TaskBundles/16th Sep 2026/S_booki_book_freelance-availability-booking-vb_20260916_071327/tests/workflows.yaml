      cov: C-CF-166
    - kind: browser
      do: Unpublish every project and confirm the index reads its own empty-state line rather than collapsing, then confirm a loading index shows a quiet placeholder in place rather than jumping when the content arrives
      cov: C-UF-27, C-UF-31
    - kind: browser
      do: Break the projects read and confirm the index states that it did not load, offers a retry control, and shows neither a blank screen nor an unhandled error
      cov: C-UF-32, C-UF-37
    - kind: pytest
      test: test_output.py::test_projects_list_is_array_in_position_order
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_project_slug_resolves_and_unknown_slug_is_not_found
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_work_trailing_slash_redirects_permanently
      category: security
      weight: 5

