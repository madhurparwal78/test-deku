      cov: C-CF-49
    - kind: browser
      do: On the contact page, which serves the six-field enquiry form, fill the six numbered fields in order and confirm each is a label over an underlined input. Confirm the form accepts no attachment on any surface and offers no file upload, and confirm a visitor with no account is walked from the open window through the six fields to a submitted enquiry with no registration step
