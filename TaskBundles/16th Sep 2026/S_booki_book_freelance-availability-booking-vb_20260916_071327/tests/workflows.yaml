      do: Type into a field and confirm validation never runs on a keystroke, then leave the field empty and move away, confirming validation runs on blur and the message appears only once focus has left
      cov: C-CF-81
    - kind: browser
      do: Return to the failed field and confirm it revalidates on each keystroke until it passes, then leave it valid and confirm the message goes
      cov: C-CF-82
    - kind: browser
      do: Fill five fields correctly, fail the sixth, submit, and confirm the five answers are still exactly as typed
    - kind: browser
      do: Break the submit endpoint, submit, and confirm a band appears directly above the control that failed and stays until it is dismissed or the action is retried
      cov: C-CF-152
