- id: responsive_and_accessibility
  purpose: The product reflows across four breakpoints and stays operable from the keyboard and from assistive technology
  substeps:
    - kind: browser
      do: Narrow the viewport below the mid switch and confirm the navigation folds to a burger, the lockup drops to the monogram at the smallest width, the hero name and the statement each step down two sizes, nothing overflows sideways, every navigation target stays reachable, and every control is a comfortable fingertip target
      cov: C-UX-50, C-UX-51, C-UX-55, C-UX-61
    - kind: browser
      do: At the same width confirm the work index loses its stagger and stacks in one left-aligned column in date order, the project view becomes a panel rather than a modal, the fixed rail is hidden, the contact form goes to one column, and the media treatment is tied to entering the frame rather than to hover
      cov: C-UX-52, C-UX-53, C-UX-54, C-UX-60
    - kind: browser
      do: Run a contrast check over the body text and the placeholders, then confirm the per-word statement and the per-character work headline are hidden from assistive technology as split elements with the original string present once in reading order and still selectable
      cov: C-UX-39, C-UX-63, C-UX-67
    - kind: browser
      do: Tab through every route and confirm focus is visible everywhere and never removed, every icon-only control carries a name, the sound control's accessible name states the action rather than the state, and no state, confirmation or error is carried by sound alone
      cov: C-CF-22, C-CF-23, C-UX-68, C-UX-69
    - kind: pytest
      test: test_output.py::test_built_stylesheet_declares_four_breakpoints
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_app_stays_responsive_at_the_stated_bar
      category: business_rule
      weight: 3
