schema_version = "1.4"

[task]
name = "deku/edge-platform-showcase-vb"
version = "1.0.0"
description = "The marketing and product-showcase site of one global edge cloud platform: a visitor opens four product menus holding thirty-two named services, reads the network story beside a turning globe, watches five live statistics count up to their measured values, reads eight capability modules that each state their outcome in words, and creates a free trial account from the signup form; behind the sign-in boundary an author writes an article on a table-first desk, attaches a cover image whose bytes live only in the object store under a pinned key scheme, holds the article back as a draft that no other reader can reach by slug, by identifier or by its cover, and publishes it or puts it behind a members wall that shows its opening to a visitor and its body only to somebody signed in"
authors = ["utsav.jain@ethara.ai", "anuj.soni@ethara.ai"]
uuid_v5 = "d51c5036-9843-5c00-8a2c-553cb8501282"
keywords = ["greenfield", "solo_founder", "python", "postgres", "minio", "edge-cloud", "product-marketing"]

[metadata]
category        = "Greenfield"
sub_category    = "solo_founder"
domain          = "saas-micro-tools"
pattern         = "content-publishing"
service_profile = "P4-db-storage"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = "aesthetic"
task_code       = "S_saasm_cont_edge-platform-showcase-vb_20260916_061858"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "cookie_choice,custom_404,mobile_viewport,no_broken_links,single_cta"
grader_version  = "0.22.0"

language     = "python"
archetype    = "edge-platform-showcase"
variant      = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 150
tokens_expected = 5200000
contributor_id  = "anuj.soni@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true

difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"
storage = "minio"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
network_mode      = "public"
allowed_hosts     = []
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0

env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-deku}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-minioadmin}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-minio-root-3d81f7a2}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0

env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-deku}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-minioadmin}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-minio-root-3d81f7a2}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_STORAGE = "minio" }

[delivery]
format         = "harbor"
schema_version = "1.4"
reward_path    = "/logs/verifier/reward.json"
reward_key     = "reward"
reward_range   = [0.0, 1.0]
reward_full    = 1.0
network_policy = "public"

[[artifacts]]
source      = "/app"
destination = "app"
