schema_version = "1.4"

[task]
name = "deku/multiplayer-canvas-workspace-vb"
version = "1.0.0"
description = "An organization-wide design workspace whose branch reviews bind an approval to a version, refuse a merge once a later push voids it, and record every transition in an append-only audit stream"
authors = [
  "kaustubh.dalvi@ethara.ai",
  "ananya.tandon.int43@ethara.ai"
]
uuid_v5 = "0888dd3f-8d00-5afa-a1ef-4ecc299814db"
keywords = ["greenfield", "enterprise", "python", "postgres", "keycloak", "mailpit", "design-workspace"]

[metadata]
category     = "Greenfield"
sub_category = "enterprise"
domain          = "it-devtools"
pattern         = "approval-workflow"
service_profile = "P6-db-auth-email"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = ""
task_code       = "E_itdev_appr_multiplayer-canvas-workspace-vb_20260916_070512"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "custom_404,no_broken_links,single_cta,sitemap_robots,spam_protection"
grader_version  = "0.22.0"
language     = "python"
archetype    = "multiplayer-canvas-workspace"
variant      = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 200
tokens_expected = 8000000
contributor_id  = "ananya.tandon.int43@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"
auth    = "keycloak"
email   = "mailpit"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", AUTH_URL = "${AUTH_URL:-http://keycloak:8080}", SMTP_HOST = "${SMTP_HOST:-mailpit}", SMTP_PORT = "${SMTP_PORT:-1025}", SMTP_USER = "${SMTP_USER:-}", SMTP_PASS = "${SMTP_PASS:-}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", AUTH_ADMIN_TOKEN = "${AUTH_ADMIN_TOKEN:-deku_admin:deku-local-dev}", EMAIL_INBOX_API_URL = "${EMAIL_INBOX_API_URL:-http://mailpit:8025}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_AUTH = "keycloak", DEKU_SERVICE_EMAIL = "mailpit" }

[[artifacts]]
source      = "/app"
destination = "app"
