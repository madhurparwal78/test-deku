      test: test_output.py::test_repeat_merge_creates_no_second_merge_version
      category: data_integrity
      weight: 5
      cov: C-CF-52
    - kind: pytest
      test: test_output.py::test_branch_withdrawal_is_stored
      category: business_rule
      weight: 3
      cov: C-CF-53

- id: two_members_in_one_file_see_each_other
  purpose: Presence lists the other member with a stable colour and is persisted nowhere
  substeps:
    - kind: pytest
      test: test_output.py::test_presence_lists_the_other_member_with_a_stable_colour
      category: business_rule
      weight: 3
      cov: C-CF-19, C-CF-20, C-CF-21, C-CF-22, C-CF-81
