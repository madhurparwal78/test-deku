      category: security
      weight: 5
      cov: C-CF-102
    - kind: pytest
      test: test_output.py::test_repeated_submissions_are_refused_after_the_third_from_one_address
      category: validation
      weight: 3
      cov: C-CF-105 (earned: the fourth submission from one address inside the hour is the limit this step drives past)

- id: concurrent_entry_writes_accept_at_most_one
