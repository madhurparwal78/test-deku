- id: the_environment_answers_before_anything_is_signed_in
  purpose: The app is reachable and healthy, carries its security headers, declares its own preview on every public destination, and records each public view for the owner
  substeps:
    - kind: pytest
      test: test_output.py::test_health_route_answers_two_hundred_without_credentials
      category: presentation
      weight: 1
      cov: C-DC-04
    - kind: pytest
      test: test_output.py::test_security_headers_are_present_on_every_response
      critical: true
      category: security
      weight: 5
      cov: C-TR-22 (earned: the strict transport policy is one of the four headers this step reads off the response)
    - kind: pytest
      test: test_output.py::test_public_routes_declare_distinct_titles_and_preview_images
      category: presentation
      weight: 1
      cov: C-TR-28
    - kind: browser
      do: Open / and confirm body text and every half-strength secondary line meet the stated contrast bar against the near-black ground
      cov: C-UX-18
    - kind: browser
      do: Press tab repeatedly from a fresh load of / and confirm the focus order runs skip link, destination region, the five destinations, then the destination controls, with a visible ring on every stop
      cov: C-UX-24
    - kind: pytest
      test: test_output.py::test_page_view_log_carries_no_network_address
      critical: true
      category: security
      weight: 5
      cov: C-CF-130
    - kind: browser
      do: Sign in as owner@example.com, open /studio/log and confirm the most recent rows name the routes just visited
      cov: C-CF-129 (earned: the log read is the newest-first page-view listing this step opens)
