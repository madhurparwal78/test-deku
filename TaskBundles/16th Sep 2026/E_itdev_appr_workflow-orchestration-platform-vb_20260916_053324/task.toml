keywords = ["greenfield", "enterprise", "python", "postgres", "keycloak", "approval-workflow"]

[metadata]
category     = "Greenfield"
sub_category = "enterprise"

domain          = "it-devtools"
pattern         = "approval-workflow"
service_profile = "P3-db-auth"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = ""
task_code       = "E_itdev_appr_workflow-orchestration-platform-vb_20260916_053324"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "favicon,form_validation,meta_tags,single_cta,spam_protection"
grader_version  = "0.22.0"

language     = "python"
archetype    = "workflow-orchestration-platform"
variant      = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 210
