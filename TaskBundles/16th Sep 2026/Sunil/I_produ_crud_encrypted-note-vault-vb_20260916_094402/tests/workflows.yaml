      do: "Sign in as user@example.com, open the files page and read the file lease-scan.pdf listed with its sealed size beside the storage figure, attached to Passport renewal"
      cov: C-CF-98 C-DM-13
    - kind: pytest
      test: test_output.py::test_uploaded_chunks_are_stored_under_the_vault_key_scheme
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_upload_missing_a_chunk_cannot_complete
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_storage_usage_counts_sealed_chunk_bytes
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_other_account_cannot_download_file_chunk
      category: security
      weight: 5

