- id: writer_seals_note_and_reads_it_after_signing_in_again
  purpose: A new writer creates an account, writes a note, signs out and signs in again to find the note intact, while nothing readable reaches the server
  substeps:
    - kind: browser
      do: "Open /signup, read the signup form stating Nobody can recover your notes if you forget this password, fill Email, Password and Confirm password, choose the Create account button, land on an empty note list saying there are no notes yet with New note offered, open the new note route with its Note type chooser, Title field and Note body editor, choose Create note to save and open the note Harbour lights, then wait for the status line All changes saved"
      cov: C-CF-17 C-CF-66 C-CF-67 C-CF-68 C-UF-3 C-UF-5
    - kind: pytest
      test: test_output.py::test_note_written_in_browser_leaves_no_plaintext_on_server
      critical: true
      category: core_outcome
      weight: 5
    - kind: browser
      do: "Choose Sign out in the settings menu to end the session and return to /sign-in, sign in again with the same account and open the note Harbour lights to read the same words written before"
      cov: C-CF-70 C-UF-6
    - kind: pytest
      test: test_output.py::test_note_reopens_intact_in_a_fresh_browser
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_sign_in_and_signup_requests_never_carry_the_password
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_same_words_saved_twice_produce_different_envelopes
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_undecryptable_item_is_named_never_shown_empty
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_item_table_has_no_readable_content_columns
      category: data_integrity
      weight: 5

- id: foreign_account_access_denied
  purpose: One account can never read, list or overwrite the items of another account
  substeps:
    - kind: browser
      do: "While signed out open /notes as an unauthenticated request and land on /sign-in, whose sign-in form carries Email, Password and a Sign in button, then sign in as user2@example.com and read the seeded note Surprise party plan in the note list"
      cov: C-UF-1 C-UF-2 C-DM-7
    - kind: pytest
      test: test_output.py::test_foreign_account_item_read_is_denied
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_foreign_uuid_write_is_refused_as_uuid_conflict
      category: security
      weight: 5
    - kind: browser
      do: "Sign in as user@example.com and read a note table that shows no sharing of notes between accounts: no Surprise party plan and nothing else from user2@example.com"
      cov: C-OV-5
    - kind: pytest
      test: test_output.py::test_sync_returns_only_the_accounts_own_items
      category: security
      weight: 5

- id: synced_vault_delivers_duplicate_free_pages
  purpose: The owner's vault arrives organised, and sync delivers every item exactly once with per-item refusals
  substeps:
    - kind: browser
      do: "Sign in as user@example.com and read the note table listing the pinned note Grocery run sorted to the top, then open the folder Finance and the folder Taxes nested inside it in the folder tree and open Quarterly taxes"
      cov: C-CF-74 C-CF-79
    - kind: pytest
      test: test_output.py::test_cursor_pages_deliver_every_item_exactly_once
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_replayed_sync_request_changes_nothing
      category: data_integrity
      weight: 5
    - kind: browser
      do: "Type renewal into the Search notes field and watch the note list narrow to Passport renewal as you type, then open the saved view Renewals listing the notes whose title contains renewal"
      cov: C-CF-78 C-CF-84
    - kind: pytest
      test: test_output.py::test_oversized_envelope_is_refused_whole
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_unknown_content_type_is_refused_per_item
      category: validation
      weight: 3
    - kind: browser
      do: "Open the history page of the seeded note Quarterly taxes and read its 3 revisions listed newest first with their times"
      cov: C-CF-85 C-DM-9
    - kind: pytest
      test: test_output.py::test_item_version_only_increases
      category: data_integrity
      weight: 5
    - kind: browser
      do: "Open the protected note Passport renewal, read This note is protected shown until the account password is entered again, enter the password and read the note, then open the archive page and find the archived note Router notes listed"
      cov: C-CF-80 C-CF-81 C-DM-14

- id: stale_edit_conflict_keeps_both_versions
  purpose: Two edits of one note both survive: the server refuses the stale write and the app keeps a conflicted copy beside the original
  substeps:
    - kind: browser
      do: "In the note table find the seeded note Packing list with its conflicted copy sorted directly beside the original note, labelled Conflicted copy with the device Kitchen tablet that made the copy"
      cov: C-CF-55 C-CF-56 C-DM-10
    - kind: pytest
      test: test_output.py::test_stale_version_write_returns_conflict_and_keeps_stored_item
      critical: true
      category: data_integrity
      weight: 5
    - kind: browser
      do: "Open the Conflicted copy of Packing list and use its side-by-side comparison with the original note"
      cov: C-CF-57

- id: emptied_trash_note_stays_deleted
  purpose: Emptying the trash writes a tombstone that reaches returning devices and cannot be undone by an older copy
  substeps:
    - kind: browser
      do: "Open the trash and find the trashed note Old wifi password offered to be restored from the trash"
      cov: C-CF-64
    - kind: pytest
      test: test_output.py::test_tombstone_syncs_to_a_device_holding_an_old_cursor
      critical: true
      category: data_integrity
      weight: 5
    - kind: browser
      do: "Empty the trash and confirm, then find the trashed note Old wifi password removed from every list: the note table, the archive and the trash"
      cov: C-CF-65
    - kind: pytest
      test: test_output.py::test_stale_upload_cannot_resurrect_a_tombstone
      category: data_integrity
      weight: 5

- id: password_change_sessions_and_lock_protect_the_vault
  purpose: A password change ends other sessions and rewrites no note, a reused refresh token ends its session, the lock clears the page and search stays on the device
  substeps:
    - kind: browser
      do: "Open the sessions page and read every session listed with its device, its start time and its last use, with the current session marked"
      cov: C-CF-29 C-CF-30
    - kind: pytest
      test: test_output.py::test_password_change_ends_every_other_session
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_password_change_rewrites_no_note
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_reused_refresh_token_ends_the_session
      category: security
      weight: 5
    - kind: browser
      do: "Turn on the lock with a passcode, choose Lock now in the sidebar to lock the app and land on /locked, then enter the passcode on the locked page and choose Unlock to return to the notes"
      cov: C-CF-111 C-CF-113
    - kind: pytest
      test: test_output.py::test_locked_app_holds_no_note_words_in_page
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_search_query_never_leaves_the_browser
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_account_deletion_removes_items_and_frees_identifier
      category: data_integrity
      weight: 5

- id: unknown_account_sign_in_is_denied_identically
  purpose: Sign-in never reveals whether an account exists, offers no reset, and signup refuses invalid input
  substeps:
    - kind: browser
      do: "Open the sign-in page, find the link Start over with an empty vault and follow it to open /start-over"
      cov: C-CF-13
    - kind: pytest
      test: test_output.py::test_wrong_secret_and_unknown_identifier_are_refused_identically
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_unknown_identifier_receives_stable_synthetic_key_params
      category: security
      weight: 5
    - kind: browser
      do: "On the start-over page read the export file saved earlier and the device still signed in listed as ways back to the notes, and see the start-over button stay unavailable until delete my notes forever is typed"
      cov: C-CF-14 C-CF-15 C-CF-16
    - kind: pytest
      test: test_output.py::test_sign_in_offers_start_over_and_no_password_reset
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_duplicate_identifier_signup_is_refused
      category: validation
      weight: 3
    - kind: browser
      do: "On the signup form submit a password shorter than 12 characters and read the refusal beside the password field"
      cov: C-CF-18
    - kind: pytest
      test: test_output.py::test_signup_form_names_invalid_field_and_creates_nothing
      category: validation
      weight: 3

- id: file_chunks_land_sealed_in_storage
  purpose: An attached file is stored as sealed chunks in the object store, counted in sealed bytes and served only to its owner
  substeps:
