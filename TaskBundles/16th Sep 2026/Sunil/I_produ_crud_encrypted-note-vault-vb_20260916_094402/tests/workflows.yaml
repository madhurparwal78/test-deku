      critical: true
      category: data_integrity
      weight: 5
    - kind: browser
      do: "Open the folder Legal and the folder Contracts made while paid, open the paid type note Loan agreement to read and edit it after the lapse, then open the Authenticator note Bank login codes and see it keep working"
      cov: C-CF-76 C-CF-105 C-CF-106
    - kind: pytest
      test: test_output.py::test_expired_account_new_upload_is_refused
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_expired_account_keeps_its_revisions
      category: data_integrity
      weight: 5
    - kind: browser
      do: "Try to nest a new folder inside Legal and read that new nesting needs a paid plan for a person on Leaf"
      cov: C-CF-75
    - kind: pytest
      test: test_output.py::test_leaf_account_revision_sync_is_refused_as_plan_limit
      category: business_rule
      weight: 3

