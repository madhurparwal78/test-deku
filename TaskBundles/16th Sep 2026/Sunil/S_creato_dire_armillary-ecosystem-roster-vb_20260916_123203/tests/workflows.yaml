      do: On the Creator Media roster grid read that each card shows the portrait, the name, the division line in the division colour and discipline pills, that the grid runs three columns with the middle column set lower, and that pointing at a card lifts the card and fades its overlay in
      cov: C-CF-98, C-CF-101, C-CF-102, C-FE-14
    - kind: browser
      do: Open /creator-tech and read the Our tool box block listing Signal Desk, Roster Graph, Brief Engine and Payline, each product with its tagline, an About label, discipline pills and a Visit Site link
      cov: C-CF-97
    - kind: browser
      do: Open the Juno Okafor card and read the creator profile page in order: the portrait across the column, the name set large, the division name Creator Media in its colour, the discipline pills Presenting and Writing, the statement, the link row with each link beside its mark, and the credits one per line; press the division name and read that /roster?division=creator-media opens
      cov: C-CF-99, C-CF-135, C-CF-136, C-CF-137
    - kind: browser
      do: Open /creator/ada-moreau and /creator/nobody-here and read the not-found profile page Not here. with its See the roster link on both addresses, the same for a draft profile as for an unknown slug
      cov: C-CF-140
    - kind: pytest
