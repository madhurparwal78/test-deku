- id: visitor_turns_the_armillary_into_a_division
  purpose: A visitor watches the arrival, turns the armillary with the keyboard and enters a division
  substeps:
    - kind: browser
      do: Open the front door and read the arrival screen: white ground with near-black type, the Halden lettering drawn in three passes, a counter counting from 0 to 100, then the white curtain clipping away to the near-black site with the wordmark, clock, menu control and toggle rising into view
      cov: C-CF-58, C-CF-59, C-FE-23
    - kind: browser
      do: On the front door read the armillary: one object of four concentric rings around a glossy black sphere filling the window; drag the object and read that it turns and settles onto the nearest segment, turn the wheel and read that the acquired division name beside the object changes, then press Next division and Previous division
      cov: C-OV-03, C-CF-68, C-CF-73, C-CF-74, C-CF-75
    - kind: browser
      do: Read the front door contents: the headline The Operating System for the Creator Economy set bottom left, one About Us pill beneath the headline linking to the about page, no picture, no video, no logo wall, no statistic and no newsletter box
      cov: C-CF-66
    - kind: browser
      do: Activate the acquired division name beside the armillary and read that the curtain comes across and lifts onto the division route at its top with no white flash, while the bar and the clock stay in place and never restart
      cov: C-CF-28, C-CF-63, C-CF-64, C-UF-06
    - kind: browser
      do: Press Menu, read that the menu control now reads Close and the menu overlay lists About Us, Creator Media, Creator Communities, Creator Products, Creator Tech and Join Us, each division link with a line in its own colour, point at a link and read the hand-drawn stroke drawing across, then press Escape and read that the menu overlay closes
      cov: C-CF-34, C-CF-35, C-CF-36, C-CF-37, C-CF-38, C-CF-39, C-FE-25
    - kind: browser
      do: Read the clock in the centre of the bar: the cities L.A, LDN and NYC each with a 24-hour time between brackets, cycling through one slot so the bar never changes width
      cov: C-CF-32, C-CF-33, C-FE-06
    - kind: browser
      do: Press Control+K on a division route, read that the command palette dialog named Find opens with one search field and lists the four divisions, The roster, Join us and live creators by name, type mara, move with the arrow keys, press Enter and land on Mara Oyelaran's profile; then open /find and read the front door with the palette already open, and press Escape to close the palette
      cov: C-CF-53, C-CF-54, C-CF-55, C-CF-56, C-CF-57, C-UF-07
    - kind: pytest
      test: test_output.py::test_site_lists_divisions_and_disciplines_in_order
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_headline_reads_as_one_accessible_sentence
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_armillary_keys_step_segments_and_enter_opens_division
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_front_door_fetches_nothing_from_another_origin
      category: business_rule
      weight: 3

- id: visitor_reads_a_division_roster_and_a_profile
  purpose: A visitor reads a division roster in curated order and a live creator profile, and a draft stays unreadable
  substeps:
    - kind: browser
      do: Open /creator-media and read the division route in order: the About us heading with the mission line, the division name Creator Media, the SKETCH MODE control, the proposition The new media empires will start with a person., the kicker PEOPLE ARE THE PLATFORM, the body paragraph revealed, the roster heading The people behind the platform and the roster grid with Juno Okafor first
