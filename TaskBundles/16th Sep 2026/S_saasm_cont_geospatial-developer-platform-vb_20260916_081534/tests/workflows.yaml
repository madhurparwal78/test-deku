- id: developer_signs_up_and_takes_a_token
  purpose: Open sign-up creates an account and issues a scoped token whose secret is shown once
  substeps:
    - kind: browser
      do: Sign up with a fresh address, land in the studio and create a token, copying the secret
    - kind: pytest
      test: test_output.py::test_signup_creates_an_author_account
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_every_seeded_account_signs_in
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_token_secret_is_shown_once_only
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_token_scope_is_enforced
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_revoked_token_is_refused_and_others_keep_working
      category: security
      weight: 5
- id: duplicate_signup_is_refused
  purpose: A second sign-up for an address that already exists is refused
  substeps:
    - kind: pytest
      test: test_output.py::test_duplicate_signup_is_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_login_with_wrong_password_is_denied
      category: security
      weight: 5
- id: upload_lands_in_the_bucket_and_becomes_a_private_tileset
  purpose: A dataset uploads, its bytes land in the object store, and processing yields a private tileset
  substeps:
    - kind: browser
      do: Open the tileset table, open the upload dialogue and send a seeded dataset
    - kind: browser
      do: Drive the running product and confirm that the app renders five data layer toggles on the control rail
      cov: C-CF-31
    - kind: browser
      do: Watch the job move through its states to complete and find the tileset marked private
    - kind: pytest
      test: test_output.py::test_upload_bytes_land_in_the_bucket_at_the_pinned_key
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_upload_job_state_is_observable
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_identical_upload_creates_no_second_object
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_malformed_upload_is_rejected_and_stores_nothing
      category: validation
      weight: 3
- id: private_tileset_cannot_be_read_before_publishing
  purpose: A private tileset answers as not found to everyone but its owner until it is published
  substeps:
    - kind: browser
      do: Ask for the new tileset's tile as the other developer and read a not-found answer
    - kind: pytest
      test: test_output.py::test_private_tileset_is_unreadable_until_published
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_private_tile_is_not_anonymously_readable_in_the_bucket
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_published_tileset_serves_one_stored_result
      category: data_integrity
      weight: 5
