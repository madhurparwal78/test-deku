- id: app_is_reachable_and_healthy
  purpose: The deployed app answers on its public address and reports ready
  substeps:
    - kind: browser
      do: Open the app's public address and confirm the home page renders rather than an error page
    - kind: pytest
      test: test_output.py::test_health_route_is_ready
      critical: true
      category: core_outcome
      weight: 5
- id: visitor_tours_the_live_map
  purpose: A visitor spins the live map and switches its scene, lighting and colour theme with no reload
  substeps:
    - kind: browser
      do: Open the home page, grab the map and spin the globe with a drag
    - kind: browser
      do: Drive the running product and confirm that the app updates the render continuously during a drag
      cov: C-CF-58
    - kind: browser
      do: Drive the running product and confirm that the app sends an expanding ripple out from the position marker
      cov: C-CF-59
    - kind: browser
      do: Drive the running product and confirm that the app draws vector tiles with the graphics hardware
      cov: C-CF-60
    - kind: browser
      do: Drive the running product and confirm that the app extrudes buildings from their footprints under pitch
      cov: C-CF-61
    - kind: browser
      do: Select each named scene in turn and confirm the data changes with the lighting
    - kind: browser
      do: Drive the running product and confirm that the app renders the home map from the real rendering engine
      cov: C-CF-50
    - kind: browser
      do: Drive the running product and confirm that the app lists the scene `Globe View` described as `Rotating 3D globe`
      cov: C-CF-51
    - kind: browser
      do: Drive the running product and confirm that the app offers the colour themes `Default`, `Faded`
      cov: C-CF-54
    - kind: browser
      do: Drive the running product and confirm that the app swaps the active data with the lighting when a scene is selected
      cov: C-CF-55
    - kind: browser
      do: Select each lighting preset and each colour theme and confirm the render changes in place
    - kind: browser
      do: Drive the running product and confirm that the app lists the scene `Data Overlay (2D)` described as `Live seismic event heatmap`
      cov: C-CF-52
    - kind: browser
      do: Drive the running product and confirm that the app offers four lighting presets named `Dawn`, `Day`, `Dusk`, `Night`
      cov: C-CF-53
    - kind: browser
      do: Drive the running product and confirm that the app reloads no page when a lighting preset is selected
      cov: C-CF-56
    - kind: browser
      do: Drive the running product and confirm that the app rotates the globe scene until a reader touches one
      cov: C-CF-57
    - kind: browser
      do: Confirm the engine tilts, extrudes buildings, drapes terrain and composites the live overlay
    - kind: browser
      do: Drive the running product and confirm that the app drapes the styled surface over elevation data
      cov: C-CF-62
    - kind: browser
      do: Drive the running product and confirm that the app composites a live overlay layer over the base each frame
      cov: C-CF-63
    - kind: browser
      do: Drive the running product and confirm that the app resolves label collision every frame
      cov: C-CF-64
    - kind: browser
      do: Drive the running product and confirm that the app falls back to a still rendered image where the graphics context is absent
      cov: C-CF-65
    - kind: browser
      do: Drive the running product and confirm that the app renders no blank canvas when the graphics context is absent
      cov: C-CF-66
    - kind: browser
      do: Remove the graphics context and confirm a still image with an explanation rather than a blank canvas
    - kind: browser
      do: Drive the running product and confirm that the app requests no tile when a style value changes
      cov: C-CF-67
    - kind: browser
      do: Drive the running product and confirm that the app addresses tiles as a quadtree by zoom, column, row
      cov: C-CF-68
    - kind: browser
      do: Drive the running product and confirm that the app clips a vector tile to its bounds with a buffer
      cov: C-CF-69
    - kind: browser
      do: Change a style value and confirm the canvas repaints without any new tile request
    - kind: browser
      do: Drive the running product and confirm that the app produces a tile on demand rather than eagerly
      cov: C-CF-70
    - kind: browser
      do: Drive the running product and confirm that the app drops detail invisible at the requested zoom
      cov: C-CF-71
    - kind: browser
      do: Drive the running product and confirm that the app shows each member's presence to the others
      cov: C-CF-117
    - kind: pytest
      test: test_output.py::test_public_routes_are_served_with_their_pinned_copy
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_marketing_pages_render_without_the_map_client
      category: business_rule
      weight: 3
- id: marketing_chrome_is_complete
  purpose: Every marketing page carries the banner, the navigation, the footer and its accessible names
  substeps:
    - kind: browser
