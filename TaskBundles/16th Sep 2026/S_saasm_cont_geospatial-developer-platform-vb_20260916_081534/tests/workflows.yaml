    - kind: browser
      do: Drive the running product and confirm that the app renders five dropdown menus in the top navigation
      cov: C-CF-18
    - kind: browser
      do: Drive the running product and confirm that the app renders five footer link columns on every marketing page
      cov: C-CF-20
    - kind: browser
      do: Drive the running product and confirm that the app renders four product subgroups in the footer
      cov: C-CF-21
    - kind: browser
      do: Confirm every band renders in the stated order with its pinned copy
    - kind: browser
      do: Drive the running product and confirm that the app renders the home bands in the stated order
      cov: C-CF-24
    - kind: browser
      do: Drive the running product and confirm that the app brings the hero heading in letter by letter as a reader arrives
      cov: C-CF-26
    - kind: browser
      do: Drive the running product and confirm that the app alternates text with visual across the product rails
      cov: C-CF-28
    - kind: browser
      do: Drive the running product and confirm that the app renders three panels on the control rail device visual
      cov: C-CF-30
    - kind: browser
      do: Drive the running product and confirm that the app renders a swipeable carousel of customer story cards
      cov: C-CF-32
    - kind: browser
      do: Drive the running product and confirm that the app glides a strip of placeholder customer marks sideways without stopping
      cov: C-CF-33
    - kind: browser
      do: Drive the running product and confirm that the app renders every non-home marketing page from one shared template
      cov: C-CF-34
    - kind: browser
      do: Drive the running product and confirm that the app renders five product cards on the electric-vehicle page
      cov: C-CF-37
    - kind: browser
      do: Confirm every content image carries alternative text and a decorative image declares itself
    - kind: browser
      do: Drive the running product and confirm that the app carries alternative text on every content image
      cov: C-CF-43
    - kind: browser
      do: Drive the running product and confirm that the app declares a decorative image as decorative
      cov: C-CF-44
    - kind: browser
      do: Drive the running product and confirm that the app carries a text alternative on the map canvas naming the active scene
      cov: C-CF-45
    - kind: pytest
      test: test_output.py::test_security_headers_are_present_on_every_response
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_sitemap_lists_every_public_route
      category: presentation
