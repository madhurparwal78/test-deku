schema_version = "1.4"

[task]
name = "deku/audio-gated-portfolio"
version = "1.0.0"
description = "Audio-gated showcase site for a brand, digital and motion studio, with a filterable project wall, long case studies, a drag-to-explore scene, object-stored posters and a new-business enquiry form"
uuid_v5 = "4aeab979-bb6b-558d-8b9a-076a1c6abe39"
authors = [
    "abhishek.shaw@ethara.ai",
    "nishant.dubey@ethara.ai",
]
keywords = ["greenfield", "solo_founder", "typescript", "postgres", "minio", "portfolio-site", "content-publishing"]

[metadata]
category     = "Greenfield"
sub_category = "solo_founder"
domain          = "content-publishing"
pattern         = "content-publishing"
service_profile = "P4-db-storage"
variant_axes    = []
capability_flags = ""
launch_surface = "favicon,no_broken_links,no_frontend_secrets,security_headers,terms_page"
design_direction = "terminal-mono"
language     = "typescript"
archetype    = "audio-gated-portfolio"
variant      = "a"
difficulty   = ""
task_code    = "S_conte_cont_audio-gated-portfolio_20260916_061712"
naming_scheme = "task-code-v1"
grader_version = "0.22.0"
rubric_version = "1"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 120
tokens_expected = 4500000
contributor_id  = "nishant.dubey@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
calibration_date     = ""
openhands_version    = ""
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"
storage = "minio"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-deku}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-minioadmin}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-minio-root-3d81f7a2}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-deku}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-minioadmin}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-minio-root-3d81f7a2}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_STORAGE = "minio" }

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"

[[artifacts]]
source      = "/app"
destination = "app"
