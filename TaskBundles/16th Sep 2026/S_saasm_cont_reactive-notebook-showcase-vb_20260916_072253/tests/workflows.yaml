- id: visitor_reads_the_pitch_and_signs_up
  purpose: A signed-out visitor reads the home route, follows the closing call to action, and creates a free account
  substeps:
    - kind: browser
      do: Open / as a signed-out visitor and read the marketing surface this app serves for a reactive data-notebook platform, confirming the dark hero, the value line, the three feature cards, the two blue panels, the community band and a closing call to action that routes a visitor toward creating a free account
      cov: C-OV-01, C-OV-02
    - kind: browser
      do: Confirm the announcement banner sits above the header, carries a near-black pill button that dismisses the announcement banner on request, takes no focus when a page loads, and scrolls away with the page rather than sticking
      cov: C-CF-37
    - kind: browser
      do: Follow the closing action to the sign-up card, choose the email method, submit an address with a password, and arrive with a free account
      cov: C-RL-03
    - kind: pytest
      test: test_output.py::test_signup_creates_a_free_reader_account
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_home_page_arrives_as_complete_html
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_health_returns_ok
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_seeded_accounts_sign_in_with_the_corpus_password
      critical: true
      category: security
      weight: 5

- id: home_route_carries_every_band
  purpose: The home route renders its banner, hero, feature cards and colour panels from stored blocks in position order
  substeps:
    - kind: browser
      do: Confirm the app labels the hero's solid button with the free-trial copy and labels the hero's outlined button `Explore the docs`
      cov: C-CF-40, C-CF-41
    - kind: browser
      do: Confirm the app asserts reactive computation on the home route, asserts real-time multiplayer on a blue panel, and asserts sandboxed execution through its footer posture links
      cov: C-CF-97, C-CF-98, C-CF-99
    - kind: browser
      do: Confirm the app sets the UI in `Inter` and sets notebook titles in `Source Serif Pro`
      cov: C-UX-09, C-UX-11
    - kind: browser
      do: Confirm each of the three feature cards carries a monospaced heading, body copy and an icon the app draws as a line shape in the current text colour like every glyph elsewhere, with selection handles at its corners in a mid, soft indigo
      cov: C-UX-06, C-UX-19
    - kind: browser
      do: Confirm the two full-bleed panels sit in a mid, soft blue, break out to the viewport edge, and carry a faint square grid behind them
      cov: C-UX-05
    - kind: browser
      do: Confirm a vivid mint teal carries the announcement band and the closing panel as the primary accent, and that the community rail of cards advances continuously beneath the community headline
      cov: C-UX-04, C-CF-51
    - kind: pytest
      test: test_output.py::test_home_route_carries_its_banner_and_hero_copy
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_home_route_carries_its_three_feature_cards
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_home_route_carries_both_blue_panels
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_home_blocks_are_stored_in_position_order
      category: data_integrity
      weight: 5

- id: ai_route_tells_its_story
  purpose: The AI route renders its hero, its panels, exactly eight use cases and both testimonials from stored rows
  substeps:
    - kind: browser
      do: Open the AI route and confirm its panels sit on a gradient falling from a vivid magenta to a vivid orange, which appears on no other route
      cov: C-UX-07
    - kind: pytest
      test: test_output.py::test_ai_route_carries_its_panels_and_eight_use_cases
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_ai_route_carries_both_testimonials
      category: business_rule
      weight: 3

- id: community_listing_sorts_and_pages
  purpose: The listing opens on the default sort, orders the seeded nine by stars, pages at thirty, and marks the forked notebook
  substeps:
    - kind: browser
      do: Open the listing, confirm the four sort tabs with the all-time tab shown selected as a filled pill, then switch the grid and list toggle and confirm the order is unchanged
      cov: C-CF-72
    - kind: browser
      do: Confirm each listing card carries a thumbnail, a title link, an author row with a circular avatar, a date, a star count with its glyph, and a fork glyph where the notebook was forked, and that the listing keeps its measure comfortable rather than airy
      cov: C-CF-74
    - kind: browser
      do: Confirm the previous control is unavailable on the first page and the next control advances the count line to the second
      cov: C-CF-69, C-CF-70, C-CF-71
    - kind: pytest
      test: test_output.py::test_listing_defaults_to_most_stars_all_time
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_listing_orders_the_seeded_nine_by_stars
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_listing_pages_at_thirty_per_page
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_listing_sort_by_recent_changes_the_order
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_listing_marks_the_forked_notebook
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeded_notebook_counts_match_the_pinned_values
      category: data_integrity
      weight: 5

- id: uploaded_bytes_live_in_the_object_store
  purpose: Every uploaded byte lands in the bucket at a key derived from its own bytes, and identical bytes yield one object
  substeps:
    - kind: browser
      do: Confirm a cell that recomputes inside a preview pulses a pale amber before settling back to the card ground, and that the embed preview variant is framed with a small attribution badge in its corner
      cov: C-UX-26, C-UX-31
    - kind: pytest
      test: test_output.py::test_uploaded_bytes_live_in_the_object_store_at_the_digest_key
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_identical_bytes_uploaded_twice_yield_one_object
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_concurrent_identical_uploads_leave_one_media_row
      critical: true
      category: data_integrity
      weight: 5

- id: draft_media_cannot_be_read_by_a_signed_out_visitor
  purpose: A draft page's object exists in the bucket and is refused to a signed-out caller, and publishing makes that same object readable without moving it
  substeps:
    - kind: browser
      do: Confirm a draft page shows its state beside its name in the studio list while a signed-out visitor sees the not-found screen at its address
      cov: C-CF-30
    - kind: pytest
      test: test_output.py::test_draft_page_media_is_not_publicly_readable
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_publishing_makes_the_same_object_readable_without_moving_it
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_draft_page_route_answers_not_found
      critical: true
      category: security
      weight: 5

