- id: content_is_composed_from_stored_rows_and_seeded_once
  purpose: Every surface is composed from stored rows rather than from a template, a restart duplicates no seeded row, and a block of an unknown kind writes nothing
  substeps:
    - kind: browser
      do: Confirm the dark footer opens with the wordmark set as live type beside a social row, then four link columns, then the legal strip
      cov: C-UX-21
    - kind: browser
      do: Confirm the app builds no reactive engine and builds no execution sandbox, so it builds no part of the notebook application the pages advertise, and every preview on the site is a still composition
      cov: C-CN-01, C-CN-02, C-OV-04
    - kind: browser
      do: Confirm the app offers no payment, offers no search index, offers no comment thread and offers no starring by a visitor anywhere in its chrome
      cov: C-CN-03, C-CN-04, C-CN-05, C-CN-06
    - kind: browser
      do: Confirm the app offers no role beyond author with reader, reproduces no real customer identity in the testimonials, ships no video and ships no native application
      cov: C-CN-07, C-CN-08, C-CN-10, C-CN-11
    - kind: browser
      do: Confirm the app stays responsive at a few thousand notebooks by paging the listing rather than rendering the whole corpus at once
      cov: C-CN-12
    - kind: pytest
      test: test_output.py::test_footer_is_served_on_every_public_route
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_newsletter_records_a_subscriber_once
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_block_of_an_unknown_kind_is_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_seeded_pages_are_stored_once_with_their_states
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeded_notebooks_are_stored_exactly_once
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_public_page_endpoint_serves_a_published_page
      category: business_rule
      weight: 3

- id: the_site_holds_its_accessibility_floors_at_every_width
  purpose: The reflow, the collapsed menu, the contrast bars, the focus rings and the reduced-motion path all hold
  substeps:
    - kind: browser
      do: At the narrow width confirm the resources menu collapses to a three-bar hamburger driving an accordion that opens and closes by its own height
      cov: C-UX-33
    - kind: browser
      do: Confirm body text on the near-white ground and light text on the near-black ground both meet the WCAG AA contrast bar, which is why the header recolours at all
      cov: C-UX-02, C-UX-35
    - kind: browser
      do: Move through the menus, the sign-up choices and the listing by keyboard alone and confirm every reachable control shows a visible focus ring
      cov: C-UX-36
    - kind: browser
      do: Confirm every icon-only control carries a label and that no meaning anywhere is carried by colour alone
      cov: C-UX-37, C-UX-38
    - kind: browser
      do: Ask for reduced motion and confirm the community marquee stills and the scripted cursor in the multiplayer preview stops
      cov: C-UX-40
    - kind: browser
      do: Zoom the page to twice its size and confirm every route stays usable with nothing overlapping or cut off
      cov: C-UX-41
    - kind: browser
      do: Confirm captions and metadata are set at the small fixed size, that the body copy stays at a comfortably readable size in the interface family, and that text paints immediately because a fallback stack sits behind each family
      cov: C-UX-13, C-UX-14

- id: the_studio_states_and_redirects_hold
  purpose: The studio's entry, its redirects and its empty states behave as the flow states
  substeps:
    - kind: browser
      do: Open a studio address while signed out, confirm the app serves author sign-in at `/studio/login`, sign in, and confirm arrival at the destination that was preserved
      cov: C-UF-05, C-UF-06, C-UF-07
    - kind: browser
      do: Confirm the app lists an author's own pages at `/studio` and carries no page belonging to the other author
      cov: C-CF-29
    - kind: browser
      do: Sign in with no destination and confirm the landing is the studio, then sign out and confirm the return to the home page
      cov: C-UF-08, C-UF-09
    - kind: browser
      do: Let a token expire mid-edit and confirm the block text that was not yet saved is still there after signing in again
      cov: C-UF-10
    - kind: browser
      do: Confirm a listing tab holding no notebooks names that tab in its empty state, a studio holding no pages says so, and a page holding no blocks renders its chrome rather than a blank body
      cov: C-UF-11, C-UF-12, C-UF-13
    - kind: browser
      do: Confirm every route shows a loading state while it is fetching rather than rendering as a bare white page
      cov: C-UF-14
