      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_blocks_are_stored_in_contiguous_positions
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_removing_a_block_closes_the_position_gap
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_publish_is_idempotent
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_concurrent_publish_yields_one_published_row
      critical: true
      category: data_integrity
      weight: 5


