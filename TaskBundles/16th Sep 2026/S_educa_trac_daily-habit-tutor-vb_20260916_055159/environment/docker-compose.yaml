services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_USER: deku_admin
      POSTGRES_PASSWORD: deku-local-dev
      POSTGRES_DB: larkwise
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deku_admin -d larkwise && PGPASSWORD=deku-local-dev psql -h 127.0.0.1 -U deku_app -d larkwise -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  main:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4173:4173"
