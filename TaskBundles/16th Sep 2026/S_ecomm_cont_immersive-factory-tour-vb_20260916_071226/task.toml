schema_version = "1.4"

[task]
name = "deku/immersive-factory-tour-vb"
version = "1.0.0"
description = "A branded, gamified three-dimensional workshop experience for an apparel maker: the maker publishes tour chapters and prize garments as content backed by stored poster objects, a draft chapter's poster stays private until published, and visitors take the guided tour and submit a single prize-draw entry, backed by PostgreSQL and MinIO."
authors = [
    "utsav.jain@ethara.ai",
    "aakanksha.sharma@ethara.ai",
]
uuid_v5 = "0f42fe3f-8584-55ad-86a3-6c537f5a15cb"
keywords = ["greenfield", "solo_founder", "ecommerce-retail", "content-publishing", "immersive-factory-tour", "typescript", "postgres", "minio"]

[metadata]
category            = "Greenfield"
sub_category        = "solo_founder"
domain              = "ecommerce-retail"
pattern             = "content-publishing"
archetype           = "immersive-factory-tour"
design_direction    = "companion"
variant             = "b"
service_profile     = "P4-db-storage"
variant_axes        = ["critical_depth", "spec_sections"]
task_code           = "S_ecomm_cont_immersive-factory-tour-vb_20260916_071226"
naming_scheme       = "task-code-v1"
language            = "typescript"
grader_version      = "0.22.0"
rubric_version      = "1"
capability_flags    = "aesthetic,concurrency_hardening"
launch_surface      = "cookie_choice,favicon,no_frontend_secrets,privacy_page,security_headers"
canary_present      = true

spec_sections_given = [
  "overview",
  "roles",
  "features",
  "flow",
  "uiux",
  "techrequirements",
  "datamodel",
  "buildplan",
  "constraints",
  "contract",
]

reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"
turns_expected       = 120
tokens_expected      = 4500000
contributor_id       = "aakanksha.sharma@ethara.ai"
created_at           = "2026-09-16"

[metadata.services]
backend = "postgres"
storage = "minio"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode      = "public"
allowed_hosts     = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-deku}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-deku-minio-app}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-deku-local-dev}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "shared"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-deku}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-deku-minio-app}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-deku-local-dev}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_STORAGE = "minio" }

[delivery]
format         = "harbor"
schema_version = "1.4"
reward_path    = "/logs/verifier/reward.json"
reward_key     = "reward"
reward_range   = [0.0, 1.0]
reward_full    = 1.0
network_policy = "public"

[[artifacts]]
source      = "/app"
destination = "app"
