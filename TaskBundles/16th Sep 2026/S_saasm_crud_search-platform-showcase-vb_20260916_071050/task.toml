schema_version = "1.4"

[task]
name = "deku/search-platform-showcase-vb"
version = "1.0.0"
description = "Marketing site and operator console for a search and retrieval platform: a header search overlay with live disjunctive source counts over a seeded corpus, an eight-criterion ranking cascade with no score in it, a faceted customer-story index, four plans with a comparison grid, a demo request form that is the one route touching state, and a console carrying a record browser, a ranking-explaining search preview, merchandising rules, keys and rollup analytics, on postgres"
uuid_v5 = "a8f23007-218f-5e3e-a1ed-cf3ec796879f"
authors = [
    "utsav.jain@ethara.ai",
    "aniket.tyagi24@ethara.ai",
]
keywords = ["greenfield", "solo_founder", "typescript", "postgres", "crud-catalog", "saas-micro-tools"]

[metadata]
category         = "Greenfield"
sub_category     = "solo_founder"
domain           = "saas-micro-tools"
pattern          = "crud-catalog"
service_profile  = "P1-db"
variant_axes     = ["critical_depth", "spec_sections"]
capability_flags = "aesthetic"
task_code        = "S_saasm_crud_search-platform-showcase-vb_20260916_071050"
naming_scheme    = "task-code-v1"
design_direction = "companion"
launch_surface   = "colour_contrast,cookie_choice,meta_tags,mobile_viewport,privacy_page"
grader_version   = "0.22.0"
language         = "typescript"
archetype        = "search-platform-showcase"
variant          = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 180
tokens_expected = 7500000
contributor_id  = "aniket.tyagi24@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode      = "public"
allowed_hosts     = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", DEKU_SERVICE_BACKEND = "postgres" }

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"

[[artifacts]]
source      = "/app"
destination = "app"
