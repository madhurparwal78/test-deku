- id: operator_edits_a_record_and_a_replay_creates_no_second_task
  purpose: An inline edit persists and survives a reload, a replayed write enqueues nothing, and a hide beats a promote
  substeps:
    - kind: browser
      do: Edit one attribute inline in the record browser, watch the returned task reach published, reload and find the new value
      cov: C-CF-532
    - kind: browser
      do: Open the tasks screen and find the edit's task with its identifier, kind, status, accept time and publish time
      cov: C-CF-536
    - kind: browser
      do: Drag a hit to the top of the merchandising editor for one query and read the rule the drag wrote
      cov: C-CF-524
    - kind: pytest
      test: test_output.py::test_console_inline_edit_persists_the_new_value
      critical: true
      category: data_integrity
      weight: 5
      cov: C-CF-498
    - kind: pytest
      test: test_output.py::test_idempotency_key_replay_creates_no_second_task
      critical: true
      category: data_integrity
      weight: 5
      cov: C-CF-325 (earned: this step is the one that observes the ask, which the item words differently)
    - kind: pytest
      test: test_output.py::test_batch_is_not_a_transaction
