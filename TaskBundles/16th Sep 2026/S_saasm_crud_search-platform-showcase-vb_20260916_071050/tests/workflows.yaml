- id: source_counts_stay_truthful_when_a_source_is_ticked
  purpose: Ticking one source leaves every other source count truthful, which is the disjunctive contract the product is sold on
  substeps:
    - kind: browser
      do: Tick Blog in the source list and read the counts beside the other seven sources
      cov: C-CF-494
    - kind: browser
      do: Tick a second source and confirm the first source's own count is unchanged
      cov: C-CF-50
    - kind: pytest
      test: test_output.py::test_source_facet_counts_are_disjunctive
      critical: true
      category: data_integrity
      weight: 5
      cov: C-CF-26
    - kind: pytest
      test: test_output.py::test_catalog_disjunctive_counts_match_the_worked_example
      critical: true
      category: data_integrity
      weight: 5
      cov: C-CF-161
    - kind: pytest
      test: test_output.py::test_selected_facet_value_with_no_match_is_still_returned
      category: business_rule
      weight: 3
      cov: C-CF-163

- id: ranking_cascade_puts_the_misspelled_hit_last
  purpose: The eight criteria are applied in sequence so a single typo outranks nothing, whatever the custom ranking says
  substeps:
    - kind: browser
      do: Open the console search preview, run the fixture query and read the returned order
      cov: C-CF-506
    - kind: browser
      do: Open the disclosure on the second hit and read the criterion marked as the one that separated the two
      cov: C-CF-511
    - kind: pytest
      test: test_output.py::test_ranking_cascade_orders_the_fixture_query
      critical: true
      category: data_integrity
      weight: 5
      cov: C-CF-59
    - kind: pytest
      test: test_output.py::test_cascade_holds_without_custom_ranking
      category: data_integrity
      weight: 5
      cov: C-CF-60 (earned: this step is the one that observes the ask, which the item words differently)
    - kind: pytest
      test: test_output.py::test_geo_bucket_ties_before_custom_ranking
      category: business_rule
      weight: 3
      cov: C-CF-96 (earned: this step is the one that observes the ask, which the item words differently)

