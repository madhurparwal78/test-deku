- id: site_boots_and_serves_every_public_route
  purpose: The deployed site answers its health route and serves every public route as a complete document with its own title
  substeps:
    - kind: browser
      do: Open the home route and confirm the wordmark, the five header items and the search field are visible before any script has run
      cov: C-CF-259
    - kind: pytest
      test: test_output.py::test_health_and_deployment_contract
      critical: true
      category: core_outcome
      weight: 5
      cov: C-TR-07 (earned: this step is the one that observes the ask, which the item words differently)
    - kind: pytest
      test: test_output.py::test_public_routes_render_before_script
      category: presentation
      weight: 1
      cov: C-UF-01
    - kind: pytest
      test: test_output.py::test_meta_tags_are_unique_per_route
      category: presentation
      weight: 1
      cov: C-CF-552 (earned: this step is the one that observes the ask, which the item words differently)
    - kind: pytest
      test: test_output.py::test_type_families_are_declared
      category: presentation
      weight: 1
      cov: C-FE-142 (earned: this step is the one that observes the ask, which the item words differently)

