- id: visitor_reads_the_studio_argument
  purpose: A stranger reads the home route, the expertise tree, the method and the about route, each rendered from stored records on an app that serves a production build
  substeps:
    - kind: browser
      do: Open the home route and read the studio serving a booking surface for a strategic call, then read down the argument and find every other public action reading published content only
      cov: C-OV-02, C-OV-05
    - kind: browser
      do: Read the home route again after a reload and find the app rendering published content from stored records, with no route personalised to a visitor and no name carried over
      cov: C-OV-06, C-OV-09
    - kind: browser
      do: Watch the home hero at first paint and find the one block complete, its headline legible before the background image decodes, the image itself darkened rather than covered by a panel
      cov: C-FE-10, C-FE-11, C-FE-12
    - kind: browser
      do: Read the three qualifying lines under the who it is for block and find the asterisk opening each one set as a text character in the surrounding face
      cov: C-FE-13
    - kind: browser
      do: Point at the booking action in the closing block and watch the action shrink slightly under the pointer, then open the navigation panel and watch it rise a distance expressed in the panel own type size
      cov: C-FE-06, C-FE-03
    - kind: browser
      do: Read the client mark strip on the home route and find each client mark generated as a wordmark set in the interface face, running at a constant rate rather than eased
      cov: C-FE-50, C-FE-45
    - kind: browser
      do: Scroll the home route and watch one reveal wrapper covering every revealing block, with media layers drifting inside their frames as the page passes them
      cov: C-FE-46, C-FE-26
    - kind: browser
      do: Read the method route and find the four method steps separated by full width hairlines, then open the about route where the manifesto renders at 16px over 24px on a narrower measure than the surrounding blocks
      cov: C-FE-27, C-FE-29, C-FE-30
    - kind: browser
      do: Read the headlines in the display face and confirm they are set in Playfair Display, the interface face is Syne, and the body copy is set in Lexend Deca
      cov: C-UX-09, C-UX-10, C-UX-11
    - kind: browser
      do: Read the interface type ramp across the route and find the sizes 12px, 13px, 14px, 15px, 16px, 20px and 30px in use with nothing between them
      cov: C-FE-55
    - kind: browser
      do: Read the site with a screen magnifier and find the body text meeting WCAG AA contrast against its ground, then reach every control by keyboard navigation with a visible focus ring
      cov: C-UX-34, C-UX-35
    - kind: browser
      do: Read the icons down the route and find them inheriting the current text colour, with depth expressed by stacking order rather than by shadow
      cov: C-FE-42, C-FE-43
    - kind: pytest
      test: test_output.py::test_health_endpoint_answers_two_hundred
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_credentials_file_names_every_seeded_account
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_reserved_directories_exist_and_are_empty
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_document_declares_its_language
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_service_index_lists_the_eight_seeded_services
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_service_detail_lists_the_projects_tagged_with_it
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_service_detail_count_matches_the_filtered_archive
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_method_carries_its_mark_and_its_four_steps
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_method_route_renders_its_mark_and_its_steps
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_expertise_index_renders_the_eight_services
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_home_route_renders_its_blocks_in_the_browser
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_studio_profile_carries_the_proof_numbers
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_testimonials_come_back_in_stored_order
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_seeding_is_idempotent_across_the_seeded_collections
      category: data_integrity
      weight: 5

- id: visitor_works_the_project_archive
  purpose: A stranger filters the archive down to one service, shares the filtered address and loads more work without the reveal replaying
  substeps:
    - kind: browser
      do: Read an archive card and find its service line joining the project tags with a spaced hyphen, with the longest service line wrapping rather than being clipped
      cov: C-CF-32, C-CF-48
    - kind: browser
      do: Choose a service filter and find the archive announcing the resulting count to assistive technology while the scroll position is left unmoved
      cov: C-CF-40, C-CF-39
    - kind: browser
      do: Filter a card out of the grid and back in, then find that a card revealed once stays revealed for the life of the page and a card re-entering the grid never replays the reveal
      cov: C-CF-41, C-CF-42
    - kind: browser
      do: Point at a filter control and watch the hovered filter take the brand red on its label plus its border together on one beat
      cov: C-FE-19
    - kind: browser
      do: Follow an archive card and find the whole card acting as the link with no separate button on the route
      cov: C-FE-20
    - kind: browser
      do: Choose load more and watch appended cards land in the same grid, leaving the scroll position unmoved, with keyboard focus landing on the first appended card
      cov: C-FE-21, C-FE-22, C-FE-23
    - kind: browser
      do: Keep choosing load more until the archive is exhausted and find the load more action removed rather than left in place unavailable
      cov: C-FE-24
    - kind: browser
      do: Copy the filtered archive address into a fresh window and find the filtered archive address reopening with the same narrowed grid
      cov: C-UF-18
    - kind: pytest
      test: test_output.py::test_archive_lists_twelve_published_projects_in_editorial_order
      critical: true
      category: business_rule
      weight: 5
    - kind: pytest
      test: test_output.py::test_every_project_carries_between_one_and_six_tags
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_six_projects_are_featured_on_the_home_route
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_filtering_the_archive_narrows_it_to_one_service
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_archive_filter_reflects_itself_in_the_address
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_archive_carries_nine_filter_controls_including_all
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_project_grounds_use_the_stored_vocabulary
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_narrow_viewport_does_not_overflow_sideways
      category: presentation
      weight: 1

