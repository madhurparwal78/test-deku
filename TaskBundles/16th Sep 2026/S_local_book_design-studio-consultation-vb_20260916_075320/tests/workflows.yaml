- id: visitor_meets_an_empty_state_and_an_unknown_address
  purpose: A stranger filters to nothing, opens an address that matches no route, and is never shown a blank frame or a stack trace
  substeps:
    - kind: browser
      do: Filter the archive to a service carrying nothing published and find every list carrying an empty state naming what would be there
      cov: C-UF-23
    - kind: browser
      do: Open a route on a slow connection and find a loading state rather than a blank frame, then force an error and find it rendering in place as an inline banner
      cov: C-UF-24, C-UF-25
