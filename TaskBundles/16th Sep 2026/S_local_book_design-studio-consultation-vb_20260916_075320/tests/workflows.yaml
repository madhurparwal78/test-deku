- id: the_deployment_contract_holds
  purpose: The app is reachable where the contract says, serves a production build that outlives the shell, and reaches no service it did not declare
  substeps:
    - kind: browser
      do: Open the app at APP_PUBLIC_URL and find it reachable there, with the container-internal port 4173 mapped from APP_PUBLIC_PORT and the HTTP API served under the /api prefix
      cov: C-DC-01, C-DC-02, C-DC-03, C-DC-04
    - kind: browser
      do: Read the served bundle and find a production build behind a preview server, with no development server serving the route
      cov: C-DC-11, C-DC-12
    - kind: browser
      do: Close the session and reopen the app, finding the server keeping running after the session ends rather than being a child of the shell
      cov: C-DC-13, C-DC-14
    - kind: browser
      do: Reach the app from outside its container and find that the server binds 0.0.0.0, never a loopback address
      cov: C-DC-15, C-DC-16
    - kind: browser
      do: Read the running app and find it starting no copy of a backing service, requiring no persistent volume of its own
      cov: C-DC-17, C-DC-19
    - kind: browser
      do: Sign in through POST /api/auth/login and read the access_token it returns, then hold a slot through POST /api/slots/{id}/hold and read the created booking it returns
      cov: C-DC-23, C-DC-24
    - kind: browser
      do: Read the running stack and find the frontend built with SolidJS plus Vite over a backend of FastAPI on Python
      cov: C-TR-01, C-TR-02
    - kind: browser
      do: Read the environment the app starts in and find the datastore reached as PostgreSQL at DATABASE_URL, with mail leaving over SMTP at SMTP_HOST and the SMTP port read from SMTP_PORT
      cov: C-TR-05, C-TR-06, C-TR-07
    - kind: browser
      do: Read the environment again and find the public origin read from APP_PUBLIC_URL, with no host hardcoded anywhere in the app
      cov: C-TR-08, C-TR-09
    - kind: browser
      do: Read the running app and find no second datastore introduced, no mail vendor beyond the named one, and authentication implemented by the app rather than an identity provider
      cov: C-TR-10, C-TR-11, C-TR-12
    - kind: browser
      do: Read the container output and find application logs going to standard output, each log line carrying the request method
      cov: C-TR-15, C-TR-16
    - kind: browser
      do: Read a media entry and find it storing the generator plus the seed plus the aspect, with no file upload surface offered anywhere
      cov: C-TR-23, C-TR-24
    - kind: browser
      do: Read the built assets and find the build shipping no video file at all
      cov: C-FE-51
    - kind: browser
      do: Read the store behind the app and find no booking living only in the running process, every booking present as a stored row
      cov: C-DC-28
