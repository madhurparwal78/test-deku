- id: visitor_reads_a_published_place_entry
  purpose: A visitor opens a published place entry and reads its guide, its fact panel and its pictures
  substeps:
    - kind: browser
      do: Open /destination/alder-cove and read the place name Alder Cove, the guide text, the fact panel labels Nearest station, Best months and Distance, and the picture strip below the guide
      cov: C-OV-06, C-CF-55, C-CF-59, C-UF-03, C-UF-30, C-DM-33, C-DM-61, C-FE-98, C-FE-99, C-FE-140, C-FE-141, C-FE-220
    - kind: pytest
      test: test_output.py::test_place_entry_detail_carries_guide_and_facts
      category: business_rule
      weight: 3
    - kind: browser
      do: Follow one card in the Nearby and alike related row and land on another published place entry sharing a theme
      cov: C-UF-31, C-FE-221
    - kind: pytest
      test: test_output.py::test_place_entry_related_row_shares_a_theme
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_published_entry_fields_survive_a_reread
      category: data_integrity
      weight: 5
    - kind: browser
      do: On /destination/alder-cove read the tall head still at three fifths of the viewport height under its corner-to-corner dark scrim, the place name over it in the display serif, the guide text in a single eight-twelfths reading column, and the sticky fact panel beside it on the section ground
      cov: C-FE-15, C-FE-20, C-FE-34, C-FE-97, C-FE-132, C-FE-133, C-FE-134, C-FE-135, C-FE-136, C-FE-138, C-FE-139, C-FE-255
    - kind: browser
      do: On /destination/alder-cove hover a related card and observe its border with its title warming to the accent orange, then narrow the window and observe the fact panel move from beside the guide text to beneath it
      cov: C-FE-76, C-FE-112, C-FE-146, C-FE-192
    - kind: pytest
      test: test_output.py::test_place_title_uses_the_display_type_family
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_body_copy_uses_the_condensed_sans_family
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_place_entry_prints_as_an_article
      category: presentation
      weight: 1

