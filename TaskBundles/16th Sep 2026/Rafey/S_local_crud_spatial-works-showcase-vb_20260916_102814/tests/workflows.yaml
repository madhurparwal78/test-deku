- id: enquiry_is_stored_and_mailed_to_the_studio
  purpose: "An enquiry is validated, stored, given a reference and mailed to the studio"
  substeps:
    - kind: browser
      do: "Open /contact, fill the name Walkthrough Visitor and a valid email, submit with a message of five characters, and confirm the message field is named invalid beside it with nothing sent"
      cov: C-CF-53, C-UF-19
    - kind: browser
      do: "Complete the message to more than twenty characters and submit, then confirm a toast names a reference beginning ENQ- and the form clears"
      cov: C-CF-57, C-CF-58, C-UF-20
    - kind: pytest
      test: test_output.py::test_an_accepted_enquiry_is_stored_exactly_as_submitted
      critical: true
      category: core_outcome
      weight: 5
      cov: C-OV-05, C-RL-02, C-CF-55, C-CF-67, C-DM-16, C-DC-11, C-DC-14
    - kind: pytest
      test: test_output.py::test_an_enquiry_notification_mail_reaches_the_studio_inbox_alone
      critical: true
      category: notification
      weight: 5
      cov: C-OV-06, C-CF-47, C-CF-60, C-CF-61, C-TR-06, C-DC-15
    - kind: pytest
      test: test_output.py::test_enquiry_references_are_sequential_and_well_formed
      category: data_integrity
      weight: 5
      cov: C-CF-56

