- id: spatial_gallery_is_served_from_one_origin
  purpose: "A visitor reaches the live gallery and its counted footer on one origin"
  substeps:
    - kind: browser
      do: "Open the site root and confirm it arrives at a home where, after the counting boot loader, a live three dimensional scene of floating project cards fills the viewport over the blue"
      cov: C-UF-13
    - kind: browser
      do: "Scroll over the home and confirm the focused card changes and its label pill shows a different project title"
      cov: C-CF-13, C-CF-15, C-UF-14
    - kind: browser
      do: "Choose Spiral in the formation switch and confirm the cards rearrange into a helix, then reload and confirm Spiral is still selected"
      cov: C-CF-12, C-UF-15
    - kind: browser
      do: "Confirm the home footer line reads BRAND & DIGITAL DESIGN STUDIO, 12 / 20 selected Works and \u00a9 2026"
      cov: C-CF-18
    - kind: pytest
      test: test_output.py::test_health_returns_200_and_the_shell_shares_the_api_origin
      category: presentation
      weight: 1
      cov: C-TR-01, C-TR-07, C-TR-15, C-CN-05, C-DC-01
    - kind: pytest
      test: test_output.py::test_app_root_keeps_reserved_screenshot_and_download_directories
      category: presentation
      weight: 1
      cov: C-DC-02
    - kind: pytest
      test: test_output.py::test_the_home_draws_a_live_three_dimensional_canvas
      category: presentation
      weight: 1
      cov: C-CF-09, C-CF-17, C-FE-20
    - kind: pytest
      test: test_output.py::test_without_webgl_the_home_shows_the_flat_catalogue
      category: business_rule
      weight: 3
      cov: C-OV-04, C-CF-20, C-FE-19
    - kind: pytest
      test: test_output.py::test_the_footer_counts_featured_and_total_projects_from_stored_rows
      category: data_integrity
      weight: 5
      cov: C-CF-19, C-TR-09, C-DM-09, C-DM-10

- id: wrong_password_login_is_refused
  purpose: "A wrong password and an unknown email are refused alike, and a retired token reaches nothing"
  substeps:
    - kind: browser
      do: "Open /login, sign in as studio@example.com with the password wrong-password, and confirm the refusal message reads Sign in failed"
      cov: C-CF-08
    - kind: pytest
      test: test_output.py::test_seeded_studio_accounts_are_stored_once_with_hashed_passwords
      critical: true
      category: data_integrity
      weight: 5
      cov: C-RL-10, C-RL-11, C-RL-12, C-CF-06, C-TR-11, C-DM-01, C-DM-02, C-CN-02, C-DC-03
    - kind: pytest
      test: test_output.py::test_login_refuses_a_wrong_password_and_an_unknown_email_alike
      critical: true
      category: security
      weight: 5
      cov: C-CF-01, C-CF-02
    - kind: pytest
      test: test_output.py::test_missing_unknown_and_retired_tokens_are_refused
      category: security
      weight: 5
      cov: C-CF-03, C-CF-05, C-DM-03
    - kind: pytest
      test: test_output.py::test_logout_retires_the_token
      category: security
      weight: 5
      cov: C-CF-04, C-DC-05

