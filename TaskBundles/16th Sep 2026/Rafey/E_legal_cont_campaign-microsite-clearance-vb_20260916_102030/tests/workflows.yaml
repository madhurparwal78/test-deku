      do: "Open the site root / and confirm the campaign index lists Afterglow with a link and does not list Dusk Parade"
      cov: C-OV-15, C-CF-44
    - kind: browser
      do: "Open /afterglow/fr/, follow the privacy link in the footer to /privacy/, and confirm the privacy page states that server logs keep request addresses for 30 days for security and abuse prevention, that the drop_lang cookie is kept for 365 days and that staff audit records are kept for 7 years"
      cov: C-CF-292, C-CF-293, C-CF-294
