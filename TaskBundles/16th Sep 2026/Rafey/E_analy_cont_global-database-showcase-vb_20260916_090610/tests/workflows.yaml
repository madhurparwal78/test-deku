- id: visitor_makes_a_cookie_choice
  purpose: A first-time visitor declines the cookie choice and is not asked again.
  substeps:
    - kind: browser
      do: Arriving for the first time on /, read the cookie choice band docked at the foot with the sentence We use cookies to measure how the site is used., its Privacy link, its filled Accept control and its outline Decline control, then press Decline
      cov: "C-CF-22, C-CF-23, C-CF-24, C-UF-20, C-FE-44 (earned: the band this substep reads is docked at the foot and stays pressable over everything but the dialog layer)"
    - kind: pytest
      test: test_output.py::test_no_analytics_cookie_is_set_before_the_visitor_chooses
      critical: true
      category: security
      weight: 5
    - kind: browser
      do: Open /product after declining the cookie choice and find the band gone, then reload the address and find the band still gone
      cov: C-CF-29, C-UF-21, C-FE-65
    - kind: pytest
      test: test_output.py::test_the_cookie_choice_is_remembered_across_routes
      category: business_rule
      weight: 3

- id: visitor_finds_distinct_page_metadata
  purpose: Every public route carries its own title, description and canonical link.
  substeps:
