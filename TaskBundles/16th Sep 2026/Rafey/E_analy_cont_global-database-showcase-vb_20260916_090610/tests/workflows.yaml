      do: Open /, /product and /product/tessera in turn and read a different page title and a different description on each, the product page title carrying Tessera
      cov: C-UF-23, C-UF-24
    - kind: pytest
      test: test_output.py::test_every_public_route_carries_its_own_title_and_description
      category: presentation
      weight: 1

- id: visitor_proves_consistency_in_the_console
  purpose: A visitor writes in one region and reads the value back from another.
  substeps:
    - kind: browser
      do: Open /console and read the region globe with its five nodes us-central, eu-west, asia-south, sa-east and au-southeast joined by thin links, the write-then-read strip with its fields sitting in inset wells a step deeper than the panel, the synchronized-clock readout and the partition control
      cov: "C-RL-04 (earned: the substep uses the console with no account), C-CF-41 (earned: the substep opens /console and reads the console standing there), C-UF-09 (earned: the substep opens /console with no account and reads what the route table says the route shows), C-UX-23 (earned: the substep reads the strip fields sitting in inset wells a step deeper than the panel), C-FE-105, C-FE-106, C-FE-114 (earned: the four parts this substep reads include the meter along the foot), C-FE-171 (earned: the drawn map is the console's own diagram, and its figures are the ones the console answers)"
    - kind: pytest
      test: test_output.py::test_partition_response_carries_all_five_regions
      category: business_rule
      weight: 3
    - kind: browser
      do: Write the value amber into us-central and see the commit-wait bar fill for the uncertainty band before the committed state flashes the darker soft green with the checkmark, then read the key back from eu-west in mode strong and receive amber with a latency figure and no staleness
      cov: "C-UF-26, C-UX-65, C-FE-107, C-FE-110, C-FE-160 (earned: the substep reads the committed state flash in the darker soft green)"
    - kind: pytest
      test: test_output.py::test_strong_read_from_another_region_returns_the_last_write
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_strong_read_never_returns_a_stale_value
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_commit_waits_out_an_uncertainty_above_zero
      critical: true
      category: business_rule
      weight: 5
    - kind: browser
      do: Read the synchronized-clock readout showing each region clock as an uncertainty band rather than a single instant, drawn as a narrowing bar
      cov: C-OV-12, C-FE-109
    - kind: pytest
      test: test_output.py::test_bounded_read_stays_within_the_bound_it_is_given
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_exact_read_answers_at_the_timestamp_it_is_given
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_an_unknown_region_or_mode_is_refused
      category: validation
      weight: 3
    - kind: browser
      do: Read the console state as text, the current value per region, the clock uncertainty and the partition status, each beside its word rather than carried by colour alone
      cov: "C-CF-72, C-CF-73, C-CF-74, C-UX-15, C-UX-81, C-FE-108 (earned: the substep reads the console state as text, which a keyboard operator reaches by the same controls)"
    - kind: pytest
      test: test_output.py::test_console_timestamps_carry_utc_milliseconds
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_a_read_missing_its_bound_or_timestamp_is_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_a_write_missing_its_value_is_refused
      category: validation
      weight: 3
    - kind: browser
      do: Resize to a narrow viewport on /console and see the four console parts stacked vertically with shortened region labels
      cov: C-FE-41
    - kind: pytest
      test: test_output.py::test_console_reads_as_a_labelled_diagram_without_scripting
      category: presentation
      weight: 1

- id: visitor_severs_a_region_and_restores_it
  purpose: A severed region refuses a write while the majority side stays correct.
  substeps:
    - kind: browser
      do: On /console sever asia-south with the partition control and see its node grey with its links drawn dashed
      cov: C-OV-13, C-CF-64, C-UX-68, C-FE-111
    - kind: browser
      do: Attempt a write against the severed asia-south and read the refusal That region will not accept a write it cannot safely agree on. beside the status circle
      cov: C-CF-68, C-FE-112
    - kind: pytest
      test: test_output.py::test_write_against_a_severed_region_is_refused
      critical: true
      category: core_outcome
      weight: 5
    - kind: browser
      do: Write into eu-west while asia-south stays severed and see it commit, then restore asia-south and see the skeleton shimmer, a step deeper than the panel ground, before it rejoins with nothing drawn as corrupted
      cov: "C-CF-71 (earned: the substep reads the console through a sever and a restore, where a forked state would show), C-UF-29, C-UX-24 (earned: the substep reads the skeleton shimmer a step deeper than the panel ground), C-FE-113"
    - kind: pytest
      test: test_output.py::test_majority_side_write_commits_while_a_region_is_severed
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_restoring_a_severed_region_resyncs_it
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_severing_a_severed_region_changes_nothing
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_console_reset_returns_the_seeded_state
      category: business_rule
      weight: 3

