services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_USER: deku_admin
      POSTGRES_PASSWORD: deku-local-dev
      POSTGRES_DB: deku
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deku_admin -d deku"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data
    environment:
      MINIO_ROOT_USER: deku_app
      MINIO_ROOT_PASSWORD: deku-local-dev
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio-init:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 deku_app deku-local-dev && mc mb --ignore-existing local/deku && mc anonymous set none local/deku && tail -f /dev/null"]

  main:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4173:4173"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
