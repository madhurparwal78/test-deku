      do: Open a checkout for Field Notes Volume One, apply the code EXPIRED10, and read the inline banner naming the closed window with the total left where it was; confirm the banner persists until dismissed or until the pane changes, and that the error is stated in place rather than leaving the app unusable
      cov: C-CF-28, C-FE-09, C-UF-17
