- id: reader_buys_a_tier_and_receives_the_entitlement
  purpose: A stranger opens a product page cold, picks a tier, applies a discount, pays, and holds the entitlement
  substeps:
    - kind: browser
      do: Open the product page that renders at its permalink route /p/field-notes-vol-one and read the name Field Notes Volume One with both tier names and both prices already on the page; confirm the page ground is a near-white warm neutral, that primary text is a near-black neutral with muted text the same hue held lighter, and that the primary action wears the mid, vivid orange nothing else on the page wears; then narrow the viewport and confirm the product page becomes a single column with the buy action pinned to the foot of the viewport
      cov: C-CF-10, C-CF-11, C-CF-18, C-UF-02, C-UX-01, C-UX-02, C-UX-03, C-UX-37
    - kind: browser
      do: Pick the Standard tier, press the primary buy action, sign in as buyer@example.com with the password deku-demo-pw-2026, and read the checkout route rendering one open session as a single column of at most four fields, showing the unit price, the tax and the total on separate lines beside the seller-of-record disclosure that appears at checkout; confirm every interactive component carries its resting, pointed-at, pressed, focused, unavailable, loading and errored state, and that a loading control keeps its width so nothing beside the control moves
      cov: C-CF-19, C-CF-122, C-FE-12, C-UF-03, C-UX-22, C-UX-23
    - kind: browser
      do: Apply the discount code LAUNCH20, read the discount line that appears and the changed figure arriving by counting to its new value of 2285, with the price block stating the currency explicitly beside every figure; then confirm and read the thanks route showing the confirmed purchase arriving as one settled state, offering a way into the library
      cov: C-CF-26, C-CF-27, C-UF-04, C-UX-18, C-UX-20, C-FE-10
    - kind: pytest
      test: test_output.py::test_checkout_confirm_creates_order_with_worked_decomposition
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_paid_order_ledger_postings_are_stored_and_balance
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_paid_order_grants_one_entitlement
      category: core_outcome
      weight: 5

- id: paid_checkout_creates_one_invoice_in_the_billing_platform
  purpose: The invoice for a paid order is a real record in the billing platform for the amount the app computed
  substeps:
    - kind: pytest
      test: test_output.py::test_paid_checkout_invoice_exists_for_worked_total
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_billing_account_external_key_is_stored_once
      category: data_integrity
      weight: 5

- id: receipt_reaches_the_buying_reader
  purpose: A paid order sends exactly one receipt, to the buying reader alone, with the pinned subject prefix
  substeps:
    - kind: browser
      do: Sign in as buyer@example.com and open /library, reading the loading placeholder occupying the space the content will occupy before either the entitlements held or the designed empty state naming the next action; confirm the buyer surfaces are spacious where the console is compact
      cov: C-UF-05, C-UF-16, C-UX-12, C-UF-09
    - kind: browser
      do: Sign out from the library, confirm the storefront home is shown, then press the back control and confirm the library is no longer reachable
      cov: C-UF-11, C-UF-12
    - kind: browser
      do: Open /library while signed out and confirm the sign-in route is shown, then sign in and confirm the library that was asked for is the page that opens; confirm a token expiring part way through an action leaves that action undone
      cov: C-UF-07, C-UF-08, C-UF-14
    - kind: pytest
      test: test_output.py::test_receipt_email_reaches_the_buying_reader_only
      critical: true
      category: notification
      weight: 5
    - kind: pytest
      test: test_output.py::test_entitlement_access_is_recorded
      category: business_rule
      weight: 3

- id: duplicate_confirm_creates_at_most_one_order
  purpose: Confirming one session twice with the same idempotency key leaves exactly one of everything behind
  substeps:
    - kind: pytest
      test: test_output.py::test_repeated_checkout_confirm_is_idempotent
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_refused_confirm_sends_no_receipt_email
      category: notification
      weight: 3

- id: concurrent_confirms_leave_the_quantity_limit_intact
  purpose: Two readers confirming the last unit at one moment produce exactly one order between them
  substeps:
    - kind: browser
      do: Open the product page for Lantern Press Kit once its one unit is gone and read the sold-out state offering the storefront rather than an error
      cov: C-CF-13, C-CF-95, C-CF-96
    - kind: pytest
      test: test_output.py::test_quantity_limit_is_never_oversold_under_contention
      critical: true
      category: data_integrity
      weight: 5

- id: reader_cannot_read_creator_orders
