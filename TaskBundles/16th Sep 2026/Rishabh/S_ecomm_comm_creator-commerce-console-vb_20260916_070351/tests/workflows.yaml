- id: draft_product_stays_hidden_from_the_storefront
  purpose: A draft product is unreadable by a stranger at every public surface
  substeps:
    - kind: browser
      do: Open the storefront home as a signed-out stranger and confirm it lists every published product, Field Notes Volume One beside Lantern Press Kit, with no Tide Tables Draft among them; confirm the buyer surfaces the app presents are a storefront, a product page, a checkout and a durable library
      cov: C-CF-12, C-OV-02
    - kind: pytest
      test: test_output.py::test_draft_product_is_not_publicly_readable
      category: security
      weight: 5

- id: creator_reads_the_money_decomposition
  purpose: The creator reads a full order decomposition beside a ledger whose trial balance reads zero
  substeps:
    - kind: browser
      do: Sign in as creator@example.com, land on the console home, and confirm the console carries a persistent left rail holding seven destinations; open the orders route, select a record on that split detail pane, confirm selecting it changes the right column with the address while never losing the left, and read the subtotal, discount, tax, total, platform fee, payment fee, affiliate share and net there, where the money decomposition carries an ordered ramp with one distinguishable colour per component and every ramp segment carries a written label beside its colour
      cov: C-RL-03, C-FE-01, C-FE-02, C-FE-03, C-UF-06, C-UF-10, C-OV-01, C-UX-05, C-UX-06
    - kind: browser
      do: Filter the console order list and confirm the filtered list reorders by sliding its rows to their new positions, then press a destructive control and confirm it confirms first, naming what will be destroyed
      cov: C-UX-19, C-UX-24
    - kind: browser
      do: Open /console/money and read the account tree beside the entry stream, expand an entry to see its legs with the account code and name, confirm debit reads differently from credit without relying on colour, confirm revenue carries a mid, vivid green where anything declined carries a mid, vivid red, and confirm a confirmation appears as a banner at the top of the working pane
      cov: C-RL-04, C-FE-13, C-UX-04
    - kind: pytest
      test: test_output.py::test_trial_balance_is_zero_after_purchase
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeded_chart_of_accounts_rows_exist
      category: data_integrity
      weight: 5

- id: creator_prices_a_product_before_committing
  purpose: The pricing decomposition returns the ledger's own arithmetic and names the component that moved
  substeps:
    - kind: browser
      do: Sign in as creator@example.com, open /console/pricing/field-notes-vol-one, set the discount depth to 2000 and the jurisdiction to IE on the direct channel, and read a net of 1602
      cov: C-CF-98, C-CF-101
    - kind: browser
      do: Move the attribution channel to marketplace, read the net falling to 1440, and confirm the surface names the platform fee as the component that moved rather than presenting the moved total alone; confirm a skeleton whose blocks occupy the space the content will occupy ends by settling into that content
      cov: C-CF-102, C-UX-17
    - kind: pytest
      test: test_output.py::test_pricing_read_matches_the_order_arithmetic
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_marketplace_channel_raises_the_platform_fee
      category: business_rule
      weight: 3

- id: open_session_price_survives_a_reprice
  purpose: A session honours the figures it locked when it opened, whatever happens to the tier afterwards
  substeps:
    - kind: browser
      do: Sign in as buyer@example.com, open a checkout for Field Notes Volume One, and read the unit price, the tax resolved for IE and the total held as three separate lines rather than one bare figure; resize to a medium width and confirm the console rail collapses to icons, then to a narrow width and confirm the rail becomes a bottom bar
      cov: C-UX-36
    - kind: pytest
      test: test_output.py::test_checkout_session_price_survives_a_reprice
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_discount_retaxes_the_discounted_base
      category: business_rule
      weight: 3

- id: expired_discount_code_is_refused
  purpose: A code outside its window or over a cap is refused with the reason named and the total unchanged
  substeps:
