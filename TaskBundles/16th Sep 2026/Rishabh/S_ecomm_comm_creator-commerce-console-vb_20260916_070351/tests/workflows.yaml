      do: Open /signup, follow the terms page link the form makes reachable, return, then submit with an address already in use and read the inline message naming the field at fault; confirm the form rejecting invalid input writes nothing, and that a transition re-triggered part way through re-targets from where the transition is
      cov: C-CF-123, C-CF-124, C-UX-16
    - kind: pytest
      test: test_output.py::test_decoy_field_submission_is_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_duplicate_signup_email_is_refused
      category: validation
      weight: 3

- id: storefront_and_terms_pages_render_for_a_stranger
  purpose: The public surfaces a stranger meets first all render, including the not-found page and the terms page
  substeps:
    - kind: browser
      do: Open / as a stranger, follow the terms page link reachable from the footer of every page, and read a terms page naming Handsel Commerce Ltd as the seller of record; confirm the seller-of-record disclosure cannot be suppressed by the creator branding on the page
      cov: C-CF-118, C-CF-119, C-CF-120, C-CF-121
    - kind: browser
      do: Read the storefront home and confirm body text sits at sixteen pixels on a twenty-four pixel line with interface text a size smaller, that every semantic colour carries a foreground holding its contrast against the background it sits on, that every surface meets WCAG 2.2 Level AA with effects active, and that the monospace family carrying every amount is never overridable
      cov: C-UX-07, C-UX-10, C-UX-11, C-UX-28
    - kind: browser
      do: Tab from the start of the document and confirm the buy action is reachable by keyboard within a short run of tab stops, that every interactive element takes focus with a visible ring, that each icon-only control carries a label, that no meaning is carried by colour alone, and that iconography is drawn inline rather than loaded as a font
      cov: C-UX-31, C-UX-32, C-UX-33, C-FE-11, C-FE-15
    - kind: browser
      do: Resize to a narrow viewport and confirm every navigation target stays reachable, then open the checkout surface and confirm nothing there delays input, moves a target after appearing or animates a total; turn reduced motion on and confirm it removes the movement rather than the information
      cov: C-UX-35, C-UX-21, C-UX-15
    - kind: browser
      do: Open an unknown address and confirm it renders the product's own not-found page with a way back
      cov: C-CF-125
    - kind: pytest
      test: test_output.py::test_product_page_html_carries_the_price
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_terms_page_names_the_seller_of_record
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_unknown_address_answers_not_found
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_health_route_answers_ready
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_no_credential_appears_in_a_served_page
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeding_is_idempotent_and_the_account_is_seeded
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_list_endpoints_return_a_top_level_array
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_out_of_scope_surfaces_are_absent
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_every_money_figure_carries_one_currency
      category: data_integrity
      weight: 5

