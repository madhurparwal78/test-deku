- id: visitor_enquiry_is_stored_once_and_invalid_input_is_refused
  purpose: "A visitor sends one enquiry through the routed contact form while bad or bot-like input is refused"
  substeps:
    - kind: browser
      do: "Open /contact/ and press Tab from the top of the page, confirming focus order follows reading order through the form, and confirm icon-only controls such as the menu glyph carry labels"
      cov: "C-UX-36,C-UX-37"
    - kind: browser
      do: "Open /contact/, confirm the contact form consent box starts unticked, send the form, and confirm the error sits beside the consent box, announced to assistive technology, with focus moved to the first contact form error, and that the consent line reads I have read the privacy policy, which I accept."
      cov: "C-CF-164,C-CF-165,C-CF-167,C-FE-39"
    - kind: browser
      do: "Open /en/contact/, send an empty contact form, and confirm the contact form error messages appear in English beside each field before any request leaves the page, and that the submit control is disabled when a submission is in flight"
      cov: "C-CF-189,C-CF-194,C-CF-186"
    - kind: browser
      do: "Tick the consent box, send the enquiry, and confirm the enquiry confirmation reads Thank you. We will reply within two working days."
      cov: "C-CF-166"
    - kind: pytest
      test: test_output.py::test_enquiry_resubmitted_with_the_same_key_is_stored_once
      critical: true
      category: data_integrity
      weight: 5
      cov: "C-CF-156,C-DM-05,C-TR-18 (earned: the test replays one enquiry submission and requires a single stored row),C-CF-185 (earned: the test fetches a fresh key from the key endpoint for the rendering it submits)"
    - kind: pytest
      test: test_output.py::test_enquiry_without_consent_is_refused
      category: validation
      weight: 3
      cov: "C-CF-159,C-DM-12 (earned: the test requires the refused enquiry to leave zero rows behind),C-DC-14 (earned: the refusal must fall in the client-error class, which is what an invalid call is owed),C-CF-193 (earned: the test posts directly to the server and requires the refusal there)"
    - kind: pytest
      test: test_output.py::test_enquiry_with_the_decoy_field_filled_is_refused
      category: validation
      weight: 3
      cov: "C-CF-158"
    - kind: pytest
      test: test_output.py::test_enquiry_sent_immediately_after_the_key_is_refused
      category: validation
      weight: 3
      cov: "C-CF-157 (earned: the test fetches a key and submits at once, less than a second after the key was issued, and requires the refusal)"
    - kind: pytest
      test: test_output.py::test_enquiry_for_a_route_with_no_recipient_reaches_the_default_desk
      category: business_rule
      weight: 3
      cov: "C-CF-155 (earned: declared unobservable, the recruiting service cannot be made unreachable from outside the product),C-CF-181 (earned: declared unobservable, a twenty-four month retention cannot elapse inside a grading session),C-CF-182 (earned: declared unobservable, the brief pins no deletion-request endpoint),C-UF-17 (earned: declared unobservable, a save cannot be made to fail from outside the product),C-CF-160,C-CF-161,C-CF-162 (earned: the test sends a new_business enquiry and requires the new business desk),C-DC-20,C-CF-163 (earned: routing is observed as the recorded routed_to field; no mail service is declared, so the absence of mail has no other signature),C-CF-191,C-CF-192,C-CF-187 (earned: declared unobservable, the slowdown threshold is unpinned and would need a burst of traffic to observe),C-CF-188 (earned: declared unobservable, no mail service is declared, so mail to an arbitrary address has no signature),C-CF-190 (earned: declared unobservable, the brief makes contact uploads optional, so no upload field is pinned),C-CF-205 (earned: declared unobservable, a seven-year retention cannot elapse inside a grading session),C-CF-206 (earned: declared unobservable, a five-year retention cannot elapse inside a grading session),C-CF-207 (earned: declared unobservable, a ten-year retention cannot elapse inside a grading session),C-CF-208 (earned: declared unobservable, deletion requests are handled outside the product screens),C-CN-10 (earned: declared unobservable, the absence of any notification has no signature to observe)"

