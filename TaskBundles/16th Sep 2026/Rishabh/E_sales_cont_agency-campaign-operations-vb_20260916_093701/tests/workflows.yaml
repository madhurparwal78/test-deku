- id: visitor_pages_the_work_index_by_year
  purpose: "A signed-out visitor pages through the public campaign index, filters it by year and reaches the empty state for a year with no work"
  substeps:
    - kind: browser
      do: "Open / and scroll past the first screen, and confirm a sticky new-work chip above the footer promotes the latest campaign and opens that campaign"
      cov: "C-FE-74"
    - kind: browser
      do: "Open /work/?page=2, choose 2024 in the year facet, and confirm choosing a year resets the work index to page one in the address and the pager"
      cov: "C-CF-254"
    - kind: browser
      do: "Open /work/ and confirm the odometer heading lands on the total count of public campaigns without the layout moving, with twelve campaign cards on the page"
      cov: "C-FE-28"
    - kind: browser
      do: "Choose 2025 in the year facet, confirm the chosen year appears in the address as a query parameter, then reload and confirm the filtered year view survives"
      cov: "C-CF-135"
    - kind: browser
      do: "Open /work/?year=2010 and confirm the empty work index says No campaigns in that year yet. Clear the filter to see everything. with a control that clears the filter"
      cov: "C-UF-12,C-UF-13"
    - kind: pytest
      test: test_output.py::test_public_work_index_counts_only_published_campaigns
      critical: true
      category: core_outcome
      weight: 5
      cov: "C-CF-131,C-CF-137,C-DM-17,C-CF-227 (earned: the test requires the English index to list the same campaigns as the Japanese one),C-CF-234 (earned: the test requires rice-field-radio in the English listing),C-DM-26 (earned: the test compares the two locale listings of the seeded campaigns),C-DC-23 (earned: the test reads the index without locale or market and gets the JP public set)"
    - kind: pytest
      test: test_output.py::test_work_index_pages_twelve_campaigns_at_a_time
      category: business_rule
      weight: 3
      cov: "C-CF-130"
    - kind: pytest
      test: test_output.py::test_work_index_page_past_the_end_falls_back_to_the_last_page
      category: validation
      weight: 3
      cov: "C-CF-136,C-CF-255 (earned: the test asks for a page past the end and requires the last existing page)"
    - kind: pytest
      test: test_output.py::test_public_lists_run_newest_first
      category: business_rule
      weight: 3
      cov: "C-CF-253 (earned: the test requires descending years on the first index page),C-CF-256 (earned: the test requires descending dates on the first newsroom page),C-CF-259 (earned: the test requires descending viewed_at in the page-view log),C-DM-34 (earned: the test requires no stories article dated 2019 in the seed)"
    - kind: pytest
      test: test_output.py::test_work_index_year_facet_carries_a_before_bucket
      category: business_rule
      weight: 3
      cov: "C-CF-132,C-CF-133,C-CF-134,C-DC-18 (earned: the test reads year_buckets, items, page and total from the public campaign index shape the contract names)"

