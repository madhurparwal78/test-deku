    - kind: browser
      do: "Toggle the Systems filter twice in quick succession, then press back and confirm each filter change was a history entry that back walks through, the quick double toggle replacing its history entry rather than adding one"
      cov: C-CF-54,C-CF-55
    - kind: browser
      do: "Leave the index, open /work again from the home page's See all eleven link, and confirm sort and view are remembered as preferences while filters are not remembered, so no filter is selected"
