- id: visitor_narrows_the_work_index
  purpose: "A visitor opens the work index, narrows it to systems work, changes the sort and the view, and walks back through the filters"
  substeps:
    - kind: browser
      do: "Open the route /work, which serves the work index, and confirm the label Everything, the heading All Work, the count 11 projects, and a filter bar carrying the pinned label over the client group and discipline group names"
      cov: C-UF-04,C-CF-33,C-CF-34,C-FE-103,C-FE-100
    - kind: browser
      do: "Confirm the client filter chips carry the client labels Verity Biotics, Kestra, Mirror Lab, Dusk Ritual and Quitkit so the work index filters by client, the discipline chips carry the discipline labels Strategy, Product, Brand & Creative, Systems and Spatial Experience, and the filter chips show only values carried by at least one published case study"
      cov: C-FE-97,C-FE-98,C-FE-99,C-CF-36
    - kind: browser
      do: "Select the Systems chip so the work index filters by discipline, confirm exactly two case studies remain, the pressed chip inverts fully and reports its pressed state with the count announced politely, the chip press is a small overshoot acknowledgement among the three movement curves, and the whole work index state lives in the address query string as discipline=systems"
      cov: C-CF-37,C-FE-104,C-FE-120,C-UX-15,C-CF-39
    - kind: browser
      do: "Press the sort chips Newest first, Oldest first and By name so the work index sorts by year or by name with rows moving to their new places, then the view chips Grid and List, confirming the work index shows the case studies in a grid or a list, the list view shows each year at the right in mono, and the address carries the view tokens view=grid and view=list"
