- id: visitor_reads_the_home_page_and_a_case_study
  purpose: "A signed-out visitor scrolls the dark home page, then opens a long case study and follows its chapter rail"
  substeps:
    - kind: browser
      do: "Open the seven-band home page / as a first-time visitor, reading a published page that needs no account, and confirm the long dark home route introducing the designer: the hero holds nine tiles, four cropped at rest by the window edges, the hero name Marisol Andrade inverts as the tiles pass behind it over a transparent rendering surface, and the roles Founder, Designer and Artist sit above the first hero sub line I build experiences at the intersection"
      cov: C-OV-01,C-RL-01,C-FE-36,C-FE-39,C-FE-42,C-FE-40,C-FE-41,C-UF-01,C-OV-09
    - kind: browser
      do: "Still on the home page, confirm the top bar: the name at the top left sits at seven tenths strength behind the nav items, the marks at the right are inline drawings in the text colour with no icon file and carry the labels Email and Network plus the preferences mark, and each nav item's track fills as the visitor moves through that item's section"
      cov: C-FE-21,C-FE-18,C-FE-23,C-FE-22
    - kind: browser
      do: "Scroll into the philosophy band under What I Do and confirm the passage lights up one character at a time, lit passage characters resting dim and lighting up by the squared progress law over a philosophy window of 18.27 characters and an about window of 6.44, its highlighted words switching to the italic display serif as whole words, that editorial type scales with the window while functional labels hold their size, and that the type ladder follows the listed sizes"
      cov: C-FE-55,C-FE-50,C-UX-11,C-FE-17,C-FE-48,C-FE-49
    - kind: browser
      do: "Confirm the five discipline cards Strategy, Product, Brand & Creative, Spatial Experiences and Systems each list their items, that pointing at a card is the only ground change on the home page, that each discipline mark primitive carries its own strength with the systems mark lit from above, and that the Product card and the Spatial Experiences card carry no mark, the two discipline marks absent rather than invented"
      cov: C-FE-56,C-FE-57,C-FE-58,C-FE-19,C-FE-20,C-CN-09
    - kind: browser
      do: "Continue into the warm work band under Selected work with its See all eleven link to /work and confirm seven rows numbered from 01, each work row showing the index title large but dim beside a middle-dot tag line, the rows entering one after another, and pointing at a work-list row lifts one preview image that follows the pointer"
      cov: C-FE-62,C-FE-64,C-FE-65,C-FE-28
    - kind: browser
      do: "Scroll to the about band under Beyond the Brief and About Me and confirm the first paragraph names Thanjavur as the place card trigger, the roles block lists Verity Biotics then Kestra under What I've Been Building, and each rendered date range uses a typographic dash"
      cov: C-FE-66,C-FE-67,C-FE-68,C-FE-69
    - kind: browser
      do: "Reach the contact band and confirm Always curious about new ideas with hello@marisol.example.com as the one email action a visitor is asked to take, the stacked [ EMAIL ] and [ NETWORK ] actions with the network action linking to https://network.example.com/in/marisol-andrade, and the copyright line naming Marisol Andrade with the year 2026"
      cov: C-FE-71,C-FE-72,C-FE-73,C-FE-75,C-OV-05
    - kind: browser
      do: "Open /verity-biotics-product, one of the eleven long-form case studies that answer at their own route at the origin root, and confirm this product case study hero shows the title, the summary and a meta row of three label-value pairs above a wide dimmed image and the opening quote, with the case-study copy already at full contrast on arrival"
      cov: C-OV-02,C-UF-03,C-FE-81,C-FE-94,C-UX-21
    - kind: browser
      do: "Scroll the article and confirm the chapter rail down the left, as on all eight case studies that are articles, marks chapters unread, current or read, with exactly one chapter current, the one whose top most recently passed a fixed line, and that the product route carries the anchors, rail labels and headings of the chapter table"
      cov: C-OV-03,C-CF-88,C-FE-78,C-FE-91
    - kind: browser
      do: "In the article confirm a callout card whose labels include The idea, The insight or The real output over a large quote, an insight card whose outlined button inverts fully on hover, and inline image captions aligned to the image rather than the text column"
      cov: C-FE-82,C-FE-84,C-FE-85
    - kind: browser
      do: "At the foot confirm the more block's See all link goes to /work, and confirm the case-study chrome carries Back to portfolio, the Case Study label, the save control and the preferences mark, with the case-study footer reading All rights reserved beside the Privacy link"
      cov: C-FE-86,C-FE-25,C-FE-29
    - kind: browser
      do: "Reload / and confirm every tile shows its still at once, swapping to film only when ready, that a tile outside the window has no film attached, that every image and film box is reserved so nothing jumps as bytes arrive, and that the scroll-driven work of the one scroll source runs smoothly in one frame loop per page"
      cov: C-TR-23,C-TR-24,C-TR-26,C-TR-27,C-FE-30
    - kind: browser
      do: "Using the page's computed styles while scrolling, confirm no transition is declared on every property of every element, no scroll handler writes to an element without a layout box, and no more than 64 elements carry a compositing hint at any moment"
      cov: C-FE-08,C-FE-33,C-FE-52
    - kind: browser
      do: "Throughout, confirm each tile chases the tile's target and settles a beat after scrolling stops, and that the site shows each glossary effect as the glossary describes the effect: parallax rate, trailing lag, lit passage, frosted card and difference blend"
      cov: C-FE-38,C-FE-121
    - kind: browser
      do: "On the home page confirm five hero tiles, the top left, top centre, middle centre, bottom left and bottom right, are muted looping films while the other four tiles are stills, and on this desktop without device orientation the tiles follow the pointer"
      cov: C-FE-134,C-FE-135
    - kind: browser
      do: "Using computed styles on the home route, confirm the font stack adds Host Grotesk before sans-serif, the hero name rates are 5vw, 10vw and 12vw with section heading rates 5vw, 5vw and 8vw, the functional sizes hold at 16px, 13.6px, 12.8px, 10.4px, 9.6px, 9.92px, 8.8px, 8.32px, 8px and 7.2px, and line ratios run 1.0, 1.2, 1.35, 1.5, 1.75, 1.8, 1.85 and 2.0 across the listed roles"
      cov: C-FE-129,C-FE-130,C-FE-131,C-FE-132
    - kind: browser
      do: "Using computed styles on /verity-biotics-product, confirm section headings render at 800, the article body renders 16px with a 1.85 line ratio, body copy uses a 1.8 line ratio, and the article body falls to 14.08px on a phone"
      cov: C-FE-13,C-FE-16,C-FE-15
    - kind: browser
      do: "Compare the inks from the pure near-white of the hero name down to the decorative minimum and confirm the inks step down in the listed order, the frosted card shadow is the only shadow on the site, hairlines and dividers are a deep neutral, and corners across the site are almost square"
      cov: C-FE-127,C-FE-128,C-UX-31,C-UX-33
    - kind: browser
      do: "Confirm the mail link and [ EMAIL ] rest at the primary ink and brighten to the pure near-white on hover, the home route's accent is a near-white warm neutral warmer than the case-study accent, and the home route's accent and heading stack differ from the case-study routes'"
      cov: C-UX-32,C-UX-06,C-FE-07
    - kind: browser
      do: "Read the computed text and border colour of every link on the home page and on a case study, and confirm no link shows the browser's default blue as text or border"
      cov: C-UX-09
    - kind: browser
      do: "Compare the home hero name at a 990 pixel window and a 1440 pixel window and confirm the hero name renders 72px at desktop and 99px at 990 wide, so the hero name is larger on a tablet than on a laptop, and the layout holds at every viewport width across desktop, tablet and phone"
      cov: C-UX-12,C-FE-14,C-UX-22
    - kind: browser
      do: "Confirm the featured band carries From Idea to Reality over Featured Work, each featured card shows the index title, the client label in capitals and the years, and each featured card writes the years as the start year plus the end year or Active, joined by a middle dot"
      cov: C-FE-59,C-FE-61,C-FE-138
    - kind: browser
      do: "Confirm the work band link to /work reads See all followed by the published count in words, See all eleven for the seeded set"
      cov: C-FE-136
    - kind: browser
      do: "Tab to a nav word, a featured card, a work row and a discipline card and confirm every hover change has a keyboard-focus equivalent, then confirm the active nav item, a pressed work-index chip and the current rail item show meaning never carried by colour alone, each marked by shape, size or weight too"
      cov: C-FE-119,C-UX-30
    - kind: browser
      do: "On /verity-biotics-product confirm the product hero meta labels come from Company or Brand, Role, Focus or Format, and Year or Period, and article emphasis steps one notch heavier and one notch brighter, nothing else"
      cov: C-FE-139,C-FE-133
    - kind: browser
      do: "Inspect the accessibility tree and confirm discipline marks are hidden from assistive technology, split passages keep the whole sentence as accessible text with the individual letters hidden, the icon-only links carry labels that exist for the keyboard even when unpainted, hero films are decorative and silent with every player showing the poster first, and any film with speech carries captions"
      cov: C-FE-149,C-UX-28,C-UX-27,C-UX-29,C-FE-147
    - kind: browser
      do: "At a 390 pixel phone width open /verity-biotics-product and confirm the rail is absent on a phone, the chapter rail giving way to a filling hairline under the chrome, then on the home page confirm the hero tiles are stills only on a phone, and every control has a comfortable touch target on a phone"
      cov: C-FE-79,C-FE-04,C-FE-43,C-UX-34
    - kind: browser
