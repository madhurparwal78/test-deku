schema_version = "1.4"

[task]
name = "deku/motion-portfolio-dossier-vb"
version = "1.0.0"
description = "A dark, motion-led portfolio for an independent product and brand designer, with a scrolling home page, eleven long-form case studies with chapter rails, a filterable work index with computed suggestions, a three-level motion preference, a server-backed reading list that remembers where a reader stopped, and a private studio where drafts stay invisible until published."
authors = [
  "abhishek.shawa@ethara.ai" ,
  "rishabh.tiwari@ethara.ai"
]
uuid_v5 = "9a6d2461-6660-5892-8a5c-fb9f86acf037"
keywords = ["greenfield", "solo_founder", "python", "postgres", "minio", "portfolio"]

[metadata]
category     = "Greenfield"
sub_category = "solo_founder"
domain          = "content-publishing"
pattern         = "content-publishing"
service_profile = "P4-db-storage"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = ""
task_code       = "S_conte_cont_motion-portfolio-dossier-vb_20260916_095602"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "cookie_choice,form_validation,no_broken_links,privacy_page,security_headers"
grader_version  = "0.22.0"

language     = "python"
archetype    = "motion-portfolio-dossier"
variant      = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 200
tokens_expected = 7500000
contributor_id  = "rishabh.tiwari@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"
storage = "minio"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-app-pw-2026@postgres:5432/ethara}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-app-pw-2026@postgres:5432/ethara}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-deku}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-deku-storage-key-2026}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-deku-storage-secret-2026}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev-2026@postgres:5432/ethara}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-deku}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-deku-storage-key-2026}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-deku-storage-secret-2026}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_STORAGE = "minio" }

[[artifacts]]
source      = "/app"
destination = "app"
