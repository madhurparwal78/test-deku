- id: visitor_generates_one_anonymous_model
  purpose: A visitor with no account generates one model from a pre-computed sample and downloads the mesh
  substeps:
    - kind: browser
      do: Open / as a visitor holding no session and confirm the four sample images sneaker, mug, chair and plant are offered
      cov: C-CF-96
    - kind: browser
      do: Confirm the credit cost and the licence CC-BY-4.0 are both shown beside the generate control before pressing it
      cov: C-CF-31
    - kind: pytest
      test: test_output.py::test_samples_endpoint_serves_four_precomputed_assets
      category: presentation
      weight: 1
      cov: C-CF-97
    - kind: pytest
      test: test_output.py::test_job_submission_returns_a_queued_job
      category: core_outcome
      weight: 5
      cov: C-CF-42
    - kind: pytest
      test: test_output.py::test_job_reaches_a_terminal_completed_state
      critical: true
      category: core_outcome
      weight: 5
      cov: C-CF-41

- id: creator_generates_and_saves_a_mesh
  purpose: A signed-in creator spends a credit, watches the job complete and saves the mesh into the library
  substeps:
    - kind: browser
      do: Sign in as creator@example.com with the password documented in /app/USER_README.md
      cov: C-CF-03
    - kind: browser
      do: Upload a photograph through the file input and change the tier from standard to pro
      cov: C-CF-35
    - kind: browser
      do: Confirm the displayed cost changes from 5 to 10 and the confirmation modal names customer-owned
      cov: C-UF-14
    - kind: pytest
      test: test_output.py::test_seeded_creator_signs_in_with_pinned_password
      category: security
      weight: 5
      cov: C-DM-42
    - kind: pytest
      test: test_output.py::test_default_generator_selection_costs_ten_credits
      category: business_rule
      weight: 3
      cov: C-CF-27
    - kind: pytest
      test: test_output.py::test_cost_charged_equals_cost_shown
      critical: true
      category: data_integrity
      weight: 5
      cov: C-CF-29
    - kind: pytest
      test: test_output.py::test_completed_asset_carries_three_download_formats
      category: business_rule
      weight: 3
      cov: C-CF-64
    - kind: pytest
      test: test_output.py::test_job_records_its_octree_and_inference_parameters
      category: data_integrity
      weight: 5
      cov: C-CF-16

- id: creator_library_filters_compose
  purpose: Library filters for status, tag and favourite apply together and archiving leaves the deletion clock running
  substeps:
    - kind: browser
      do: Open /my-assets and apply the status filter completed with the tag prop and the favourite filter together
      cov: C-CF-90
    - kind: browser
      do: Archive Harbour Crane and confirm the asset leaves the default view while its deletion date is unchanged
      cov: C-CF-91
    - kind: pytest
      test: test_output.py::test_library_filters_compose
      category: business_rule
      weight: 3
      cov: C-CF-89 (earned: the substep runs test_library_filters_compose, whose assertions read the value this item pins)
    - kind: pytest
      test: test_output.py::test_archiving_leaves_the_deletion_date_unchanged
      category: data_integrity
      weight: 5
      cov: C-DM-34

- id: creator_downloads_two_formats_for_one_credit
  purpose: Downloading a second representation of one asset spends no further credit and creates no second entry
  substeps:
    - kind: browser
      do: Open a completed asset in the detail pane and download the GLB, then the STL
      cov: C-FE-16
    - kind: browser
      do: Confirm the download history shows two entries and the credit balance moved once
      cov: C-CF-68
    - kind: pytest
      test: test_output.py::test_second_download_creates_no_second_asset
      critical: true
      category: data_integrity
      weight: 5
      cov: C-CF-66
    - kind: pytest
      test: test_output.py::test_download_events_are_recorded_per_representation
      category: data_integrity
      weight: 5
      cov: C-CF-67

- id: foreign_creator_cannot_read_another_library
  purpose: A second creator is refused an asset owned by the first, at the API, and the row is untouched
  substeps:
    - kind: browser
      do: Sign in as creator2@example.com and request the asset Harbour Crane owned by creator@example.com
      cov: C-RL-05
    - kind: pytest
      test: test_output.py::test_foreign_creator_reading_an_asset_is_refused
      critical: true
      category: security
      weight: 5
      cov: C-RL-14 (earned: the substep runs test_foreign_creator_reading_an_asset_is_refused, whose assertions read the value this item pins)
    - kind: pytest
      test: test_output.py::test_foreign_creator_patching_an_asset_is_refused
      category: security
      weight: 5
      cov: C-RL-07
    - kind: pytest
      test: test_output.py::test_foreign_asset_row_is_unchanged_after_a_refused_read
      category: security
      weight: 5
      cov: C-DM-19 (earned: the substep runs test_foreign_asset_row_is_unchanged_after_a_refused_read, whose assertions read the value this item pins)

- id: unauthenticated_library_request_is_denied
  purpose: A request with no session is refused at the API and a wrong password discloses nothing
  substeps:
    - kind: browser
      do: Request /my-assets with no session and confirm the app refuses rather than rendering another account's library
      cov: C-UF-12
    - kind: pytest
      test: test_output.py::test_library_request_without_session_is_refused
      critical: true
      category: security
      weight: 5
      cov: C-CF-06
    - kind: pytest
      test: test_output.py::test_anonymous_request_for_an_asset_is_refused
      category: security
      weight: 5
      cov: C-RL-16
    - kind: pytest
      test: test_output.py::test_sign_in_with_wrong_password_is_refused
      category: security
      weight: 5
      cov: C-CF-04

- id: concurrent_submissions_leave_one_accepted
  purpose: Two jobs started in the same instant against a balance with room for one leave exactly one accepted
  substeps:
    - kind: browser
      do: Sign in as creator3@example.com and confirm the balance shows 5 credits
      cov: C-DM-48
    - kind: pytest
      test: test_output.py::test_two_simultaneous_submissions_leave_one_accepted
      critical: true
      category: data_integrity
      weight: 5
      cov: C-CF-56 (earned: the substep runs test_two_simultaneous_submissions_leave_one_accepted, whose assertions read the value this item pins)
    - kind: pytest
      test: test_output.py::test_balance_never_falls_below_zero
      category: data_integrity
      weight: 5
      cov: C-DM-29
    - kind: pytest
      test: test_output.py::test_submission_over_balance_is_refused
      category: validation
      weight: 3
      cov: C-CF-54

- id: failed_job_refunds_the_reservation
  purpose: A job that ends failed returns its reservation in full and the append-only ledger still balances
  substeps:
    - kind: browser
      do: Open a failed job in the library and confirm the refund is stated
      cov: C-CF-49
    - kind: pytest
      test: test_output.py::test_failed_job_returns_the_reservation_in_full
      critical: true
      category: data_integrity
      weight: 5
      cov: C-DM-27
    - kind: pytest
      test: test_output.py::test_credit_ledger_rows_are_append_only
      category: data_integrity
      weight: 5
      cov: C-DM-23
    - kind: pytest
      test: test_output.py::test_balance_equals_the_sum_of_ledger_amounts
      category: data_integrity
      weight: 5
      cov: C-DM-26

- id: licence_and_retention_survive_a_plan_change
  purpose: A licence stamped at creation and a deletion date set at creation both survive a later plan change
  substeps:
    - kind: browser
      do: Move creator2@example.com from the free plan to pro and reopen Paper Lantern
      cov: C-CF-72
    - kind: pytest
      test: test_output.py::test_licence_survives_a_plan_upgrade
      critical: true
      category: data_integrity
      weight: 5
      cov: C-DM-30 (earned: the substep runs test_licence_survives_a_plan_upgrade, whose assertions read the value this item pins)
    - kind: pytest
      test: test_output.py::test_deletion_date_survives_a_downgrade
      category: data_integrity
      weight: 5
      cov: C-DM-33
    - kind: pytest
      test: test_output.py::test_licence_change_request_is_refused
      category: validation
      weight: 3
      cov: C-CF-73
    - kind: pytest
      test: test_output.py::test_queue_placement_is_recorded_at_submission
      category: business_rule
      weight: 3
      cov: C-DM-35

- id: duplicate_idempotency_key_returns_the_existing_job
  purpose: A resubmission carrying an existing key yields the job that already exists and spends nothing further
  substeps:
    - kind: browser
      do: Submit a generation, then resubmit the same request and confirm one job appears in the library
      cov: C-CF-51 (earned: the walked step puts this ask on screen at the point the step describes)
    - kind: pytest
      test: test_output.py::test_repeated_idempotency_key_returns_the_existing_job
      critical: true
      category: data_integrity
      weight: 5
      cov: C-CF-53
    - kind: pytest
      test: test_output.py::test_monthly_grant_is_idempotent_within_a_period
      category: data_integrity
      weight: 5
      cov: C-DM-36

- id: anonymous_allowance_limit_is_refused
  purpose: A second anonymous generation is refused by name rather than with a generic failure
  substeps:
    - kind: browser
      do: As a visitor who has already generated once, press generate again and read the refusal
      cov: C-CF-100 (earned: the walked step puts this ask on screen at the point the step describes)
    - kind: browser
      do: Confirm the refusal offers registration as the way forward
      cov: C-CF-101
    - kind: pytest
      test: test_output.py::test_second_anonymous_generation_is_refused
      critical: true
      category: validation
      weight: 5
      cov: C-CF-99

- id: expired_claim_token_is_refused
