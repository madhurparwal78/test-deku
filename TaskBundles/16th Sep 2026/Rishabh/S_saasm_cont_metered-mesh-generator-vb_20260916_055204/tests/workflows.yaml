- id: stored_objects_land_in_the_private_bucket
  purpose: A completed job writes its mesh objects into the object store and nobody else can read them
  substeps:
    - kind: browser
      do: Complete a generation as creator@example.com and download the resulting GLB
      cov: C-CF-63 (earned: the walked step puts this ask on screen at the point the step describes)
    - kind: pytest
      test: test_output.py::test_completed_job_writes_its_glb_object_to_the_bucket
      critical: true
      category: data_integrity
      weight: 5
      cov: C-TR-12 (earned: the substep reads the glb representation row and confirms the object it names exists in the bucket)
    - kind: pytest
      test: test_output.py::test_completed_job_writes_its_obj_and_stl_objects_to_the_bucket
      category: data_integrity
      weight: 5
      cov: C-CF-64 (earned: the substep reads the obj and stl representation rows and confirms each named object exists in the bucket)
    - kind: pytest
      test: test_output.py::test_bucket_is_not_publicly_readable
      critical: true
      category: security
      weight: 5
      cov: C-TR-13
    - kind: pytest
      test: test_output.py::test_foreign_creator_download_of_an_object_is_refused
      critical: true
      category: security
      weight: 5
      cov: C-RL-15 (earned: the substep requests the download route from a second account session and from no session, and asserts the refusal status of each)

