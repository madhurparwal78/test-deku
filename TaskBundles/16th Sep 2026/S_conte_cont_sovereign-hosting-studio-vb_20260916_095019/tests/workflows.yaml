- id: visitor_reads_the_home_argument
  purpose: "A signed-out visitor scrolls the home page as it writes and draws itself, and follows the capability links"
  substeps:
    - kind: browser
      do: "Scroll the pinned cards slowly and confirm each pinned card panel has an opaque ground, a card body starts revealing a little way into the hold while the philosophy statement starts later in a longer hold, in card 02 interface is white while api, workers and postgres are mid neutral, the card 03 progress fill is drawn at twice the track stroke, in card 03 LCP 0.6s is amber while CLS 0.00 and 100 / 100 are mid neutral, below the amber top slot the card 04 slots fade downward, the card 04 padlock is a body with a curved shackle, card 05 is the widest of the four drawings, the card 05 diagonals are drawn at a quarter of the perimeter strength, the card 05 city names read Falkenstein, Frankfurt, Eygelshoven and Eygelshoven, and below the collapse width a card keeps its timing"
      cov: C-FE-194,C-FE-195,C-FE-196,C-FE-197,C-FE-198,C-FE-199,C-FE-200,C-FE-201,C-FE-202,C-FE-203,C-FE-204
    - kind: browser
      do: "Look at the hero foot, the pinned cards and the contact prompt and confirm the hero foot separates the city names by a middle dot with a space either side, the word Scroll sits beside a short vertical line fading downward, the slightly wider left side of a pinned card holds a tag row of amber number plus eyebrow, the heading, the body and the arrow link with the drawing on the right, the card 02 drawing shows an amber box above two boxes over a fainter box joined by four elbow lines with an amber dot in the top box, the card 03 drawing shows a window frame with a title bar rule, three dots, three rounded text bars and an amber pill, the card 04 drawing shows six slots with the top slot amber, three status dots and brackets running off each side, the card 05 perimeter is one continuous stroke with an amber dot at each corner, an amber chevron leads the contact prompt, and on /uptime the status notice link carries a drawn arrow of two strokes in the link colour"
      cov: C-FE-170,C-FE-171,C-FE-172,C-FE-173,C-FE-174,C-FE-175,C-FE-180,C-FE-181,C-FE-183
    - kind: browser
      do: "Hover the arrow links while the page reveals and confirm the mono arrow link is amber capitals followed by an arrow, link plus arrow turning white on hover, a hover changing a background or a border takes a touch longer than a hover changing a colour, a hover or a style change elsewhere on the page never fights the reveal, and words, drawings, hairline and hero are painted together in one frame"
      cov: C-UX-64,C-FE-169,C-FE-176,C-TR-35
    - kind: browser
      do: "Move through /, /about and /uptime, where smoothed scrolling runs only, by keyboard focus, scroll-into-view, back and forward, scrollbar drag, a window resize, a rotation and a font arrival, and confirm each one updates the reveal, native scrolling is never disabled, the punctuation after an amber phrase lights as a step of its own, and the long dash reveals as a word of its own"
      cov: C-FE-143,C-FE-145,C-FE-146,C-FE-147,C-FE-179
    - kind: browser
      do: "Scroll slowly through the pinned capability cards and confirm each capability card is three windows tall around a one-window panel, the outgoing card's text stays selectable, a card body reveal finishes with a little over a fifth of the hold to spare, the philosophy statement reveal finishes with a seventh of the hold to spare, a filled dot appears rather than draws, a shape that reports no length fades in instead of drawing, and the card 05 city names sit in the fainter neutral"
      cov: C-FE-139,C-FE-140,C-FE-141,C-FE-142,C-FE-149,C-FE-150,C-FE-151
    - kind: browser
      do: "Look closely at the home page chrome and confirm the grain never shows colour, the chrome layers never intercept the pointer so every link under them still takes a click, selected text sits on two-thirds amber, structural strokes are translucent white, and the overscroll area past the top or bottom of the page is never white"
      cov: C-FE-07,C-FE-133,C-FE-135,C-FE-137,C-FE-138,C-FE-148
    - kind: browser
      do: "Scroll the four cards and the two founder statements until revealed and confirm card 02 marks maintainable and entirely yours in amber, card 03 marks under a second and no tracking scripts, card 04 marks our own hardware and GDPR is the floor, card 05 marks Our racks, our keys, statement 01 - The craft marks owned outright, documented and hardware I can point to, and statement 02 - The principle marks the starting condition and answerable to you"
      cov: C-FE-109,C-FE-110,C-FE-111,C-FE-112,C-FE-113,C-FE-114
    - kind: browser
      do: "Hover the home page links and buttons and confirm the underlined text link is a mid neutral sentence-case link turning white on hover, buttons are fully rounded, a hover changing a background or a border takes a touch longer than a hover changing a colour, nothing loops quickly, and the teaser is the only link on / to the founder page"
      cov: C-UX-53,C-UX-59,C-FE-152,C-FE-153
    - kind: browser
      do: "Open / and confirm the site presents Vela Studio as a one-person software studio in Marburg, the hero lines rise into place one after another on load, the hero shows the two-line headline, the lede, one solid amber pill button with near-black text and an underlined text link, with the three city names and the word Scroll along the foot, the hero stays still when the real font arrives, and the story route is spacious with one proportional side gutter, then scroll and confirm the hero drifts up more slowly than the page as it fades"
      cov: C-OV-01,C-CF-192,C-UX-14,C-UX-25,C-FE-15,C-FE-16
    - kind: browser
      do: "Scroll into the philosophy statement and confirm the home page reveals the statement word by word as the reader scrolls, the pinned section holds still as the content advances, the reveal follows scroll progress rather than a timer, a hairline under the statement fills from the left as progress, and a slow frame never makes the reveal jump or skip, then scroll back up and confirm the words un-reveal in exactly the reverse order"
      cov: C-OV-02,C-CF-183,C-CF-187,C-CF-188,C-CF-191,C-TR-21
    - kind: browser
      do: "Scroll with the wheel through What we build and the four pinned capability cards and confirm wheel scrolling glides, each card diagram draws one line at a time in the listed order and finishes about two thirds of the way through the card hold, the words beside the drawing never drift apart from it, a long page of revealed paragraphs scrolls as smoothly at the bottom as at the top, and the scroll reveal adds nothing visible of its own to the page"
      cov: C-OV-03,C-CF-189,C-CF-190,C-TR-20,C-TR-25,C-FE-31,C-FE-98
    - kind: browser
      do: "Return to the top, press See what we build and confirm the page glides, taking a moment, and lands on card 02 with its drawing already complete"
      cov: C-CF-193,C-CF-195
    - kind: browser
      do: "Scroll to the end and confirm the command-line contact screen reading talk to an engineer_ with a blinking block cursor, the reply note and the amber mail link, then confirm the teaser below links to the founder page"
      cov: C-UX-17
    - kind: browser
      do: "Use find-in-page for a word in card 04 and confirm the page lands on that card with the words around the match revealed"
      cov: C-FE-32
    - kind: pytest
      test: test_output.py::test_home_diagrams_are_complete_and_described
      category: presentation
      weight: 1
      cov: "C-CF-209,C-FE-17,C-FE-18,C-FE-19,C-FE-20,C-FE-21,C-FE-22,C-FE-23,C-FE-24,C-FE-42,C-UX-38,C-UX-40 (earned: the test reads the four drawing descriptions, the drawing words, the two anchors and every image alt attribute with scripts off)"
    - kind: pytest
