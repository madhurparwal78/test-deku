      do: "Look over /, /about and /uptime and confirm the hero fills the first screen, the four pinned cards run back to back with nothing stacked as moving layers, the card number keeps its digits with wide tracking, the footer links, the teaser and the mail link keep their written case with slight tracking, the contact line keeps its written case with tight tracking, and the portal host inside the notice link keeps its written case with no added tracking"
      cov: C-UX-67,C-UX-68,C-UX-69,C-UX-70,C-FE-219,C-FE-220
    - kind: browser
      do: "Look over / and /uptime and confirm sentences use a near-white neutral, grotesk headings are tracked tight, the legal page heading is the tightest-tracked text on the site, text is antialiased in greyscale on every route, the pinned statement holds a narrow measure of about twenty characters, each hero line is held on one line on wider windows with the second in the mid neutral, the uptime bars are barely rounded and are no targets, and target size comes from padding rather than a bigger visual box"
      cov: C-UX-60,C-UX-61,C-UX-62,C-UX-63,C-FE-160,C-FE-162,C-FE-163,C-FE-164
    - kind: browser
      do: "Tab through / with the keyboard and confirm focus order follows the page, text before drawing, and focusing an element below the fold scrolls to the element without snapping back"
      cov: C-UX-50,C-UX-51
    - kind: browser
      do: "Tab through /about with the keyboard and confirm every control is reached in page order with a visible amber focus ring, the focus ring on the amber button turns dark, every genuine target is comfortably sized for a finger, and the decorative grain, glows and dots are hidden from assistive technology in the accessibility tree"
      cov: C-UX-35,C-UX-37,C-UX-39
    - kind: browser
      do: "At a phone width open /, /about and /uptime and confirm each capability card puts its drawing below its text, the founder page shows the small avatar above the text, the headline wraps, and the uptime bars are fewer and wider"
      cov: C-UX-28,C-UX-29,C-UX-30
    - kind: browser
      do: "Look over the home page, the founder page, the status board and the legal pages and confirm the product carries one language with no locale switch, the board offers no incident email subscription, the product offers no external booking link, and the site carries no payment, no comment, no chat, no newsletter and no search"
