      do: "Reload /uptime and confirm the status skeleton is three placeholder cards, each with two shimmering lines over a row of bars, typing in the page stays responsive as the status board applies new values without blocking input, the status tiles and the card values fill rows by a minimum width, a status card value is 16px, and each incident history row shows the system name beside the opening time"
