      cov: "C-CF-172,C-CF-173,C-CF-174,C-CF-175,C-CF-176,C-CF-177,C-CF-178,C-CF-179,C-CF-180,C-CF-181 (earned: the test resolves every card link on the home page, including after publishing and withdrawing a later hosting record)"
    - kind: pytest
