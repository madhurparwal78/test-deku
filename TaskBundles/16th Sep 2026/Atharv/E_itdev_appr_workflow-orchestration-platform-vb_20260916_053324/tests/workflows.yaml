- id: visitor_compares_plans
  purpose: A visitor switches the billing period and one plan's volume, and only the affected prices change
  substeps:
    - kind: browser
      do: Open the pricing route and confirm four plans render in order, Starter then Pro then Business then Enterprise, with the annual period already selected
      cov: C-CF-66
    - kind: browser
      do: Switch the billing period control to Monthly and confirm every visible price changes without the route changing
      cov: C-CF-67
    - kind: browser
      do: Confirm the plan column, the banner below the table and the alternatives pair are one card component in different background variants, each carrying the warm hairline along its top edge
      cov: C-FE-09
    - kind: browser
      do: Confirm the button has three gradient variants across the plan action, the banner action and the neutral action, each carrying a transparent veil layer at rest that appears only on hover
      cov: C-FE-10
    - kind: browser
      do: Point at a navigation entry and confirm its colour settles before any movement in the interface finishes
      cov: C-UX-09
    - kind: browser
      do: Point at the primary plan action and confirm a pale veil rises over it while the orange run swings direction, with the button staying exactly where it is
      cov: C-UX-11
    - kind: browser
      do: Select a different tab on the home route role strip and confirm the chosen tab is marked by a short glowing rail down its left side rather than an underline
      cov: C-UX-14
    - kind: pytest
      test: test_output.py::test_plan_prices_switch_between_monthly_and_annual
      category: business_rule
      weight: 3

- id: visitor_searches_node_catalogue
  purpose: A visitor searches and facets the connector catalogue and the result count follows the query
  substeps:
    - kind: browser
      do: Open the integrations route and type part of a connector name in lower case into the search field, confirming the free text matches name plus description case insensitively
      cov: C-CF-74
    - kind: browser
      do: Confirm the result count above the grid reports a number followed by the word integrations
      cov: C-CF-77
    - kind: browser
      do: Confirm the segmented control above the results offers All Types, Regular, Trigger and Core Nodes, with the chosen one filled and the rest transparent
      cov: C-CF-75
    - kind: browser
      do: Confirm the sort control on the right of the result header reads Sort followed by Popularity before anything is changed
      cov: C-CF-76
    - kind: browser
      do: Search for a string no connector can match and confirm the grid renders a sentence saying nothing matched rather than an empty area
      cov: C-CF-82
    - kind: pytest
      test: test_output.py::test_catalogue_search_filters_and_counts
      category: business_rule
      weight: 3

- id: visitor_reads_case_study
  purpose: A visitor opens a case study article from its card and sees the full quote and its attribution
  substeps:
    - kind: browser
      do: Open the case studies route and press Read Case Study on the Vantage card
      cov: C-CF-83
    - kind: pytest
      test: test_output.py::test_case_study_article_carries_its_quote
      category: business_rule
      weight: 3

- id: public_routes_carry_their_own_metadata
  purpose: Every public route declares its own title and description and the site declares a favicon
  substeps:
    - kind: browser
      do: Open the home route and then the pricing route and confirm the browser tab title differs between them
      cov: C-CF-60
    - kind: browser
      do: Open the home, pricing and case studies routes and confirm no marketing route renders a live run of a workflow
      cov: C-OV-05
    - kind: browser
      do: Confirm the body text on the home route reads clearly against its background, meeting the WCAG AA contrast bar
      cov: C-UX-18
    - kind: browser
      do: Confirm every icon-only control in the header and the footer carries a text alternative a screen reader announces
      cov: C-UX-19
    - kind: browser
      do: Confirm every content image carries alternative text and each decorative image declares itself decorative
      cov: C-UX-21
    - kind: browser
      do: Open each of the home, product overview, AI, pricing, integrations, enterprise, case studies, contact, alternatives and privacy routes in turn and confirm each one renders its own content
      cov: C-CF-59
    - kind: browser
      do: Confirm the header carries six entries and that Product, Use cases, Docs and Community each drop a panel while Enterprise and Pricing go straight to their routes
      cov: C-UF-08
    - kind: browser
      do: Confirm the product is dark only on every route, with no control anywhere offering a theme toggle
      cov: C-UX-01
    - kind: browser
      do: Confirm the palette is consumed by name rather than declared per page, by checking the ground, the surface and the text hold the same custom properties across the home, pricing and integrations routes
      cov: C-UX-02
    - kind: browser
      do: Confirm the light pink conference colouring appears only in the announcement bar and nowhere else on any route
      cov: C-UX-06
    - kind: browser
      do: Confirm the consent dialog offers decline all and accept all as two presses of the same size at the same prominence, then decline and confirm the site still works
      cov: C-CF-91
    - kind: browser
      do: Confirm the announcement bar sits at the top of the home route as a card whose lower corners are rounded and whose upper corners are square
      cov: C-FE-01
    - kind: browser
      do: Scroll the home route to its footer and confirm the header stays at the top of the window at the same height throughout
      cov: C-FE-03
    - kind: browser
      do: Point at the Product entry in the header, confirm a panel drops down, then press Escape and confirm the panel closes with focus back on its trigger
      cov: C-FE-05
    - kind: browser
      do: Scroll to the footer and confirm the warm glow behind it fades in from the top edge rather than cutting a hard line against the section above
      cov: C-FE-06
    - kind: browser
      do: Confirm every icon, the chevron beside a panel name and the arrow ending a card link, is geometry drawn inline that takes the colour of the text beside it rather than a font or a fetched file
      cov: C-FE-08
    - kind: browser
      do: Confirm the home hero headline sets two lines with the first line in a lighter weight than the second
      cov: C-FE-11
    - kind: browser
      do: Confirm the second hero line reads brighter than the first, so the eye lands on the second
      cov: C-FE-12
    - kind: browser
      do: Watch the two marquee rows of connector tiles on the home route and confirm the rows run at cycle lengths with no common factor, so the rows never align
      cov: C-UX-10
    - kind: pytest
      test: test_output.py::test_public_routes_carry_distinct_titles_and_descriptions
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_favicon_is_served_and_declared
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_security_headers_and_no_frontend_secrets
      category: security
      weight: 5

- id: unknown_address_is_invalid
  purpose: An address that does not exist renders the product's own not-found page and answers not found
  substeps:
    - kind: browser
      do: Open a made-up address under the site origin and confirm the product's own not-found page renders with a way back to the home route
      cov: C-CF-63
    - kind: browser
      do: Confirm the not-found page renders with no announcement bar, no header and no footer, just the headline, the subhead and one action centred in the window
      cov: C-FE-15
    - kind: pytest
      test: test_output.py::test_unknown_address_answers_not_found
      category: presentation
      weight: 1

- id: operator_signs_in_to_the_console
  purpose: An operator signs in with the seeded credentials and reaches the project list
  substeps:
    - kind: browser
      do: Sign in as operator@example.com with the password deku-demo-pw-2026 and confirm the person sees exactly the projects holding a membership for that person, which is Platform Ops alone
      cov: C-CF-07
    - kind: browser
      do: Request a console route while signed out and confirm the app redirects to sign-in, then sign in and confirm it lands on the console route that was asked for
      cov: C-UF-01
    - kind: browser
      do: Sign in from the sign-in route with no pending destination and confirm the app lands on the project list
      cov: C-UF-02
    - kind: browser
      do: Sign out, confirm the app returns to the home route, then request a console route again and confirm it redirects to sign-in
      cov: C-UF-03
    - kind: pytest
      test: test_output.py::test_operator_login_returns_token
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_health_endpoint_returns_200
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_user_readme_records_the_seeded_logins
      category: presentation
      weight: 1

- id: operator_saves_a_workflow_version
  purpose: An operator adds a step to a workflow and saving writes a new immutable version
  substeps:
    - kind: browser
      do: Open Platform Ops, then Workflows, then Incident triage, and confirm five steps render on the canvas beside the step list
    - kind: browser
      do: Add a step as a new row at the end of the step list, name it Notify on call, save, and confirm the version number in the canvas header increases
    - kind: pytest
      test: test_output.py::test_saved_workflow_version_is_persisted_and_immutable
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeded_rows_exist_for_every_project_and_workflow
      category: data_integrity
      weight: 5

- id: run_is_queued_and_dispatched_to_a_worker
  purpose: Starting a run queues it and a worker claims it, recording the worker identifier
  substeps:
    - kind: browser
      do: Press Run on Incident triage and confirm starting the run places the run on the queue at status new, as a card in the first column of the run board
      cov: C-CF-24
    - kind: pytest
      test: test_output.py::test_manual_run_is_queued_then_claimed_by_a_worker
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_run_steps_record_one_row_per_attempt
      category: data_integrity
      weight: 5

- id: run_pauses_for_human_approval
  purpose: The run reaches the approval step, parks at waiting and releases its worker
  substeps:
    - kind: browser
      do: Open the run board and confirm the run sits in the waiting for approval column carrying the step name Wait for approval
      cov: C-CF-35
    - kind: browser
      do: Confirm success reads as a soft teal, failure as the accent red, in progress as a vivid cyan and waiting as a light orange, each with a word beside it so the state is never told by colour alone
      cov: C-UX-05
    - kind: pytest
      test: test_output.py::test_approval_step_parks_the_run_at_waiting
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_waiting_run_holds_no_worker_row
      critical: true
      category: data_integrity
      weight: 5

- id: approver_resumes_the_paused_run
  purpose: An approver in the run's project approves it and the run resumes to succeeded
  substeps:
    - kind: browser
      do: Sign in as approver@example.com with the password deku-demo-pw-2026 and confirm only an approver belonging to the run's project decides that run, by pressing Approve on the waiting run in Platform Ops
      cov: C-CF-39
    - kind: browser
      do: Confirm a confirmation page opens carrying the run identifier and the word Approved
    - kind: pytest
      test: test_output.py::test_approver_decision_resumes_the_run_to_succeeded
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_audit_event_is_stored_for_every_approval_decision
      category: data_integrity
      weight: 5

- id: approver_rejects_the_paused_run
  purpose: A rejection drives the run to failed and marks the steps after the approval step skipped
  substeps:
    - kind: browser
      do: Open the approvals queue as approver@example.com and press Reject on a waiting run
      cov: C-CF-45
    - kind: pytest
      test: test_output.py::test_rejection_marks_the_run_failed
      category: business_rule
      weight: 3

- id: operator_approval_is_denied
  purpose: An operator session is refused the approval decision and the run is left waiting with nothing recorded
  substeps:
    - kind: browser
      do: Sign in as operator@example.com, open a run that is waiting, and confirm an operator is refused when deciding an approval because no approve or reject control is present
      cov: C-RL-02
    - kind: pytest
      test: test_output.py::test_operator_approval_is_denied_and_run_untouched
      critical: true
      category: security
      weight: 5

- id: cross_project_approver_is_denied
