schema_version = "1.4"

[task]
name = "deku/architecture-studio-showcase-vb"
version = "1.0.0"
description = "A monochrome showcase site for an architecture bureau, with a scroll-driven picture layer, a three-mode project index and one enquiry form."
authors = [
  "abhishek.shaw@ethara.ai",
  "atharv.mahalwar@ethara.ai"
]
uuid_v5 = "b1ee51d9-2cbf-5e2f-b64f-b396780d253d"
keywords = ["greenfield", "solo_founder", "python", "postgres", "minio", "architecture-showcase", "scroll-timeline"]

[metadata]
category     = "Greenfield"
sub_category = "solo_founder"

domain          = "local-services"
pattern         = "content-publishing"
service_profile = "P4-db-storage"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = "aesthetic"
task_code       = "S_local_cont_architecture-studio-showcase-vb_20260916_072142"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "alt_text,form_validation,meta_tags,spam_protection,terms_page"
grader_version  = "0.22.0"

language     = "python"
archetype    = "architecture-studio-showcase"
variant      = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 200
tokens_expected = 8000000
contributor_id  = "atharv.mahalwar@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"
storage = "minio"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/norrgaard}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/norrgaard}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-norrgaard-media}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-deku-storage-key}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-deku-storage-secret}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/norrgaard}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-norrgaard-media}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-deku-storage-key}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-deku-storage-secret}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_STORAGE = "minio" }

[[artifacts]]
source      = "/app"
destination = "app"
