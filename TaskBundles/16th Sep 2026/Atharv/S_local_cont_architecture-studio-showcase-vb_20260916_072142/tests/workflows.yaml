- id: visitor_scrolls_home_and_sends_an_enquiry
  purpose: A visitor reads the whole home route, browses the project index, opens a building and sends an enquiry that lands on its own confirmation address
  substeps:
    - kind: browser
      do: Open `/` and read the hero render with the wordmark set bottom-left in the display serif
      cov: C-FE-01
    - kind: browser
      do: Scroll past the founding block and watch each heading arrive a line at a time
      cov: C-CF-38
    - kind: browser
      do: Scroll to the radial figure behind `Refined & Bold Essential` and watch it fade in
      cov: C-CF-39
    - kind: browser
      do: Scroll into the black arc section and watch the fanned photographs rotate and settle over `15+ Years of experience`
      cov: C-CF-40
    - kind: browser
      do: Read the three statistics and then the fifteen-office list that closes the route
      cov: C-CF-41
    - kind: browser
      do: Open `/work`, press `Visit` on a project, and read its body beside its gallery
      cov: C-UF-03
    - kind: browser
      do: Press `Order design` in the footer, fill the modal with a name, an email and a message, and send it
      cov: C-FE-02
    - kind: browser
      do: Read the confirmation address and the reference it shows
      cov: C-UF-04
    - kind: pytest
      test: test_output.py::test_health_endpoint_returns_ok
      category: presentation
      weight: 1
      cov: C-DC-01,C-DC-06,C-DC-07,C-DC-08,C-DC-09,C-DC-10
    - kind: pytest
      test: test_output.py::test_seeded_accounts_sign_in_with_the_pinned_password
      category: security
      weight: 5
      cov: C-RL-01
    - kind: pytest
      test: test_output.py::test_user_readme_carries_every_seeded_login
      category: presentation
      weight: 1
      cov: C-DC-02,C-DM-06
    - kind: pytest
      test: test_output.py::test_project_list_returns_published_projects_in_order
      critical: true
      category: core_outcome
      weight: 5
      cov: C-CF-04
    - kind: pytest
      test: test_output.py::test_project_detail_carries_body_and_gallery_image_rows
      category: business_rule
      weight: 3
      cov: C-CF-06
    - kind: pytest
      test: test_output.py::test_enquiry_is_stored_with_a_unique_twelve_character_reference
      critical: true
      category: data_integrity
      weight: 5
      cov: C-CF-21,C-DM-09
    - kind: pytest
      test: test_output.py::test_enquiry_confirmation_address_shows_its_reference
      category: business_rule
      weight: 3
      cov: C-CF-29
    - kind: pytest
      test: test_output.py::test_public_routes_resolve_at_their_pinned_addresses
      category: presentation
      weight: 1
      cov: C-DC-05,C-UF-02
    - kind: pytest
      test: test_output.py::test_project_area_renders_with_a_thousands_separator
      category: presentation
      weight: 1
      cov: C-CF-05
