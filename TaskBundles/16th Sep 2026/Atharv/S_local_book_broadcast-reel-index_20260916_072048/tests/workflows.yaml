- id: booking_validates_its_input
  purpose: Values outside their declared ranges are refused before anything is written
  substeps:
    - kind: browser
      do: Submit the booking details with an empty agenda and verify the field is named inline  cov: C-UF-42
    - kind: browser
      do: Verify every field in the form rejects invalid input inline rather than on a later step  cov: C-CF-96, C-UX-110, C-UX-95
    - kind: browser
      do: Force a request to fail and verify the surface says what failed and offers the action again  cov: C-UF-63, C-UF-64
