    - kind: browser
      do: Verify the chosen time is shown as held rather than as free  cov: C-OV-19, C-UF-55, C-UX-115, C-UX-119, C-UX-87, C-UX-91, C-UX-94
    - kind: browser
      do: As a second visitor take the same time and verify the grid refreshes in place with the details already typed kept  cov: C-UF-32, C-UF-45, C-UF-46, C-UF-47, C-UX-22
    - kind: pytest
      test: test_output.py::test_holding_a_slot_blocks_a_second_hold
      category: business_rule
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_holding_a_slot_blocks_a_booking_by_another_caller
      category: security
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_lapsed_hold_releases_the_slot
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_confirming_against_a_lapsed_hold_is_refused
      category: validation
      weight: 5
      critical: true

