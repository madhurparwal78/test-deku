      test: test_output.py::test_agenda_outside_its_range_is_rejected
      category: validation
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_attendee_name_outside_its_range_is_rejected
      category: validation
      weight: 3

- id: booking_requires_no_account
  purpose: A signed-out visitor completes the whole booking flow
  substeps:
    - kind: browser
      do: Signed out, take the call to action from a case study and verify the panel opens over the page  cov: C-RL-02, C-UF-40
    - kind: browser
      do: Complete the details and confirm, then verify the panel is replaced in place by a confirmation naming the principal and the time  cov: C-UF-43, C-UX-96
    - kind: browser
      do: Verify the confirmation banner stays in the panel rather than disappearing on its own  cov: C-UX-97, C-UX-98
    - kind: browser
      do: Verify the springy overshoot settles the booking confirmation once and appears on no other surface  cov: C-DM-47, C-UX-52, C-UX-53, C-UX-56
    - kind: browser
      do: Ask the system to reduce motion, book again, and verify the confirmation simply appears with no overshoot  cov: C-UX-61, C-UX-62, C-UX-63, C-UX-64
    - kind: pytest
      test: test_output.py::test_booking_requires_no_account
      category: core_outcome
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_confirmed_booking_is_stored_with_its_attendee
      category: data_integrity
      weight: 5
      critical: true

