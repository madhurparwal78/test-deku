- id: visitor_reads_the_work
  purpose: A signed-out visitor reads the index in both shapes and the home feed in its own order
  substeps:
    - kind: browser
      do: Open the home page and verify eleven productions appear, beginning Vertical Mile then Master the Route  cov: C-DM-17, C-OV-14, C-UF-01, C-UF-33
    - kind: browser
      do: Open the work index and verify seventeen productions numbered 01 to 17  cov: C-CF-44, C-CF-45, C-CF-56, C-CN-01, C-DM-09, C-DM-11, C-OV-03, C-TR-17, C-UF-03, C-UF-34, C-UF-35, C-UF-36, C-UF-56, C-UX-74
    - kind: browser
      do: Verify each index row carries its title, client, category and running time  cov: C-CF-63, C-DM-12, C-DM-20, C-OV-04, C-OV-05, C-OV-06, C-UX-57
    - kind: browser
      do: Switch the index to its list shape and verify the same seventeen in the same order  cov: C-CF-54, C-CF-55, C-OV-11, C-OV-12, C-OV-13, C-RL-01, C-UF-05, C-UF-37
    - kind: browser
      do: Switch back to the grid shape and verify the order is unchanged again  cov: C-DC-18, C-UF-04, C-UX-77, C-UX-79, C-UX-80
    - kind: browser
      do: Verify the ordinals line up in one column down the index rows  cov: C-CF-58, C-DM-08, C-DM-18, C-UX-45, C-UX-46
    - kind: browser
      do: Verify the persistent rail sits beside the content on the home page, the work index and a case study  cov: C-CF-57, C-UX-06, C-UX-65, C-UX-68
    - kind: browser
      do: Verify the rail carries the wordmark and the four destinations  cov: C-UX-66, C-UX-67, C-UX-69, C-UX-71, C-UX-72
    - kind: browser
      do: Scroll the work index and verify the rail stays in place rather than scrolling with the page  cov: C-UX-70
    - kind: browser
      do: Verify the gap between two bands of content is about three times the gap beneath a heading  cov: C-UX-12, C-UX-47
    - kind: browser
      do: Verify the interface reads as bright and consumer-grade, with a comfortable density rather than a cramped one  cov: C-UX-02, C-UX-05
    - kind: browser
      do: Verify one characterful display face sits over a geometric sans that carries the rest of the interface  cov: C-UX-03, C-UX-36, C-UX-37, C-UX-41
    - kind: pytest
      test: test_output.py::test_seeded_productions_are_listed_in_index_order
      category: data_integrity
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_home_feed_returns_eleven_in_its_own_order
      category: data_integrity
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_home_ordering_is_not_derived_from_index_ordering
      category: business_rule
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_featured_flag_and_home_sort_index_agree
      category: data_integrity
      weight: 5

- id: case_study_carries_its_credits_and_captions
  purpose: A case study leads with its reel and carries credits and captioned galleries
  substeps:
    - kind: browser
      do: Open the production norvel-drift and verify the hero reel leads the page  cov: C-CF-65, C-DM-15, C-OV-07, C-UX-123, C-UX-83
    - kind: browser
      do: Verify the credits appear as role and name pairs, and every gallery still shows a caption  cov: C-UX-84
    - kind: browser
      do: Operate the film player from the keyboard and verify each of its controls carries a label  cov: C-UX-117, C-UX-118
    - kind: browser
      do: Verify the hero reel plays from seeded media with no upload control anywhere on the page  cov: C-CN-28, C-CN-29
    - kind: browser
      do: Signed out, watch a film, read the about page, read the privacy page, then reach the booking action, with no account at any point  cov: C-RL-03, C-RL-04, C-RL-05, C-UX-54
    - kind: pytest
      test: test_output.py::test_case_study_returns_credits_in_stored_order
      category: data_integrity
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_every_gallery_still_carries_a_caption
      category: data_integrity
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_gallery_image_without_caption_cannot_be_stored
      category: data_integrity
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_unknown_production_slug_is_not_found
      category: validation
      weight: 3

