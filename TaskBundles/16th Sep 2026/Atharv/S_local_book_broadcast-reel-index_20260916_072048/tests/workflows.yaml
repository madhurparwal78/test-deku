- id: visitor_is_denied_at_agency_endpoints
  purpose: A visitor session is refused at every agency surface
  substeps:
    - kind: browser
      do: Sign in as the visitor account and verify the booking list reports that the surface belongs to the agency  cov: C-CF-29, C-RL-07, C-RL-08, C-UF-22, C-UF-51, C-UX-92
    - kind: browser
      do: Verify the visitor is not sent back to the sign-in surface after that refusal  cov: C-UF-12, C-UF-19, C-UF-20, C-UF-23
    - kind: browser
      do: Verify the refusal comes from the server rather than from a button hidden in the interface  cov: C-CF-70, C-RL-23, C-UX-10
    - kind: browser
      do: With an expired token verify the principal stays on the same surface, told the session ended, offered a control to sign in again  cov: C-CF-106, C-CF-116, C-UF-26, C-UF-27, C-UF-28
    - kind: browser
      do: Sign out and verify the visitor returns to the home page with the token discarded  cov: C-CF-100, C-CF-109, C-CF-113, C-CF-114, C-CF-115, C-TR-14, C-TR-15, C-UF-21, C-UF-24, C-UF-25
    - kind: pytest
      test: test_output.py::test_visitor_is_denied_at_every_principal_endpoint
      category: security
      weight: 5
      critical: true
    - kind: pytest
