      category: security
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_seeded_accounts_carry_their_roles
      category: data_integrity
      weight: 5

- id: the_public_surface_holds
  purpose: Links resolve, unknown addresses are not found, and the privacy page is reachable
  substeps:
    - kind: browser
      do: Verify a link to the privacy page sits in the footer of the home page, the work index and a case study  cov: C-CF-91, C-UF-61, C-UF-62
    - kind: browser
      do: Open an address matching no route and verify the product's own not-found page renders with a way back  cov: C-CF-93, C-CF-94, C-CN-26, C-UF-59, C-UF-60
    - kind: browser
      do: At a narrow viewport verify no surface scrolls sideways and the call to action stays reachable  cov: C-OV-16, C-UX-122, C-UX-124, C-UX-73
    - kind: browser
      do: Verify each page leads with exactly one primary action and no second control competes with it  cov: C-OV-15, C-UX-103, C-UX-104, C-UX-26, C-UX-28, C-UX-29
    - kind: browser
      do: Verify no route leaves the visitor on a blank page and nothing jumps as content arrives  cov: C-UF-58, C-UF-65, C-UF-66
    - kind: browser
      do: Verify large type clears the large-text contrast floor against the one dark appearance
    - kind: browser
      do: Verify body text and every control label clear the contrast floor against the same dark appearance  cov: C-UX-111, C-UX-112
    - kind: browser
      do: At a narrow viewport verify the gap between bands about halves  cov: C-UX-48
    - kind: browser
      do: Verify the chrome does not compete with the film and no decoration stands in for work  cov: C-UX-126, C-UX-127
    - kind: browser
      do: Verify the layout is not borrowed from a subject unrelated to film work and does not read as a dashboard  cov: C-UX-09, C-UX-125 (earned: the same substep rejects a dashboard reading of the layout), C-UX-128
    - kind: browser
      do: From any route verify the booking action is reachable without hunting, so a marketing director can talk to the agency at once  cov: C-UF-02, C-UF-08, C-UX-07, C-UX-08
    - kind: browser
      do: Walk every public route and verify the product carries no cart, no pricing, no search, no comments, no likes, no reactions, no tag pages and no newsletter  cov: C-TR-11, C-UF-57, C-UX-33
    - kind: browser
      do: Walk every public route and verify the product carries no signup, no password reset, no invitation, no account deletion and no cookie consent surface  cov: C-CN-02, C-CN-30, C-RL-29
    - kind: browser
      do: Verify the product offers the visitor no way to reschedule or cancel a confirmed booking, and shows no crew operations, day rates, awards rows or client roster  cov: C-CF-61
    - kind: browser
      do: Verify the product ships one appearance with no theme switch and no second theme anywhere  cov: C-CN-34, C-CN-35, C-UX-32, C-UX-34
    - kind: pytest
      test: test_output.py::test_every_internal_link_on_every_public_route_resolves
      category: presentation
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_unknown_address_answers_not_found
      category: validation
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_privacy_page_is_served
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_invalid_form_input_is_rejected_and_writes_nothing
      category: validation
      weight: 5
      critical: true

