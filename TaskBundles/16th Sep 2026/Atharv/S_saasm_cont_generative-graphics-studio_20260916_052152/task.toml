authors = ["yasir.aliint17@ethara.ai", "mahalwaratharv@gmail.com"]
keywords = ["greenfield", "solo_founder", "javascript", "postgres", "minio", "content-publishing"]

[metadata]
category     = "Greenfield"
sub_category = "solo_founder"
language     = "javascript"
archetype    = "generative-graphics-studio"
task_code    = "S_saasm_cont_generative-graphics-studio_20260916_052152"
naming_scheme = "task-code-v1"
grader_version = "0.22.0"
launch_surface = "cookie_choice,form_validation,mobile_viewport,no_broken_links,terms_page"
domain       = "saas-micro-tools"
pattern      = "content-publishing"
service_profile = "P4-db-storage"
variant      = "a"
variant_axes = []
difficulty   = ""

spec_sections_given = [
  "overview",
  "roles",
  "features",
  "flow",
  "uiux",
  "techrequirements",
  "datamodel",
  "constraints",
  "contract",
]

turns_expected  = 140
tokens_expected = 5200000
contributor_id  = "mahalwaratharv@gmail.com"
created_at      = "2026-09-16"
