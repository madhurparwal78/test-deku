pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"
storage = "minio"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0

network_mode  = "public"
allowed_hosts = []

env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/vvvivid}", DATABASE_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/vvvivid}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-vvvivid-renders}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-deku-storage-key}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-deku-storage-secret}", AUTH_SECRET = "${AUTH_SECRET:-deku-local-auth-secret}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0

env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/vvvivid}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-vvvivid-renders}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-deku-storage-key}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-deku-storage-secret}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_STORAGE = "minio" }

[[artifacts]]
source      = "/app"
destination = "app"
