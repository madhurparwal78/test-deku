    - kind: pytest
      test: test_output.py::test_unlisted_preset_resolves_for_any_caller_holding_the_address
      category: business_rule
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_unlisted_preset_is_absent_from_the_gallery
      category: security
      weight: 5
      critical: true

- id: publication_creates_one_entry
  purpose: Publishing requires an account and a title and creates one gallery entry
  substeps:
