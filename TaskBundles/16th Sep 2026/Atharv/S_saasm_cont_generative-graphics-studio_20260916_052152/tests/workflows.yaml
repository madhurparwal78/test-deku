      cov: C-UX-77
    - kind: pytest
      test: test_output.py::test_render_object_exists_in_the_bucket_at_its_content_key
      category: core_outcome
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_render_object_key_is_the_digest_of_the_stored_bytes
      category: data_integrity
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_render_bytes_are_not_stored_in_the_database
      category: data_integrity
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_two_identical_renders_store_one_object
      category: data_integrity
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_declared_stack_and_environment_are_in_use
      category: data_integrity
      weight: 5
      critical: true

- id: rejected_renders_write_no_object
  purpose: An oversized or wrong-format render is refused and leaves the store untouched
  substeps:
    - kind: browser
      do: Ask for an export in a format the product does not offer and verify the refusal names the format rather than failing silently
    - kind: pytest
      test: test_output.py::test_oversized_render_is_refused_and_writes_no_object
      category: validation
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_unsupported_render_format_is_refused_and_writes_no_object
      category: validation
      weight: 5
      critical: true

- id: unlisted_resolves_and_stays_out_of_the_gallery
