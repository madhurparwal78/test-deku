- id: visitor_leaves_with_a_graphic
  purpose: A signed-out visitor picks a tool, changes a control and leaves with the graphic
  substeps:
    - kind: browser
      do: Open the tile index and verify the seeded tools appear as a grid of cards with their names set in lower case
      cov: C-CF-137, C-CF-138, C-CF-139, C-CF-141, C-CF-146, C-DM-18, C-UF-01, C-UF-54, C-UX-69, C-UX-70, C-UX-71, C-UX-74, C-UX-89
    - kind: browser
      do: Verify the retired tool vvvanish is absent from the tile grid
    - kind: browser
      do: Open the tool bbblob and verify a preview is already drawn before any control is touched
      cov: C-UF-30, C-UX-75
    - kind: browser
      do: Change one control and verify the preview redraws without a full page load
      cov: C-CF-157, C-OV-04, C-OV-05, C-RL-01, C-TR-03, C-UF-31, C-UX-34, C-UX-43
    - kind: browser
      do: Use the copy action and verify the action confirms in place by changing its own label
      cov: C-UF-32, C-UX-46, C-UX-76
    - kind: browser
      do: Verify the full tile grid repeats beneath the tool's own content
      cov: C-UF-33, C-UX-68, C-UX-78
    - kind: pytest
      test: test_output.py::test_seeded_tiles_are_listed_in_stored_order
      category: data_integrity
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_retired_generator_keeps_its_route_and_leaves_the_grid
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_data_model_tables_and_columns_exist
      category: data_integrity
      weight: 5
      critical: true

- id: derived_address_reproduces_the_worked_example
  purpose: The published derivation reproduces the identifier the brief pins
  substeps:
    - kind: browser
      do: Signed in as an author, open the save surface for a tool and verify the derived address is shown before anything is saved
      cov: C-UF-03, C-UF-18, C-UF-34, C-UX-79, C-UX-80
    - kind: browser
      do: Verify the derived address is labelled as derived from the settings rather than as assigned
      cov: C-UX-08, C-UX-38, C-UX-54
    - kind: pytest
      test: test_output.py::test_worked_example_canonical_string_derives_its_pinned_identifier
      category: core_outcome
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_saved_preset_identifier_matches_the_recomputed_derivation
      category: core_outcome
      weight: 5
      critical: true

- id: identical_settings_save_once
  purpose: Saving one set of settings twice yields one row and one identifier
  substeps:
    - kind: browser
      do: Signed in as an author, save a set of settings, return to the same tool, reproduce the settings and save again
    - kind: browser
      do: Verify the author's own preset list shows one entry for those settings rather than two
      cov: C-TR-28, C-UX-63
    - kind: pytest
      test: test_output.py::test_second_save_of_identical_settings_returns_one_identifier
      category: business_rule
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_second_save_of_identical_settings_leaves_one_row
      category: data_integrity
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_a_supplied_identifier_on_a_save_is_ignored
      category: security
      weight: 5

- id: concurrent_identical_saves_keep_one_row
  purpose: Two authors saving identical settings at once do not both create a row
  substeps:
    - kind: pytest
      test: test_output.py::test_concurrent_identical_saves_leave_exactly_one_row
      category: data_integrity
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_concurrent_identical_saves_return_one_identifier_to_both
      category: business_rule
      weight: 5
      critical: true

- id: private_preset_is_refused_to_the_public
  purpose: A private preset is unreachable from a listing and from its own address
  substeps:
    - kind: browser
      do: Signed out, open the gallery and verify the private seeded preset title is absent
      cov: C-CF-119, C-UX-85
    - kind: browser
      do: Signed out, open the private preset's own address and verify the product's own not-found page renders
      cov: C-UF-55
    - kind: pytest
      test: test_output.py::test_private_preset_is_absent_from_the_gallery
      category: security
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_private_preset_address_is_refused_to_every_caller_but_its_owner
      category: security
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_private_refusal_is_indistinguishable_from_an_unknown_identifier
      category: security
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_owner_reads_their_own_private_preset
      category: core_outcome
      weight: 5

- id: private_export_is_refused
  purpose: The rendered export of a private preset is refused with the preset
  substeps:
    - kind: pytest
      test: test_output.py::test_private_preset_export_is_refused_to_every_caller_but_its_owner
      category: security
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_published_preset_export_is_served_to_anyone
      category: core_outcome
      weight: 5

- id: render_object_exists_at_its_content_key
