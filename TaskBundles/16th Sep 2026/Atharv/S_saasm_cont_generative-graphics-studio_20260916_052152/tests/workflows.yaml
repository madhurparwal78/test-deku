      do: Sign in as the reader account and verify the studio surface reports that saving belongs to accounts that can save
      cov: C-TR-35, C-UF-17, C-UF-21, C-UF-25, C-UX-64
    - kind: browser
      do: Verify the reader is not sent back to the sign-in surface after that refusal
    - kind: pytest
      test: test_output.py::test_reader_cannot_save_render_publish_or_fork
      category: security
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_denied_reader_write_creates_no_row
      category: security
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_seeded_accounts_carry_their_handles_and_roles
      category: data_integrity
      weight: 5

- id: cross_author_write_is_forbidden
  purpose: An author cannot write to a preset another account owns
  substeps:
    - kind: browser
      do: Signed in as a second author, open the publish surface for a preset the first author owns and verify the refusal names the owner rather than reporting not found
    - kind: pytest
      test: test_output.py::test_cross_author_edit_publish_delete_and_render_are_forbidden
      category: security
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_forbidden_cross_author_write_leaves_the_row_unchanged
      category: security
      weight: 5
      critical: true

- id: the_public_surface_holds
  purpose: The terms page, the links, the cookie choice and form validation all hold
  substeps:
    - kind: browser
      do: Verify a terms page is reachable from the footer of the tile index and is linked from the publish surface
      cov: C-CF-177, C-CF-178, C-CF-182
    - kind: browser
      do: Verify a first-time visitor is asked once about non-essential cookies and is not asked again after a reload
      cov: C-CF-183, C-CF-184, C-CF-185
    - kind: browser
      do: Submit the report form with an empty reason and verify the field is named inline
      cov: C-CF-190, C-CF-191
    - kind: browser
      do: At a narrow viewport verify no surface scrolls sideways and every tile stays reachable
      cov: C-UX-106, C-UX-107, C-UX-108, C-UX-109, C-UX-110, C-UX-66
    - kind: pytest
      test: test_output.py::test_every_internal_link_on_every_public_route_resolves
      category: presentation
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_invalid_form_input_is_rejected_and_writes_nothing
      category: validation
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_terms_page_is_served
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_deployment_contract_holds
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_scope_out_surfaces_are_absent
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_every_route_in_the_brief_resolves
      category: presentation
      weight: 1
