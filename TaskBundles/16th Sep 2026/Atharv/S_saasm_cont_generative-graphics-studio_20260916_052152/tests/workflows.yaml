      category: business_rule
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_publishing_twice_leaves_one_gallery_entry
      category: data_integrity
      weight: 5
      critical: true

- id: fork_records_its_parent
  purpose: A fork names its parent and raises the parent's stored fork count by one
  substeps:
    - kind: browser
      do: Open a gallery entry signed in as a second author and verify the entry shows its fork count
      cov: C-CF-122, C-UF-51, C-UX-84, C-UX-87
    - kind: browser
      do: Fork the entry, change one control, save, and verify the new preset names the original as its parent
      cov: C-CF-80, C-UF-44, C-UX-88
    - kind: pytest
      test: test_output.py::test_fork_records_exactly_one_parent
      category: data_integrity
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_fork_raises_the_parent_stored_fork_count_by_one
      category: business_rule
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_forking_without_changing_a_setting_returns_the_parent
      category: business_rule
      weight: 3

- id: tombstone_keeps_lineage_resolvable
  purpose: Deleting a forked preset keeps its children's ancestry resolvable
  substeps:
    - kind: browser
      do: Open the address of a deleted preset that has forks and verify a withdrawn page renders rather than a not-found page
      cov: C-CF-100, C-UF-58
    - kind: pytest
      test: test_output.py::test_deleting_a_forked_preset_tombstones_it_rather_than_removing_it
      category: business_rule
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_child_resolves_its_ancestry_through_a_tombstoned_parent
      category: data_integrity
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_tombstoned_preset_is_absent_from_the_gallery
      category: security
      weight: 5

- id: reader_write_is_denied
  purpose: A reader session is refused at every author-only endpoint
  substeps:
