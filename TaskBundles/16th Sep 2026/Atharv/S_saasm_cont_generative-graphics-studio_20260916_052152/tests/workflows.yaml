      do: Signed in as an author, publish an owned preset and verify the surface is replaced by a full-page confirmation naming the entry address
      cov: C-CF-120, C-UF-22, C-UF-42, C-UX-91, C-UX-92, C-UX-95
    - kind: browser
      do: Verify the confirmation states that publication is attributable and one-way
      cov: C-UX-93, C-UX-94
    - kind: pytest
      test: test_output.py::test_publication_creates_one_live_gallery_entry
      category: core_outcome
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_publication_without_an_account_is_refused
      category: security
      weight: 5
      critical: true
    - kind: pytest
      test: test_output.py::test_publication_without_a_title_is_rejected
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_entry_tags_are_read_back_in_stored_order
      category: data_integrity
      weight: 5

- id: republishing_returns_the_existing_entry
  purpose: Publishing the same content twice does not create a second entry
