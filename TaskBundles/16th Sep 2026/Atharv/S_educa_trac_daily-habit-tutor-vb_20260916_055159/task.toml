schema_version = "1.4"

[task]
name = "deku/daily-habit-tutor-vb"
version = "1.0.0"
description = "A free daily learning app with spaced repetition, hearts, streaks and weekly leagues, sold by one marketing page."
authors = [
  "abhishek.shaw@ethara.ai",
  "atharv.mahalwar@ethara.ai"
]
uuid_v5 = "02bd8f66-163b-5ead-ac86-b601a393055a"
keywords = ["greenfield", "solo_founder", "typescript", "postgres", "spaced-repetition", "daily-habit"]

[metadata]
category     = "Greenfield"
sub_category = "solo_founder"

domain          = "education-courses"
pattern         = "tracker-log"
service_profile = "P1-db"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = "aesthetic"
task_code       = "S_educa_trac_daily-habit-tutor-vb_20260916_055159"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "colour_contrast,mobile_viewport,no_broken_links,social_preview,terms_page"
grader_version  = "0.22.0"

language     = "typescript"
archetype    = "daily-habit-tutor"
variant      = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 220
tokens_expected = 8000000
contributor_id  = "atharv.mahalwar@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/larkwise}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/larkwise}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/larkwise}", DEKU_SERVICE_BACKEND = "postgres" }

[[artifacts]]
source      = "/app"
destination = "app"
