- id: member_builds_and_places_a_box
  purpose: A member builds a box of three titles from the current reveal and places it, and the order carries the computed total
  substeps:
    - kind: browser
      do: Sign in as member@example.com with deku-demo-pw-2026, open /box, add The Orrery Thief, Salt and Static and A Quiet Inventory from their own rows, and place the box
    - kind: browser
      do: Confirm the box builder shows the catalogue on one side and the box on the other, both visible at once, that the running total changes as each title is added, and that the builder spaces its pages generously rather than densely
      cov: C-UX-18
    - kind: browser
      do: Confirm placing the box lands on its own confirmation route rather than a panel over the builder, and that the route names the order, the three titles and the total
    - kind: browser
      do: Open the box builder and the account page as a signed-in member and confirm each is served
      cov: C-UF-06, C-UF-07
    - kind: browser
      do: Open the box builder while signed out, confirm arrival at the sign-in page, sign in, and confirm arrival at the destination that was preserved
      cov: C-UF-09, C-UF-10
    - kind: browser
      do: Sign in with no destination and confirm the landing is the box builder, then sign out and confirm the return to the home page
      cov: C-UF-11, C-UF-12
    - kind: browser
      do: Open another member's confirmation route and confirm the request is denied rather than redirected to your own order
      cov: C-UF-13
    - kind: browser
      do: Press a primary button and confirm it squashes more than it narrows, then move between two pages and confirm the arriving content rises from below while the leaving content rises away above
      cov: C-UX-24, C-UX-27
    - kind: pytest
      test: test_output.py::test_box_of_three_places_and_totals_correctly
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_placed_box_is_persisted_with_its_pricing_snapshot
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeded_subscriptions_survive_a_failed_payment
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_cancelled_membership_ends_at_the_close_of_the_paid_cycle
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_health_returns_ok
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_seeded_accounts_sign_in_with_the_corpus_password
      critical: true
      category: security
      weight: 5

- id: monthly_reveal_is_atomic_and_editions_are_records
  purpose: The current cycle carries its whole selection, a reprint is a separate record sharing one work, and a cover hue is derived once
  substeps:
    - kind: browser
      do: Open / as a signed-out visitor, read the reveal carousel, then compare /books/salt-and-static with /books/salt-and-static-reprint
    - kind: browser
      do: Confirm the marketing pages and the box builder are served from one origin, that one membership tier is offered rather than a table of plans, and that the product ships no native mobile application of its own
      cov: C-CN-01, C-CN-03, C-CN-04
    - kind: browser
      do: Confirm the app integrates no carrier and offers no parcel tracking, and that no refund flow is offered to a member anywhere in the account
      cov: C-CN-08, C-CN-09
    - kind: browser
      do: Confirm the book titles, the authors and the press outlets shown are the invented ones this brief names rather than real published works
      cov: C-CN-10
    - kind: browser
      do: Confirm the app seeds six FAQ entries that appear one per hue in their seeded order, and that the four press mentions are listed under the mentions heading
      cov: C-DM-45, C-DM-46
    - kind: browser
      do: Confirm the reveal carousel is operable by pointer drag, by its arrow controls and by the keyboard, that the arrows disable at the ends rather than vanishing, and that the position in the row is announced
    - kind: browser
      do: Confirm each carousel card sits on a background colour drawn from its own cover and at a slightly different vertical offset from its neighbours
    - kind: pytest
      test: test_output.py::test_current_cycle_reveals_the_seeded_selection
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_seeded_editions_are_stored_exactly_once
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_reprint_and_original_are_separate_rows
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_cover_hue_is_stored_and_does_not_move_between_reads
      category: data_integrity
      weight: 5

- id: catalogue_browses_by_genre_and_flat_tags
  purpose: The catalogue lists every orderable edition, filters by genre, and shows the flat tag vocabulary on an edition page
  substeps:
    - kind: browser
      do: Open /allbooks, filter to Horror, then open /books/the-orrery-thief and read its tag pills
    - kind: browser
      do: Confirm an edition marked as a special edition shows a ribbon over the corner of its card, and that the club-published anthology names the club itself as its publisher
      cov: C-CF-24, C-CF-114
    - kind: browser
      do: Confirm no edition page offers a comment control, a review, a rating, a member profile or a recommendation engine row
      cov: C-CN-05, C-CN-06, C-CN-07, C-CN-11
    - kind: browser
      do: Confirm an edition card shows the cover inset at the top, the tags as coloured pills, the name in the display face, the description truncated with an ellipsis, then Read more, and that the interface labels on that card hold at a fixed size while the content type scales fluidly between a minimum and a maximum as the window widens
      cov: C-UX-14, C-UX-15
    - kind: browser
      do: Confirm a tag's colour carries no meaning, so that Fantasy and Includes a Dog render identically in treatment, and the text on the pale pills meets the contrast bar
    - kind: pytest
      test: test_output.py::test_editions_list_returns_every_orderable_slug
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_catalogue_filters_by_genre
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_edition_detail_carries_the_flat_tag_vocabulary
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_catalogue_copy_states_the_open_genre_list
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_home_page_arrives_as_complete_html
      category: presentation
      weight: 1

