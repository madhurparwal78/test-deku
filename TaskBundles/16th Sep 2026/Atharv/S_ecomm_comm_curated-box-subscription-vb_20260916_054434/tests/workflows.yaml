- id: invalid_or_empty_input_is_refused_and_writes_nothing
  purpose: A bad signup, an empty box, an unknown edition address and an unservable postal address are each refused and leave nothing behind
  substeps:
    - kind: browser
      do: Open /signup, submit an address with no at sign, read the message beside the field, then empty the box and read its empty state
    - kind: browser
      do: Confirm the message on a refused form names the offending field, appears beside it, and leaves the page standing rather than crashing
      cov: C-CF-130, C-UF-18
    - kind: browser
      do: Confirm the app serves the signup page, serves the login sign-in page, and serves the redeem redemption page to a signed-out visitor
      cov: C-UF-03, C-UF-04, C-UF-05
    - kind: browser
      do: Filter the catalogue to a genre holding no editions and confirm an empty state naming that filter
      cov: C-UF-14
    - kind: browser
      do: Sign in as a member with no orders, open the account page, and confirm an empty state rather than a blank list
      cov: C-UF-16
    - kind: browser
      do: Confirm every route shows a loading state while it is fetching rather than rendering as a bare white page
      cov: C-UF-17
    - kind: browser
      do: Enter a Puerto Rico address at address entry, then an APO or FPO address, and confirm the app recognises each as one the ordinary flow cannot serve before payment is reached
      cov: C-CF-109, C-CF-110, C-CF-113
    - kind: pytest
      test: test_output.py::test_signup_with_an_unsupported_country_is_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_signup_with_a_malformed_email_writes_nothing
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_empty_box_placement_is_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_unknown_edition_slug_is_not_found
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_address_check_names_a_po_box_as_unservable
      category: validation
      weight: 3

- id: launch_surfaces_are_present_on_every_public_route
  purpose: The privacy page, the terms page and a distinct social preview are served on the public routes
  substeps:
    - kind: browser
      do: Open /, /allbooks, /gifting and /faq, follow the footer links, and answer the cookie question once then reload
    - kind: browser
      do: Open the home reveal and confirm the brand marks appear in a light, vivid violet and a mid, vivid teal against a white ground
      cov: C-RL-01, C-UX-02, C-UX-03
    - kind: browser
      do: Confirm the primary action on a page is filled with a light, soft amber worn by nothing else on that page, and the alternate action is filled with a mid, vivid magenta
      cov: C-UX-04, C-UX-05, C-UX-06
    - kind: browser
      do: Open the FAQ page and confirm the app serves every question there, then confirm the home page surfaces three of them above a link to the rest
      cov: C-CF-115, C-CF-116
    - kind: browser
      do: Open the gifting page and confirm the copy No spying on shelves needed. is present
      cov: C-CF-117
    - kind: browser
      do: Open the privacy page and confirm it states what the club records about a member and how long each record is kept
      cov: C-CF-120
    - kind: browser
      do: As a first-time visitor answer the cookie question once, reload the page, and confirm the question is not asked a second time in the same browser
      cov: C-CF-126, C-CF-127, C-CF-128
    - kind: browser
      do: Confirm body text meets the WCAG AA contrast bar, every keyboard-reachable control shows a visible focus ring, every icon-only control carries a label, and no meaning is carried by colour alone
      cov: C-UX-37, C-UX-38, C-UX-39, C-UX-40
    - kind: browser
      do: Confirm the transitions on a page are declared per property rather than as one blanket rule animating everything
      cov: C-UX-28
    - kind: browser
      do: Confirm the social preview image declared on each public route resolves to real bytes rather than a broken reference
      cov: C-TR-09
    - kind: browser
      do: Confirm the header is a floating pill group of four navigation items plus the sign-in control, and that it collapses to the mark and a Menu control at the narrowest width
      cov: C-UX-19
    - kind: browser
      do: Confirm nothing overflows sideways at a narrow viewport, every navigation target stays reachable, and the carousel card offsets align at the narrowest width rather than staying staggered
      cov: C-UX-34
    - kind: browser
      do: Confirm each FAQ panel keeps its hue and lightens from its solid variant to its soft twin when it opens
    - kind: browser
      do: Confirm that under a reduced-motion preference the mascot ears hold still, page transitions become a plain cross-fade, and the scroll sequence holds one frame
      cov: C-UX-45
    - kind: pytest
      test: test_output.py::test_privacy_page_is_served_and_linked_from_the_footer
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_terms_page_is_served_and_linked_from_the_footer
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_public_routes_declare_distinct_social_preview_titles
      category: presentation
      weight: 1

