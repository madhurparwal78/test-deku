schema_version = "1.4"

[task]
name = "deku/curated-box-subscription-vb"
version = "1.0.0"
description = "A monthly book subscription where the member builds a box of up to three titles, at least one from the current month's reveal"
authors = [
  "abhishek.shaw@ethara.ai",
  "atharv.mahalwar@ethara.ai"
]
uuid_v5 = "3860c34d-6255-5076-a998-109d090aabd9"
keywords = ["greenfield", "solo_founder", "python", "postgres", "mailpit", "killbill", "subscription"]

[metadata]
category     = "Greenfield"
sub_category = "solo_founder"

domain          = "ecommerce-retail"
pattern         = "commerce-checkout"
service_profile = "P5-db-pay-email"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = ""
task_code       = "S_ecomm_comm_curated-box-subscription-vb_20260916_054434"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "cookie_choice,form_validation,mobile_viewport,privacy_page,social_preview"
grader_version  = "0.22.0"

language     = "python"
archetype    = "curated-box-subscription"
variant      = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 170
tokens_expected = 7000000
contributor_id  = "atharv.mahalwar@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true

difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend  = "postgres"
email    = "mailpit"
payments = "killbill"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", SMTP_HOST = "${SMTP_HOST:-mailpit}", SMTP_PORT = "${SMTP_PORT:-1025}", SMTP_USER = "${SMTP_USER:-deku_app}", SMTP_PASS = "${SMTP_PASS:-deku-local-dev}", PAYMENTS_API_URL = "${PAYMENTS_API_URL:-http://killbill:8080}", PAYMENTS_API_KEY = "${PAYMENTS_API_KEY:-orbit-labs}", PAYMENTS_API_SECRET = "${PAYMENTS_API_SECRET:-orbit-labs-secret-9f14c73e}", PAYMENTS_ADMIN_USER = "${PAYMENTS_ADMIN_USER:-admin}", PAYMENTS_ADMIN_PASSWORD = "${PAYMENTS_ADMIN_PASSWORD:-password}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", EMAIL_INBOX_API_URL = "${EMAIL_INBOX_API_URL:-http://mailpit:8025}", PAYMENTS_API_URL = "${PAYMENTS_API_URL:-http://killbill:8080}", PAYMENTS_API_KEY = "${PAYMENTS_API_KEY:-orbit-labs}", PAYMENTS_API_SECRET = "${PAYMENTS_API_SECRET:-orbit-labs-secret-9f14c73e}", PAYMENTS_ADMIN_USER = "${PAYMENTS_ADMIN_USER:-admin}", PAYMENTS_ADMIN_PASSWORD = "${PAYMENTS_ADMIN_PASSWORD:-password}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_EMAIL = "mailpit", DEKU_SERVICE_PAYMENTS = "killbill" }

[[artifacts]]
source      = "/app"
destination = "app"
