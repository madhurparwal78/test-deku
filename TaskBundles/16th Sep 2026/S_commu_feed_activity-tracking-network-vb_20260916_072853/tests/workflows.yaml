- id: blocked_athlete_is_denied_every_path
  purpose: A block is enforced at the data layer, so the blocked athlete reaches the blocker by no route at all
  substeps:
    - kind: browser
      do: Sign in as athlete4@example.com, whom Rowan Ellery blocks, and confirm Rowan Ellery's profile is not found
      cov: C-UF-17
    - kind: browser
      do: Open the Ridgeway Climb leaderboard as the blocked athlete and confirm Rowan Ellery is absent and the remaining places still read one upward with no gap
      cov: C-CF-22
    - kind: browser
      do: Open the Dawn Patrol club feed as the blocked athlete and confirm only the member activities this viewer is permitted to read appear, then open the April Ascent challenge and confirm the standings name Rowan Ellery nowhere
      cov: C-CF-121, C-CF-124
    - kind: browser
      do: Search for the blocker by name as the blocked athlete and confirm the search returns nothing, as with every other read path a block covers
      cov: C-CF-22
    - kind: browser
      do: Confirm the blocked athlete receives the same not-found the product returns for content that never existed, rather than a message naming the refusal
      cov: C-UF-10, C-CF-25
    - kind: pytest
      test: test_output.py::test_blocked_athlete_reaches_the_blocker_by_no_path
      category: security
      critical: true
      weight: 5
    - kind: pytest
      test: test_output.py::test_block_is_symmetric_in_effect
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_blocking_removes_the_follow_edge_in_both_directions
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_club_feed_shows_only_activities_the_viewer_may_read
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_challenge_standings_are_contiguous_and_respect_blocking
      category: security
      weight: 5

- id: athlete_uploads_an_activity_that_fans_out_and_matches
  purpose: The upload is the transaction: it stores the file, derives the numbers, matches the segments and reaches the followers
  substeps:
    - kind: browser
      do: Sign in as athlete@example.com, open the upload route and confirm the work is broken into ordered steps with the current one named and the ones behind it revisitable
      cov: C-UF-18
    - kind: browser
      do: Choose a track file, confirm the type and name, set the visibility and submit, and confirm an upload identifier is returned immediately with the processing running afterwards
      cov: C-CF-26
    - kind: browser
      do: Watch the upload move from received through parsing and matching to ready without reloading the page
      cov: C-CF-33
    - kind: browser
      do: Open the activity while matching is still running and confirm the segment area says matching is in progress rather than reporting that it crossed none
      cov: C-CF-66
    - kind: browser
      do: Confirm the wizard reports the upload moving through received, then parsing, then matching, then ready, terminating at failed or duplicate_suspected
      cov: C-CF-33
    - kind: browser
      do: Confirm the activity page shows the drawn route, the full set of statistics, an elevation chart, a splits table and the segment efforts the activity produced
      cov: C-FE-25
    - kind: browser
      do: Confirm the elevation chart can be stepped through from the keyboard with its values announced, or is paired with a table carrying the same numbers
      cov: C-FE-26
    - kind: browser
      do: Confirm a statistic block receives a canonical value with a quantity type rather than a formatted string, formatting it for the viewer
      cov: C-FE-19
    - kind: browser
      do: Confirm a statistic block performs no arithmetic, rendering only the derived values the server sent
      cov: C-FE-20
    - kind: browser
      do: Open the print preview of the activity and confirm the drawn route, the summary statistics, the elevation chart and the splits table survive without the feed chrome around them
      cov: C-FE-25
    - kind: pytest
