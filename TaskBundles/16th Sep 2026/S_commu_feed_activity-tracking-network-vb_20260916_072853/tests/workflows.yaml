- id: athlete_reads_and_reacts_to_the_following_feed
  purpose: The feed is a stream of activity cards from followed athletes, paged by cursor, and kudos count once
  substeps:
    - kind: browser
      do: Sign in as athlete2@example.com and confirm the following feed lists activities from the followed athletes plus the joined clubs, newest activity start time first
      cov: C-CF-93
    - kind: browser
      do: Confirm each card carries the recording athlete, the activity name, the activity type written in words beside its glyph, a drawn route and a block of distance, moving time and elevation gain
      cov: C-UF-13
    - kind: browser
      do: Confirm the condensed width carries the numerals in the statistic blocks and is never used for prose
      cov: C-UX-16
    - kind: browser
      do: Confirm the activity type appears as text rather than being carried by the glyph alone, and that a type with no glyph falls back to a generic one
      cov: C-UX-19
    - kind: browser
      do: Confirm each statistic is announced with its unit when the card is read by assistive technology
      cov: C-UX-31
    - kind: browser
      do: Confirm an activity recorded by several athletes together appears as one grouped card naming all of them with one drawn route
      cov: C-FE-23
    - kind: browser
      do: Confirm an activity entered by hand is visibly marked as such and carries no drawn route
      cov: C-FE-24
    - kind: browser
      do: Scroll to the end of the feed and confirm the feed is cursor-paginated on a stable sort key, so an insertion between pages skips no row and repeats no row
      cov: C-CF-98
    - kind: pytest
      test: test_output.py::test_feed_orders_by_start_time_and_holds_only_visible_activities
      category: core_outcome
      critical: true
      weight: 5
    - kind: pytest
      test: test_output.py::test_feed_pagination_is_by_cursor_and_survives_an_insertion
      category: data_integrity
      critical: true
      weight: 5
    - kind: pytest
      test: test_output.py::test_feed_page_fetches_no_stream
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_fanout_reaches_followers_below_the_threshold
      category: core_outcome
      weight: 5
    - kind: browser
      do: Press the kudos control on a card and confirm the count rises by one, with the glyph rendering one step smaller than the text beside it
      cov: C-UF-14, C-UX-18
    - kind: browser
      do: Press the kudos control again and confirm the count falls back, then press a third time and confirm it rises and stops there
      cov: C-CF-100
    - kind: browser
      do: Confirm the kudos control carries an accessible name rather than a bare glyph, and that every statistic on the card is announced with its unit
      cov: C-UX-31
    - kind: browser
      do: Leave a comment on an activity and confirm it appears with its author and the time it was left
