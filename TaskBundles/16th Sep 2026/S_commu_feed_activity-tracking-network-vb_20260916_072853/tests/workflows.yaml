      category: notification
      weight: 3
    - kind: pytest
      test: test_output.py::test_comment_carries_its_author_and_is_deletable
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_a_retried_follow_and_a_retried_join_change_nothing
      category: data_integrity
      weight: 5

