- id: product_holds_one_shape_across_widths_and_settings
  purpose: One header everywhere, four breakpoints, print, forced colours and reduced motion all hold
  substeps:
    - kind: browser
      do: Open the feed, a segment and a club in turn and confirm the same top bar appears on each with the same items in the same order and the same call to action
      cov: C-UF-05
    - kind: browser
      do: Narrow the window through each of the four breakpoints and confirm the layout reflows at each without the page scrolling sideways
      cov: C-UX-24
    - kind: browser
      do: Turn on a reduced-motion preference and confirm the loading indicator becomes static, feed items appear without an entrance animation, and any route replay waits for a play control rather than starting on its own
      cov: C-UX-22
    - kind: browser
      do: Turn on forced colours and confirm a drawn route still carries a shape or marker difference and a podium place is still stated in words
      cov: C-UX-26, C-UX-27
    - kind: browser
      do: Confirm every route carries exactly one first-level heading, a banner, a navigation region, a main region and a footer region
      cov: C-UX-28
    - kind: browser
      do: Confirm the spacing between elements comes from a named ladder that is dense at the small end and generous at the large end rather than a doubling series
      cov: C-UX-11
    - kind: browser
      do: Confirm borders appear only as solid, dashed or dotted lines, with no grooved, ridged, inset or outset edge anywhere
      cov: C-UX-12
    - kind: browser
      do: Confirm nothing on any page floats above the consent bar on a layer far beyond the product's own five bands
      cov: C-UX-13
    - kind: browser
      do: Confirm the four duplicate token pairs collapse to one token each, so no spacing, radius or colour value is carried under two names
      cov: C-UX-14
    - kind: browser
      do: Confirm running prose is set in the standard width while only the numerals in tables and statistic blocks use the condensed one
      cov: C-UX-16
    - kind: browser
      do: Confirm any movement in the interface follows one of a small set of named easings rather than a different curve on each surface
      cov: C-UX-21
    - kind: browser
      do: Open the clubs route and a club, then the challenges route and a challenge, and confirm each renders its roster, its feed and its standings
      cov: C-UF-03
    - kind: browser
      do: Open every public route in turn and confirm each carries its own title with its own description, none of them shared between two routes
      cov: C-CF-134
    - kind: browser
      do: Open settings, then privacy, then connected applications, then data export, and confirm the account route map covers each of the four
      cov: C-UF-04
    - kind: browser
      do: Confirm the product is built from the ten named modules, running from the token layer through the statistic block to the chart
      cov: C-FE-34
    - kind: browser
      do: Search for something no record matches and confirm the list surface shows its empty state rather than a blank region, then confirm a failed list offers a retry preserving the query with its filters
      cov: C-UF-24, C-UF-25
