- id: visitor_reads_the_signup_landing
  purpose: A visitor meets the product on a three-panel landing and can tell what it argues
  substeps:
    - kind: browser
      do: Open the signup landing and confirm the wide layout runs to the edges of the window as a panel, a white column carrying the form, and a second panel carrying a drawn device with a watch over it
      cov: C-UF-12, C-FE-09
    - kind: browser
      do: Confirm the heading reads Community-Powered Motivation with a body line about tracking progress and cheering each other on
      cov: C-FE-10
    - kind: browser
      do: Confirm the two federated controls sit above the email control, that the email control is the one filled in the brand orange, and that the two federated ones are outlined
      cov: C-FE-11
    - kind: browser
      do: Confirm a single top navigation bar carries the mark, the wordmark, five centre items in one order with a disclosure on the first, and a right cluster offering log in beside join
      cov: C-FE-01, C-UF-05
    - kind: browser
      do: Confirm the header shadow sits near a two-and-a-half percent alpha, separating the bar from the white content beneath without drawing a line
      cov: C-FE-02
    - kind: browser
      do: Confirm the footer carries four columns headed Features, Subscription, Support and Privacy, with the gift link among them
      cov: C-FE-03
    - kind: browser
      do: Open the signup landing, log in, signup, features, maps, challenges, subscription, gift, stories, help and search in turn and confirm each route renders its own content describing a capability the product actually has
      cov: C-CF-131, C-UF-01
    - kind: browser
      do: Confirm a consent bar sits at the bottom of the page, below the content rather than over it, naming cookies plainly
      cov: C-FE-04, C-FE-07
    - kind: browser
      do: Confirm the consent bar offers accept, customise and reject controls with a details disclosure, that the reject control is the same size as accept, and that rejecting takes one action
      cov: C-FE-05, C-FE-06, C-UX-29
    - kind: browser
      do: Press the Tab key once from the top of the document and confirm a skip link appears and moves focus past the navigation
      cov: C-FE-08
    - kind: browser
      do: Confirm one display family ships in two widths at three weights with a true italic, and that the interface text is one size at one leading through the page
      cov: C-UX-06, C-UX-05
    - kind: browser
      do: Confirm the only strongly saturated hue on the page is the brand orange, over near-black ink on a near-white ground
      cov: C-UX-01, C-UX-09
    - kind: browser
      do: Confirm the brand orange used as body text on the pale ground is a darker step of the same hue rather than the brand step itself
      cov: C-UX-02, C-UX-34
    - kind: browser
      do: Confirm the mark is an ascending trace built from two nested chevron forms, taller than wide, filled with no stroke
      cov: C-UX-17
    - kind: pytest
      test: test_output.py::test_public_routes_carry_distinct_titles_and_descriptions
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_social_preview_metadata_is_declared
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_mobile_viewport_is_declared
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_consent_choice_is_offered_with_a_one_action_reject
      category: presentation
      weight: 1

- id: visitor_signs_up_and_reaches_an_empty_feed
  purpose: Signup is open, collects three fields, and lands the new athlete on a feed that says it is empty
  substeps:
    - kind: browser
      do: Press Sign Up With Email and confirm the form asks for an address, a password and a display name, and asks for nothing else
      cov: C-CF-04
    - kind: browser
      do: Confirm the legal line links both the terms and the privacy documents, and that acceptance is recorded with the exact text shown at the time
      cov: C-CF-16
    - kind: browser
      do: Complete the form with a new address and confirm the product lands on the following feed
      cov: C-UF-07
    - kind: browser
      do: Confirm the empty feed states that it is empty and offers the next action, which is to find athletes to follow, rather than rendering a blank region
      cov: C-FE-32, C-UF-24
    - kind: browser
      do: Open the signup landing again while signed in and confirm the product sends the reader to the feed instead
      cov: C-UF-08
    - kind: pytest
      test: test_output.py::test_signup_creates_a_free_athlete_with_an_empty_feed
      category: core_outcome
      critical: true
      weight: 5
    - kind: pytest
      test: test_output.py::test_signup_with_a_registered_address_is_refused_without_confirming_it
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_federated_identity_links_rather_than_forking_the_account
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeded_athletes_exist_with_their_pinned_standing
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeded_world_is_present_once
      category: data_integrity
      critical: true
      weight: 5

