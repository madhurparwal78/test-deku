schema_version = "1.4"

[task]
name = "deku/structured-content-platform-vb"
version = "1.0.0"
description = "Marketing site, documentation property and authenticated studio of a structured content platform: documents with service-assigned revision fields, keyed array items, rich text stored as blocks and spans, drafts under a reserved prefix with four distinguishable states, publishing as one transaction, patches addressed by key, optimistic concurrency and idempotent transactions, strong and weak references, a projection query language reporting its own cost, a live event stream, collaborative editing without locks, an image pipeline with crop and hotspot on each use, a migration runner whose dry run is the default, datasets with grants scoped by department, and a hash-chained audit log, on postgres and minio"
uuid_v5 = "34f17a85-fbd9-5a38-b133-1e978aff4fe6"
authors = [
    "utsav.jain@ethara.ai",
    "aniket.tyagi24@ethara.ai",
]
keywords = ["greenfield", "enterprise", "typescript", "postgres", "minio", "content-publishing", "it-devtools"]

[metadata]
category         = "Greenfield"
sub_category     = "enterprise"
domain           = "it-devtools"
pattern          = "content-publishing"
service_profile  = "P4-db-storage"
variant_axes     = ["critical_depth", "spec_sections"]
capability_flags = "aesthetic"
design_direction = "companion"
launch_surface   = "cookie_choice, custom_404, no_broken_links, sitemap_robots, spam_protection"
rubric_version   = "1"
language         = "typescript"
archetype        = "structured-content-platform"
variant          = "b"
task_code        = "E_itdev_cont_structured-content-platform-vb_20260916_073627"
naming_scheme    = "task-code-v1"
grader_version   = "0.22.0"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 180
tokens_expected = 6500000
contributor_id  = "aniket.tyagi24@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"
storage = "minio"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode      = "public"
allowed_hosts     = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-deku}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-minioadmin}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-minio-root-3d81f7a2}", PREVIEW_GRANT_TTL_SEC = "${PREVIEW_GRANT_TTL_SEC:-3600}", TRANSACTION_REPLAY_WINDOW_SEC = "${TRANSACTION_REPLAY_WINDOW_SEC:-300}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-deku}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-minioadmin}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-minio-root-3d81f7a2}", PREVIEW_GRANT_TTL_SEC = "${PREVIEW_GRANT_TTL_SEC:-8}", TRANSACTION_REPLAY_WINDOW_SEC = "${TRANSACTION_REPLAY_WINDOW_SEC:-300}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_STORAGE = "minio" }

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"

[[artifacts]]
source      = "/app"
destination = "app"
