[metadata]
category     = "Greenfield"
sub_category = "enterprise"

domain          = "it-devtools"
pattern         = "approval-workflow"
service_profile = "P3-db-auth"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = ""
task_code       = "E_itdev_appr_deployment-governance-console-vb_20260916_071312"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "no_broken_links,privacy_page,single_cta,sitemap_robots,terms_page"
