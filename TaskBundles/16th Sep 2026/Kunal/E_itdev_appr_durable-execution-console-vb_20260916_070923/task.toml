schema_version = "1.4"

[task]
name = "deku/durable-execution-console-vb"
version = "1.0.0"
description = "Operator console for a durable execution platform, where a namespace change request is reviewed, approved and applied by a principal other than its requester"
authors = [
  "kaustubh.dalvi@ethara.ai",
  "kunal.singh.int5@ethara.ai"
]
uuid_v5 = "a44fe632-94f4-5fc0-ae5a-3f6daa6326bc"
keywords = ["greenfield", "enterprise", "python", "postgres", "keycloak", "approval-workflow", "durable-execution"]

[metadata]
category     = "Greenfield"
sub_category = "enterprise"

domain          = "it-devtools"
pattern         = "approval-workflow"
service_profile = "P3-db-auth"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = ""
task_code       = "E_itdev_appr_durable-execution-console-vb_20260916_070923"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "favicon,form_validation,privacy_page,security_headers,sitemap_robots"
grader_version  = "0.22.0"
rubric_version  = "1"

language     = "python"
archetype    = "durable-execution-console"
variant      = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 200
tokens_expected = 8000000
contributor_id  = "kunal.singh.int5@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"
auth    = "keycloak"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", AUTH_URL = "${AUTH_URL:-http://keycloak:8080/realms/perpetua}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", AUTH_ADMIN_TOKEN = "${AUTH_ADMIN_TOKEN:-deku_admin:deku-local-dev}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_AUTH = "keycloak" }

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"

[[artifacts]]
source      = "/app"
destination = "app"
