- id: visitor_travels_the_journey_to_the_summit
  purpose: A visitor travels the home journey from the opening headline to the summit and the tile bands match the published registry on both branches
  substeps:
    - kind: browser
      do: Open the home route and travel the journey with the wheel from the opening headline through the project tiles to the summit headline, and observe that the page itself never scrolls
      cov: C-OV-02, C-CF-44, C-CF-35, C-OV-01
    - kind: pytest
      test: test_output.py::test_journey_desktop_tile_bands_match_the_pinned_timing_table
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_journey_band_count_matches_the_published_project_count
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_home_route_is_one_viewport_tall_and_never_scrolls
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_journey_mobile_branch_carries_its_own_band_and_pages
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_journey_pages_follow_the_viewport_height
      category: business_rule
      weight: 3
    - kind: browser
      do: Choose a project from the Work menu and watch the journey travel to the middle of that project band without loading another page
      cov: C-CF-38, C-CF-37, C-UF-16, C-DC-32
    - kind: browser
      do: Open the home route in a narrow viewport and travel the journey with touch from arrival to the summit
      cov: C-UX-21, C-CF-32, C-CF-138, C-CF-33

- id: invalid_journey_request_is_refused
  purpose: An unknown journey branch and a viewport height that is not a positive number are both refused
  substeps:
    - kind: pytest
      test: test_output.py::test_journey_refuses_an_unknown_branch_and_a_bad_viewport
      category: validation
      weight: 3

- id: deployed_app_answers_health_crawler_and_page_view_routes
  purpose: The deployed app reports health, publishes a sitemap of public routes only, renders its own not-found page and logs a page view as a route and a time
  substeps:
    - kind: pytest
      test: test_output.py::test_health_route_answers_ready
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_sitemap_lists_every_public_route_and_no_private_one
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_public_markup_carries_no_credential_or_binary_asset
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_unknown_address_answers_with_the_not_found_page
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_not_found_page_shows_its_heading_and_return_link
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_page_view_is_recorded_with_its_route_and_time_only
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_page_view_for_a_private_route_is_refused
      category: validation
      weight: 3
    - kind: browser
      do: Open an address that lives nowhere and read the not-found heading and the link back to the portfolio
      cov: C-CF-136, C-CF-135, C-TR-34, C-TR-01
    - kind: browser
      do: Sign in as the owner and read the page view log newest first, carrying a route and a time and nothing else
      cov: C-CF-140, C-CF-15, C-DM-09, C-CF-139

- id: visitor_sends_a_contact_message_the_owner_reads
  purpose: A visitor sends a message from the summit contact form and the owner reads it in the console
  substeps:
    - kind: browser
      do: Travel to the summit headline, watch it become the contact form, write a name, an email and a message, and send it
      cov: C-DM-08, C-FE-29, C-CF-16, C-CF-31
    - kind: pytest
      test: test_output.py::test_contact_message_is_persisted_as_a_row_the_owner_reads
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_discarded_contact_submission_stores_no_row
      category: data_integrity
      weight: 5
    - kind: browser
      do: Sign in as the owner, open the messages console and read the new message at the head of the list
      cov: C-FE-77, C-UF-06, C-UF-11, C-TR-11

- id: invalid_contact_submission_is_refused
  purpose: A contact submission with a missing field, a malformed address or an overlong message is refused and stored nowhere
  substeps:
    - kind: pytest
      test: test_output.py::test_contact_form_refuses_a_missing_field_and_a_malformed_email
      category: validation
      weight: 3
    - kind: browser
      do: Send the contact form with a malformed email address and read the copy the page shows for that code
      cov: C-CF-25, C-CF-26, C-CF-24, C-FE-31

- id: visitor_reads_the_case_study_hub_and_the_document_routes
  purpose: A visitor opens the case study hub in hub order, reads one case study end to end, then the playground, the highlights reel, the curriculum vitae and the plain version
  substeps:
    - kind: browser
      do: Open the case study hub and observe one cell per published case study, each carrying its eyebrow and its two headline lines
      cov: C-CF-50, C-CF-52, C-FE-51, C-CF-56
    - kind: pytest
      test: test_output.py::test_seeded_projects_are_listed_in_registry_order
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_case_study_hub_order_differs_from_the_registry_order
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_published_project_record_carries_its_derived_eyebrow_and_path
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_curriculum_vitae_selected_work_is_generated_from_the_records
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_highlights_entry_shows_the_published_run_figures
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_flat_route_carries_the_plain_version_notice
      category: presentation
      weight: 1
    - kind: browser
      do: Open a case study and read its headline, its three-column metadata rail and its body blocks in stored order, then the next-project card at the foot
      cov: C-CF-53, C-CF-55, C-UF-12, C-DM-17
    - kind: browser
      do: Open the curriculum vitae, read the name, the role line and the contact details, and observe that it is the one route that scrolls natively
      cov: C-CF-67, C-CF-99, C-CF-66, C-DC-22
    - kind: browser
      do: Open the highlights reel and read one entry per published case study with its heading, its paragraph and its stat row
      cov: C-CF-64, C-CF-65, C-TR-21, C-TR-20
    - kind: browser
      do: Open the playground overlay on top of the journey and close it, returning to the exact journey position it was opened from
      cov: C-CF-59, C-UX-14, C-TR-22

- id: visitor_searches_and_an_empty_search_offers_suggestions
  purpose: A ranked search groups results by type and an empty result set offers the most used tags instead
  substeps:
    - kind: pytest
      test: test_output.py::test_search_groups_results_in_the_fixed_weight_order
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_search_index_documents_carry_their_type_weight
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_search_offers_tag_suggestions_when_nothing_matched
      category: validation
      weight: 3
    - kind: browser
      do: Type a tool name into the search field, wait for it to settle, and read the results grouped by type with the projects first
      cov: C-TR-51, C-CF-123, C-RL-02, C-CF-61

- id: owner_uploads_project_media_and_a_duplicate_leaves_one_object
  purpose: The owner attaches an image to a project, the published media is served from the object store, and the same bytes uploaded twice leave exactly one object
  substeps:
    - kind: browser
      do: Sign in as the owner, open the composer for a published project and attach an image to it
      cov: C-CF-01, C-UF-10, C-RL-16, C-RL-01
    - kind: pytest
      test: test_output.py::test_owner_upload_is_stored_in_the_bucket_under_its_sha256_object_key
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_published_media_file_is_served_byte_for_byte_from_the_object_store
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_identical_uploads_leave_exactly_one_stored_object_and_row
      critical: true
      category: data_integrity
      weight: 5

- id: invalid_media_upload_is_refused
  purpose: An upload that is not one of the three image formats, and one over the byte ceiling, are both refused and stored nowhere
  substeps:
    - kind: pytest
      test: test_output.py::test_unsupported_media_upload_is_refused_and_stores_no_object
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_oversize_media_upload_is_refused_and_stores_no_object
      category: validation
      weight: 3
    - kind: browser
      do: Attach a file that is not an image in the composer and read the refusal the page shows
      cov: C-TR-08

- id: draft_work_and_its_media_cannot_be_read_by_the_public
  purpose: A draft project, its route and its uploaded images stay unreadable until the owner publishes it
  substeps:
    - kind: pytest
      test: test_output.py::test_draft_project_record_is_not_found_for_the_public
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_draft_media_object_is_not_found_for_the_public
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_preview_token_opens_the_draft_for_one_reader
      category: business_rule
      weight: 3
    - kind: browser
      do: Sign out and open the draft case study route, and observe the portfolio not-found page rather than the draft
      cov: C-CF-10, C-CF-54, C-CF-107, C-UF-09

- id: composer_stores_and_validates_a_case_study_record
  purpose: The composer stores a new record as a draft and refuses a case study body that breaks its rules
  substeps:
    - kind: pytest
      test: test_output.py::test_publishing_through_the_composer_stores_a_draft_record
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_composer_refuses_a_case_study_with_no_failure_statement
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_composer_finding_carries_every_declared_field
      category: validation
      weight: 3
    - kind: browser
      do: Open the composer, write a new project record with its menu label, its headline lines and its category, and save it as a draft
      cov: C-TR-30, C-DM-16, C-DC-17, C-CF-08
    - kind: browser
      do: Save a case study whose body carries no failure statement and read every finding the composer reports against it
      cov: C-CF-103, C-CF-104, C-TR-17, C-CF-58

- id: reviewer_submits_and_confirms_a_peer_review
  purpose: A reviewer writes a review through an invitation, confirms it, and the owner publishes the writer own words
  substeps:
    - kind: browser
      do: Sign in as a reviewer, open the invitation link the owner handed over and write a review naming the relationship, the scope and the period
      cov: C-CF-71, C-RL-09, C-RL-07, C-CN-02
    - kind: pytest
      test: test_output.py::test_invitation_carries_at_most_one_live_review
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_review_body_never_changes_once_it_is_confirmed
      critical: true
      category: data_integrity
      weight: 5
    - kind: browser
      do: Confirm the review from the reviewer own list, then sign in as the owner and publish it
      cov: C-CF-89, C-FE-76, C-RL-10, C-CF-90
    - kind: browser
      do: Open the peer review wall and read the published review grouped by project with its attribution line
      cov: C-RL-04, C-CF-97, C-DM-25, C-FE-70

- id: expired_invitation_and_invalid_review_are_refused
  purpose: An expired invitation answers as an unknown one and every invalid review field carries its own code
  substeps:
    - kind: pytest
      test: test_output.py::test_expired_invitation_is_refused_like_an_unknown_one
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_review_submission_refuses_each_invalid_field
      category: validation
      weight: 3
    - kind: browser
      do: Submit a review whose body is far under the word floor and read the message the page shows for that code
      cov: C-CF-82, C-CF-81, C-FE-74, C-CF-73

- id: unpublished_review_cannot_reach_the_public_wall
  purpose: A review its writer has not confirmed, and every private field of any review, stay off every public surface
  substeps:
    - kind: pytest
      test: test_output.py::test_unconfirmed_reviews_are_absent_from_the_public_wall
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_public_review_payload_carries_no_reviewer_email
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_owner_cannot_publish_a_review_before_its_writer_confirms
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_owner_cannot_confirm_a_review_on_a_writer_behalf
      category: security
      weight: 5
    - kind: browser
      do: Open the peer review wall signed out and observe that no email address, decline reason or revision note appears anywhere on it
      cov: C-CF-96, C-RL-03, C-FE-69, C-FE-79

- id: reviewer_and_signed_out_caller_are_denied_the_console
  purpose: A reviewer session and a signed-out caller reach no console endpoint, no composer endpoint and no other writer review
  substeps:
    - kind: pytest
      test: test_output.py::test_reviewer_is_denied_every_admin_endpoint
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_reviewer_is_denied_the_composer_endpoints
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_reviewer_cannot_act_on_another_reviewers_review
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_anonymous_caller_is_denied_every_console_endpoint
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_signup_ignores_a_role_sent_in_the_body
      category: security
      weight: 5
    - kind: browser
      do: Sign in as a reviewer and open a console route, and observe that the console never renders for that session
      cov: C-UF-02, C-UF-03, C-CF-141, C-UF-05
    - kind: browser
      do: Sign out, open a console route, and observe the sign-in page rather than the console
      cov: C-UF-01

- id: telemetry_ingest_is_denied_without_a_device_key
  purpose: A replayed batch stores each event once, a batch with no device key or an unknown kind is refused, and an untrusted run refuses to publish its figures
  substeps:
    - kind: pytest
      test: test_output.py::test_telemetry_event_triple_is_stored_exactly_once
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_published_run_figures_stay_frozen_after_later_events
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_duplicate_device_registration_is_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_ingest_without_a_device_key_is_denied
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_ingest_refuses_an_unknown_kind_and_an_oversize_batch
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_untrusted_run_publication_is_refused_with_its_proportion
      critical: true
      category: data_integrity
      weight: 5
    - kind: browser
      do: Open the telemetry run in the console and read its sessions, their outcomes and the figures it published
      cov: C-CF-115, C-FE-81, C-TR-46, C-CF-117
    - kind: browser
      do: Open the untrusted run in the console and read its health status and its trusted proportion
      cov: C-TR-49, C-CF-116, C-UF-15, C-TR-44
