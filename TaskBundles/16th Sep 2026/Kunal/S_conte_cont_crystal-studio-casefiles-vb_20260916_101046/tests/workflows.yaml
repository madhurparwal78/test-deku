- id: the_menu_and_the_studio_story_open_as_layers
  purpose: "The menu opens over the home screen and the studio story reads as a layer with its own address"
  substeps:
    - kind: browser
      do: "Activate Discover and confirm the menu opens over the home screen without changing the address, showing About, Work and Contact as three large sentence-case words that arrive in visible perspective"
      cov: C-CF-98, C-CF-99, C-FE-24
    - kind: browser
      do: "Point at one menu word and confirm the other two words dim, move the pointer onto a word while the words are still arriving and confirm a resting pointer triggers no reaction, then press Escape and confirm the menu closes"
      cov: C-CF-103, C-CF-105, C-CF-104
    - kind: browser
      do: "Read the small account line at the foot of the menu and confirm it reads Studio Sign In while signed out, find the locale control at the foot of the menu layer, choose a locale and confirm the choice is kept for the visitor, and confirm the menu itself is marked as a navigation landmark"
      cov: C-CF-106, C-CF-375, C-CF-362, C-FE-46
    - kind: browser
      do: "Sign in as a visitor and reopen the menu to confirm the account line reads Your Shortlist, then sign in as an author and confirm the same line reads Studio"
      cov: C-CF-108, C-CF-107
    - kind: browser
      do: "Choose About and confirm the studio story shows the studio title, the promise, the disciplines line, the client rows and the awards in that order, with the headings Selected Clients over the sector rows and Awards over the award names, that the story layer scrolls inside itself, that client names are not links, and that client names in a row are separated by a middle dot with no trailing dot"
      cov: C-CF-100, C-CF-109, C-CF-112, C-CF-113, C-CF-114, C-CF-115
    - kind: browser
      do: "Activate Close Story and confirm the address returns to the home screen, that the open layer had its own address, that the close control replaced Discover in the top right, and that moving between these surfaces never loaded a new document"
      cov: C-UF-14, C-OV-05, C-OV-04, C-CF-87, C-OV-06
