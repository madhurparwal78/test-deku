    - kind: pytest
      test: test_output.py::test_the_app_serves_a_production_build
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_the_home_screen_stays_inside_its_transfer_budget
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_the_icon_set_is_declared_inside_the_document
