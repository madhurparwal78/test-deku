      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_a_public_address_answers_the_application_document
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_the_home_screen_fills_one_window
      category: presentation
      weight: 1
