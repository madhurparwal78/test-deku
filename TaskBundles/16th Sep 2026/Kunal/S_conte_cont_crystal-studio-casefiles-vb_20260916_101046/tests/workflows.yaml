- id: first_visit_arrives_at_the_crystal_and_the_wordmark
  purpose: "A stranger opens the public site of the Kelo studio and meets the arrival sequence, the turning crystal, the four corner controls and the interaction bar"
  substeps:
    - kind: browser
      do: "Open the home address of Facet, the public site of the Kelo creative studio, and watch the arrival sequence: the drop mark, a thin progress line filling from left to right, then the wordmark fading in, with no spinner shown without a progress fill beside it; the home screen that follows is one near-black window carrying a faceted crystal turning continuously in a surface that fills the window, with the two-line wordmark reading the studio name over its founding year inside one heading"
      cov: C-OV-01, C-CF-79, C-CF-81, C-OV-02, C-CF-63, C-CF-64
    - kind: browser
      do: "Once the arrival completes, watch the four corner controls appear one after another, then drag the crystal across the home screen and confirm the crystal rotates with the pointer, keeps its momentum on release and settles back to its idle rotation, and that a drag starting on the wordmark never selects the wordmark text"
      cov: C-CF-80, C-CF-69, C-CF-70, C-CF-71
    - kind: browser
      do: "Press the Drop control in the top left and confirm the crystal reseeds without reloading the scene and the reseed counter increments, then read the four corner controls in place: Drop top left, Discover top right, Showreel bottom left and Audio bottom right"
      cov: C-CF-72, C-CF-73, C-CF-83
    - kind: browser
      do: "Move the pointer slowly into the top right corner and confirm the control is acquired well before the pointer reaches the mark, that the control name appears only when the pointer comes near, and that the corner controls never move into a bar or collapse into a menu sheet"
      cov: C-CF-84, C-CF-85, C-CF-86
    - kind: browser
      do: "Read the interaction bar along the bottom centre and confirm its messages are uppercase, short and faded after a moment, that the bar text is announced through a polite live region, and that the Audio mark shows sound off on arrival as a crossed speaker"
      cov: C-CF-90, C-CF-92, C-CF-93, C-CF-95
    - kind: browser
      do: "Turn sound on with the Audio control, confirm the mark changes to a speaker with two arcs, reload the page and confirm the sound choice persists, and confirm the crystal is still visible and turning behind the reloaded screen at this width"
      cov: C-CF-96, C-CF-76, C-CF-77
    - kind: browser
      do: "Before any enquiry has been written in this run, sign in as the editor, open the enquiry inbox and confirm the empty inbox shows No enquiries. over the line saying nobody has written yet, with the control SEE THE CONTACT PAGE, then sign out again"
      cov: C-CF-390
