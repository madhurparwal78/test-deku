- id: visitor_reads_the_network_pitch
  purpose: A visitor opens the home route and reads the promise, the trust wall, the platform section, the turning globe and the industry cards in one pass
  substeps:
    - kind: browser
      do: Open the route / that serves the network pitch to the public and read the marketing site of one edge cloud platform state its promise in one line: a dark opening band carrying the pinned home headline over its sub-line, the headline scaling with the width of its column
      cov: C-OV-01, C-OV-03, C-UF-01, C-CF-98, C-CF-99, C-FE-31, C-FE-32
    - kind: browser
      do: Read the two opening actions, Request a demo beside the filled Get started, find both actions leading to /signup, and at a narrow width find the two home actions stacked; the generated illustration beside the words is a block motif composed from a fixed seed so the motif is the same on every load, and it declares itself decorative
      cov: C-CF-100, C-CF-101, C-CF-102, C-CF-103, C-FE-33, C-FE-34, C-FE-35, C-FE-36
    - kind: browser
      do: Read the lower bar row carrying the Veloce wordmark at the far left, find Try Veloce Free the primary action in the chrome, and follow Try Veloce Free to /signup
      cov: C-CF-49, C-CF-55, C-CF-56
    - kind: browser
      do: Watch the announcement rail slide sideways without pausing and the customer marks of the trust wall move faster beneath the line Trusted by the world's leading digital innovators, with every mark drawn in the document rather than fetched from another host; both strips loop seamlessly with no gap at the join, and both strips hold still under a reduced-motion preference
      cov: C-OV-04, C-CF-104, C-CF-105, C-CF-106, C-CF-107, C-CF-108, C-FE-37, C-FE-38, C-FE-39, C-FE-40
    - kind: browser
      do: Watch the network panel while the home route loads and find the application makes no outbound network call at run time: no third-party chat exists in it, no third-party consent platform, no analytics vendor and no tag manager
      cov: C-TR-38, C-TR-39, C-TR-40, C-TR-41, C-TR-42
    - kind: browser
      do: Read the platform section, its four family headings and the thirty-two services listed under them, then follow Check out the Veloce CDN to the route /pricing that serves the plans to the public
      cov: C-CF-109, C-CF-110, C-CF-111, C-CF-112, C-UF-03
    - kind: browser
      do: Scroll to A more powerful global network, read the paragraph beginning We built our network with intention, and watch the outline globe turn with its meridian arcs, its pins arriving on one expanding pulse and its thin orbit ring, with nothing about the globe a picture file
      cov: C-OV-05, C-CF-113, C-CF-114, C-CF-130, C-CF-131, C-CF-132, C-CF-133, C-CF-134, C-CF-135, C-FE-52, C-FE-53, C-FE-54, C-FE-55, C-UF-30, C-UF-31
    - kind: browser
      do: Read the text alternative the globe carries stating the network claim rather than describing the drawing, set a reduced-motion preference and find the globe holds still with its pins present, then read the link the network section carries reading Take a closer look and follow it to the route /company that serves the company story to the public
      cov: C-CF-115, C-CF-116, C-CF-136, C-CF-137, C-CF-138, C-UF-02
    - kind: browser
      do: Read the flexibility heading, its paragraph and the three industry cards eCommerce, Streaming Media and Travel and hospitality by which the site segments the offer by industry, each a generated gradient thumbnail above its title, the three card shapes sharing one softening with one hairline and each thumbnail keyed by a per-card seed so no two cards on a page carry the same gradient
      cov: C-OV-09, C-CF-117, C-CF-118, C-CF-119, C-CF-120, C-CF-121, C-CF-122, C-CF-123, C-FE-56, C-FE-57, C-FE-59, C-FE-60
    - kind: browser
      do: Read the three reading cards drawn newest first from the published articles, each a thumbnail over a category eyebrow with a Read the report link, then find the site closes on a create-account call in a footer that shares the chrome ground, opening on Get in touch or create an account with its taxonomy columns, Terms, Privacy, the language control and the social marks
