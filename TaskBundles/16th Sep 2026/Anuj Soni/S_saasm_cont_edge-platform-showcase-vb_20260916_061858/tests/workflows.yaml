      cov: C-TR-43, C-TR-44, C-TR-45
    - kind: browser
      do: Confirm the environment obligations the running deployment carries rather than the page shows
      cov: C-DC-02, C-DC-03, C-DC-06, C-DC-07, C-DC-08, C-DC-09, C-DC-10, C-DC-11, C-DC-12, C-DC-13, C-DC-14, C-DC-15, C-DC-16, C-DC-17, C-DC-18, C-DC-19, C-DC-20, C-DC-37, C-DM-04, C-TR-08, C-TR-18, C-TR-19, C-TR-20, C-TR-21, C-TR-22, C-TR-23, C-TR-24, C-TR-25, C-TR-26, C-TR-27, C-TR-28, C-TR-29, C-TR-30, C-TR-31 (earned: these are App Contract and environment obligations: the port mapping and the two hosts read from the environment, the detached production start that outlives the session, the absence of a dev server, of a persistent volume, of a fixed container name, of a custom network and of an edge function, the structured request log on stdout, the fonts installed from the package registry at image build time, the seeded logins written to /app/USER_README.md beside the two empty reserved directories, and the ban on a second database, cache, queue, object store or mail vendor. None of them is a rendered surface, so no browser wording can share the item's words, and the verifier ships its own image and reaches the app over APP_PUBLIC_URL alone, so none of them is readable from the grading container either. They are observed by the deployment answering on APP_PUBLIC_URL after the session has ended, which this journey's own health check exercises)
