- id: members_article_body_is_denied_to_a_visitor
  purpose: An article behind the members wall shows its opening to a visitor and its body only to somebody signed in
  substeps:
    - kind: browser
      do: Signed out, open the members article and read its category, title, author, cover and excerpt with Try Veloce Free offered in place of the body
      cov: C-OV-23, C-CF-219, C-CF-224
    - kind: browser
      do: Find the same article marked in the index as needing an account, and its body absent from the page
      cov: C-OV-24, C-UF-42
    - kind: browser
      do: Sign in as reader@example.com, open the same address, and read the full body
      cov: C-UF-43, C-RL-15
    - kind: browser
      do: Open a published open article and read its category, title, author display name, published date, cover image and full body with no session
      cov: C-RL-04
    - kind: pytest
      test: test_output.py::test_members_article_withholds_its_body_from_a_visitor
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_members_article_body_is_served_to_a_signed_in_reader
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_open_article_read_returns_its_body_to_anybody
      category: business_rule
      weight: 3

- id: reader_cannot_reach_the_desk_and_an_author_cannot_reach_what_it_does_not_own
  purpose: A reader session is turned away from every desk address, a caller with no session is sent to sign in first, and a write aimed at another author's article is refused
  substeps:
    - kind: browser
      do: Sign in as reader@example.com, open a /desk address, and read the refusal saying the desk belongs to authors with /blog offered instead
      cov: C-UF-22, C-UF-23, C-UF-24
    - kind: browser
      do: Sign out, open a /desk address with no session at all, and land on /login with the destination preserved
      cov: C-RL-13, C-RL-19
    - kind: browser
      do: Sign in as author2@example.com, reach the edit address of an article author@example.com owns, read the refusal with the article unchanged behind it, and find no draft of another author anywhere in the desk list
      cov: C-UF-25, C-RL-31
    - kind: pytest
      test: test_output.py::test_reader_cannot_reach_the_desk_list
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_anonymous_desk_request_is_denied
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_author_cannot_edit_another_authors_article
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_signed_out_token_is_no_longer_accepted
      category: security
      weight: 5

- id: invalid_article_write_is_refused
  purpose: A write reusing a slug, or missing a title or a body, is refused inline and writes nothing
  substeps:
    - kind: browser
      do: On /desk/new type a slug another article already holds, save, and read the refusal naming the slug field beside it
      cov: C-CF-249
    - kind: browser
      do: Clear the title, save, read the refusal naming the title field, then clear the body and read the refusal naming the body field
      cov: C-CF-251, C-CF-252
    - kind: pytest
      test: test_output.py::test_duplicate_slug_is_refused_and_stores_no_second_article
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_article_missing_a_required_field_is_refused_and_stores_nothing
      category: validation
      weight: 3

- id: visitor_records_a_cookie_choice
  purpose: A first-time visitor is asked once about non-essential cookies and the answer survives a reload
  substeps:
    - kind: browser
      do: Arrive at the route / for the first time and find the cookie card appears once, floating near a bottom corner and carrying its sentence word for word with Cookie Policy leading to /privacy and the two controls Ok and No thanks, neither hidden behind the other, with the page behind it still readable and reachable
      cov: C-CF-329, C-CF-330, C-CF-331, C-CF-332, C-CF-333, C-CF-334, C-CF-335, C-CF-339, C-UF-44
    - kind: browser
      do: Press Ok, find the cookie answer recorded against the opaque key the browser keeps, reload / and find the recorded answer survives with the card gone
      cov: C-CF-336, C-CF-337, C-CF-338
    - kind: browser
      do: Watch a route show its loading state before its content arrives, a list show placeholder rows of the same height as real ones rather than a blank frame, an empty list show its own words above the surface's primary action, and a failed request leave the page readable with no raw error
      cov: C-UF-45, C-UF-46, C-UF-47, C-UF-48, C-FE-74, C-FE-75, C-FE-76
    - kind: pytest
      test: test_output.py::test_cookie_choice_is_stored_once_per_visitor_key
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeding_is_idempotent_across_every_seeded_table
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeded_article_rows_carry_their_pinned_fields
      category: data_integrity
      weight: 5

- id: visitor_searches_the_site_and_meets_the_not_found_page
  purpose: A visitor searches the site from the bar, reaches published articles, services and marketing routes but never a draft, and meets the site's own not-found page at an address the app does not have
  substeps:
    - kind: browser
      do: Press the search trigger, read the field carrying the placeholder Search beside a Clear control, type a query and press Clear to empty it, then submit a query and read the results at /search, each a title over the address it leads to with a short extract
      cov: C-CF-291, C-CF-292, C-CF-293, C-CF-295, C-UF-13
    - kind: browser
      do: Search for a word nothing uses and read the empty-search words, then search for the title of an unpublished article and find nothing answering for it
      cov: C-CF-300
    - kind: browser
      do: Open an address the app does not have and read the site's own not-found page wearing the same chrome, carrying one line of display type over one line of reading type, with nothing on it moving
      cov: C-CF-323, C-CF-325, C-CF-328, C-FE-73
    - kind: browser
      do: Follow the two links the not-found page carries, back to / and on to /blog
      cov: C-CF-326, C-CF-327
    - kind: pytest
      test: test_output.py::test_search_reaches_articles_services_and_routes
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_search_never_returns_a_draft_to_anybody
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_unknown_address_answers_not_found
      category: business_rule
      weight: 3
