      weight: 5
    - kind: pytest
      test: test_output.py::test_draft_story_requested_by_identifier_by_another_author_is_denied
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_draft_story_is_absent_from_another_authors_story_list
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_draft_story_cover_is_refused_to_every_caller_but_the_owner
      critical: true
      category: security
