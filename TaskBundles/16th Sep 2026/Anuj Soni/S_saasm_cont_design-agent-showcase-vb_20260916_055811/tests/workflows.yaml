- id: visitor_reads_the_home_route_and_the_shared_chrome
  purpose: A visitor opens the home route and meets the chrome the whole site wears
  substeps:
    - kind: browser
      do: Open the home route serving the public marketing site for the AI website builder named Kanvo, and read the headline over the continuously moving fluid field
      cov: C-OV-01, C-CF-20
    - kind: browser
      do: Read the eight customer wordmarks under the label Meet our customers, then scroll into the dense grid of platform tiles below the customer strip
      cov: C-CF-22, C-CF-24
    - kind: browser
      do: Read the fixed top bar on the home route, open each of the three menu labels so a full-width panel of grouped links appears, then read the footer directory
      cov: C-CF-06, C-CF-07, C-CF-08
    - kind: browser
      do: Scroll the fluid field out of view on the home route and confirm the fluid field stops rather than running behind the reader
      cov: C-CF-21
    - kind: browser
      do: Answer the cookie card that asks a first-time visitor once about non-essential cookies, then reload the home route so the cookie choice survives the reload
      cov: C-CF-10, C-CF-11
    - kind: pytest
      test: test_output.py::test_hero_metric_line_is_served_by_the_app
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_api_is_served_under_the_api_prefix_on_the_same_origin
      category: presentation
      weight: 1

- id: visitor_walks_the_product_routes_and_every_internal_link_resolves
  purpose: A visitor scrolls the product routes, each staged replica advances with the scroll, and every internal link reaches a page
  substeps:
    - kind: browser
      do: Scroll the AI route into the canvas replica showing the page tree rail, then scroll back so the replica renders the frame belonging to the earlier progress input
      cov: C-CF-26, C-CF-33
    - kind: browser
      do: Scroll the AI route through the four capability scenes under one heading while the animated replicas of the product play inside the marketing route
      cov: C-CF-27, C-OV-02
    - kind: browser
      do: Scroll the CMS route into the collections rail beside the table of content rows, then read the published customer stories listed with a category tag apiece
      cov: C-CF-28, C-CF-30
    - kind: browser
      do: Scroll the SEO route into the page-settings replica bound to content variables, then into the vitals readout beside the well-known files panel
      cov: C-CF-31, C-CF-32
    - kind: browser
      do: Type into the agent chat inside a replica on the AI route and confirm the app generates no website for a visitor and calls no model at run time
      cov: C-OV-05, C-OV-06
    - kind: browser
      do: Read the heading of the home route, the AI route and the CMS route as text that paints before the fluid field starts behind it
      cov: C-TR-11
    - kind: pytest
      test: test_output.py::test_story_category_belongs_to_the_seven_named_categories
      category: business_rule
      weight: 3
    - kind: browser
      do: Follow every internal link that leads somewhere from the home route, the AI route, the CMS route, the SEO route and the scanner route, and reach a page from each of the five marketing routes
      cov: C-CF-09, C-UF-01
    - kind: pytest
      test: test_output.py::test_no_payment_or_checkout_route_exists
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_scan_completes_for_an_address_that_does_not_resolve
      category: business_rule
      weight: 3

- id: visitor_scans_a_site_and_reads_the_graded_report
  purpose: A visitor submits the answer-engine scanner and reads a graded sectioned report
  substeps:
    - kind: browser
      do: Open the scanner route and read the scanner card holding a website field beside two name fields, then confirm the app collects a visitor as a lead through the answer-engine scanner
      cov: C-CF-54, C-OV-03
    - kind: browser
      do: Submit the scanner form, watch the thin bar fill, then read the report at the address the accepted submission answers with as a scan reference
      cov: C-CF-57
    - kind: pytest
      test: test_output.py::test_accepted_scan_submission_answers_with_a_scan_reference
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_scan_reference_reads_scan_followed_by_twelve_hexadecimal_characters
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_scan_advances_to_complete_without_further_visitor_action
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_complete_scan_carries_exactly_four_graded_sections
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_complete_scan_carries_an_overall_grade_from_the_three_words
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_two_scans_of_one_address_produce_identical_grades
      category: data_integrity
      weight: 5

- id: invalid_scan_submission_is_refused_and_writes_nothing
  purpose: A malformed address or a consumer mail address is refused inline and no scan is written
  substeps:
    - kind: browser
      do: Submit the scanner form with an address naming no host with a dot, then with a business email at a consumer mail domain, and read both fields named inline as invalid
      cov: C-CF-55, C-CF-56
    - kind: pytest
      test: test_output.py::test_scan_address_naming_no_host_with_a_dot_is_refused_and_writes_nothing
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_scan_business_email_at_a_consumer_mail_domain_is_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_fourth_scan_from_one_business_email_inside_an_hour_is_refused
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_scan_report_omits_the_name_of_the_person_who_submitted_it
      category: security
      weight: 5

- id: visitor_subscribes_and_a_duplicate_address_creates_no_second_record
  purpose: A visitor subscribes from the footer, the address counts only once confirmed, and a duplicate submission writes nothing
  substeps:
    - kind: browser
      do: Submit an address to the newsletter capture in the footer and read the inline banner naming the confirmation step, because the app sends no email to announce it
      cov: C-CF-65, C-OV-07
    - kind: pytest
      test: test_output.py::test_new_newsletter_address_is_recorded_with_the_status_pending
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_confirming_a_subscription_moves_the_status_to_confirmed
      category: business_rule
      weight: 3
    - kind: browser
      do: Submit one address to the newsletter capture in the footer twice and read the inline banner saying the newsletter creates no second record for a repeated address
      cov: C-CF-67
    - kind: pytest
      test: test_output.py::test_repeated_newsletter_address_creates_no_second_subscriber_row
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_confirming_twice_leaves_one_confirmed_subscriber
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_malformed_newsletter_address_is_rejected_and_writes_nothing
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_concurrent_subscriptions_of_one_address_leave_exactly_one_subscriber
      category: data_integrity
      weight: 5

- id: author_signs_in_and_writes_a_story
  purpose: An author signs in, reaches the studio and writes a customer story from its own address
  substeps:
    - kind: browser
      do: Sign in as author@example.com with no preserved destination and land on the studio, where the app keeps customer stories behind a sign-in boundary
      cov: C-UF-04, C-OV-04
    - kind: browser
      do: Follow New story from the studio to its own address, write a title, a slug, a category, an intro and a body, and save the newly created story
      cov: C-CF-36
    - kind: pytest
      test: test_output.py::test_login_returns_a_bearer_token_for_every_seeded_account
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_new_story_row_is_persisted_with_the_state_draft
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_story_body_is_not_stored_in_the_cover_row
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_database_at_the_database_url_holds_the_seeded_rows
      category: data_integrity
      weight: 5

- id: author_publishes_a_story_and_the_index_shows_it_first
  purpose: An author publishes a story and the public story index lists it newest published first
  substeps:
