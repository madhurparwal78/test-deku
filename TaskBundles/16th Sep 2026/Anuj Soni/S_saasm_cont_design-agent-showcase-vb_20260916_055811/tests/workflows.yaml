      do: Publish the story from the studio, then open the story index and see the app list published stories newest published first with this story at the top
      cov: C-RL-06, C-CF-44
    - kind: pytest
      test: test_output.py::test_publishing_a_story_sets_its_state_and_published_moment
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_story_index_lists_published_stories_newest_published_first
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_unpublishing_returns_a_story_to_the_state_draft
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_published_open_story_is_served_in_full_to_a_signed_out_visitor
      critical: true
      category: core_outcome
      weight: 5

