schema_version = "1.4"

[task]
name = "deku/creative-studio-archive-vb"
version = "1.0.0"
description = "The public site and the back office of a small digital creative studio: one scroll driven sequence of eight ordered blocks ending in a numbered stack of client cases whose graded veil is computed from each card's position and regrades when the stack is reordered; a second mode over the same document holding a wrapping, draggable wall of several hundred archive images laid out from the item sizes and a stored seed so that no two overlap and two reads agree; addressable case studies of seven body block types that answer a stranger as an unknown address does until they are published, with the cover object behind them refused on the same rule; an awards board whose every count is derived from individual win records rather than typed; a work inquiry carrying a client generated key that produces exactly one row on a repeat, defended by a decoy field, a minimum fill time, a rate ceiling and a quarantine state that never discards anything; and a console where a writer may draft but never publish, a lead publishes only against a client approval recorded on the exact revision, an erased inquiry keeps its row and its events while every personal field reads the erasure marker, and an append only trail chains each row to the one before it."
authors = [
  "utsav.jain@ethara.ai",
  "anuj.soni@ethara.ai",
]
uuid_v5 = "54bdfeeb-e2e5-58d9-89b2-0f74181ec4cf"
keywords = ["greenfield", "solo_founder", "typescript", "postgres", "minio", "local-services", "content-publishing"]

