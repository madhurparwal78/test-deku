- id: visitor_reads_the_project_site
  purpose: "A stranger opens the public project site, reads the home route band by band and finds every internal link resolving on an app that carries its credentials file and its reserved directories"
  substeps:
    - kind: browser
      do: "Tab into / and find the skip link as the first focusable element on the route, then read down the route and find exactly one level-one heading on it"
      cov: C-UX-40, C-UX-41
    - kind: browser
      do: "Read the home route from the top down and find the announcement bar stacked above the hero billboard, four action cards carried below the hero billboard, and each action card one link covering its own icon"
      cov: C-CF-171, C-CF-172, C-CF-178
    - kind: browser
      do: "Read the home route feature grid and find eight icons sitting above the eight feature cards, each one drawn as inline vector geometry rather than fetched as a file"
      cov: C-FE-21, C-FE-20
    - kind: browser
      do: "Open /downloads, /support and /blog and find the announcement bar appears on no route other than the home route"
      cov: C-CF-173
    - kind: browser
      do: "Read the header and the home route bands and find no surface the product styles carries a gradient anywhere"
      cov: C-UX-15
    - kind: browser
      do: "Scroll the home route and find the header stays in place as the page moves beneath the header, while the announcement bar scrolls out of view as the header stays put"
      cov: C-FE-15, C-FE-16
    - kind: browser
      do: "Read the footer on every public route and find the same four link columns and the same closing lines on each of them"
    - kind: browser
      do: "Measure the rendered type on / and find fine print renders at 11.9px, secondary copy renders at 13.6px and body copy renders at 16px on a line height of 23.2px"
      cov: C-FE-01, C-FE-02, C-FE-03
    - kind: browser
      do: "Measure the rendered headings on / and find a card title renders at 22.4px, a section heading renders at 32px and the hero display line renders at 3rem on a wide screen"
      cov: C-FE-04, C-FE-05, C-FE-07
    - kind: browser
      do: "Open /blog and an article beneath it and find an article first-level heading renders at 2.2rem"
      cov: C-FE-06
    - kind: browser
      do: "Read the type on / and find headings use the family Source Sans 3 while a monospace face carries digests, medical record numbers and coded values"
      cov: C-UX-18, C-UX-20
    - kind: browser
      do: "Read the adopter row and the certification plate and find an organisation mark renders as the organisation name in type and a certification mark renders as a bordered plate carrying text"
      cov: C-FE-23, C-FE-24
    - kind: browser
      do: "Open the support panel over the home route and find three stacking levels exist, no more, across the panel, the header and the mirror behind the document"
      cov: C-FE-12
    - kind: browser
      do: "Reach the wordmark with the keyboard and find one link whose accessible name is the product name"
      cov: C-FE-17
    - kind: browser
      do: "Read a photographic band on the home route and find the band carries no text and is exposed as decorative"
      cov: C-FE-30, C-FE-31
    - kind: pytest
      test: test_output.py::test_the_deployed_app_answers_from_outside_its_own_container
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_health_endpoint_answers_two_hundred
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_credentials_file_is_written_at_the_app_root
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_reserved_directories_exist_and_are_empty
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_public_documents_are_rendered_on_the_server
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_announcement_bar_is_home_route_only
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_internal_links_on_public_routes_resolve
      critical: true
      category: business_rule
      weight: 5
    - kind: pytest
      test: test_output.py::test_list_endpoints_return_a_top_level_array
      category: presentation
      weight: 1
