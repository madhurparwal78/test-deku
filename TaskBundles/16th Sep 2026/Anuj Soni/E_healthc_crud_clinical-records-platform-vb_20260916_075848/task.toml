schema_version = "1.4"

[task]
name = "deku/clinical-records-platform-vb"
version = "1.0.0"
description = "The public project site and the clinical record of Kestrel, an open-source health record for a small clinic: a project site carrying a release whose artifacts ship their digests, a demonstration that holds no real patient data, a module directory whose category badges are routes, a news index and a real not-found route that records what it refused; and behind a sign-in, an evidentiary record where nothing is overwritten, a patient register whose identifiers are unique only within their issuing system and whose twins reach a review queue rather than a merge, an appointment book where the store refuses the second booking of one slot, encounters whose draft notes are private to their author and whose stale saves are refused rather than merged, results that arrive once under their control identifier and are queued rather than guessed when they match no patient, prescribing that warns without naming a fact the prescriber may not see, and claims whose remittances post nothing at all unless they balance to the minor unit; and one action, signing an encounter, that locks the note against a stored rendering, releases its orders and queues its claim in a single transaction."
authors = [
  "utsav.jain@ethara.ai",
  "anuj.soni@ethara.ai",
]
uuid_v5 = "fd578380-6522-5a94-82db-842ec0dbf3de"
keywords = ["greenfield", "enterprise", "typescript", "postgres", "healthcare-clinical", "crud-catalog"]

[metadata]
category     = "Greenfield"
sub_category = "enterprise"

domain          = "healthcare-clinical"
pattern         = "crud-catalog"
service_profile = "P1-db"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = "aesthetic"
task_code       = "E_healthc_crud_clinical-records-platform-vb_20260916_075848"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface  = "meta_tags,no_broken_links,page_view_log,security_headers,social_preview"
grader_version  = "0.22.0"

language     = "typescript"
archetype    = "clinical-records-platform"
variant      = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 180
tokens_expected = 6500000
contributor_id  = "anuj.soni@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true

difficulty           = ""
