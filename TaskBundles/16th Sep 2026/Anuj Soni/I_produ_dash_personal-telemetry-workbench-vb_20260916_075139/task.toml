schema_version = "1.4"

[task]
name = "deku/personal-telemetry-workbench-vb"
version = "1.0.0"
description = "A local-first product-telemetry workbench for one developer measuring the software they ship: one workspace of projects holding an event archive, session recordings, feature flags, experiments, error groups and survey answers that all resolve to one person identity and one clock, a zoomable event field whose five bands run from a density image of years down to one mark per event, a brush that resolves a cohort whose cardinality equals the distinct persons in the raw events beneath it, saved insights that must carry the provenance of every result, dashboards whose tile filters declare their conflicts, deterministic flag evaluation and experiment assignment from a frozen salt, a three-step insight wizard, a held mode that records authoring as pending work while refusing six publishing operations outright, a processing switch that names the capabilities it withdraws before it is enabled, capability-scoped revocable read-only share links that answer a revoked token exactly as they answer one that never existed, and an append-only operation log with a digest chain from which the audit answer is derived rather than stored"
authors = [
  "utsav.jain@ethara.ai",
  "anuj.soni@ethara.ai",
]
uuid_v5 = "eb3ac3eb-824d-52b4-a3ad-fb26f1e5a134"
keywords = ["greenfield", "individual", "typescript", "postgres", "productivity-self-management", "dashboard-analytics"]

[metadata]
category     = "Greenfield"
sub_category = "individual"

domain          = "productivity-self-management"
pattern         = "dashboard-analytics"
service_profile = "P1-db"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = ""
task_code       = "I_produ_dash_personal-telemetry-workbench-vb_20260916_075139"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface  = "colour_contrast,form_validation,meta_tags,no_broken_links,security_headers"
grader_version  = "0.22.0"

language     = "typescript"
archetype    = "personal-telemetry-workbench"
variant      = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 195
tokens_expected = 6800000
contributor_id  = "anuj.soni@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true

difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "shared"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", DEKU_SERVICE_BACKEND = "postgres" }

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"

[[artifacts]]
source      = "/app"
destination = "app"
