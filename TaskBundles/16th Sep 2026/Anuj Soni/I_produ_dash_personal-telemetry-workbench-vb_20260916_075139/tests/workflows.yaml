- id: owner_signs_in_and_reaches_the_field_through_its_launch_surface
  purpose: The owner signs in, lands on the event field, and every surface a real product carries before it launches is present
  substeps:
    - kind: browser
      do: Sign in at /login as owner@example.com and land on the event field of the last project the owner used
      cov: C-UF-06
    - kind: pytest
      test: test_output.py::test_health_route_answers_two_hundred
      category: presentation
      weight: 1
    - kind: browser
      do: Open the root address as an unknown visitor and land on the sign-in route, then open the root address signed in and land on the field of the last project used
      cov: C-UF-01, C-UF-02
    - kind: pytest
      test: test_output.py::test_owner_signs_in_and_receives_a_bearer_token
      category: security
      weight: 5
    - kind: browser
      do: Read the rail carrying exactly eight destinations in a fixed order, each marked with its own rail attribute
      cov: C-FE-04, C-FE-24
    - kind: pytest
      test: test_output.py::test_both_seeded_accounts_sign_in_with_the_pinned_password
      category: security
      weight: 5
    - kind: browser
      do: Switch project from the control in the rail header and confirm the current surface is kept rather than returning to a home screen
      cov: C-FE-05, C-FE-06
    - kind: pytest
      test: test_output.py::test_credentials_file_is_written_at_the_app_root
      category: presentation
      weight: 1
    - kind: browser
      do: Open the command surface over the field, type a saved object name, move the selection with the arrow keys and go to the result
      cov: C-FE-07, C-FE-08
    - kind: pytest
      test: test_output.py::test_reserved_directories_exist_and_are_empty
      category: presentation
      weight: 1
    - kind: browser
      do: Open the empty project quarry and read the honest empty state naming why no events have been received, offering the ingest snippet rather than documentation
      cov: C-UF-21
    - kind: pytest
      test: test_output.py::test_project_list_holds_only_the_projects_of_the_signed_in_owner
      category: security
      weight: 5
    - kind: browser
      do: Open an unrecognised address and read the product's own not-found page rendered inside the shell with the rail intact and a way back to the field
      cov: C-CF-46, C-CF-227
    - kind: pytest
      test: test_output.py::test_project_document_declares_every_structural_limit
      category: business_rule
      weight: 3
    - kind: browser
      do: Open /privacy from the footer of the sign-in page and read what the workbench stores
      cov: C-CF-225
    - kind: pytest
      test: test_output.py::test_privacy_page_is_readable_without_signing_in
      category: presentation
      weight: 1
    - kind: browser
      do: Submit the sign-in form with an invalid email and read the refusal inline beside the field that was wrong, with nothing written
      cov: C-CF-219, C-CF-220, C-CF-221
    - kind: pytest
      test: test_output.py::test_public_routes_declare_distinct_titles_and_descriptions
      category: presentation
      weight: 1
    - kind: browser
      do: Confirm each page leads with exactly one primary action, visually distinct from every secondary one
      cov: C-UX-35
    - kind: pytest
      test: test_output.py::test_every_response_carries_the_security_headers
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_every_api_response_carries_the_rate_limit_headers
      category: presentation
      weight: 1
    - kind: browser
      do: Read body text against its background at a contrast ratio of at least 4.5:1 in both the dark theme and the light theme
      cov: C-UX-37
    - kind: pytest
      test: test_output.py::test_unknown_address_answers_not_found_with_a_way_back
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_every_internal_link_on_a_public_route_resolves
      category: presentation
      weight: 1
    - kind: browser
      do: Move focus to a control and read a visible focus ring holding a contrast ratio of at least 3:1 against its own background
      cov: C-UX-38
    - kind: pytest
      test: test_output.py::test_no_credential_appears_in_anything_the_browser_downloads
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_an_address_under_the_api_prefix_that_is_unnamed_answers_not_found
      category: validation
      weight: 3
    - kind: browser
      do: Confirm every touch target measures at least 44 CSS pixels on each side
      cov: C-UX-39
    - kind: pytest
      test: test_output.py::test_signup_creates_an_account_with_an_empty_workspace
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_a_request_with_no_token_is_denied_at_the_api
      category: security
      weight: 5

- id: field_total_reconciles_at_every_band
  purpose: One span reports one total at every magnification, and no band transition leaves the field empty
  substeps:
    - kind: browser
      do: Zoom the field out to the epoch band and read a density cell per person per day coloured by the dominant event class
      cov: C-CF-24
    - kind: browser
      do: Zoom into the season band and read banded density carrying a hue per event type
      cov: C-CF-25
    - kind: browser
      do: Zoom into the week band and read nearby events grouped into one mark, then into the session band and read one mark per event with person lanes resolved
      cov: C-CF-26, C-CF-27
    - kind: pytest
      test: test_output.py::test_span_total_is_identical_at_every_band
      critical: true
      category: core_outcome
      weight: 5
    - kind: browser
      do: Zoom into the moment band and read property labels drawn beside each mark, with the band attribute on the field root reading moment
      cov: C-CF-28, C-FE-21
    - kind: pytest
      test: test_output.py::test_field_answer_names_the_band_it_drew
      category: business_rule
      weight: 3
    - kind: browser
      do: Zoom out and back in and watch the band indicator move through all five bands, with the two representations cross-fading rather than swapping and the field never empty during the transition
      cov: C-UF-11
    - kind: pytest
      test: test_output.py::test_field_total_reconciles_with_the_raw_event_rows
      critical: true
      category: data_integrity
      weight: 5
    - kind: browser
      do: Nudge the viewport back and forth across a band boundary and confirm the representation stays on one band
      cov: C-CF-30
    - kind: pytest
      test: test_output.py::test_field_person_count_reconciles_with_the_raw_event_rows
      category: data_integrity
      weight: 5
    - kind: browser
      do: Zoom continuously from the whole archive down to a single millisecond, confirming one wheel notch changes the visible span by one proportion at every scale
      cov: C-CF-32, C-CF-33
    - kind: pytest
      test: test_output.py::test_field_accepts_every_bound_dimension
      category: business_rule
      weight: 3
    - kind: browser
      do: Zoom about the pointer and confirm the time axis under the pointer holds still
      cov: C-CF-34
    - kind: pytest
      test: test_output.py::test_seeded_archive_holds_the_pinned_event_total
      category: data_integrity
      weight: 5
    - kind: browser
      do: Read the time ribbon across the top of the field with its tick density following the visible span
      cov: C-FE-09
    - kind: pytest
      test: test_output.py::test_seeded_event_types_carry_the_pinned_counts
      category: data_integrity
      weight: 5
    - kind: browser
      do: Read the minimap marking the current viewport within the whole archive
      cov: C-FE-11
    - kind: pytest
      test: test_output.py::test_seeded_event_rows_are_stored_in_the_database
      critical: true
      category: data_integrity
      weight: 5
    - kind: browser
      do: Copy the address of the field at one viewport, open the address in a new session and read an identical view carrying the same time bounds, the same bound dimension, the same overlays and the same event-type filter
      cov: C-CF-42, C-CF-43
    - kind: pytest
      test: test_output.py::test_empty_project_reports_no_events
      category: business_rule
      weight: 3

