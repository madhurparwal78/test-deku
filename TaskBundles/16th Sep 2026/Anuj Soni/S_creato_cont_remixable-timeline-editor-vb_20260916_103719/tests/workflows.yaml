    - kind: browser
      do: "Open / signed out and read the marketing header: a floating header pill with the wordmark and navigation beside a separate account pill carrying Login and Try for free when signed out; scroll down and watch the left header pill narrow to the wordmark plus ellipsis during the collapse while the right header pill keeps its place"
