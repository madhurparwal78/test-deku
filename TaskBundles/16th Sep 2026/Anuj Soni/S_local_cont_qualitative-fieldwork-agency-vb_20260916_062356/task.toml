schema_version = "1.4"

[task]
name = "deku/qualitative-fieldwork-agency-vb"
version = "1.0.0"
description = "The public site and the back office of a global qualitative research agency: an editorial estate of thirteen research methods, twelve industry sectors, a country network with a map and an accessible country rail, a nine-service catalogue that is also the brief form's own vocabulary, and a filtered article library whose case studies name clients and cannot be published without a recorded approval reference; a staged brief form across three addresses that validates every field on the server, acknowledges with a quotable reference, refuses an automated submitter and opens exactly one routed opportunity on a same-day replay; a console where opportunities carry a deterministic routing reason, a sensitivity class copied from the sector record, the six published stage names advanced forward only, and notes written in the row; an editorial surface whose publish action is refused with a stated reason until its rules hold; and an object store where every uploaded image lives under a digest-keyed scheme and an unpublished record's bytes stay unreadable to everyone but an editor."
authors = [
  "utsav.jain@ethara.ai",
  "anuj.soni@ethara.ai",
]
uuid_v5 = "c6e42a0b-241c-5306-9337-46234d7090f9"
keywords = ["greenfield", "solo_founder", "typescript", "postgres", "minio", "local-services", "content-publishing"]

