- id: visitor_reads_the_editorial_estate
  purpose: A stranger reads the method, sector, network and about routes, each rendered from stored records, on an app that carries its credentials file and its reserved directories
  substeps:
    - kind: browser
      do: Tab into / and find the skip link as the first focusable element on the route, then read down the route and find exactly one level-one heading on it
      cov: C-UX-26, C-UX-27
    - kind: browser
      do: Read the floating header capsule on / and on /articles: it sits clear of all four edges, keeps the quote action in a capsule of its own, and holds one height at every scroll position
      cov: C-FE-07, C-FE-08, C-FE-09
    - kind: browser
      do: Open the Methodology panel from the header, close it with the Escape key and find focus back on the item that opened it, then tab forward and find the closed panel skipped
      cov: C-FE-10, C-FE-11, C-UX-23
    - kind: browser
      do: Point at the quote action and watch its circular icon disc drop away while a second disc rises into place, overshoots its end value and settles, which is what anything a pointer touches does here
      cov: C-FE-12, C-FE-13, C-UX-12
    - kind: browser
      do: Open /network and step the value carousel forward one card at a time, then find the control unavailable at the end of the track
      cov: C-FE-22, C-UX-22
    - kind: browser
      do: Scroll past the client mark wall until its container leaves the screen and watch the looping movement pause rather than run on
      cov: C-UX-14
    - kind: browser
      do: Open /about-us on a wide window and read the comparison as two columns, then narrow the window past the primary breakpoint and read the same content as two sequential lists with their own headings while the navigation collapses into a slide-in panel
      cov: C-FE-24, C-UX-31, C-UX-33
    - kind: browser
      do: Follow an in-page anchor from the about route's section navigation, which marks the section being read, and find the heading clear of the floating header with focus moved to it
      cov: C-FE-39, C-FE-23
    - kind: browser
      do: Open / and read the public editorial site of a market research agency, whose home route stacks its nine sections in the stated order: the hero, the four promise tiles each linking to one named route and each revealing by growing its ground out from nothing behind the text, and the three published figures, then follow the Speak their language. tile to /sectors
      cov: C-OV-01, C-UX-13, C-FE-14, C-FE-15
    - kind: browser
      do: Open each header dropdown panel and find it listing its full child set, then open /methodology, count thirteen method rows, and open /methodology/focus-groups to read the ordered list of content blocks down to the question-and-answer accordion
      cov: C-CF-12, C-FE-17, C-FE-18, C-FE-19
    - kind: browser
      do: Open /network, read the map shown through its circular window, point at a pin and watch it grow to full size, then reach the country rail beneath the map with the keyboard alone and find the same rail becoming the interface below the primary threshold
      cov: C-CF-19, C-CF-20, C-FE-20, C-FE-21
