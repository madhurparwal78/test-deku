    - kind: browser
      do: Sign in at /login as editor@example.com with the password deku-demo-pw-2026, the seeded login the app writes into its credentials file at the app root beside the two reserved empty directories, and land on /console
      cov: C-DC-07, C-DC-08, C-DC-09, C-DM-04 (earned: the credentials file and the reserved directories live on the agent filesystem, which a separate-mode grader cannot read; this step proves the seeded login that file carries signs in, and the files themselves are observed by hand at the oracle run, OPEN-DECISIONS D-H)
