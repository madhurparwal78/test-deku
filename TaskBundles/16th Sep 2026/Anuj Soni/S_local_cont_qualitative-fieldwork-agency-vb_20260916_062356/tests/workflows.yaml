- id: visitor_scopes_a_study_and_receives_a_reference
  purpose: A stranger completes the three brief stages and leaves with a quotable reference that opened one routed opportunity
  substeps:
    - kind: browser
      do: Arrive on / with a fresh session: the first document of the session paints behind a cover that draws itself on, the cover lifts rather than waiting when loading runs long, and the reveals that follow move with one considered ease carrying a long settle
      cov: C-FE-34, C-FE-35, C-UX-11
    - kind: browser
      do: Move from /contact to /contact/study and find the document title replaced with the new stage's own, with focus on the new heading
      cov: C-FE-36, C-FE-37
    - kind: browser
      do: Read the decoy field on /contact/question, which is reachable by nothing a person uses, and point at each visible control to find a resting state plus a pointed-at state
      cov: C-FE-33, C-UX-21
    - kind: browser
      do: Open /contact, read which stage the visitor is on, enter Dana Whitfield, dana@example.com and Halcyon Labs into controls that each carry a persistent visible label, then continue to /contact/study
      cov: C-FE-28, C-FE-29
    - kind: browser
      do: On /contact/study choose the Pharmaceutical sector, the markets Germany and Japan, the method In-depth Interviews, one of the same nine service records the services route offers, a sample size and a budget band, then continue to /contact/question
      cov: C-CF-47, C-CF-17
    - kind: browser
      do: On /contact/question write the challenge, choose Perplexity as how they heard, submit, and read the reference beginning MF- on /contact/sent
      cov: C-CF-48, C-CF-58
    - kind: pytest
      test: test_output.py::test_staged_brief_submission_persists_the_request_row
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_brief_reference_uses_the_agency_prefix
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_brief_opens_one_routed_opportunity_row
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_timestamps_are_utc_with_a_z_suffix
      category: presentation
      weight: 1

