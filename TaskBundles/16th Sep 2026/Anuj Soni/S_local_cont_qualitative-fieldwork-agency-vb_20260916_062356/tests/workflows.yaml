      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_sector_index_lists_twelve_published_sectors
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_services_list_ranks_two_primary_above_seven_supporting
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_country_list_exposes_the_featured_rail_countries
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_about_route_publishes_the_six_process_steps
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_home_figures_come_from_stored_settings
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_public_documents_are_rendered_on_the_server
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_public_routes_carry_distinct_titles_and_descriptions
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_route_titles_end_with_the_site_name
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_seeded_reference_rows_are_persisted
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_unknown_method_slug_answers_not_found
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_every_public_route_carries_a_skip_link_and_one_top_heading
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_the_deployed_app_answers_from_outside_its_own_container
      critical: true
      category: core_outcome
