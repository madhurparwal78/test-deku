- id: visitor_reads_the_work_index_and_opens_a_film
  purpose: A signed-out reader moves down the work index, watches colour return to a still and opens a film into its reel
  substeps:
    - kind: browser
      do: Open /works and confirm one sentence in serif display type sits at the foot of an otherwise empty first screen, reading Quiet decisions, made early, are the ones you notice last.
      cov: C-CF-12,C-CF-42
    - kind: browser
      do: Scroll the index and confirm twelve entries run down the page in a left, right and centre rhythm, each captioned with its zero-padded ordinal at the still's left edge and its title at the still's right edge
      cov: C-CF-13,C-CF-44,C-CF-45,C-CF-46,C-DM-07
    - kind: browser
      do: Point at a still and confirm the colour returns over a slow beat, with no lift, no scale and no shadow, then confirm the index carries no filter, no sort and no search
      cov: C-CF-47,C-CF-48,C-UX-02
    - kind: browser
      do: Open the collection root /works and then the same address with a trailing slash /works/, and confirm the trailing-slash form resolves to the same surface with no redirect flash
      cov: C-UF-01,C-UF-07
    - kind: pytest
      test: test_output.py::test_published_works_are_listed_with_contiguous_ordinals
      critical: true
      category: core_outcome
      weight: 5
      cov: C-CF-14,C-TR-10
    - kind: pytest
      test: test_output.py::test_work_detail_returns_credits_media_and_neighbours
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_work_neighbours_wrap_from_last_to_first
      category: business_rule
      weight: 3

