      cov: C-CF-34,C-CF-35,C-FE-30
    - kind: browser
      do: Confirm the window then fills with a loose cluster of overlapping stills, dense toward the centre, leaving the four corners empty and the exact centre clear, arranged the same way on a reload
      cov: C-CF-36
