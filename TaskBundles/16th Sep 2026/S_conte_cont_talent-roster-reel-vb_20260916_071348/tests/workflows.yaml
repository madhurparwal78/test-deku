      do: Confirm the left margin lists DIRECTOR and PHOTOGRAPHER with a small square marking the active one, then select the other and confirm the set narrows without the address changing
      cov: C-CF-24,C-CF-53,C-FE-45
    - kind: browser
      do: Open a talent and confirm the name is set at exactly the size the roster sets it, and that the contact address shown is the house address rather than that talent's own
      cov: C-CF-55,C-CF-58,C-CF-83,C-UF-02
    - kind: pytest
      test: test_output.py::test_published_talents_are_listed_for_a_visitor
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_discipline_filter_narrows_the_roster
      category: business_rule
      weight: 3
      cov: C-CF-23
    - kind: pytest
      test: test_output.py::test_talent_detail_returns_derived_credited_work
      category: business_rule
      weight: 3
      cov: C-CF-57,C-DM-15

