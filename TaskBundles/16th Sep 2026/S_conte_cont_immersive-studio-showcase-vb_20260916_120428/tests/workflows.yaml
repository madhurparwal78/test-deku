- id: visitor_opens_published_case_from_the_reel
  purpose: A visitor watches the loader hand off, browses the featured reel and opens a published case study whose media is served from the object store
  substeps:
    - kind: browser
      do: Open the home route as a prospective client, read the site present the studio portfolio work, scroll the featured reel past the seven projects, and open the case study Grand Opera of Verdal
      cov: C-OV-01, C-FE-04, C-CF-25
    - kind: browser
      do: Read the case study hero image and its ordered media bands on the opened case page
      cov: C-FE-06, C-DM-21
    - kind: browser
      do: Watch the loader hold a mascot running inside a ring on a near-black ground while the progress stroke fills clockwise from twelve o'clock
      cov: C-CF-77, C-CF-78, C-OV-04, C-CF-79
    - kind: browser
      do: Read the three-dimensional layer holding the studio mascot as a lit model behind the page, its pose tracking scroll progress on the home route
      cov: C-CF-80, C-OV-05, C-CF-81
    - kind: browser
      do: Watch the display headline assemble letter by letter on a short stagger, each letter title starting tilted away from the reader and pushed back in depth
      cov: C-CF-82, C-UX-19, C-OV-06
    - kind: browser
      do: Read the fixed header carrying the wordmark, the five primary links, a showreel link, a sound control and a menu control
      cov: C-CF-20
    - kind: browser
      do: Open the menu control, read the full-screen overlay carrying the full navigation, and watch the menu control bars morph when pointed at
      cov: C-CF-21, C-UX-20
    - kind: browser
      do: Turn on the sound control, hear the ambient bed play under the experience, watch the ripple grow a ring from nothing to full, read the control pulsing during live sound, then move to another route and read the mute choice persisting
      cov: C-CF-86, C-UX-21, C-CF-83, C-CF-84, C-CF-85
    - kind: browser
      do: Open the showreel as a full-screen takeover from the header, read the play, the pause, the scrubbable progress bar, the current-time readout, the mute, the captions and the settings menu, then close the showreel back to the page
      cov: C-CF-88, C-CF-87, C-CF-89
    - kind: browser
      do: Read the editorial headings set in the GT Sectra Display family, the loudest display words in the Gilroy family and the interface, body and caption text in the Heebo family, with body text at 14px over a 29.4px line and the primary display headline at 120px over 107px
      cov: C-UX-11, C-UX-12, C-UX-13, C-UX-14, C-UX-15
    - kind: browser
      do: Read the page with no image file, video file, font file, three-dimensional model or audio file downloaded, the mascot composed from primitives, the ambient bed generated live from detuned tones and each photographic slot a seeded gradient in the owning project accent
      cov: C-FE-13, C-FE-14, C-FE-15, C-FE-16
    - kind: browser
      do: Read the hero carrying a three-line studio statement beneath the display headline
      cov: C-FE-02
    - kind: browser
      do: Scroll the home route as one continuous descent rather than a stack of blocks and watch the entrance cascade settle siblings one after another on a short stagger
      cov: C-FE-01, C-UX-18
    - kind: browser
      do: Scroll back up and watch a reveal un-play, because scroll position drives every reveal rather than the native scrollbar
      cov: C-UX-25, C-UX-26
    - kind: browser
      do: Point at a case card and read the card tint with that project accent, one project accent active at a time
      cov: C-FE-07, C-UX-10
    - kind: browser
      do: Read the case study page binding that project accent across its links, rules, captions and caret marks
      cov: C-CF-27
    - kind: browser
      do: Read the case study page carrying previous links and next links to sibling cases
      cov: C-FE-08
    - kind: pytest
      test: test_output.py::test_health_reports_ready
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_published_asset_streams_from_store
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_case_detail_carries_ordered_bands
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_seeded_cases_match_the_brief
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_public_case_list_excludes_drafts
      category: security
      weight: 5

- id: visitor_sends_contact_enquiry
  purpose: A visitor submits the contact enquiry form and the enquiry is stored while the success banner replaces the form in place
  substeps:
    - kind: browser
      do: Open the contact route, fill the enquiry form, submit it, and read the success banner replace the form in place
      cov: C-CF-59, C-CF-66, C-OV-02
    - kind: browser
      do: Read the contact route leading with exactly one primary action distinct from every secondary one
      cov: C-CF-101
    - kind: pytest
      test: test_output.py::test_enquiry_is_stored
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_invalid_enquiry_stores_nothing
      category: validation
      weight: 3

- id: visitor_subscribes_to_the_newsletter
  purpose: A visitor subscribes from the footer newsletter form and the subscriber is stored
  substeps:
    - kind: browser
      do: Open the footer newsletter form as a visitor, submit an address so the site collects the newsletter subscription, and read the success banner
      cov: C-CF-22, C-OV-03, C-CF-65
    - kind: browser
      do: Read the footer carrying the three offices Detroit, Rotterdam and Lyon above the studio contact address, with the four social links beside them
      cov: C-CF-14, C-CF-15, C-FE-03
    - kind: browser
      do: Read the cookie banner asking once about functional cookies, answer it, then reload and read the answer surviving the reload
      cov: C-CF-23, C-CF-24
    - kind: pytest
      test: test_output.py::test_subscriber_is_stored
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_config_exposes_offices_and_socials
      category: presentation
      weight: 1

- id: author_publishes_the_draft_case
  purpose: An author opens the content desk, publishes the draft case study, and its card appears in the public index with its media readable
  substeps:
    - kind: browser
      do: Sign in as author@example.com, open the desk table showing one row per case study, post and open role, and publish the draft case study
      cov: C-CF-67, C-RL-04
    - kind: browser
      do: Read the desk table columns carrying the title, the type, the state, the discipline or office, the accent and the publication date
      cov: C-CF-68, C-FE-11
    - kind: pytest
      test: test_output.py::test_author_reads_draft_case
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_author_case_list_includes_drafts
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_posts_list_excludes_drafts
      category: security
      weight: 5

- id: reader_cannot_read_the_draft_case
  purpose: A signed-in reader asking for the draft case study receives exactly what an absent slug returns, and so does an anonymous visitor
  substeps:
    - kind: browser
      do: Sign in as reader@example.com, request the draft case study route, and read the not-found page rather than the case
      cov: C-CF-38, C-RL-10
    - kind: pytest
      test: test_output.py::test_reader_draft_case_answers_as_absent
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_draft_case_answers_as_absent
      category: security
      weight: 5

- id: anonymous_visitor_is_forbidden_from_the_desk
  purpose: The author content desk and the page-view log are refused to an anonymous visitor and to a reader, indistinguishably from absence
  substeps:
    - kind: browser
      do: Request the desk route without signing in and read the not-found page, identical to the page for an address that never existed
      cov: C-CF-69, C-UF-03
    - kind: pytest
      test: test_output.py::test_anonymous_cannot_reach_desk
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_reader_cannot_read_page_views
      category: security
      weight: 5

- id: draft_media_is_denied_by_object_key
  purpose: A draft record's bytes are unreachable by object key to everybody without the author role, and unpublishing revokes a published record's media at once
  substeps:
    - kind: browser
      do: Request the draft case study hero image by its object key without signing in and read the refusal rather than the bytes
      cov: C-CF-50, C-OV-09
    - kind: pytest
      test: test_output.py::test_draft_asset_is_denied_by_object_key
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_unpublish_revokes_media_immediately
      category: data_integrity
      weight: 5

- id: concurrent_publish_leaves_at_most_one_published_row
  purpose: Two simultaneous publishes of one case study leave exactly one published row carrying one publication time
  substeps:
    - kind: browser
      do: Open the desk table and read exactly one publication time on the published case study row, stamped once by publishing
      cov: C-CF-40
    - kind: pytest
      test: test_output.py::test_concurrent_publish_leaves_one_published_row
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_asset_alt_text_is_stored
      category: business_rule
      weight: 3

- id: duplicate_upload_stores_one_object
  purpose: The object key carries the digest of the bytes, so uploading identical bytes twice to one case study leaves one object and one asset row
  substeps:
    - kind: browser
      do: Open the case creation route from the desk, save a case study, upload a hero image, and read the object key back
      cov: C-CF-70, C-CF-73
    - kind: browser
      do: Open the post creation route and the role creation route from the desk, each a real address carrying its own creation form
      cov: C-CF-71, C-CF-72
    - kind: pytest
      test: test_output.py::test_duplicate_upload_leaves_one_object
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_concurrent_upload_leaves_one_object
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_asset_object_key_carries_digest
      category: data_integrity
      weight: 5

- id: duplicate_subscriber_leaves_one_row
  purpose: Subscribing the same address twice leaves exactly one subscriber row and the second attempt reports success
  substeps:
    - kind: browser
      do: Submit the footer newsletter form twice with one address and read the repeat subscription report success rather than an error both times
      cov: C-CF-64
    - kind: pytest
      test: test_output.py::test_duplicate_subscriber_leaves_one_row
      category: data_integrity
      weight: 5

- id: invalid_enquiry_is_refused
  purpose: A malformed address is refused as a client error naming the offending field, a repeated submitter is slowed, and a taken slug is refused
  substeps:
    - kind: browser
      do: Submit the enquiry form with a malformed address and read the failure banner name the offending field
      cov: C-CF-61, C-TR-17
    - kind: browser
      do: Read an error replace only the failed region while the chrome stays, offering a retry and carrying the request identifier
      cov: C-UF-13, C-UF-14, C-UF-15
    - kind: pytest
      test: test_output.py::test_rate_limit_slows_repeated_enquiries
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_duplicate_slug_is_refused
      category: validation
      weight: 3

- id: signup_cannot_grant_the_author_role
  purpose: Open signup always creates a reader, and a signup asking for the author role is still a reader who cannot reach the desk
  substeps:
    - kind: browser
      do: Open the signup route as an anonymous visitor, sign up as a reader, then request the desk route and read the not-found page
      cov: C-UF-09, C-RL-15
    - kind: pytest
      test: test_output.py::test_signup_creates_reader_only
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_login_returns_access_token
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_login_refusals_are_indistinguishable
      category: security
      weight: 5

- id: empty_discipline_filter_returns_no_cases
  purpose: Filtering the cases index to a discipline with no published case returns an empty list and an empty state naming the filter
  substeps:
    - kind: browser
      do: Open the cases index, filter the card grid by discipline, and read the empty state naming the filter that produced it
      cov: C-UF-10, C-CF-26
    - kind: browser
      do: Read the empty state offering exactly one action back to the unfiltered card grid
      cov: C-UF-11
    - kind: browser
      do: Read the loading state keeping the chrome while only the content region is replaced
      cov: C-UF-12
    - kind: browser
      do: Read a long case title truncate to one line, revealing the full text only when the title is truncated
      cov: C-FE-12
    - kind: pytest
      test: test_output.py::test_empty_discipline_filter_returns_empty_array
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_discipline_filter_returns_only_that_discipline
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_roles_list_carries_offices
      category: business_rule
      weight: 3

- id: locale_switch_persists_across_a_return_visit
  purpose: Choosing Spanish sets the locale prefix and the choice persists when the visitor returns with no prefix
  substeps:
    - kind: browser
      do: Choose the Spanish label in the footer language switch and read the locale prefix on the address
      cov: C-CF-17
    - kind: browser
      do: Return to the site with no locale prefix and read the persisted Spanish choice
      cov: C-CF-18
    - kind: browser
      do: Open the values route and read each value statement numbered with an oversized light numeral
      cov: C-FE-09
    - kind: browser
      do: Open the careers route and point at a role row, reading the row lift
      cov: C-FE-10
    - kind: pytest
      test: test_output.py::test_locale_prefix_serves_both_languages
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_page_view_log_records_route_and_locale
      category: business_rule
      weight: 3

