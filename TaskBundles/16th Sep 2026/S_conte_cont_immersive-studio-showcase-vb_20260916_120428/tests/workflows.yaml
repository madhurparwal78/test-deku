      cov: C-UX-42, C-UX-43
    - kind: browser
      do: Read the privacy route carrying numbered clauses beneath a last-updated line, and the terms route carrying one primary action back to the home route
      cov: C-FE-17, C-FE-18
    - kind: pytest
