      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_robots_names_the_sitemap
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_favicon_is_served
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_public_routes_carry_unique_meta
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_terms_and_privacy_routes_are_served
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_no_credential_reaches_the_browser
      category: security
      weight: 5

- id: reader_cannot_create_or_upload
  purpose: A reader is refused every author-only mutation at the API and the protected state is left unchanged
  substeps:
    - kind: browser
      do: Sign in as reader@example.com, read the cases index carrying no control that creates a case study, and read the reader denied an upload control
      cov: C-RL-08, C-RL-12
    - kind: browser
      do: Tab through the chrome, reading every control operable from the keyboard with a visible focus state, then press Escape to close one overlay level
      cov: C-UX-30, C-UX-37
    - kind: browser
      do: Read every icon-only control carrying a visually hidden label naming the control, with an unavailable state signalled by more than colour and no meaning carried by colour alone
      cov: C-UX-39, C-UX-29, C-UX-40
    - kind: browser
      do: Read the text contrast ratio against the ground and the large text contrast ratio, then at the narrowest viewport read every interactive target at the touch floor with nothing overflowing sideways
      cov: C-UX-35, C-UX-36, C-UX-41, C-UX-34
    - kind: pytest
      test: test_output.py::test_reader_cannot_create_case
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_reader_cannot_upload_asset
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_reader_cannot_publish_case
      category: security
      weight: 5
