- id: invalid_form_input_rejected
  purpose: A form rejects invalid input inline, names the offending field, and writes nothing
  substeps:
    - kind: browser
      do: Sign in with the seeded account documented in /app/USER_README.md and open the editor
    - kind: browser
      do: Open a changeset with an empty comment and verify the form refuses it and names the comment field
    - kind: browser
      do: Verify no changeset was created after that refusal
    - kind: pytest
      test: test_output.py::test_form_validation_rejects_and_writes_nothing
      category: validation
      weight: 3

- id: the_app_meets_its_deployment_contract
  purpose: The app answers at its public address on the same origin, serves a production build, and carries the reserved directories
  substeps:
    - kind: browser
      do: Verify the reserved directories exist at the app root
      cov: C-DC-07 (earned: the reserved directories are an image-filesystem obligation the harness proves at G13 and G18; under a separate verifier the grader runs in its own container and cannot read the agent's app root, so the browser walk records the requirement and the handoff gate discharges it)
    - kind: browser
      do: Verify the app reads its public address from APP_PUBLIC_URL
      cov: C-DC-01
    - kind: browser
      do: Verify the app offers no GPS trace upload
      cov: C-CN-01
    - kind: browser
      do: Verify the app offers no route planning
      cov: C-CN-02
    - kind: browser
      do: Verify the app offers no moderator tier
      cov: C-CN-03
    - kind: browser
      do: Verify the reading pages arrive as server-rendered HTML on first paint
      cov: C-TR-01 (earned: the framework name is not observable from outside the app; its observable consequence, server-rendered HTML on first paint, is what this step checks, and the framework itself is graded by the source-reading quality channel which never touches reward), C-TR-02 (earned: the same, for the backend half of the drawn stack)
    - kind: browser
      do: Verify the app is reachable on the outside port it reads from APP_PUBLIC_PORT
      cov: C-DC-02
    - kind: browser
      do: Verify the app starts from the environment image with no manual steps
      cov: C-DC-06
    - kind: browser
      do: Verify the server keeps running after the build session ends
      cov: C-DC-09
    - kind: browser
      do: Verify the app binds 0.0.0.0 so it is reachable from outside its container
      cov: C-DC-10
    - kind: browser
      do: Verify the seeded credentials are written into /app/USER_README.md
      cov: C-DM-04
    - kind: browser
      do: Verify the app makes no external network call at runtime
      cov: C-CN-04
    - kind: browser
      do: Verify the app downloads no binary asset
      cov: C-CN-05
    - kind: browser
      do: Verify the app offers no likes, no follows and no private messages
      cov: C-OV-03
    - kind: browser
      do: Open the site root and verify the app is reachable at its public address with a rendered page
    - kind: browser
      do: Verify the reading pages arrive as server-rendered HTML on first paint rather than being drawn by the map client
    - kind: browser
      do: Verify the map home offers no GPS trace upload control and no route planning control
    - kind: browser
      do: Verify the app offers no moderator tier, so revert is available to any signed-in mapper
    - kind: pytest
      test: test_output.py::test_health_endpoint_answers_200
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_api_is_served_under_the_api_prefix
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_app_is_reachable_at_its_public_address
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_production_build_is_served
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_seeded_password_signs_in_every_account
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_timestamps_are_utc
      category: data_integrity
      weight: 5
