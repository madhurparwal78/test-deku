    - kind: pytest
      test: test_output.py::test_unknown_address_renders_own_not_found_page
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_content_images_carry_alt_text
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_public_routes_carry_unique_title_and_description
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_narrow_viewport_has_no_horizontal_overflow
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_sitemap_lists_public_routes_with_robots
