      cov: C-UF-08
    - kind: browser
      do: Verify the app carries alternative text on every content image
      cov: C-UX-11
    - kind: browser
      do: Verify an attribution line naming Openhaven contributors is shown on every view of the map
      cov: C-CF-41
    - kind: browser
      do: Verify the about page renders five named sections
      cov: C-CF-52
    - kind: browser
      do: Verify a whole help card is clickable rather than its heading alone
      cov: C-CF-54
    - kind: browser
      do: Verify every animation stops under reduced motion
      cov: C-UX-08
    - kind: browser
      do: Verify the map home shows a welcome card to a first-time visitor
      cov: C-CF-38
    - kind: browser
      do: Verify body copy is set at 14px
      cov: C-UX-05
    - kind: browser
