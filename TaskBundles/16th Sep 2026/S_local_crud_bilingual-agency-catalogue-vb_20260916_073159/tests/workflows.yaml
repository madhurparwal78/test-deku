- id: a_visitor_browses_to_a_brief
  purpose: A visitor narrows the catalogue by discipline, opens a case study and sends a qualified enquiry that becomes a lead
  substeps:
    - kind: browser
      do: Open the home route and read the five bands in order: the hero, the pinned sequence, the feature rail, the catalogue column and the award panel, confirming the product serves visitors browsing a studio's client work
      cov: C-CF-49, C-OV-01
    - kind: browser
      do: Read the home route's one first-level heading and confirm a visually hidden heading stands behind the drawn wordmark carrying the real title
      cov: C-CF-50
    - kind: browser
      do: Open the catalogue and read the four French facet labels Direction artistique, Experience digitale, Site vitrine and E-commerce above the mosaic
      cov: C-CF-23
    - kind: browser
      do: Select two disciplines, then press the clear control reading Tout effacer in French and Clear all in English, confirming every selection is removed
      cov: C-CF-27
    - kind: browser
      do: Hover a catalogue card on a pointer device, then open the same card on a touch device, confirming the hover content lives in the card's accessible name and is visible without hover
      cov: C-CF-35
    - kind: browser
      do: Open a case study and confirm the return control restores the catalogue's filters plus the scroll position the visitor left
      cov: C-CF-44
    - kind: browser
      do: Follow the call-to-action block at the end of the case study and confirm it leads to the contact route in the same locale
      cov: C-CF-48
    - kind: pytest
      test: test_output.py::test_filtering_moves_the_total_and_the_results_together
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeded_french_total_matches_the_published_rows
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_facet_counts_sum_above_the_total
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_catalogue_carries_total_facets_and_results
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_every_catalogue_card_carries_its_declared_fields
      category: presentation
      weight: 1

- id: the_catalogue_filter_lives_in_the_address
  purpose: The whole filter state is the address, so a copied address reproduces the view in a fresh session
  substeps:
    - kind: browser
      do: Copy the narrowed catalogue address into a fresh session and confirm the same mosaic, the same total and the same four counts come back, then walk every route the flow table names and confirm each is reachable at the auth level named beside it
      cov: C-UF-01
    - kind: browser
      do: Unpublish every project in one locale and confirm the catalogue renders Bientot over Les projets arrivent. En attendant, parlons du votre.
      cov: C-CF-34
    - kind: pytest
      test: test_output.py::test_filter_state_round_trips_through_the_address
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_all_mode_is_stricter_than_any_mode
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_a_filter_combination_with_no_match_renders_the_empty_panel
      category: presentation
      weight: 1

- id: the_case_study_composes_eleven_blocks
  purpose: A case study composes eleven block kinds whose spacing is decided by the pair of kinds
  substeps:
    - kind: browser
      do: Read a case study carrying two full-bleed blocks in sequence and confirm the gap before a block is decided by the pair of kinds, the two full-bleed blocks meeting with no gap
      cov: C-CF-39
    - kind: browser
      do: Open an inline video block holding no source and confirm a poster renders under the controls, carrying a line saying no source is attached
      cov: C-CF-43
    - kind: browser
      do: Drive the carousel block from the keyboard alone and confirm the position is announced as the carousel moves
      cov: C-CF-46
    - kind: browser
      do: Read the statistics row and confirm the figures are stored values rather than text typed into a paragraph
      cov: C-CF-47
    - kind: pytest
      test: test_output.py::test_project_detail_returns_its_blocks_in_order
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_the_feature_project_carries_every_block_kind
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_a_full_bleed_image_block_carries_both_crops
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_an_autoplaying_video_block_carries_a_description
      category: validation
      weight: 3

- id: the_home_route_holds_its_pinned_sequence
  purpose: The pinned sequence grows with the work, unpins in a short window and gives up gracefully when it cannot keep up
  substeps:
    - kind: browser
      do: Add a fourth featured project and confirm the pinned sequence lengthens rather than compressing the contents it already holds
      cov: C-CF-51
    - kind: browser
      do: Open the home route in a short landscape window and confirm the pinned sequence unpins, rendering as stacked sections
      cov: C-CF-52
    - kind: browser
      do: Open the home route on a struggling machine and confirm the pinned sequence unpins itself, becoming stacked sections rather than stuttering
      cov: C-CF-53
    - kind: browser
      do: Reach the feature rail from the keyboard and confirm it is reachable in a linear reading order, stacking vertically at the narrow arrangement
      cov: C-CF-54
    - kind: browser
      do: Read the award panel and confirm it names Webframe and DDA, each carrying a count, over the three award row titles Site Of The Month, Site Of The Day and Developer Award in both locales
      cov: C-CF-55, C-CF-56
    - kind: browser
      do: Read the award stage and confirm it renders a poster composition, the dimensional scene layer being declared absent rather than faked
      cov: C-CF-57, C-CN-02
    - kind: pytest
      test: test_output.py::test_french_catalogue_is_served_without_a_prefix
      category: presentation
      weight: 1

- id: the_remaining_public_surfaces_render
  purpose: Expertise, agency, contact, the footer and the legal surfaces each render what the brief names
  substeps:
    - kind: browser
      do: Open the expertise route and confirm it renders five services, each carrying a skill list, beside drawn letter tiles
      cov: C-CF-58
    - kind: browser
      do: Look at the expertise index at rest and confirm every expertise entry leading to a detail carries a visible resting affordance rather than revealing itself only under a pointer
      cov: C-CF-59
    - kind: browser
      do: Open the agency route and confirm it renders the studio's story, a three-word marquee, the team, the awards and the clients
      cov: C-CF-60
    - kind: browser
      do: Open the contact route and confirm it renders three entry cards, each leading to a branch of the funnel, reading Un projet, Candidature and En savoir plus in French
      cov: C-CF-61, C-CF-62
    - kind: browser
      do: Close one branch and confirm the entry renders a line naming a mail address rather than a control leading nowhere
      cov: C-CF-63
    - kind: browser
      do: Read the footer and confirm it carries contact@example.com and jobs@example.com with the phone number rendered once, over a copyright year that is computed rather than typed
      cov: C-CF-64, C-CF-65
    - kind: browser
      do: Provoke a server failure and confirm the body reads Quelque chose a casse de notre cote. Nous sommes prevenus.
      cov: C-CF-145
    - kind: pytest
      test: test_output.py::test_english_catalogue_is_served_under_the_prefix
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_every_public_route_carries_a_distinct_title_and_description
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_every_internal_link_on_the_catalogue_resolves
      category: business_rule
      weight: 3

- id: two_languages_two_addresses
  purpose: French is unprefixed and English is prefixed and separately slugged, and the switch explains a missing translation
  substeps:
    - kind: browser
      do: Read the English unavailability line and confirm it reads not available in French yet, prefixed by the page noun
      cov: C-CF-15
    - kind: browser
      do: Switch language, leave and return, and confirm the chosen language is remembered on the visitor's own device, being offered later as a suggestion rather than a redirect
      cov: C-CF-16
    - kind: browser
      do: Open the studio console and confirm it renders in one locale, never translated, whatever language the public site was left in
      cov: C-CF-141
    - kind: pytest
      test: test_output.py::test_project_published_in_french_only_is_absent_from_the_english_catalogue
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_language_switch_explains_a_missing_translation
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_language_header_never_redirects
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_path_without_a_trailing_slash_redirects_to_the_canonical_form
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_uppercase_path_redirects_to_the_canonical_form
      category: business_rule
      weight: 3

- id: the_studio_publishes_a_case_study
  purpose: An editor creates a project through three addressed steps, clears the preflight and publishes it onto the catalogue
  substeps:
