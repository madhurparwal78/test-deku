      cov: C-CF-74
    - kind: browser
      do: Reorder a block and confirm the reordered block moves before the server answers, a refused reorder returning the row to the prior position
      cov: C-CF-75
    - kind: browser
      do: Insert a block between two others and confirm rank is rebalanced across the list rather than rewriting the whole project
      cov: C-CF-76
    - kind: browser
      do: Open one record as two editors and confirm the second write against a record already changed is refused, naming the editor responsible
      cov: C-CF-77
    - kind: browser
      do: Let a scheduled publish fail and confirm it stays scheduled, raising an alert before a retry
      cov: C-CF-73
    - kind: pytest
      test: test_output.py::test_publishing_a_new_project_moves_the_catalogue_by_one
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_the_preflight_names_every_unmet_obligation
      critical: true
      category: validation
      weight: 5
    - kind: pytest
      test: test_output.py::test_publish_is_refused_while_the_preflight_is_unclean
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_a_publish_writes_a_revision
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_an_unpublished_project_is_not_readable_anonymously
      category: security
      weight: 5

- id: a_renamed_address_still_resolves
