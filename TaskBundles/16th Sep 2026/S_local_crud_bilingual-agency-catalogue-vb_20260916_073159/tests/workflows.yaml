- id: the_enquiry_funnel_files_one_lead
  purpose: Three branches of addressed steps end in exactly one lead with its acknowledgement committed alongside
  substeps:
    - kind: browser
      do: Walk the funnel and confirm the project branch runs over three addressed steps, the application branch over two and the question branch over one
      cov: C-CF-87
    - kind: browser
      do: Read the funnel controls and confirm they read Retour, Continuer and Envoyer, with Envoi en cours shown while a submission is in flight
      cov: C-CF-88
    - kind: browser
      do: Type two answers, reload the tab, and confirm the draft is held on the visitor's own device, surviving a reload, a closed tab and a refused submit
      cov: C-CF-89
    - kind: browser
      do: Submit a step with a missing answer and confirm validation names the field inline over a summary counting what is left to fix
      cov: C-CF-90
    - kind: browser
      do: Read the required-answer message and confirm it reads Cette reponse est necessaire pour continuer.
      cov: C-CF-91
    - kind: browser
      do: Open the budget question and confirm it offers Je ne sais pas encore as a real answer rather than forcing a number
      cov: C-CF-93
    - kind: browser
      do: Complete a submission and confirm the confirmation route renders C'est envoye over a line naming the reference
      cov: C-CF-104
    - kind: browser
      do: Walk the funnel from an empty draft through saved, invalid, sending, refused and done, confirming the funnel renders six states
      cov: C-UF-09
    - kind: pytest
      test: test_output.py::test_an_enquiry_creates_one_lead_and_returns_a_reference
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_simultaneous_submissions_under_one_key_produce_one_lead
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_a_repeat_submission_under_one_key_produces_one_lead
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_an_enquiry_without_consent_is_refused
      category: validation
      weight: 3

- id: the_acknowledgement_is_committed_with_the_lead
  purpose: A lead that exists always has an acknowledgement on its way, addressed to the enquirer alone
  substeps:
    - kind: browser
      do: Submit an enquiry through an automated client and confirm a submission judged automated receives the status, the body and the confirmation any other submission receives
      cov: C-CF-106
    - kind: browser
      do: Move a lead through its states and confirm only a submission plus an application outcome send mail, a state change sending nothing at all
      cov: C-CF-103
    - kind: browser
      do: Record an application outcome and confirm the subject begins Suite a votre candidature in the positive case plus the negative case alike
      cov: C-CF-125
    - kind: browser
      do: Stop the mail server, submit an enquiry, and confirm the lead is still written while the confirmation says an acknowledgement is on its way rather than claiming one was sent
      cov: C-TR-05
    - kind: pytest
      test: test_output.py::test_the_acknowledgement_reaches_the_mail_server
      critical: true
      category: notification
      weight: 5
    - kind: pytest
      test: test_output.py::test_an_application_acknowledgement_carries_its_own_subject
      category: notification
      weight: 3
    - kind: pytest
      test: test_output.py::test_the_acknowledgement_is_addressed_to_the_enquirer_alone
      category: notification
      weight: 3
    - kind: pytest
      test: test_output.py::test_the_acknowledgement_never_quotes_the_payload_back
      category: security
      weight: 5

