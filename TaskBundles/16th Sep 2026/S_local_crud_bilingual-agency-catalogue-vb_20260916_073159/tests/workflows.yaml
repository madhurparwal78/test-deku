- id: the_product_ships_with_nothing_binary
  purpose: Every asset is generated from text, and nothing is fetched from an origin the visitor did not choose
  substeps:
    - kind: browser
      do: List the delivery tree and confirm it carries no image file, no video file, no typeface file, no model and no vector file
      cov: C-CN-01
    - kind: browser
      do: Read the marks on every surface and confirm no icon font ships and no downloaded icon ships, every mark being inline geometry
      cov: C-CN-03
    - kind: browser
      do: Read the running services and confirm no second datastore, cache server, queue, object store or identity provider is introduced beyond the two declared
      cov: C-CN-04, C-TR-02
    - kind: browser
      do: Confirm no background scheduler runs, deadline work being evaluated on read or reached through a maintenance endpoint
      cov: C-CN-05
    - kind: browser
      do: Open a public route with scripting unavailable and confirm the server-rendered application still filters the catalogue, still completes the funnel and still opens the navigation, so the progressive enhancement over it ships no client framework
      cov: C-TR-03, C-TR-01
    - kind: browser
      do: Publish a record and confirm cache invalidation bumps a version suffix rather than deleting the key
      cov: C-TR-11
    - kind: browser
      do: Read the request log after an enquiry and confirm no personal data reaches a log, the redaction step at the logging boundary removing it
      cov: C-TR-13
    - kind: browser
      do: Read the credentials written to the documented readme file at the application root, then confirm the reserved screenshot and download directories exist there, empty
      cov: C-DC-05, C-DC-06
    - kind: pytest
      test: test_output.py::test_no_credential_reaches_the_browser
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_every_response_carries_the_security_headers
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_the_privacy_page_is_reachable_from_every_public_route
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_seeding_is_idempotent
      category: data_integrity
      weight: 5

