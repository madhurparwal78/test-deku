schema_version = "1.4"

[task]
name = "deku/interactive-animation-studio"
version = "1.0.0"
description = "Browser workspace where a team versions interactive-graphic documents, publishes an immutable build to a named channel, and serves it from a runtime address beside a public marketplace."
uuid_v5 = "d932ced0-a9a1-5a03-8831-8e0d2a5c2a44"
authors = ["abhishek.shaw@ethara.ai", "nishant.dubey@ethara.ai"]
keywords = ["greenfield", "solo_founder", "python", "postgres", "minio", "content-publishing", "revision-history"]

[metadata]
category     = "Greenfield"
sub_category = "solo_founder"
domain          = "saas-micro-tools"
pattern         = "content-publishing"
service_profile = "P4-db-storage"
variant_axes    = []
capability_flags = "aesthetic"
design_direction = "terminal-mono"
launch_surface = "alt_text,cookie_choice,form_validation,page_view_log,privacy_page"
language     = "python"
archetype    = "interactive-animation-studio"
variant      = "a"
difficulty   = ""
task_code    = "S_saasm_cont_interactive-animation-studio_20260916_061700"
naming_scheme = "task-code-v1"
grader_version = "0.22.0"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 140
tokens_expected = 5000000
contributor_id  = "nishant.dubey@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
calibration_date     = ""
openhands_version    = ""
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"
storage = "minio"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-deku}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-mote-access-6b2e40d7}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-minio-root-3d81f7a2}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", STORAGE_ENDPOINT = "${STORAGE_ENDPOINT:-http://minio:9000}", STORAGE_BUCKET = "${STORAGE_BUCKET:-deku}", STORAGE_ACCESS_KEY = "${STORAGE_ACCESS_KEY:-mote-access-6b2e40d7}", STORAGE_SECRET_KEY = "${STORAGE_SECRET_KEY:-minio-root-3d81f7a2}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_STORAGE = "minio" }

[[artifacts]]
source      = "/app"
destination = "app"

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"
