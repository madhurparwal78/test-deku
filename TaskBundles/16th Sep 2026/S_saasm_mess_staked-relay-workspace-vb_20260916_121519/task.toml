schema_version = "1.4"

[task]
name = "deku/staked-relay-workspace-vb"
version = "1.0.0"
description = "A private messenger, file store and task board for members of a subscriber-run relay network, sealed on the device, with relay rewards settled exactly once per epoch."
authors = [
  "utsav.jain@ethara.ai" ,
  "raja.kumarint17@ethara.ai"
]
uuid_v5 = "b992b4ee-313d-5a25-9c76-4969b45cfabd"
keywords = ["greenfield", "solo_founder", "typescript", "postgres", "mailpit", "end-to-end-encryption", "settlement"]

[metadata]
category     = "Greenfield"
sub_category = "solo_founder"
domain          = "saas-micro-tools"
pattern         = "messaging-notifications"
service_profile = "P2-db-email"
variant_axes    = ["critical_depth", "spec_sections", "roles"]
capability_flags = "aesthetic"
task_code       = "S_saasm_mess_staked-relay-workspace-vb_20260916_121519"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "alt_text,custom_404,form_validation,sitemap_robots,spam_protection"
grader_version  = "0.22.0"
rubric_version  = "1"
language     = "typescript"
archetype    = "staked-relay-workspace"
variant      = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 200
tokens_expected = 8000000
contributor_id  = "raja.kumarint17@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend  = "postgres"
email    = "mailpit"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", SMTP_HOST = "${SMTP_HOST:-mailpit}", SMTP_PORT = "${SMTP_PORT:-1025}", SMTP_USER = "${SMTP_USER:-deku_app}", SMTP_PASS = "${SMTP_PASS:-deku-local-dev}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", EMAIL_INBOX_API_URL = "${EMAIL_INBOX_API_URL:-http://mailpit:8025/api/v1}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_EMAIL = "mailpit" }

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"

[delivery.images]
main = "mcr.microsoft.com/playwright/python:v1.49.1-noble@sha256:42e251ec3238672c931be6c3565ff279690ae072c3e22058128d0412494f6866"
postgres = "postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412"
mailpit = "axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d"

[[artifacts]]
source      = "/app"
destination = "app"
