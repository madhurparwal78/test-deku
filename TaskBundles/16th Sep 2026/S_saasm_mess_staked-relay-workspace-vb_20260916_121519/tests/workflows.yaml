      weight: 3
      cov: "C-CF-156, C-CF-157, C-CF-158, C-CF-196 (earned: a request with not-an-address is refused)"
    - kind: pytest
      test: test_output.py::test_invalid_signup_email_is_named_inline_and_stores_no_account
