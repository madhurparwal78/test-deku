      weight: 3
      cov: "C-CF-37, C-CF-38 (earned: the step reads gap_before over an envelope whose preceding sender_seq is missing), C-CF-39 (earned: the step sends the missing envelope late and reads the flag cleared), C-CF-177 (earned: two envelopes share clock 40 and are ordered by sender device id)"

