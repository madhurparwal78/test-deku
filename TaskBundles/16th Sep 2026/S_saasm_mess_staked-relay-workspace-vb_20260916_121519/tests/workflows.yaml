      weight: 5
      cov: "C-CF-08, C-CF-09, C-CF-10, C-TR-07 (earned: a signature over an altered message is refused while the stored message verifies), C-DM-04 (earned: the step expires a challenge by its wallet_challenges expires_at row)"
    - kind: pytest
