- id: intro_releases_the_page_on_every_path
  purpose: "The public page's introduction lets every visitor reach the page by keyboard, deep link, return visit, reduced motion or without scripts, inside its byte budget"
  substeps:
    - kind: browser
      do: "Open /, press Skip the intro if the introduction is showing, open the FAQ section, expand the question about why the service is paid, and verify its answer text is shown below the question"
      cov: "C-CF-154"
    - kind: browser
      do: "Open /#tokenSaleSection and verify the text $0.035 for token is not shown before the checkbox I am a private investor and a potential user of Nightjar is ticked and Show the terms is pressed, and that it is shown after"
      cov: "C-CF-133"
    - kind: browser
      do: "Open /, press Skip the intro if the introduction is showing, scroll through the features and verify the link text reads Know more from our Whitepaper, that no application-store badge appears anywhere on the page, that the hero headline carries a six-sided hexagon mark, and that the moving banner reading get to know Nightjar better shows the hexagon mark between repeats of its phrase"
      cov: "C-FE-07, C-CN-01, C-FE-05, C-FE-11"
    - kind: browser
      do: "Open /#roadmapSection and verify the roadmap entry April 2024 Whitepaper v.0.1.0 developed is marked Delivered and the entry Q2 2026 Token sale is marked Missed, and that Delivered sits beside a check mark in the lime and Missed beside a hollow ring in grey, neither in red"
      cov: "C-CF-169, C-CF-227 (earned: the step reads the Missed mark on the Q2 2026 token sale entry), C-UX-11 (earned: the step reads the check mark and word beside Delivered), C-UX-13 (earned: the step reads the hollow ring in grey beside Missed, not in red)"
    - kind: pytest
      test: test_output.py::test_skip_is_first_focus_and_deep_links_or_returning_visits_show_no_intro
      critical: true
      category: business_rule
      weight: 5
      cov: "C-CF-145, C-CF-146, C-CF-147, C-CF-153 (earned: the step chooses About and presses Back to return to the token-sale address), C-CF-180 (earned: the first visit shows the Introduction region), C-CF-181 (earned: Enter on the skip control hides the introduction and the page scrolls), C-CF-182 (earned: the token sale section offset is read in view after the deep link), C-CF-239 (earned: the step follows the About link)"
    - kind: pytest
      test: test_output.py::test_page_without_scripts_shows_every_section_and_scrolls
      critical: true
      category: business_rule
      weight: 5
      cov: "C-CF-148, C-CF-149, C-CF-213 (earned: each of the seven section ids is located)"
    - kind: pytest
      test: test_output.py::test_reduced_motion_shows_stills_and_a_still_banner_read_once
      category: business_rule
      weight: 3
      cov: "C-CF-150, C-CF-151, C-CF-152, C-CF-236 (earned: the page scrolls under reduced motion)"
    - kind: pytest
      test: test_output.py::test_phone_intro_keeps_skip_on_screen_and_its_stage_labels_in_one_row
      category: presentation
      weight: 1
      cov: "C-FE-09 (earned: at 390 by 844 the step reads the skip control inside the viewport and the six stage labels on one row without widening the page)"
    - kind: pytest
      test: test_output.py::test_first_public_page_load_stays_inside_the_byte_budget
      category: business_rule
      weight: 3
      cov: "C-TR-01, C-TR-02, C-TR-03, C-TR-04, C-FE-01, C-FE-02, C-CN-02 (earned: every request of the first load is checked against the app origin)"

