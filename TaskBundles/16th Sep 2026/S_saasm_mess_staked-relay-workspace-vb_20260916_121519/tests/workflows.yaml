      category: core_outcome
      weight: 5
      cov: "C-OV-01, C-OV-02, C-CF-28, C-CF-29, C-CF-30, C-DM-02 (earned: the step alters the stored envelopes ciphertext base64 and reads the result), C-CF-209 (earned: the Message field and Send button carry every sent message), C-UF-14 (earned: both browsers sign in through the Email, Password and Sign in controls)"
    - kind: pytest
      test: test_output.py::test_retried_send_stores_one_envelope_row
      critical: true
      category: data_integrity
      weight: 5
      cov: "C-CF-35, C-CF-36, C-TR-08, C-DC-06 (earned: the step compares the envelope_id each send returns)"
    - kind: pytest
      test: test_output.py::test_history_orders_by_clock_and_flags_gaps_when_read
