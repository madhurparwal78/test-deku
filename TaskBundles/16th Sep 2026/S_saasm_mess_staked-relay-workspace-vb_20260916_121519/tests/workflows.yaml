      do: "Sign up at /signup with a new email address of your choosing and the password deku-demo-pw-2026, tick I understand that nobody can restore this key and press Continue, press New conversation, and verify the wizard moves through three steps at /app/conversations/new, /app/conversations/new/people and /app/conversations/new/name"
