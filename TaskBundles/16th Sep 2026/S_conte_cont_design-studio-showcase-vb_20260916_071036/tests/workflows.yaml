- id: home_route_tells_the_nine_band_story
  purpose: "A first visitor meets the loader, then reads the nine bands of the home route in order"
  substeps:
    - kind: browser
      do: "Open the home route of the Sable digital agency site, the public product, and watch the opening sequence: a dark field carries one light bar whose label reads LOADING... in upper case, the loader bar growing from nothing to the full frame width at a steady rate"
      cov: C-CF-23, C-CF-24, C-CF-25, C-CF-26, C-OV-01
    - kind: browser
      do: "Scroll the home route from top to bottom and confirm the nine bands arrive in order: the service index heading pairing WE DO with What, the twenty services, the four tone words, the four capabilities, and the Selected Cases archive heading reading above the thirteen cases"
      cov: C-CF-16, C-CF-30, C-CF-31, C-CF-32, C-CF-36, C-CF-39, C-CF-40
    - kind: browser
      do: "Scroll back upward through the case archive and confirm every moving element runs backwards with the input, the dots drifting back towards their home positions and the capability band holding still as its four items advance in reverse"
      cov: C-CF-33, C-CF-34, C-CF-35, C-CF-37
    - kind: browser
      do: "Open the contact route, press Projects in the header, and confirm the page returns to the home route and settles at the projects band without a full document load"
      cov: C-CF-17, C-CF-18, C-CF-19, C-UF-01
    - kind: browser
      do: "Select a case in the home archive, tab inside the overlay that opens, point at the round close control and watch it turn, then close the overlay with the escape key and confirm focus returns to that case"
      cov: C-CF-46, C-CF-48, C-CF-49, C-CF-50, C-UX-18, C-FE-13
    - kind: pytest
      test: test_output.py::test_services_index_lists_twenty_names
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_capabilities_and_discipline_tags_are_seeded
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_home_route_serves_rendered_markup
      category: presentation
      weight: 1
