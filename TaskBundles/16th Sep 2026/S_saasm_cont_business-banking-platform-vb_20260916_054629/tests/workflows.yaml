- id: rendered_surface_meets_the_stated_bars
  purpose: The rendered pages meet the contrast, keyboard, alternative-text and narrow-viewport bars the brief states
  substeps:
    - kind: pytest
      test: test_output.py::test_page_body_text_meets_the_contrast_bar
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_page_narrow_viewport_has_no_sideways_overflow
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_page_content_images_carry_alternative_text
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_page_keyboard_focus_ring_is_visible_on_every_control
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_page_money_columns_use_tabular_figures
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_page_view_record_is_stored_and_read_only_by_the_editor
      category: business_rule
      weight: 3
    - kind: browser
      do: Walk the home route from the keyboard, navigation reaches every control with a visible focus ring, the focus outline changes colour along with everything else, and Escape closes an open panel returning focus to the opening control
      cov: C-UX-26, C-UX-15, C-UX-23
    - kind: browser
      do: Confirm body text meets the WCAG AA contrast bar on both grounds, each route carries one first-rank heading, every content image carries alternative text, and an icon-only control carries a name saying what the control does
      cov: C-UX-24, C-UX-25, C-UX-28, C-UX-27
    - kind: browser
      do: Resize upward from a narrow viewport through the six ascending breakpoints and confirm nothing overflows sideways and the layout is mobile first
      cov: C-UX-29, C-UX-30
    - kind: browser
      do: Point at, press, focus and disable a control and confirm it carries resting, pointed-at, pressed, focused and unavailable states
      cov: C-UX-21
