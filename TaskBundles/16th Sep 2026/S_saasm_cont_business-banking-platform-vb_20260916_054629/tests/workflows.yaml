      cov: C-CF-77, C-UX-04
    - kind: pytest
      test: test_output.py::test_available_balance_excludes_a_live_hold_and_spending_uses_available
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_expired_card_hold_is_released_by_a_posting_without_a_prior_read
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_interest_residual_account_absorbs_the_rounding_difference
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_credit_account_balance_carries_the_opposite_sign
      category: business_rule
      weight: 3
    - kind: browser
      do: Read the account list and confirm a credit balance carries the opposite sign to a deposit balance, with a negative amount rendered explicitly rather than by colour alone, and every amount set in a monospace with tabular figures
      cov: C-CF-74, C-FE-16, C-UX-10
    - kind: browser
      do: Open the money display beside each balance and confirm the display receives a minor amount plus a currency rather than a formatted string
