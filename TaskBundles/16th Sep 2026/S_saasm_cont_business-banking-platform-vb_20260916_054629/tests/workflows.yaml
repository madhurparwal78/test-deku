- id: visitor_applies_and_the_organisation_is_provisioned
  purpose: An application walked end to end provisions an organisation whose opening entries balance
  substeps:
    - kind: browser
      do: Start an application from the hero capture and walk the business, ownership, identity, document and review steps to a decision, then confirm a visitor ends by submitting an application that provisions an organisation, then that raising a payment is a dedicated address rather than a panel
      cov: C-UF-06, C-CF-50, C-OV-03, C-FE-27
    - kind: pytest
      test: test_output.py::test_application_provisions_an_organisation_with_balanced_opening_entries
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_application_stores_attestation_text_shown_at_acceptance
      category: data_integrity
      weight: 5
    - kind: browser
      do: Upload a formation document at the documents step and see the upload acknowledged, then confirm a stored object's key follows the scheme `vault/{kind}/{owner_id}/{sha256_of_bytes}.{ext}`
      cov: C-CF-56, C-CF-133
    - kind: pytest
      test: test_output.py::test_uploaded_formation_document_lands_in_the_object_store_at_its_key
      critical: true
      category: data_integrity
      weight: 5
    - kind: browser
      do: At the review step confirm the deposit agreement is presented as the partner bank's own document rather than as this product's
      cov: C-CF-58

- id: concurrent_postings_and_ledger_edits_rejected
  purpose: Two hundred simultaneous postings leave a derived balance equal to the exact sum, and an edit against an entry is refused by the engine
  substeps:
    - kind: pytest
      test: test_output.py::test_two_hundred_concurrent_postings_keep_the_derived_balance_exact
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_balance_as_at_a_past_date_is_answerable
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_ledger_entry_update_and_delete_are_refused_by_the_database
      critical: true
      category: data_integrity
      weight: 5

- id: public_routes_are_titled_linked_and_canonical
  purpose: Every public route carries its own title and description, resolves its links, and no address serves home with a success status
  substeps:
    - kind: browser
      do: Walk the product, solutions, resources and legal routes from the navigation and the footer, then confirm the route table's every public address answers, then that the header carries the five items from `Products` to `Pricing`
      cov: C-UF-01, C-CF-23, C-FE-10
    - kind: pytest
      test: test_output.py::test_every_public_route_carries_a_unique_title_and_description
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_every_internal_link_on_a_public_route_resolves
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_sitemap_lists_published_routes_and_robots_names_the_sitemap
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_favicon_asset_is_served_and_declared_in_the_document_head
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_unknown_path_is_not_found_and_no_path_serves_home_with_success
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_campaign_paths_redirect_permanently
      category: business_rule
      weight: 3
    - kind: browser
      do: Open the developer reference on its inverted ground and read the resource index and the terminal panel, then confirm the command-line control reads `Install CLI`
      cov: C-CF-44, C-FE-21, C-FE-22
    - kind: pytest
      test: test_output.py::test_developer_reference_lists_fifteen_resources_with_descriptions
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_worked_request_and_response_state_one_amount
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_developer_reference_resources_match_the_served_api
      category: business_rule
      weight: 3
    - kind: browser
      do: Open an unknown address and confirm the not-found page carries a route to the support library
      cov: C-UF-18

- id: editor_publishes_and_the_draft_is_denied_to_a_visitor
  purpose: A published page becomes readable and listed, an unqualified page is refused, and a draft is denied to a signed-out caller
  substeps:
    - kind: browser
      do: Sign in as the editor, write a page, publish it, and open its public address, then confirm publishing a record makes the record readable, adds the route to the sitemap
      cov: C-UF-12, C-RL-04, C-CF-47
    - kind: pytest
      test: test_output.py::test_publishing_a_draft_makes_the_page_readable_and_listed
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_editorial_form_refuses_invalid_input_and_writes_nothing
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_page_with_an_unregistered_marker_cannot_be_published
      category: validation
      weight: 3
    - kind: browser
      do: Sign out and open the seeded draft address, finding no content, then confirm a Visitor cannot read a draft page
      cov: C-RL-02, C-RL-01
    - kind: pytest
      test: test_output.py::test_draft_page_is_denied_to_a_signed_out_caller
      critical: true
      category: security
      weight: 5

- id: ach_payment_settles_then_is_returned_five_days_later
  purpose: A settled ACH credit is returned days afterwards, the reversal posts, and the account goes negative as a valid state
  substeps:
    - kind: browser
      do: Raise an ACH payment, approve it, settle it, deliver the return and read the negative balance on the account
      cov: C-UF-08, C-CF-88
    - kind: pytest
      test: test_output.py::test_ach_payment_moves_through_in_transit_to_settled
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_settled_ach_payment_returned_after_five_days_posts_a_reversal
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_return_codes_drive_different_recipient_behaviour
      category: business_rule
      weight: 3
    - kind: browser
      do: Raise a payment after the ACH cutoff and read the date the interface states it is scheduled for, then confirm an outcome is an inline banner above the surface the outcome changed
      cov: C-CF-95, C-FE-28
    - kind: pytest
      test: test_output.py::test_post_cutoff_payment_is_scheduled_to_the_next_banking_day
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_realtime_payment_sends_on_a_holiday_sunday
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_wire_recall_is_recorded_as_a_request_not_a_cancellation
      category: business_rule
      weight: 3
    - kind: browser
      do: Raise a wire and confirm the interface states the irreversibility of a wire before the control is pressed
      cov: C-CF-90

- id: initiator_and_bookkeeper_cannot_move_money
  purpose: The payment creator is refused their own approval, an edit after approval returns the payment to pending, and a bookkeeper reaches no money-moving route
  substeps:
    - kind: browser
      do: Sign in as the initiator, raise a payment, and find the approval control refused, then confirm an approver moves a pending payment to approved
      cov: C-UF-07, C-RL-10
    - kind: pytest
      test: test_output.py::test_initiator_cannot_approve_their_own_payment
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_editing_an_approved_payment_returns_it_to_pending
      category: business_rule
      weight: 3
    - kind: browser
      do: Sign in as the bookkeeper, categorise a transaction, and find every payment control absent and refused, then confirm signing out stops the token working
      cov: C-UF-05, C-RL-11
    - kind: pytest
      test: test_output.py::test_bookkeeper_cannot_move_money_at_the_api
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_unauthenticated_product_and_editorial_routes_are_denied
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_step_up_grant_is_scoped_to_one_action
      category: security
      weight: 5

- id: visitor_reads_home_and_the_persistent_disclosure
  purpose: The home route opens on its headline with the partner-bank disclosure on the first screen
  substeps:
    - kind: browser
      do: Open the home route and read the headline, the email capture and the disclosure sentence without scrolling, then confirm the layout archetype is a top navigation carrying five centred items, then that the announcement bar carries `Real-time payments are here - instant, free, 24/7/365.`
      cov: C-UX-19, C-FE-17, C-FE-18, C-FE-09
    - kind: pytest
      test: test_output.py::test_disclosure_is_served_in_the_document_of_every_claiming_route
      critical: true
      category: business_rule
      weight: 5
    - kind: pytest
      test: test_output.py::test_page_home_leads_with_one_primary_action
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_health_route_and_reserved_directories_exist
      category: presentation
      weight: 1
    - kind: browser
      do: Read the feature stack heading above the three expanding rows, then confirm the page leads with one primary action distinct from every secondary one
      cov: C-FE-19, C-UX-20
    - kind: browser
      do: Confirm the cookie bar is anchored to the foot rather than rendered as a modal, that every icon is drawn geometry rather than an image file, and that an internal drawing reference is unique per instance
      cov: C-FE-12, C-FE-06, C-FE-07
    - kind: browser
      do: Count the type roles on the page, three exist and no fourth, interface type sits a shade heavier on the variable axis than reading type, and text roles sit in a ladder parallel to icon roles
      cov: C-FE-05, C-UX-09, C-UX-08

