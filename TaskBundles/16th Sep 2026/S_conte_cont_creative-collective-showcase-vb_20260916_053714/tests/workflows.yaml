- id: visitor_browses_the_published_work
  purpose: A visitor opens the home route, watches the recent-work reel advance and reaches the work index
  substeps:
    - kind: browser
      do: Open / and confirm the hero headline reads 'We are a brand' over 'of collective' over 'creativity' as selectable text, with the Japanese setting of the word creativity beneath the lens
      cov: C-CF-18,C-CF-19,C-UX-11
    - kind: browser
      do: Confirm the hero carries a drifting colour field behind the words, a circular lens bending what sits beneath it, and that the words are readable before the field animates
      cov: C-CF-16,C-CF-17,C-CF-20
    - kind: browser
      do: Scroll past the hero and confirm the eyebrow reads RECENT WORK, the section pins while the project titles advance, and the ruler tick tracks progress
      cov: C-CF-22,C-CF-23
    - kind: browser
      do: Scroll back up and confirm the reel rewinds through the same projects in reverse
      cov: C-CF-24
    - kind: browser
      do: Ask the browser for reduced motion, reload / and confirm the hero renders a still frame of the field with the grain and the words in place and the lens as a static circular crop
      cov: C-CF-21,C-UX-15
    - kind: browser
      do: Under reduced motion, scroll the whole home route and confirm every reveal resolves to its end state at once while the fade is kept, the reel reads as a plain list and the parallax stops
      cov: C-UX-16
    - kind: browser
      do: Scroll the hero fully out of view, confirm its loop stops rather than running unseen, then scroll back and confirm it resumes
      cov: C-TR-09
    - kind: browser
      do: Press the pill reading Discover all projects and confirm the home route serves the hero plus the reel above it and that the press lands on the work index
      cov: C-CF-27,C-UF-01
    - kind: pytest
      test: test_pytest.py::test_published_projects_are_listed
      critical: true
      category: core_outcome
      weight: 5
- id: visitor_filters_the_work_index
  purpose: A visitor narrows the work index to one discipline and shares the filtered address
  substeps:
    - kind: browser
      do: Open /work and confirm the eight filter controls read All, SPATIAL, Campaign, Photography, Brand design, Video, Digital and Illustration in that order
      cov: C-CF-28
    - kind: browser
      do: Choose SPATIAL and confirm the grid narrows in place with no page reload and the leaving cards animate out
      cov: C-CF-29
    - kind: browser
      do: Choosing the Illustration work filter reflects the choice in the URL query, and the grid narrows to one project
      cov: C-CF-30
    - kind: browser
      do: Reload the filtered work URL directly and confirm the same projects are shown
      cov: C-CF-31
    - kind: browser
      do: Point at a project cover and confirm its film runs, then move the pointer away and confirm it pauses
      cov: C-CF-34
    - kind: browser
      do: Narrow the viewport to a phone width and confirm the eight filters become a native select control that drives the same filter state
      cov: C-UX-19
    - kind: browser
      do: At the narrow viewport confirm nothing overflows sideways on the work route and that every header target stays reachable behind the burger
      cov: C-UX-20
    - kind: browser
      do: Change the filter with a screen reader active and confirm the new result count is announced politely rather than interrupting
      cov: C-UX-24
    - kind: pytest
      test: test_pytest.py::test_discipline_filter_and_reset_list_published_projects
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_pytest.py::test_empty_discipline_filter_returns_an_empty_list
      category: business_rule
      weight: 3
    - kind: browser
      do: Choose a discipline no published project carries and confirm the grid shows the index empty state rather than a blank page or an error
      cov: C-UF-08
- id: visitor_reads_the_press_timeline
  purpose: A visitor reads the dated press feed, its derived category counts and the featured series
  substeps:
    - kind: browser
      do: Open /press and confirm the category filters carry their counts and the feed items each show a category, a date written DD.MM.YYYY and a Read more link
      cov: C-CF-38
    - kind: browser
      do: Choose Series and confirm the three volumes tilt and settle at different depths as the scroll passes, each revealed through an expanding circular mask
      cov: C-CF-41
    - kind: browser
      do: Confirm each series image arrives as a blurred preview first and is replaced by the full image once decoded, without the layout moving
      cov: C-CF-42,C-TR-10
    - kind: browser
      do: Scroll to the foot of /press and confirm the contact invitation returns as three pill links of different widths, each carrying a hairline ring set in from its edge
      cov: C-CF-43
    - kind: pytest
      test: test_pytest.py::test_press_feed_is_newest_first
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_pytest.py::test_press_category_badges_match_the_seeded_collection
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_pytest.py::test_series_volumes_are_served
      category: business_rule
      weight: 3
- id: visitor_reads_the_team_story
  purpose: A visitor reads the studio story, the member grid and the founding history
  substeps:
    - kind: browser
      do: Open /team and confirm the three intro lines rise and fade into place one after another, reading We seek, unique, perspectives, in the eased motion character the whole site shares
      cov: C-CF-44,C-UX-12
    - kind: browser
      do: Confirm the footnote reads [ a city-based global network ] above the intro paragraph
      cov: C-CF-45
    - kind: browser
      do: Scroll and confirm the four-line we-are banner draws in against the scroll rather than on entry
      cov: C-CF-46
    - kind: browser
      do: Confirm the display, body and interface text on /team computes to the Inter family, with the Japanese setting on / computing to Noto Sans JP
      cov: C-UX-08,C-UX-09
    - kind: browser
      do: At a desktop width confirm the body type resolves to 16px over 18.4px and the display line to 45px over 48.915px
      cov: C-FE-03,C-FE-04
    - kind: pytest
      test: test_pytest.py::test_team_members_carry_a_derived_count
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_pytest.py::test_studio_chapters_are_served
      category: business_rule
      weight: 3
- id: visitor_sends_an_enquiry
  purpose: A visitor sends the studio an enquiry and the studio editor reads it in the console
  substeps:
    - kind: browser
      do: Open the contact form from the footer of /work and confirm the footer carries the call to action, the supporting line, the contact address, the postal block, the socials and the sitemap column
      cov: C-CF-14
    - kind: browser
      do: Submit a complete enquiry and confirm the success state replaces the form in place rather than being inserted into the layout
      cov: C-CF-52
    - kind: pytest
      test: test_pytest.py::test_enquiry_is_persisted
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_pytest.py::test_enquiry_list_is_served_to_the_editor
      category: business_rule
      weight: 3
    - kind: browser
      do: Open the console enquiry list before any enquiry has arrived and confirm the empty state explains what will appear there
      cov: C-UF-09
- id: invalid_enquiry_is_refused
  purpose: An enquiry missing a field or carrying a malformed address is refused inline and nothing is written
  substeps:
    - kind: browser
      do: Submit the enquiry form with the email left empty and confirm the field is named inline, the page does not reload and the form keeps what was typed
      cov: C-CF-54
    - kind: pytest
      test: test_pytest.py::test_enquiry_with_an_empty_name_writes_no_row
      category: validation
      weight: 3
    - kind: pytest
      test: test_pytest.py::test_enquiry_with_a_malformed_address_writes_no_row
      category: validation
      weight: 3
- id: automated_enquiry_is_refused
  purpose: An enquiry that looks automated is refused by the decoy field and by the rate rule, and nothing is written
  substeps:
    - kind: pytest
      test: test_pytest.py::test_enquiry_filling_the_decoy_field_is_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_pytest.py::test_fourth_enquiry_inside_the_window_is_refused
      category: validation
      weight: 3
- id: editor_creates_a_draft_project
  purpose: The studio editor walks the three wizard steps and lands on the full-page confirmation
  substeps:
    - kind: browser
      do: Sign in as author@example.com and confirm the console opens on its own quiet layout rather than the public site's
      cov: C-RL-06
    - kind: browser
      do: Walk /studio/projects/new/details, /studio/projects/new/disciplines and /studio/projects/new/media in turn, returning to the first step to confirm what was entered is still there
      cov: C-CF-65,C-CF-66
    - kind: browser
      do: Finish the wizard and confirm a full-page confirmation names the project just created
      cov: C-CF-67
    - kind: pytest
      test: test_pytest.py::test_author_creates_a_draft_project
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_pytest.py::test_cover_upload_is_stored_in_the_bucket
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_pytest.py::test_press_kit_upload_is_stored_in_the_bucket
      category: data_integrity
      weight: 5
