- id: site_records_consent_and_page_views
  purpose: The cookie choice is recorded and survives a reload, and each page view is recorded for the studio
  substeps:
    - kind: browser
      do: Open / in a fresh session and confirm the rail states that the website uses cookies, carries a Learn more link and an ACCEPT control, and does not cover the hero
      cov: C-CF-59,C-CF-61
    - kind: browser
      do: Accept the rail, reload the route and confirm the cookie choice survives the reload and the rail stays away
      cov: C-CF-60
    - kind: pytest
      test: test_pytest.py::test_consent_choice_is_recorded
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_pytest.py::test_page_view_is_recorded
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_pytest.py::test_seed_rows_are_not_duplicated
      critical: true
      category: data_integrity
      weight: 5
- id: persistent_shell_survives_a_route_change
  purpose: The chrome persists across a client route change, the address bar tracks it and the back control restores it
  substeps:
    - kind: browser
      do: Move from / to /work to /press and confirm the header survives each route change, the footer survives each route change, and the world-clock strip, the custom cursor and the cookie rail stay on screen behind the wordmark veil
      cov: C-CF-04,C-CF-05,C-FE-06
    - kind: browser
      do: Confirm the address bar shows the destination path at each step, then press back twice and confirm each previous route and its scroll position return
      cov: C-CF-06,C-CF-07
    - kind: browser
      do: Confirm the header carries Home, Work and Services on the left and team, contact and PRESS & NEWS in the centre, in exactly that casing
      cov: C-CF-09,C-CF-10
    - kind: browser
      do: Confirm the three world clocks read a twelve-hour time with a meridiem for London, Tokyo and New York, and that each advances within a minute without a network request
      cov: C-CF-11,C-CF-12
    - kind: browser
      do: Follow every link in the header and the footer in turn and confirm each one resolves to a route with authored content, Services, Contact and Privacy policy included
      cov: C-CF-13,C-CF-15
    - kind: browser
      do: Walk every public route and confirm none of them offers a cart, a price, a customer account menu, a comment thread or a search field
      cov: C-OV-02
    - kind: browser
      do: Confirm no organisation, workspace or studio switcher appears anywhere, so the site serves one studio only
      cov: C-CN-01
    - kind: browser
      do: Read the computed value of the accent custom property and confirm the same token carries every action mark, and that body-size text on the paper ground never wears it
      cov: C-FE-02,C-UX-04
    - kind: pytest
      test: test_pytest.py::test_cold_load_of_a_deep_path_renders_that_route
      category: business_rule
      weight: 3
