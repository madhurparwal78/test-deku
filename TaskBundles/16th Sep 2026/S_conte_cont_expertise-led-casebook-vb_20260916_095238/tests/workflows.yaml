- id: owner_publishes_a_case_study_and_features_it
  purpose: "The owner signs in through the return path, writes a case study, generates its cover, publishes it and features it on the front page"
  substeps:
    - kind: browser
      do: "Open /studio/shelf signed out, confirm the browser lands on /sign-in carrying the intended path, sign in as owner@example.com with the password deku-demo-pw-2026, and confirm the owner lands back on /studio/shelf"
      cov: "C-CF-230,C-CF-231,C-RL-30,C-RL-33,C-UF-07"
    - kind: browser
      do: "Open /studio, confirm the dashboard tiles Published work, Drafts and Unread briefs, confirm the recent list shows the most recently changed items newest first, and press New case study to reach the dedicated route /studio/work/new Confirm each dashboard recent row links to the item the row names."
      cov: "C-CF-198,C-CF-203,C-CF-208,C-CF-204"
    - kind: browser
      do: "In the case study editor type the title Aster Row Residences, the client Halden and the year 2025, confirm the slug is derived from the title and stays editable, use the shuffle control on the cover seed, and add a paragraph block by pressing the plus between blocks and choosing from the list of six block kinds"
