    - kind: browser
      do: "Choose the expertise Real Estate and the tag Real Estate, press Save, confirm the status line reads Saved just now. and confirm Aster Row Residences is not yet on /work"
      cov: "C-CF-219,C-UF-17"
    - kind: browser
      do: "Choose the cover palette warm, confirm that changing the palette saves the case study before a cover is drawn, write the cover's alternative text, press Generate cover and confirm the generated cover appears in the editor drawn from the saved cover seed in the saved warm palette"
      cov: "C-UF-18,C-CF-25,C-CF-27,C-CF-26"
    - kind: browser
      do: "Press Publish, confirm the status line beginning Published. appears, open /work and confirm Aster Row Residences is the last published case study card"
      cov: "C-CF-221,C-UF-19,C-RL-19"
    - kind: browser
      do: "Open /expertise/real-estate and confirm Aster Row Residences appears in the work band of the Real Estate landing, in shelf order"
      cov: "C-UF-20,C-CF-50"
    - kind: browser
      do: "Open /studio/shelf, put Aster Row Residences into the second Real Estate slot, confirm the line Featured on the home page. appears, reload / and confirm Aster Row Residences shows side by side with the other featured case study in the Real Estate band"
