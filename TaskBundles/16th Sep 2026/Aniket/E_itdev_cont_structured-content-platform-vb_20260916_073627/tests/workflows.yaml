      test: test_output.py::test_uploaded_bytes_live_in_the_bucket_at_the_pinned_key
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_identical_uploads_deduplicate_to_one_asset
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_derived_rendering_is_cached_under_its_own_prefix
      category: data_integrity
      weight: 5

- id: one_asset_carries_a_different_crop_in_each_use
  purpose: A crop belongs to the use rather than to the asset, a square rendering keeps the hotspot region visible, and an asset in a private dataset is refused without credentials
  substeps:
