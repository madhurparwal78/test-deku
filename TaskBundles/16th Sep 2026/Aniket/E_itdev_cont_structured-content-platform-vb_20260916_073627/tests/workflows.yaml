      test: test_output.py::test_mislabelled_upload_is_refused
      category: validation
      weight: 3
    - kind: pytest
      test: test_output.py::test_document_carries_reserved_service_fields
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_client_supplied_revision_is_refused
      category: validation
      weight: 3

- id: migration_dry_run_writes_nothing
