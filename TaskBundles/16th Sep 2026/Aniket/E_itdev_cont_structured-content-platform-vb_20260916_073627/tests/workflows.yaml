      test: test_output.py::test_migration_rerun_changes_nothing
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_migration_preserves_rich_text_keys
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_migration_against_production_requires_retyped_name
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_dataset_visibility_change_requires_typed_name
      category: security
      weight: 5

- id: release_publishes_every_document_or_none
  purpose: A release publishes its whole set in one transaction, and a set too large to be atomic is refused when the release is created rather than when it fires
  substeps:
    - kind: browser
      do: Sign in as editor@example.com, create two documents, open the releases route served at /d/production/releases, and build a release holding both of them
      cov: C-UF-26
    - kind: browser
      do: Publish the release, then read a partial failure that shows the rows already loaded with an inline retry offered for the range that did not arrive
      cov: C-UF-27
    - kind: pytest
      test: test_output.py::test_release_publishes_atomically
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_oversized_release_is_refused_at_creation
      category: validation
      weight: 3

- id: search_finds_a_word_split_by_a_mark
  purpose: A word whose middle is emboldened is stored as three spans and is still findable in editor search as one word
  substeps:
    - kind: browser
      do: Sign in as editor@example.com, open /d/production/search, and search for the word whose middle is emboldened inside article-aurora-pipeline
      cov: C-CF-111
    - kind: browser
      do: Read the result row naming the document, then confirm a search that cannot answer says so rather than returning nothing
      cov: C-UF-28
    - kind: pytest
      test: test_output.py::test_search_finds_a_word_split_across_spans
      critical: true
      category: core_outcome
      weight: 5

- id: public_site_serves_its_own_not_found_page
  purpose: An unmatched address returns the product's own not-found page, every internal link resolves, the sitemap lists every public route, and a cookie decision survives a reload
  substeps:
    - kind: browser
      do: Open an address that matches no route, read the not-found page carrying the address that failed, and follow the suggestion it offers toward the nearest real route
      cov: C-CF-112
    - kind: browser
      do: Open the marketing home served at /, record a cookie decision, reload the route, and confirm the recorded decision is still in force
      cov: C-UF-29
    - kind: pytest
      test: test_output.py::test_unmatched_path_returns_the_not_found_page
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_no_internal_link_on_a_public_route_is_broken
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_sitemap_lists_every_public_route
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_robots_names_the_sitemap
      category: presentation
      weight: 1
    - kind: pytest
      test: test_output.py::test_cookie_decision_survives_a_reload
      category: presentation
      weight: 1

- id: repeated_lead_submissions_are_refused
  purpose: A demo request submitted repeatedly in quick succession from one origin is refused and writes no second lead
  substeps:
    - kind: browser
      do: Open the demo request form served at /contact, fill in a work address, a name, a company plus a team size, and submit it
      cov: C-UF-30
    - kind: browser
      do: Submit an invalid demo request and read the offending field named inline, then submit the same form again straight away and read the refusal
      cov: C-CF-113
    - kind: pytest
      test: test_output.py::test_repeated_lead_submissions_are_refused
      category: validation
      weight: 3
