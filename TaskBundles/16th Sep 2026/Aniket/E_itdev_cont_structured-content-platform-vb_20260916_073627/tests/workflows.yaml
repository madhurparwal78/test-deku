      do: Sign in as editor@example.com, open article-editorial-standards, and edit the crop of that one use on the image block of the document editor before saving
      cov: C-UX-09
    - kind: browser
      do: Sign in as editor2@example.com, open article-quarterly-letter, and confirm the seeded image keeps its own crop together with its own alternative text
      cov: C-DM-23
