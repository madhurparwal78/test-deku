      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_history_is_append_only_across_publish
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_four_publication_states_are_distinguishable
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_unpublish_recreates_the_draft
      category: business_rule
      weight: 3

- id: uploaded_image_is_stored_in_the_bucket
  purpose: An uploaded file lands in the object store at its content-addressed key, identical bytes deduplicate to one asset, and a derived rendering is cached under its own prefix
  substeps:
