      do: 'Drag the scrub bar under a diagram to the halfway point and watch the gate collapse to a sliver of its height and dim'
      cov: 'C-CF-45, C-CF-56 (earned: the reader is dragging the timeline by hand across both drawings at once, which is the only way to see that one description produced them)'
    - kind: browser
      do: 'Scroll a system diagram through the viewport and watch a mark travel along its connector while the run log ticks its rows off in order'
      cov: 'C-CF-49, C-CF-50'
    - kind: browser
      do: 'Watch a promoted path draw itself in and then retract on the same diagram'
      cov: 'C-UX-15'
    - kind: pytest
      test: test_output.py::test_diagram_renders_both_layouts_from_one_structure
      category: business_rule
      weight: 3
      cov: 'C-CF-46, C-CF-47, C-DM-8, C-FE-11, C-FE-13 (earned: this grader reads the stored structure back and inspects its two declared layouts and its sampled series, which is where one description producing two drawings is observable)'
    - kind: pytest
      test: test_output.py::test_diagram_render_is_deterministic
      category: data_integrity
      weight: 5
      cov: 'C-CF-43, C-CF-44 (earned: this grader renders one structure twice at the same progress and compares the two drawings character for character, which is what repeatability means here)'
    - kind: pytest
      test: test_output.py::test_run_log_and_text_alternative
      category: business_rule
      weight: 3
      cov: 'C-CF-48, C-CF-51, C-CF-52, C-CF-53 (earned: this grader reads each seeded system''s run log and each diagram''s text alternative, so the row count, the status row and the description come from the records that produce them)'

- id: author_exports_a_still_into_the_object_store
  purpose: 'Exporting a diagram writes the drawn bytes into the bucket at the pinned key and records the key on the row'
  substeps:
    - kind: browser
      do: 'Sign in as the author, walk the three wizard steps, press export on the review step and read the inline banner confirming the still was written'
      cov: 'C-CF-54, C-CF-55, C-FE-26'
    - kind: browser
      do: 'Open the studio index and confirm it is a grid of cards, one per piece and one per diagram, each carrying its own drawing and its state'
      cov: 'C-FE-25'
    - kind: pytest
      test: test_output.py::test_still_bytes_live_in_the_bucket_at_their_key
      critical: true
      category: data_integrity
      weight: 5
      cov: 'C-CF-61, C-CF-62, C-CF-63, C-DC-17 (earned: this grader exports, reads the returned key against the pinned scheme, then asks the object store whether that key exists, which is the only way to tell a stored object from a stored filename)'
    - kind: pytest
      test: test_output.py::test_seeded_content_is_complete_and_idempotent
      category: data_integrity
      weight: 5
      cov: 'C-DM-1, C-DM-2, C-DM-25, C-CN-1 (earned: this grader counts every seeded table and looks for duplicate addresses and duplicate keys, which is what a second boot would leave behind if seeding were not idempotent)'
    - kind: pytest
      test: test_output.py::test_studio_grid_and_inline_banner
      category: presentation
      weight: 1
      cov: 'C-UF-13, C-UF-16 (earned: this grader walks the studio index and the three wizard addresses and reads what each surface shows, which is where an empty grid or a missing loading state appears)'

