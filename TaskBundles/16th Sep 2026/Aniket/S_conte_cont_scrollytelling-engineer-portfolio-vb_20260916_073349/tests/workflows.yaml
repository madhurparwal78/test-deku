- id: site_boots_and_serves_its_public_routes
  purpose: 'The deployed portfolio answers its health route and serves every public route as a complete document'
  substeps:
    - kind: browser
      do: 'Open the index and confirm the wordmark, the top-bar entries and the opening line are visible before anything moves'
      cov: 'C-OV-1 (earned: the reader is looking at the whole first screen of the single scroll, which is where a portfolio built as one continuous page is told apart from one built as separate pages)'
    - kind: browser
      do: 'Follow the footer link to the privacy page from three different routes and confirm each one arrives'
      cov: 'C-CF-132'
    - kind: browser
      do: 'Read the whole index and confirm no comment thread, no like control, no follower count, no price and no advertising slot appears anywhere on it'
      cov: 'C-CN-2, C-CN-3, C-CN-4 (earned: the reader is sweeping the whole index for the surfaces this product deliberately does not have, which is the only way an absence is observable)'
    - kind: browser
      do: 'Read the stack band and confirm it is a grouped list of the author''s own working tools rather than a statement about how the site is built'
      cov: 'C-CN-7'
    - kind: browser
      do: 'Watch the page load with the network panel open and confirm no image file, no video file and no font file is downloaded'
      cov: 'C-FE-28'
    - kind: pytest
      test: test_output.py::test_health_and_deployment_contract
      critical: true
      category: core_outcome
      weight: 5
      cov: 'C-DC-1, C-DC-2, C-DC-3, C-DC-4, C-DC-5, C-DC-6, C-DC-7, C-DC-8, C-DC-9, C-DC-10, C-DC-11, C-DC-12, C-DC-13, C-TR-6 (earned: this grader drives the health route, the index over the public address and the bind address, so every line of the deployment contract becomes observable in one pass)'
    - kind: pytest
      test: test_output.py::test_public_routes_render_complete_documents
      category: presentation
      weight: 1
      cov: 'C-TR-1, C-TR-2, C-UF-1, C-UF-2, C-FE-1, C-FE-2, C-FE-5, C-FE-6, C-FE-14, C-FE-15, C-FE-16, C-FE-17, C-DM-20, C-DM-21, C-DM-22, C-DM-23, C-DM-24, C-OV-2 (earned: this grader fetches every public route and reads the served document, so the chrome, the pinned index copy and the seeded records all come from the same response)'
    - kind: pytest
      test: test_output.py::test_favicon_resolves_at_its_declared_address
      category: presentation
      weight: 1
      cov: 'C-TR-13'
    - kind: pytest
      test: test_output.py::test_every_internal_link_resolves
      category: presentation
      weight: 1
      cov: 'C-CF-127'
    - kind: pytest
      test: test_output.py::test_list_endpoints_return_top_level_arrays
      category: presentation
      weight: 1
      cov: 'C-DC-14, C-TR-8 (earned: this grader calls each listing over the same origin and reads its shape, so a second datastore answering a different shape surfaces here)'

- id: visitor_signs_up_and_invalid_input_is_refused
  purpose: 'A visitor creates an account from the sign-up form and a form carrying invalid input is refused with the field named'
  substeps:
    - kind: browser
      do: 'Open the sign-up route, submit a fresh address with the corpus password, confirm the account route opens signed in'
      cov: 'C-CF-1'
    - kind: browser
      do: 'Submit the sign-up form with an empty password and read the inline message naming the field that is wrong'
      cov: 'C-CF-13'
    - kind: pytest
      test: test_output.py::test_signup_creates_account_and_rejects_duplicate
      critical: true
      category: security
      weight: 5
      cov: 'C-CF-2, C-CF-3, C-CF-4, C-CF-5, C-CF-6, C-CF-7, C-CF-8, C-CF-10, C-CF-11, C-CF-12 (earned: this grader signs up, signs in with the corpus password, reuses the token and repeats the address, so the seeded accounts, the token lifetime and the duplicate refusal are exercised together)'
    - kind: pytest
      test: test_output.py::test_persisted_account_row_carries_its_role
      critical: true
      category: data_integrity
      weight: 5
      cov: 'C-CF-9, C-DM-3, C-DM-4 (earned: this grader reads the stored account row back out of the datastore and inspects what it holds, so the hashing and the uniqueness are read from the row rather than from the response)'
    - kind: pytest
      test: test_output.py::test_form_validation_refuses_invalid_input
      category: validation
      weight: 3
      cov: 'C-CF-14'

- id: unauthenticated_request_for_a_protected_route_is_denied
  purpose: 'A signed-out or wrongly-roled caller is denied at the API and lands on the sign-in route rather than inside the surface'
  substeps:
    - kind: browser
      do: 'Sign out, request the studio address, and land on the sign-in route rather than inside the studio'
      cov: 'C-UF-6'
    - kind: pytest
      test: test_output.py::test_role_boundaries_are_enforced_server_side
      critical: true
      category: security
      weight: 5
      cov: 'C-RL-3, C-RL-6, C-RL-7, C-UF-3, C-UF-5, C-UF-10, C-DC-15, C-DC-16 (earned: this grader calls the author-only surfaces from a reader session and from no session at all, so each boundary is exercised as a direct request rather than as a hidden button)'
    - kind: pytest
      test: test_output.py::test_signed_out_request_returns_to_the_route_asked_for
      category: security
      weight: 5
      cov: 'C-UF-7, C-UF-8, C-UF-9 (earned: this grader requests each protected route signed out, signs in, and reads where the browser lands, which is the redirect behaviour these asks describe)'
    - kind: pytest
      test: test_output.py::test_no_secret_reaches_the_browser
      critical: true
      category: security
      weight: 5
      cov: 'C-TR-3, C-TR-4, C-TR-5, C-TR-7, C-TR-11, C-TR-12 (earned: this grader scans every document and response the browser receives for the environment names and the store credentials, which is the only place a hardcoded address or key would surface)'

- id: index_plays_its_nine_bands_in_order
  purpose: 'The index carries nine bands in a fixed order with the rail naming the band the reader is in'
  substeps:
    - kind: browser
      do: 'Read the left rail and confirm a vertical ruler of hairline ticks with a longer mark at each of the nine band boundaries'
      cov: C-FE-4
    - kind: browser
      do: 'Scroll the index from the opening line to the footer and watch the rail marker travel while the band name changes at each boundary'
      cov: 'C-OV-3, C-CF-20'
    - kind: browser
      do: 'Scroll through the experience band and watch each employer header stay pinned to the top while that employer''s roles are read'
      cov: 'C-CF-25'
    - kind: browser
      do: 'Read the open-source band and confirm the inline links in a piece of writing wear the one blue and lighten under the pointer'
      cov: C-UX-6
    - kind: browser
      do: 'Scroll the index quickly with several diagrams on screen and confirm the page keeps up without stalling or jumping'
      cov: 'C-FE-12, C-TR-15 (earned: the reader is scrolling hard with several diagrams playing, which is where a page that recalculates layout on every frame stops keeping up)'
    - kind: browser
      do: 'Reload the index and confirm nothing on the page jumps or re-lays out at the moment the fonts settle'
      cov: 'C-TR-16'
    - kind: browser
      do: 'Watch the index at rest and confirm the field and the diagrams are the only surfaces moving'
      cov: 'C-FE-27'
    - kind: browser
      do: 'Confirm the accent shows on the current band name, on the fixed contact control and on the waiting run-log row, and on nothing else'
      cov: C-UX-4
    - kind: browser
      do: 'Scroll until a diagram overlay, the rail and the top bar all overlap and confirm each covers the one below it in the stated order'
      cov: C-FE-8
    - kind: browser
      do: 'Read the open-source band and confirm each repository row shows its name, its one-line description and its language chip'
      cov: 'C-FE-29'
    - kind: pytest
      test: test_output.py::test_band_sequence_tiles_the_document
      category: business_rule
      weight: 3
      cov: 'C-CF-15, C-CF-16, C-CF-17, C-CF-18, C-CF-19 (earned: this grader reads the band list and its fractions straight from the endpoint, so the count, the order, the field names and the tiling come from one payload)'
    - kind: pytest
      test: test_output.py::test_rail_names_the_current_band
      category: business_rule
      weight: 3
      cov: 'C-CF-21, C-FE-4'
    - kind: pytest
      test: test_output.py::test_top_bar_scrolls_to_a_band_and_moves_focus
      category: business_rule
      weight: 3
      cov: 'C-CF-22, C-CF-23, C-UX-23 (earned: this grader presses a top-bar entry and reads both the scroll position and where keyboard focus landed, which is what separates scrolling to a band from navigating away)'
    - kind: pytest
      test: test_output.py::test_index_carries_its_seeded_records
      category: data_integrity
      weight: 5
      cov: 'C-CF-24, C-CF-26, C-CF-27, C-DM-5, C-DM-6 (earned: this grader counts the seeded content rows and reads the served index, so the six roles, the four employers, the four principles and the five systems are checked against both)'

- id: wireframe_field_stops_drawing_once_it_is_covered
  purpose: 'The opening field turns behind the headline, is hidden from assistive technology, and stops rendering once covered'
  substeps:
    - kind: browser
      do: 'Watch the opening field turn slowly behind the headline and dissolve into the page ground at the foot of the first screen'
      cov: 'C-CF-28, C-CF-29, C-CF-31'
    - kind: browser
      do: 'Move the pointer across the first screen and watch the volume lean slightly toward it with a few coloured threads running through the mass'
      cov: 'C-FE-9, C-FE-10 (earned: the reader is watching the coloured threads run through the mass as connected paths and the volume lean toward the pointer, which is what the scrim behind the headline has to survive)'
    - kind: browser
      do: 'Watch the headline arrive word by word, each word sliding up and sharpening from a blur'
      cov: 'C-UX-13'
    - kind: browser
      do: 'Sit on the first screen for a minute and watch the figure in the top bar climb steadily from the moment the page opened'
      cov: 'C-TR-17 (earned: the reader is watching the counter figure climb continuously from the moment the page opened, which is the whole of what the counter owes)'
    - kind: pytest
      test: test_output.py::test_field_is_decorative_and_stops_when_covered
      critical: true
      category: business_rule
      weight: 5
      cov: 'C-CF-30, C-CF-32, C-CF-33, C-UX-24 (earned: this grader reads the field''s own frame counter and its accessibility state before and after the field is scrolled past, which is where a loop that never stops shows itself)'
    - kind: pytest
      test: test_output.py::test_reduced_motion_holds_the_field_and_finishes_the_diagrams
      category: business_rule
      weight: 3
      cov: 'C-CF-34, C-CF-35, C-UX-16, C-UX-17, C-UX-18 (earned: this grader opens the index under a reduced-motion preference and reads the frame counter, the diagram progress and the counter figure, which is every part of the reduced-motion rule)'
    - kind: pytest
      test: test_output.py::test_counter_climbs_without_resetting
      category: business_rule
      weight: 3
      cov: 'C-TR-17, C-TR-18, C-TR-19 (earned: this grader reads the counter figure three times, once after scrolling, so the climb and the absence of a reset come from the same element)'

- id: diagram_structure_with_an_invalid_kind_is_refused
  purpose: 'A structure carrying an illegal kind, a dangling edge or a stop outside the range fails validation and blocks the export'
  substeps:
    - kind: browser
      do: 'Open the diagram step of the wizard, introduce an edge naming a node that does not exist, and read the validation report naming the offending edge'
      cov: 'C-CF-40'
    - kind: browser
      do: 'Confirm the preview holds the last valid drawing while validation is reporting a finding'
      cov: 'C-UF-17 (earned: the reader is watching the preview hold its last good drawing instead of collapsing, which is the error behaviour this ask describes)'
    - kind: pytest
      test: test_output.py::test_diagram_validation_refuses_illegal_structure
      category: validation
      weight: 3
      cov: 'C-CF-36, C-CF-37, C-CF-38, C-CF-39, C-CF-41, C-CF-42, C-DM-7 (earned: this grader submits a structure carrying an illegal kind, a dangling edge and a stop outside the range, then reads the report, so each closed vocabulary is exercised by a violation of it)'
    - kind: pytest
      test: test_output.py::test_export_is_refused_while_validation_fails
      critical: true
      category: data_integrity
      weight: 5
      cov: 'C-CF-66, C-CF-67 (earned: this grader lists the bucket before and after a refused export, so an object written despite a failing validation appears as a difference in the listing)'

- id: one_structure_renders_both_diagram_layouts
  purpose: 'One declared structure renders the tall layout and the wide layout, identically on two consecutive renders'
  substeps:
