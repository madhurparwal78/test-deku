[task]
name = "deku/token-citizen-directory-vb"
version = "1.0.0"
description = "Brand world and citizen directory for a ten thousand character collection: a scroll driven story route, a thirteen facet catalogue served from a packed index in object storage, an editorial journal and press library, and a membership directory where an account binds a wallet address with a single-use challenge and claims a citizen page whose private passport documents live in the bucket, on postgres and minio"
uuid_v5 = "dee5abcd-574a-5f2d-aaf1-81860485cb8c"
authors = [
    "utsav.jain@ethara.ai",
    "aniket.tyagi24@ethara.ai",
]
keywords = ["greenfield", "solo_founder", "python", "postgres", "minio", "directory-matching", "community-social"]

[metadata]
category         = "Greenfield"
sub_category     = "solo_founder"
domain           = "community-social"
pattern          = "directory-matching"
service_profile  = "P4-db-storage"
variant_axes     = ["critical_depth", "spec_sections"]
