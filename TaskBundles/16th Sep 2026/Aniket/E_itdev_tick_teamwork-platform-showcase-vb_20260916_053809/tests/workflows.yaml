- id: visitor_reads_the_public_estate
  purpose: "A visitor reaches every public route and each one carries its content without script"
  substeps:
    - kind: browser
      do: "Walk the product and confirm that the product ships a public marketing estate of sixteen routes"
      cov: C-OV-01
    - kind: browser
      do: "Walk the product and confirm that accept, reject, manage carry equal visual strength in the consent dialogue"
      cov: C-CF-36
    - kind: browser
      do: "Walk the product and confirm that every route in the route table exists, reachable without client-side scripting"
      cov: C-UF-01
    - kind: browser
      do: "Walk the product and confirm that the public routes include /, /products, /products/work/pricing"
      cov: C-UF-02
    - kind: browser
      do: "Walk the product and confirm that three meaning colours appear nowhere else in the interface"
      cov: C-UX-02
    - kind: browser
      do: "Walk the product and confirm that headings are set at the 653 axis value in Northwind Sans"
      cov: C-UX-05
    - kind: browser
      do: "Walk the product and confirm that the frontend is React with Vite, the backend Flask"
      cov: C-TR-01
    - kind: browser
      do: "Walk the product and confirm that a trailing slash is stripped, redirected permanently"
      cov: C-TR-08
    - kind: browser
      do: "Walk the product and confirm that every visual value resolves from a named token, never a literal colour"
      cov: C-FE-01
    - kind: browser
      do: "Walk the product and confirm that elevation carries three levels: raised, overlay, overflow"
      cov: C-FE-02
    - kind: browser
      do: "Walk the product and confirm that corner radii vary by component, primary buttons being full lozenges"
      cov: C-FE-04
    - kind: browser
      do: "Walk the product and confirm that motion binds to four named roles used in component code"
      cov: C-FE-07
    - kind: browser
      do: "Walk the product and confirm that nothing declares a transition on every property"
      cov: C-FE-09
    - kind: browser
      do: "Walk the product and confirm that every icon is drawn as geometry, never fetched as a separate request"
      cov: C-FE-10
    - kind: browser
      do: "Walk the product and confirm that the home journey pins a stage across reserved scroll distance"
      cov: C-FE-25
    - kind: browser
      do: "Walk the product and confirm that no separate search index, metrics store, app sandbox, billing ships"
      cov: C-CN-02
    - kind: browser
      do: "Walk the product and confirm that the app is reachable at APP_PUBLIC_URL"
      cov: C-DC-01
    - kind: browser
      do: "Walk the product and confirm that the port mapping is ${APP_PUBLIC_PORT}:4173"
      cov: C-DC-02
    - kind: browser
      do: "Walk the product and confirm that a production build is served behind a static preview server"
      cov: C-DC-07
    - kind: browser
      do: "Walk the product and confirm that the listener binds 0.0.0.0 rather than loopback"
      cov: C-DC-09
    - kind: pytest
      test: test_output.py::test_public_routes_render_without_script
      category: presentation
      weight: 1
      cov: C-TR-03
    - kind: pytest
      test: test_output.py::test_favicon_declared_in_document_head
      category: presentation
      weight: 1

- id: visitor_prices_a_team_of_three_hundred
