      do: "Walk the product and confirm that the card enters its new column before the write is confirmed"
      cov: C-CF-15
    - kind: browser
      do: "Walk the product and confirm that a transition carries conditions, validators, post-functions as three hooks"
      cov: C-CF-17
    - kind: browser
      do: "Walk the product and confirm that publishing a workflow is refused until every removed status names a destination"
      cov: C-CF-18
    - kind: browser
      do: "Walk the product and confirm that the datastore is reached at DATABASE_URL"
      cov: C-TR-04
    - kind: browser
      do: "Walk the product and confirm that sixteen tables carry the model, every timestamp being UTC"
      cov: C-DM-01
    - kind: browser
      do: "Walk the product and confirm that an item key is unique within its project, never changing"
      cov: C-DM-02
    - kind: browser
      do: "Walk the product and confirm that FIN carries statuses Blocked, In progress, Ready for review, Done"
      cov: C-DM-07
    - kind: browser
      do: "Walk the product and confirm that no outbound network call at run time beyond the two named services"
      cov: C-CN-03
    - kind: browser
      do: "Walk the product and confirm that named backing services are already running, never started by the app"
      cov: C-DC-10
    - kind: pytest
      test: test_output.py::test_drag_writes_transition_and_history
      critical: true
      category: core_outcome
      weight: 5
      cov: C-CF-09
    - kind: pytest
      test: test_output.py::test_transition_persists_across_reread
      critical: true
      category: data_integrity
      weight: 5
      cov: C-CF-10

