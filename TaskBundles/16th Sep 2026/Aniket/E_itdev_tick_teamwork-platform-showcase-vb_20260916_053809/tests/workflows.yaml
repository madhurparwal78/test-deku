      do: "Walk the product and confirm that the pricing journey restores both controls from the address"
      cov: C-UF-08
    - kind: browser
      do: "Walk the product and confirm that success takes a lime rather than the teal in the same accent scale"
      cov: C-UX-03
    - kind: browser
      do: "Walk the product and confirm that the comparison matrix is a real table with a scope per header cell"
