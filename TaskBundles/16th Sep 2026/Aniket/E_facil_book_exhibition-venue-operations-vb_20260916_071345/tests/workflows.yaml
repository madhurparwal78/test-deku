- id: coordinator_holds_the_combination_and_confirms_a_booking
  purpose: A coordinator holds two halls plus the passage between them for a client and confirms that hold into a booking carrying its five phases and its contract
  substeps:
    - kind: browser
      do: Sign in at /signin as coordinator@example.com with deku-demo-pw-2026, open the enquiry desk, place a rank one option on Hall 4, Hall 5 and The Transit for the seeded week, then confirm it and confirm the booking file shows five phases and a contract
    - kind: pytest
      test: test_output.py::test_confirmation_stores_spaces_phases_and_contract_together
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_option_ranks_are_stored_one_per_space_and_window
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_a_lower_rank_does_not_block_the_higher_rank
      category: business_rule
      weight: 3

- id: combination_hold_blocks_every_constituent_space
  purpose: Holding a combination blocks every hall inside it and holding a constituent blocks the combination above it
  substeps:
    - kind: browser
      do: As coordinator@example.com, open the campus calendar, ask for Hall 4 alone across the week Verwick Design Days holds, and confirm the answer names the blocking combination rather than reading free
    - kind: browser
      do: As coordinator@example.com, open the campus timeline and confirm the combination row and the two hall rows beneath it are shaded across the same week
    - kind: pytest
      test: test_output.py::test_holding_a_combination_blocks_every_constituent_space
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_holding_a_constituent_blocks_the_ancestor_combination
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_availability_answers_only_from_the_closed_state_set
      category: business_rule
      weight: 3

- id: licensed_capacity_is_stored_not_computed
  purpose: Capacity is the stored licensed figure per space, per layout and per combination rather than a number derived from floor area or summed from members
  substeps:
    - kind: browser
      do: As coordinator@example.com, open the spaces desk, compare Hall 4 and Hall 5 and confirm the smaller hall carries the larger licensed figure
    - kind: browser
      do: As coordinator@example.com, open the combination of Hall 4, Hall 5 and The Transit and confirm its licensed figure is lower than the two hall figures added together
    - kind: pytest
      test: test_output.py::test_capacity_is_not_derived_from_the_stored_floor_area
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_combination_capacity_is_stored_rather_than_summed
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_meeting_centre_combination_stores_its_own_licensed_figure
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_seeded_hall_rows_carry_the_measured_area_and_capacity
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_space_catalog_stores_every_seeded_space
      category: business_rule
      weight: 3

- id: concurrent_confirmations_leave_one_booking
  purpose: Two coordinators confirming competing options on one hall in the same instant leave exactly one booking and one clear refusal in the store
  substeps:
    - kind: browser
      do: As coordinator@example.com, place two ranked options on Hall 2 for one week, confirm the rank one option, then try to confirm the rank two option and read the refusal naming the space and the window
    - kind: pytest
      test: test_output.py::test_competing_confirmations_leave_exactly_one_stored_booking
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_cancelling_a_booking_releases_every_stored_hold
      category: data_integrity
      weight: 5

- id: phases_occupy_the_hall_and_a_tight_turnaround_raises_a_conflict
  purpose: Build-up and tear-down occupy the hall exactly as the run does, and a turnaround that does not fit is refused with the shortfall named in hours
  substeps:
    - kind: browser
      do: As coordinator@example.com, open the campus timeline, confirm the Verwick Design Days row is occupied across build-up, run and tear-down, then try to place a second event behind it and read the shortfall
    - kind: browser
      do: As coordinator@example.com, extend the run of Verwick Design Days into the following booking and confirm a conflict is raised naming both bookings rather than either being overwritten
    - kind: pytest
      test: test_output.py::test_phase_windows_are_stored_as_occupancy_of_the_space
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_tight_turnaround_is_refused_naming_the_shortfall
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_maintenance_hold_is_stored_and_blocks_a_booking
      category: business_rule
      weight: 3

- id: invalid_stand_placement_is_refused_on_the_plan
  purpose: A stand placed across a fire exit is flagged as it lands, with the rule named in words and the offending clearance shown
  substeps:
    - kind: browser
      do: Sign in as planner@example.com, open the plan for Verwick Design Days, drop a stand across a fire exit and confirm the flag names the rule and shows the measurement
    - kind: browser
      do: As planner@example.com, drag a stand across a column on the plan and confirm the flag names the column rule and stays until the stand is moved clear
    - kind: pytest
      test: test_output.py::test_plan_object_blocking_an_exit_is_refused_with_the_rule
      critical: true
      category: business_rule
      weight: 5
    - kind: pytest
      test: test_output.py::test_plan_constraints_are_stored_for_the_seeded_halls
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_plan_object_kinds_are_stored_from_the_closed_set
      category: business_rule
      weight: 3

- id: planner_cannot_approve_an_own_revision
  purpose: A planner cannot approve a plan revision that same planner submitted, and the refusal comes from the server
  substeps:
    - kind: browser
      do: As planner@example.com, submit a plan revision and confirm the approve control is absent or refuses with a stated reason
    - kind: pytest
      test: test_output.py::test_planner_cannot_approve_an_own_submitted_revision
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_planner_cannot_publish_another_party_event
      category: security
      weight: 5

- id: expired_evidence_stops_its_badge
  purpose: An insurance certificate that expires withdraws its accreditation at the moment of expiry and the badge derived from it stops working
  substeps:
    - kind: browser
      do: Sign in as operations@example.com, open accreditation, find the contractor whose certificate has expired and confirm the state reads expired
    - kind: browser
      do: As operations@example.com, open the badge list of the expired accreditation and confirm each badge shows as stopped rather than live
    - kind: pytest
      test: test_output.py::test_expired_evidence_stops_the_badge_derived_from_it
      critical: true
      category: business_rule
      weight: 5
    - kind: pytest
      test: test_output.py::test_accreditation_rows_are_stored_with_their_granter
      category: data_integrity
      weight: 5

- id: revoking_an_organiser_cascades_to_every_badge_beneath
  purpose: Withdrawing an organiser accreditation withdraws every accreditation granted beneath it within a second
  substeps:
    - kind: browser
      do: As coordinator@example.com, revoke the organiser accreditation of Bookmark Fair and confirm the exhibitor accredited beneath it reads revoked without reloading
    - kind: pytest
      test: test_output.py::test_revoking_an_organiser_cascades_to_every_row_beneath
      critical: true
      category: security
      weight: 5

