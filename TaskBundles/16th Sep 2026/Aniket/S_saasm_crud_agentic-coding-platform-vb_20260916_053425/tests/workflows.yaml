- id: visitor_reads_every_public_route
  purpose: A signed-out visitor reads every public route with its chrome, its own title and the changelog band
  substeps:
    - kind: browser
      do: "Open the home route and read the headline, the trust line and the eight customer marks"
      cov: C-CF-15, C-CF-19, C-CF-20, C-CF-22, C-CF-28
    - kind: browser
      do: "Follow the footer through the product, model, teams, enterprise, pricing, download, changelog and legal routes"
      cov: C-OV-2, C-OV-4, C-CF-11, C-CF-13, C-CF-30
    - kind: browser
      do: "Confirm in the browser that A signup whose address is already registered is rejected as invalid, creating no second account. A self-reported benchmark figure is marked in the accessible name of its cell, not only in a note beneath the table. A capability granted on a lower plan is granted on every higher plan."
      cov: C-CF-3, C-CF-54, C-CF-98
    - kind: browser
      do: "Confirm in the browser that Each certification carries an issuing body, a scope, a validity window, an evidence address. The foreground is a deep warm neutral reading as a very dark olive-brown. Every border, secondary text colour, overlay, hover wash is the foreground mixed into the ground at a stated share."
      cov: C-CF-154, C-UX-2, C-UX-3
    - kind: browser
      do: "Confirm in the browser that A deep soft teal marks an inserted line, a mid vivid red marks a removed line, neither appearing in the page chrome. Everything is set in one humanist grotesque carrying a variable axis of stroke thickness. The type scale is one base size multiplied by a ratio, with the multiplication authored rather than the result."
      cov: C-UX-6, C-UX-7, C-UX-8
    - kind: browser
      do: "Confirm in the browser that Figures line up in a column wherever amounts stack. Five named moments move on their own, with nothing else animating. Every shimmering row on a page shares one clock."
      cov: C-UX-9, C-UX-14, C-UX-15
    - kind: browser
      do: "Confirm in the browser that A reduced-motion preference stops every loop at its most legible frame. Colour transitions survive a reduced-motion preference because a colour change carries meaning. A navigation item fades to about three-quarters strength when pointed at, with nothing else changing."
      cov: C-UX-16, C-UX-17, C-UX-19
    - kind: browser
      do: "Confirm in the browser that Contrast meets WCAG AA in both themes, verified independently. Meaning is never carried by colour alone. Each drawn window is one region carrying a written description, with its internals hidden from assistive technology."
      cov: C-UX-22, C-UX-24, C-UX-25
    - kind: browser
      do: "Confirm in the browser that The document never scrolls sideways at any viewport width. The drawn window runs off the trailing edge inside a clipped container at narrow widths rather than shrinking. The theme control offers three states with system as the default."
      cov: C-UX-27, C-UX-28, C-UX-29
    - kind: browser
      do: "Confirm in the browser that A visitor whose machine is set to dark sees dark on the first paint with no flash of the wrong theme."
      cov: C-UX-30
    - kind: pytest
      test: test_output.py::test_public_routes_render_with_chrome_and_skip_link
      critical: true
      category: core_outcome
      weight: 5
      cov: C-CF-12, C-CF-18, C-CF-33, C-CF-57, C-CF-88
    - kind: pytest
      test: test_output.py::test_health_endpoint_is_ready
      category: presentation
      weight: 1
      cov: C-TR-10, C-DC-4
    - kind: pytest
      test: test_output.py::test_every_public_route_carries_its_own_title_and_description
      category: presentation
      weight: 1
      cov: C-CF-173
    - kind: pytest
      test: test_output.py::test_sitemap_lists_every_public_route_and_robots_points_at_it
      category: presentation
      weight: 1
      cov: C-OV-1, C-CF-174
    - kind: pytest
      test: test_output.py::test_install_block_and_marketplace_heading_are_pinned_copy
      category: presentation
      weight: 1
      cov: C-CF-23, C-CF-25
    - kind: pytest
      test: test_output.py::test_changelog_projects_its_four_newest_entries_onto_the_home_route
      category: business_rule
      weight: 3
      cov: C-CF-26, C-CF-27, C-CF-43, C-UF-3

