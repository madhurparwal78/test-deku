      cov: C-OV-3, C-RL-1, C-RL-3, C-CF-7, C-CF-149
    - kind: browser
      do: "Confirm in the browser that The changelog route is one column of entries, newest first, each carrying a date, a title, a standfirst, a body. An explicit query parameter overrides the declared platform, the declared architecture. A late usage event is attributed to the period the usage belongs to, never moved into the current period."
      cov: C-CF-42, C-CF-87, C-CF-139
