      do: "Confirm in the browser that The three backing services are already running, so none is downloaded, installed, compiled, started. The mail credentials are read from SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS. No host, no port is hardcoded."
      cov: C-TR-4, C-TR-6, C-TR-8
    - kind: browser
      do: "Confirm in the browser that No password, no token, no provider credential is returned in a response body. Every response carries the standard security headers. Every state-changing request carries an origin check failing closed on a missing header."
      cov: C-TR-11, C-TR-13, C-TR-14
    - kind: browser
      do: "Confirm in the browser that No state-changing action is reachable by a safe method. Server-side validation runs for every request regardless of what the browser already checked. A business-rule violation is rejected as a client error naming the field, never as a server error."
      cov: C-TR-15, C-TR-16, C-TR-17
