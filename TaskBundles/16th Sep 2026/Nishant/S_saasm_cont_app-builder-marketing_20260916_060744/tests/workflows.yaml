- id: every_surface_carries_its_empty_and_loading_states
  purpose: Each collection surface names what would appear when it holds nothing, and a failed request leaves the page usable
  substeps:
    - kind: browser
      do: Confirm the signed-in studio presents the site's own authors with all four collections, open each studio collection with no records and confirm an empty state naming what would appear there, then confirm each route shows a loading state before its content arrives
      cov: C-UF-10, C-OV-03
    - kind: browser
      do: Trigger a failed request and confirm a message appears without the page breaking
      cov: C-UF-11
    - kind: browser
      do: Request an unknown path and confirm the shared not-found surface renders with the reading-route header cluster and the footer pinned to the bottom of the viewport
      cov: C-OV-02, C-UF-08, C-UF-12
    - kind: browser
      do: Request the share, invite, embed and verification prefixes with no trailing identifier and confirm each renders the same not-found surface
      cov: C-FE-02

- id: the_interface_holds_at_every_width_and_without_motion
  purpose: The layout holds between the named tiers, every control is reachable by keyboard, and nothing animates under reduced motion
  substeps:
    - kind: browser
      do: Resize between and across the three captured widths and confirm the layout holds at every width, that the home hero substitutes a single static composition on the narrow width, and that no horizontal scrolling appears
    - kind: browser
      do: Traverse each route by keyboard alone and confirm every control is reachable with a visible focus ring, that text meets the stated contrast, and that no meaning is carried by colour alone
      cov: C-UX-09
    - kind: browser
      do: Enable reduced motion and confirm every scroll-driven value, every parallax offset and every keyframe resolves to its end state immediately
      cov: C-FE-17
    - kind: browser
      do: Confirm buttons, tags and switches are fully rounded at their ends, that every other surface carries a gentle corner, and that no sharp corner appears anywhere
    - kind: browser
      do: Confirm body text is set at the stated colour, that the display family sets its normal face a step heavier than a static family would, that the hairline value draws every rule and every outlined pill, and that the route progress bar is the only place the accent appears at full strength on a light ground
      cov: C-FE-05, C-FE-08, C-FE-09, C-FE-13
    - kind: browser
      do: Confirm the studio sets its type in monospace, that the agent terminal does the same, that the editorial reading measure keeps a proportional face, and that the product excludes a visual editor
      cov: C-UX-02, C-OV-05
