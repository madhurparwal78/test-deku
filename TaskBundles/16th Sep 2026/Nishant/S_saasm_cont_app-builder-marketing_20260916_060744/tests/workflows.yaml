      do: Open the editorial index and confirm its title, a one-line standfirst, the inline subscribe form with its placeholder and inset button, one featured media card, and a list of article rows with thumbnails and hairlines between them, and that the one accent colour carries only progress, documentation links and one large mark
      cov: C-UX-06
    - kind: pytest
      test: test_output.py::test_subscription_response_reveals_no_membership
      critical: true
      category: security
      weight: 5

