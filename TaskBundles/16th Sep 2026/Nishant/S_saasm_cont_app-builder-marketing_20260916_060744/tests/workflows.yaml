- id: visitor_files_a_build_request_from_the_composer
  purpose: A visitor reads the pitch on the home route, describes the app they want in the composer, and the request is filed with an identifier returned
  substeps:
    - kind: browser
      do: Open the home route and confirm the hero, the trust marquee, the connected-apps section, the card carousel, the three-step disclosure, the device composition, the integration chip field, the dark security band, the app tile grid, the testimonial carousel and the founder quote are present in that order, that the primary navigation carries five items, and that the site presents seven public reading surfaces
      cov: C-OV-01, C-UF-01, C-FE-01, C-FE-03
    - kind: browser
      do: Confirm the prompt composer is present in the hero with the placeholder text and the attachment label, that it carries a circular submit button, and that the composer card blurs whatever ground passes behind it
      cov: C-FE-10, C-FE-11, C-FE-12
    - kind: pytest
      test: test_output.py::test_build_request_is_durable_and_returns_its_identifier
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_health_endpoint_reports_ready
      critical: true
      category: core_outcome
      weight: 5
    - kind: browser
      do: Sign in with the login credentials the app writes into its readme at the app root and confirm they work, then confirm the reserved screenshot and download directories exist and start empty
      cov: C-DC-04, C-DC-05, C-DC-06
    - kind: browser
      do: Type a sentence into the hero composer, scroll past the hero, and confirm the composer is pinned to the bottom of the viewport with the typed text still present and no layout jump
      cov: C-CF-26
    - kind: browser
      do: Confirm the composer is present on the agent route, the answers route and the careers route, pinned to the bottom of the viewport

- id: author_publishes_an_article_with_a_cover
  purpose: An author writes an article in the studio, uploads its cover, and publishes it onto the editorial index
  substeps:
    - kind: browser
      do: Sign in as author@example.com and confirm the studio opens with a fixed rail of the four collections and a card grid of records beside it
      cov: C-UF-06, C-RL-01
    - kind: browser
      do: Open the create slide-over, fill an article, save it as a draft, confirm the row appears in the grid before the server answers, then publish it and confirm an author publishes only their own records
      cov: C-RL-02
    - kind: pytest
      test: test_output.py::test_article_cover_upload_is_stored_in_the_object_store
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_published_articles_listed_newest_first
      critical: true
      category: business_rule
      weight: 5
    - kind: pytest
      test: test_output.py::test_cover_bytes_are_not_persisted_in_a_database_column
      critical: true
      category: data_integrity
      weight: 5

