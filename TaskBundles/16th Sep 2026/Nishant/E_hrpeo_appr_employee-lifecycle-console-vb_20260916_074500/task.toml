schema_version = "1.4"

[task]
name = "deku/employee-lifecycle-console-vb"
version = "1.0.0"
description = "Human resources and payroll console holding one employee record from hire to exit, with one approval queue scoped by the reporting line and a payroll run whose preparer may not sign it off."
authors = [
  "abhishek.shaw@ethara.ai" ,
  "nishant.dubey@ethara.ai"
]
uuid_v5 = "36af4631-5e23-5c61-b2ca-09395955cc45"
keywords = ["greenfield", "enterprise", "typescript", "postgres", "keycloak", "approval-workflow", "payroll"]

[metadata]
category     = "Greenfield"
sub_category = "enterprise"
domain          = "hr-people-ops"
pattern         = "approval-workflow"
service_profile = "P3-db-auth"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = ""
task_code       = "E_hrpeo_appr_employee-lifecycle-console-vb_20260916_074500"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "custom_404,favicon,no_broken_links,no_frontend_secrets,single_cta"
grader_version  = "0.22.0"
language     = "typescript"
archetype    = "employee-lifecycle-console"
variant      = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 160
tokens_expected = 5500000
contributor_id  = "nishant.dubey@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"
auth    = "keycloak"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", AUTH_ISSUER_URL = "${AUTH_ISSUER_URL:-http://keycloak:8080/realms/deku}", AUTH_CLIENT_ID = "${AUTH_CLIENT_ID:-cadrix-console}", AUTH_CLIENT_SECRET = "${AUTH_CLIENT_SECRET:-cadrix-client-7f3b19d4}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", AUTH_ISSUER_URL = "${AUTH_ISSUER_URL:-http://keycloak:8080/realms/deku}", AUTH_ADMIN_TOKEN = "${AUTH_ADMIN_TOKEN:-deku-realm-admin-4c81ba07}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_AUTH = "keycloak" }

[[artifacts]]
source      = "/app"
destination = "app"

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"
