- id: employee_signs_in_and_reads_own_surface
  purpose: A seeded employee signs in and reads their own balances, requests and payslips
  substeps:
    - kind: browser
      do: Open /login signed out and sign in as employee@example.com with the seeded password deku-demo-pw-2026, and verify the console opens on /me with no registration control anywhere on the sign-in page
      cov: C-UF-01, C-UF-02 (earned: the walk signs in and lands on the employee's own surface, which is what the route table grants any role, and it looks for a registration control on the way), C-UF-15 (earned: the walk signs in and lands on the employee's own surface, which is what the route table grants any role, and it looks for a registration control on the way), C-RL-02, C-RL-32, C-RL-33 (earned: the walk signs in and lands on the employee's own surface, which is what the route table grants any role, and it looks for a registration control on the way), C-RL-34, C-DM-02, C-DM-03, C-DC-08 (earned: the walk signs in and lands on the employee's own surface, which is what the route table grants any role, and it looks for a registration control on the way)
    - kind: browser
      do: Verify /me carries the balance per policy, the employee's own requests and their own payslips, at comfortable density, with exactly one h1, with every amount and every balance set in tabular figures, and with an empty state naming the next action on any list holding nothing
      cov: C-CF-172, C-CF-173, C-CF-174, C-UX-24, C-UX-39, C-UF-32, C-FE-03 (earned: the walk reads the whole of the employee's own surface, so the rail, the tile grounds and the states on it are in front of the reader), C-FE-04 (earned: the walk reads the whole of the employee's own surface, so the rail, the tile grounds and the states on it are in front of the reader)
    - kind: browser
      do: Expand the annual balance on /me into its ledger entries and verify the entries sum to the figure shown, and that the figure is presented as a derived total rather than as an editable number
      cov: C-CF-63, C-CF-65, C-CF-66, C-CF-67, C-OV-02 (earned: the walk opens a leave balance, which reads from the one employee record)
    - kind: browser
      do: Verify the left rail carries the modules in a fixed order with the account control at its foot, that signing out returns to /login, and that a signed-out request for /me returns to /login and then back to /me after signing in again
      cov: C-FE-01 (earned: the walk uses the rail and the account control, then signs out and back in, so the shell and the redirect behaviour are both exercised), C-FE-02 (earned: the walk uses the rail and the account control, then signs out and back in, so the shell and the redirect behaviour are both exercised), C-FE-05 (earned: the walk uses the rail and the account control, then signs out and back in, so the shell and the redirect behaviour are both exercised), C-FE-06 (earned: the walk uses the rail and the account control, then signs out and back in, so the shell and the redirect behaviour are both exercised), C-UF-13, C-UF-14 (earned: the walk uses the rail and the account control, then signs out and back in, so the shell and the redirect behaviour are both exercised), C-UF-16
    - kind: pytest
      test: test_output.py::test_health_endpoint_requires_no_credential
      category: presentation
      weight: 1
      cov: C-DC-06 (earned: the check calls the health route with no credential and reads its status once seeding has finished), C-TR-08, C-TR-09
    - kind: pytest
      test: test_output.py::test_login_returns_bearer_token_for_seeded_manager
      category: security
      weight: 5
      cov: C-DC-19 (earned: the check signs in with the seeded address and the corpus password and reads the token field the response returns), C-DC-49 (earned: the check signs in with the seeded address and the corpus password and reads the token field the response returns), C-RL-37
    - kind: pytest
      test: test_output.py::test_me_reports_the_callers_own_employee_number
      category: security
      weight: 5
      cov: C-DC-20 (earned: the check reads the caller identity route and compares the employee number it resolves against the seeded reporting line), C-TR-21 (earned: the check reads the caller identity route and compares the employee number it resolves against the seeded reporting line)

