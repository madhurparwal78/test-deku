      do: Approve the request and verify the row leaves the queue before the response lands, that the approval is recorded against manager@example.com, and that the queue then shows its empty state naming the next action when nothing is left
      cov: C-UF-22, C-UF-32, C-FE-08 (earned: the walk approves and watches the row leave the queue, then reads the empty state the queue falls back to), C-FE-53 (earned: the walk approves and watches the row leave the queue, then reads the empty state the queue falls back to), C-FE-71, C-CF-52 (earned: the walk approves and watches the row leave the queue, then reads the empty state the queue falls back to)
