- id: manager_approves_direct_report_leave_request
  purpose: A manager clears the queue for a direct report and the booked day reaches the open run
  substeps:
    - kind: browser
      do: Sign in as manager@example.com, open /approvals and verify one queue holds leave requests, regularisations and claims together with a filter by kind, each row carrying the requester, the kind, a one-line summary, an age in days and the two actions
