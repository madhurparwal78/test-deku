      do: Verify the console meets its accessibility floor: WCAG AA contrast on body text, real tables with header associations, a label on every icon-only control, every amount announced with its currency and every date announced in full
      cov: C-UX-40, C-UX-42, C-UX-43, C-UX-47, C-UX-48
    - kind: browser
      do: Verify the header carries the wordmark, the primary navigation and the account control, that the wordmark is a lowercase word in the brand violet with a raised dot and a small two-letter suffix below the baseline, and that the announcement bar above it can be dismissed for the session
      cov: C-FE-38, C-FE-39, C-FE-48, C-FE-49, C-FE-14, C-FE-15, C-FE-16 (earned: the walk reads the header, the wordmark and the announcement bar above it)
    - kind: browser
      do: Verify every interface glyph shares one stroke weighting, that every illustration is drawn from the palette rather than sourced, that no photograph of a person and no third-party mark appears, and that no certification badge is downloaded
      cov: C-FE-40, C-FE-41, C-FE-42, C-FE-43, C-FE-46
    - kind: browser
