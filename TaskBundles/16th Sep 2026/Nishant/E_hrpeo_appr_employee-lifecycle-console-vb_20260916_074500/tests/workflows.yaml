      critical: true
      category: core_outcome
      weight: 5
      cov: C-CF-58 (earned: the check approves a request and polls the computed attendance day the approval produces), C-CF-59, C-OV-01 (earned: the check approves a request and polls the computed attendance day the approval produces), C-DM-23 (earned: the check approves a request and polls the computed attendance day the approval produces)
    - kind: pytest
      test: test_output.py::test_approval_persists_an_availed_ledger_row
      category: data_integrity
      weight: 5
      cov: C-CF-52, C-DM-19 (earned: the check approves a request and polls the availed ledger rows the approval writes)
    - kind: pytest
      test: test_output.py::test_rejection_removes_the_pending_ledger_row
      category: data_integrity
      weight: 5
      cov: C-CF-53, C-CF-54 (earned: the check rejects a request and polls the balance the rejection restores)

