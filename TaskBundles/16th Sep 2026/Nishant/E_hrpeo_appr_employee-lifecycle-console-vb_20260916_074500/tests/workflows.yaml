      do: Open the pending annual request raised by Nadia Fernandes and verify the deciding context opens in place, showing her balance and the one teammate already away that week
      cov: C-UF-08, C-UF-21, C-FE-05 (earned: the walk opens one queue row in place, which is the deciding surface the shell puts the context on), C-FE-06
