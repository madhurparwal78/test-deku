- id: responsive_matrix_holds_at_three_widths
  purpose: The console holds at every width and the register refuses the narrowest one
  substeps:
    - kind: browser
      do: At the narrowest width verify the rail becomes a sheet, the directory becomes cards carrying name, designation and status, and the month grid shows one employee with the days down
      cov: C-FE-63, C-FE-64, C-FE-65, C-FE-51
    - kind: browser
      do: At the middle width verify the month grid shows seven days across with paging and the register scrolls horizontally with a frozen first column
      cov: C-FE-66, C-FE-69
    - kind: browser
      do: At the narrowest width open the register and verify it is refused with the copy The register needs a wider window above an export offered instead
      cov: C-FE-68
    - kind: browser
      do: Verify the layout holds at every width between the named tiers, floors on the smallest viewport, and that the employee surface and the approval queue read as built for the narrow width first
      cov: C-UX-49, C-UX-50
    - kind: browser
      do: Open the empty directory and verify the copy reads No people yet above Add your first employee or import a list.
      cov: C-FE-70, C-FE-54 (earned: the walk empties the directory filter and reads the copy the surface falls back to)

- id: scope_boundary_holds_across_the_console
  purpose: The console offers nothing the brief holds out of scope
  substeps:
    - kind: browser
      do: Walk every route and every menu as manager@example.com and payroll@example.com and verify no control offers onboarding, exit, clearance or a final settlement, and none offers a typed assistant
      cov: C-CN-05, C-CN-06
    - kind: browser
      do: Verify no control offers a report builder, report scheduling or export delivery, no control delegates an approval to a colleague, and no control impersonates another account
      cov: C-CN-07, C-CN-08 (earned: the walk visits every route and every menu and looks for the named controls), C-CN-09 (earned: the walk visits every route and every menu and looks for the named controls)
    - kind: browser
      do: Verify no billing, plan, invoice or metering surface exists, no integration, webhook or public key surface exists, and no letter, certificate or generated document is offered
      cov: C-CN-10, C-CN-11, C-CN-12
    - kind: browser
      do: Verify no action sends an email, a message or a push notification, that the queue is the only place a decision is announced, and that no second factor, password reset or self-service signup is offered anywhere
      cov: C-CN-13, C-CN-14, C-OV-11
    - kind: browser
      do: Verify no route serves a marketing page, a pricing page or a public website, and that no download or install of a native application is offered
      cov: C-CN-15, C-CN-16

- id: bulk_decisions_undo_within_the_window
  purpose: A filtered selection is decided in bulk and the action can be taken back
  substeps:
    - kind: browser
      do: As manager@example.com filter /approvals to leave, select several rows, approve them in bulk with no reason asked for, and verify each row updates the moment the action is taken
      cov: C-CF-127, C-CF-131
    - kind: browser
      do: Reject a filtered selection in bulk and verify a reason is required before the action is accepted, then take the action back inside the undo period of ten seconds and verify the rows return to pending
      cov: C-CF-128, C-CF-129, C-CF-130
    - kind: browser
      do: Verify a leave request carries its state as one of the eight named words through its life, and that a late cancellation made by a payroll account writes a correction entry carrying a reason
      cov: C-CF-57, C-CF-62

