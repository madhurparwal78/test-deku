schema_version = "1.4"

[task]
name = "deku/instrument-portfolio-console-vb"
version = "1.0.0"
description = "Single-canvas portfolio console whose owner writes each work entry, orders the shelf and publishes, while visitors steer the scene, open a dossier and send a message the owner reads."
