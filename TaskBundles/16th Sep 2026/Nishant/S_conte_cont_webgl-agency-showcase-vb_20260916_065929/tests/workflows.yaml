- id: visitor_browses_the_published_wall
  purpose: A signed-out visitor opens the home wall and sees every published project with the live count
  substeps:
    - kind: browser
      do: Open / signed out and confirm the header reads All projects beside the count 6 projects, then drag the wall and confirm it keeps travelling after the pointer is released
      cov: C-OV-01, C-OV-03, C-UF-01, C-UF-32, C-UF-33, C-UF-34
    - kind: browser
      do: Load / cold and watch the opening sequence, confirming the mascot holds the first paint behind a progress bar, leaves on a choreographed exit that is not the same twice, hands off cleanly, and renders as a translucent self-lit form that idles and tracks the pointer
      cov: C-FE-66, C-FE-67, C-FE-68, C-FE-69, C-FE-70, C-FE-71, C-FE-72, C-FE-73, C-FE-74, C-FE-75, C-FE-76, C-FE-77, C-FE-78, C-FE-79, C-FE-80, C-FE-81, C-FE-147, C-FE-148, C-FE-151, C-FE-150
    - kind: browser
      do: Move the pointer across the wall and confirm the custom cursor inverts what sits behind it, trails on a lag, drags a faint image trail, is suppressed for touch, is hidden from assistive technology, and that distant thumbnails sit smaller and dimmer than near ones
      cov: C-FE-92, C-FE-95, C-FE-96, C-FE-101, C-FE-102, C-FE-103, C-FE-132, C-UX-25
    - kind: browser
      do: Read the chrome and the wall against the design tokens, confirming the near-monochrome ground, the hairline and muted values, the single warm accent, the distinct failure colour, the alpha ladder, the two type families with the published ramp, the radius set and the layering order
      cov: C-FE-01, C-FE-02, C-FE-03, C-FE-04, C-FE-05, C-FE-06, C-FE-07, C-FE-08, C-FE-09, C-FE-10, C-FE-11, C-FE-12, C-FE-13, C-FE-14, C-FE-15, C-FE-16, C-FE-17, C-FE-18, C-FE-19, C-FE-20, C-FE-21, C-FE-22, C-FE-23, C-FE-24, C-FE-25, C-FE-26, C-FE-27, C-FE-28, C-FE-29
    - kind: browser
      do: Confirm the reveal vocabulary on entry, the named chrome entrances, the default easing and the card spring, the scrubbed separators, the split headlines, and that a reduced-motion preference collapses travel without losing any information
      cov: C-FE-40, C-FE-41, C-FE-54, C-FE-55, C-FE-56, C-FE-58, C-FE-59, C-FE-60, C-FE-61, C-FE-62, C-FE-64, C-FE-65, C-FE-133, C-FE-134, C-FE-135, C-FE-136
    - kind: pytest
      test: test_output.py::test_health_endpoint_returns_ok
      category: core_outcome
      weight: 5
      critical: true
      cov: C-DC-01, C-DC-05, C-DC-06, C-TR-17, C-CF-05, C-TR-08, C-TR-09, C-TR-10, C-TR-11, C-TR-12, C-DM-01, C-DM-02
    - kind: pytest
      test: test_output.py::test_public_catalogue_lists_only_published_projects
      category: core_outcome
      weight: 5
      critical: true
      cov: C-CF-13, C-CF-14, C-DC-28
    - kind: pytest
      test: test_output.py::test_public_count_endpoint_matches_published_total
      category: data_integrity
      weight: 5
      critical: true
      cov: C-CF-18, C-CF-19, C-DC-29, C-DM-31

