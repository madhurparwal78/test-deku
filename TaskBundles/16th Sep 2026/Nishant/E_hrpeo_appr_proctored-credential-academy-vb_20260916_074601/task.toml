schema_version = "1.4"

[task]
name = "deku/proctored-credential-academy-vb"
version = "1.0.0"
description = "Proctored credential academy where an Artisan enrols against a partner treasury, sits a timed monitored test, has a project approved by a person, and is issued a credential written once to an append-only public ledger."
uuid_v5 = "3237d5aa-c8c1-50a4-80dc-68bdf3a2e75f"
authors = ["abhishek.shaw@ethara.ai", "nishant.dubey@ethara.ai"]
keywords = ["greenfield", "enterprise", "javascript", "postgres", "keycloak", "approval-workflow", "credentialing"]

[metadata]
category     = "Greenfield"
sub_category = "enterprise"
domain          = "hr-people-ops"
pattern         = "approval-workflow"
service_profile = "P3-db-auth"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = "aesthetic"
design_direction = "companion"
launch_surface = "colour_contrast,cookie_choice,favicon,meta_tags,privacy_page"
language     = "javascript"
archetype    = "proctored-credential-academy"
variant      = "b"
difficulty   = ""
task_code    = "E_hrpeo_appr_proctored-credential-academy-vb_20260916_074601"
naming_scheme = "task-code-v1"
grader_version = "0.22.0"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 180
tokens_expected = 6000000
contributor_id  = "nishant.dubey@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"
auth = "keycloak"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", AUTH_URL = "${AUTH_URL:-http://keycloak:8080}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", AUTH_URL = "${AUTH_URL:-http://keycloak:8080}", AUTH_ADMIN_TOKEN = "${AUTH_ADMIN_TOKEN:-deku-admin-token-5f82b613}", DEKU_SERVICE_BACKEND = "postgres", DEKU_SERVICE_AUTH = "keycloak" }

[[artifacts]]
source      = "/app"
destination = "app"

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"
