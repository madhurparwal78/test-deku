[metadata]
category     = "Greenfield"
sub_category = "enterprise"

domain          = "legal-compliance"
pattern         = "content-publishing"
service_profile = "P4-db-storage"
variant_axes    = ["critical_depth", "spec_sections"]
capability_flags = ""
task_code       = "E_legal_cont_brand-governance-portal-vb_20260916_064757"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "cookie_choice,custom_404,no_broken_links,security_headers,spam_protection"
