      do: Sign in as reviewer@example.com, open the queue route /queue, read the waiting requests ordered by deadline, open one and read the panel explaining why the request reached the holding reviewer and the cap that will apply to the grant
      cov: C-CF-90, C-CF-91, C-CF-93, C-RL-10, C-UF-10
    - kind: pytest
      test: test_output.py::test_queue_is_ordered_by_the_stored_deadline
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_stored_deadline_survives_a_policy_change
      category: data_integrity
      weight: 5

- id: one_stage_admits_exactly_one_decision
  purpose: Two reviewers approving one stage at the same instant leave exactly one recorded decision
  substeps:
