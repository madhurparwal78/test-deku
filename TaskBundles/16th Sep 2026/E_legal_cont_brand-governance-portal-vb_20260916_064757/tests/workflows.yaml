      test: test_output.py::test_employee_is_refused_the_queue_and_the_decision_endpoint
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_partner_engagement_bounds_downloads_and_expires_with_the_engagement
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_draft_chapter_version_is_unreachable_publicly
      category: security
      weight: 5

