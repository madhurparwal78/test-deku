      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_retiring_an_asset_under_review_rejects_the_request
      category: business_rule
      weight: 3

- id: the_record_cannot_be_unwritten
  purpose: Every transition writes one audit record and no principal can alter one
  substeps:
