      test: test_output.py::test_requester_withdraws_their_own_request
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_changes_requested_resubmission_returns_to_routed
      category: business_rule
      weight: 3
    - kind: pytest
