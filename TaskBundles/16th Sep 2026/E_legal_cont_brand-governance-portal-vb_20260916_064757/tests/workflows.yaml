- id: visitor_reads_the_hub_and_a_chapter
  purpose: A visitor opens the hub, watches the eight tiles assemble and reads a chapter through
  substeps:
    - kind: browser
      do: As a visitor with no account, open the hub route / as the first entry point, scroll the hub to its foot and read the eight tiles reach their final geometry, read that each tile carries its own ground colour from the chapter palette, then open the menu overlay and read the same eight chapters listed in the same fixed order
      cov: C-CF-14, C-CF-15, C-CF-17, C-CF-18, C-CF-24, C-UF-01
    - kind: browser
      do: Open the chapter route /typography through the menu overlay, read the vertical rail showing the chapter title, scroll the chapter and read the rail fill as the page advances, then read that the chapter carries no breadcrumb and no next chapter link
      cov: C-CF-19, C-CF-20, C-CF-21, C-CF-22, C-CF-23, C-UF-02
    - kind: pytest
      test: test_output.py::test_hub_and_eight_chapter_routes_answer_anonymously
      critical: true
      category: core_outcome
      weight: 5
    - kind: pytest
      test: test_output.py::test_chapter_order_matches_the_stored_display_field
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_public_route_titles_are_unique_per_route
      category: presentation
      weight: 1

- id: chapters_teach_by_working_demonstration
  purpose: Every explanatory figure in a chapter is a live component rather than a flat image
  substeps:
    - kind: browser
      do: Open the typography chapter and drag the live ruler driving the variable axis of the display face, then open the colour chapter and read the rotating palette wheel, then open the iconography chapter and read the three counter scrolling marquees, and confirm that no explanatory figure in any chapter is a flat image
      cov: C-CF-32, C-CF-33, C-CF-34, C-CF-36
    - kind: browser
      do: Open the motion chapter and scrub the timeline editor carrying keyframe markers, then open the framework chapter and read the four published principles Prioritize Simplicity, Deepen Understanding, Instant Feedback and Subtle Playfulness, then open the voice chapter and read one message written for three named delivery surfaces
      cov: C-CF-35, C-CF-25, C-CF-26, C-CF-27, C-CF-28, C-CF-29
    - kind: browser
      do: Open the logo chapter and read the mark labelled Version A and Version B, each expression stating its own permitted applications
      cov: C-CF-30, C-CF-31
    - kind: pytest
      test: test_output.py::test_chapter_statements_carry_stable_identifiers
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_reserved_slug_is_refused_at_chapter_creation
      category: validation
      weight: 3

- id: the_product_owns_its_not_found_page
  purpose: A reserved or unknown address answers the product's own designed page rather than a framework default
  substeps:
    - kind: browser
      do: As any caller, try opening the reserved address /gs and read that the request lands on the product's own not-found page carrying the chapter menu as the way back, then open the reserved address /as and read the same page
      cov: C-CF-11, C-CF-12, C-UF-16
    - kind: pytest
      test: test_output.py::test_reserved_addresses_answer_the_product_not_found_page
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_every_internal_link_on_public_routes_resolves
      category: presentation
      weight: 1

- id: the_outro_and_footer_split_three_ways
  purpose: Every public route closes with the partner desk, the legal desk and the design publication
  substeps:
    - kind: browser
      do: Scroll any chapter to its outro and read the three destinations Brand Partner Toolkit, Legal Branding Resources and Tessera Design, read that every public route ends with this same outro, then read the footer carrying Modern Slavery Statement, Impressum, Cancel Contract and Cookies & CCPA preferences
      cov: C-CF-40, C-CF-41, C-CF-42, C-CF-43, C-CF-44, C-CF-45, C-CF-46, C-CF-47
    - kind: browser
      do: Read the credit line on the hub outro naming Tessera Brand Studio as the owning function and Meridian Studio as the external collaborator
      cov: C-FE-13, C-FE-14
    - kind: pytest
      test: test_output.py::test_collection_endpoints_answer_top_level_arrays
      category: presentation
      weight: 1

- id: the_cookie_question_is_asked_once
  purpose: A first time visitor answers the consent question once and the answer survives a reload
  substeps:
    - kind: browser
      do: Open the hub as a first time visitor and read the consent frame asking once about non essential cookie use, carrying the control Do not sell or share my personal data to third parties, answer it, reload the hub and read that the question does not return, then use the Cookies & CCPA preferences footer link to reopen the choice
      cov: C-CF-49, C-CF-50, C-CF-52, C-CF-53
    - kind: pytest
      test: test_output.py::test_cookie_choice_is_asked_once_and_survives_reload
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_security_headers_present_on_every_response
      category: security
      weight: 5

- id: provisioned_principals_sign_in
  purpose: A seeded principal signs in and no route creates an account
  substeps:
    - kind: browser
      do: Open the sign in surface, sign in as employee@example.com with the seeded password and read the return to the library, then sign out and confirm that no principal can create an account through the app by looking for a signup form anywhere in the product
      cov: C-UF-04, C-RL-13
    - kind: pytest
      test: test_output.py::test_seeded_login_returns_access_token
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_failed_signin_returns_no_token_without_disclosing_the_address
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_no_route_creates_a_principal
      category: security
      weight: 5

- id: the_library_is_never_empty
  purpose: Every asset is visible to every signed in principal, badged for that principal
  substeps:
    - kind: browser
      do: Sign in as partner@example.com and open the library route /library, read that the library is never empty for a principal holding no permission because the result grid is populated with assets the reader cannot have, read the availability badge on each asset card, then apply a chapter filter that excludes every result and read which filter is named as responsible
      cov: C-CF-54, C-CF-55, C-CF-56, C-CF-62, C-CF-63, C-CF-64
    - kind: pytest
      test: test_output.py::test_library_lists_every_asset_with_one_availability_badge
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_availability_is_computed_for_the_calling_principal
      critical: true
      category: security
      weight: 5

- id: asset_detail_explains_itself
  purpose: An asset states its licence, its governing rule and the reason a control is unusable
  substeps:
    - kind: browser
      do: Open an asset detail page and read the preview rendered from the asset derivative, the licence record, the governing usage text linked to its statement identifier, then read the disabled download control stating the reason for being disabled
      cov: C-CF-66, C-CF-67, C-CF-68, C-CF-69, C-CF-70, C-UF-08
    - kind: browser
      do: Open the retired asset and read that the detail page names its successor asset
      cov: C-CF-74
    - kind: pytest
      test: test_output.py::test_asset_detail_carries_licence_and_governing_statement
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_released_icon_dimensions_must_match_its_class
      category: validation
      weight: 3

- id: a_binary_is_released_only_behind_a_decision
  purpose: A download reaches a principal only where a decision permitted it
  substeps:
    - kind: browser
      do: Sign in as employee@example.com, open an asset badged Available and download the format offered, then read the download recorded against the principal
      cov: C-RL-04, C-UF-05, C-UF-06
    - kind: pytest
      test: test_output.py::test_employee_downloads_available_asset_and_row_is_recorded
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_restricted_download_without_grant_is_refused_with_reason
      critical: true
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_retired_asset_is_never_downloadable_and_names_successor
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_protected_object_address_is_refused_anonymously
      category: security
      weight: 5

- id: a_usage_request_describes_itself
  purpose: A submitted request stores the rules that applied when it was asked
  substeps:
    - kind: browser
      do: Sign in as partner@example.com, open the mark, choose Request use, fill in the application class, the territory and the campaign dates, read the warning that the campaign end falls after the engagement end, then submit and open the request on the request desk route /requests
      cov: C-CF-75, C-CF-76, C-UF-09, C-UF-07
    - kind: pytest
      test: test_output.py::test_request_submission_records_chapter_and_policy_version
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_requester_reads_only_their_own_requests
      category: security
      weight: 5
    - kind: pytest
      test: test_output.py::test_invalid_request_body_names_the_field_and_writes_nothing
      category: validation
      weight: 3

- id: routing_follows_what_is_asked_for
  purpose: The stages a request needs are decided from the application class and the asset class
