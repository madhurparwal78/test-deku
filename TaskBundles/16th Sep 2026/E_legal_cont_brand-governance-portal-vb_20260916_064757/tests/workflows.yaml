      do: Sign in as reviewer@example.com, open the audit route /admin/audit, query by request identifier and read the acting principal, the address the action came from and the state before beside the state after for each transition
      cov: C-CF-115, C-CF-116, C-CF-118, C-CF-120, C-CF-121, C-UF-15
    - kind: pytest
      test: test_output.py::test_audit_record_is_written_once_per_transition
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_audit_record_cannot_be_altered_or_removed
      critical: true
      category: security
      weight: 5

- id: the_boundary_is_enforced_on_the_server
