      cov: C-CF-81, C-CF-88, C-CF-92
    - kind: pytest
      test: test_output.py::test_co_brand_application_class_adds_a_legal_stage
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_mark_asset_class_adds_a_second_distinct_reviewer_stage
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_request_always_names_exactly_one_holder
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_reviewer_is_never_assigned_their_own_request
      category: security
      weight: 5

- id: the_queue_is_ordered_by_its_stored_deadline
  purpose: A reviewer reads the waiting stages in deadline order with the routing explained
  substeps:
