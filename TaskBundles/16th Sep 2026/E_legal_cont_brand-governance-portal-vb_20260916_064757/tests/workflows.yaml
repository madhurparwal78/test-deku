- id: a_grant_cannot_outlive_its_engagement
  purpose: The minted grant ends at the earliest of the four candidate dates
  substeps:
    - kind: browser
      do: Sign in as reviewer@example.com and approve the first stage attaching a clear space condition, sign in as reviewer2@example.com and approve the legal stage, read the granted request showing the grant ending on the engagement end date rather than the campaign end date, then sign in as the partner and download the mark once the grant exists
      cov: C-CF-97, C-UF-11, C-UF-12, C-UF-13
    - kind: pytest
      test: test_output.py::test_grant_end_date_is_the_earliest_of_four_candidates
      critical: true
      category: data_integrity
      weight: 5
    - kind: pytest
      test: test_output.py::test_proof_required_condition_holds_the_grant_until_accepted
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_proof_upload_size_and_sniffed_type_are_enforced
      category: validation
      weight: 3

