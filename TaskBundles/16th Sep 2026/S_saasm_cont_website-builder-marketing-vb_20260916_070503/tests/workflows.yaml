      category: business_rule
      weight: 3
    - kind: browser
      do: Search a registered name, then a free name, and confirm one answers as unavailable while the other quotes a yearly price
      cov: C-CF-22 (earned: the browser reads the rendered answer while the pytest check reads the registry status field behind it)
    - kind: pytest
      test: test_output.py::test_domain_availability_answers_registered_name
      category: business_rule
      weight: 3
    - kind: pytest
      test: test_output.py::test_domain_availability_answers_free_name_price
