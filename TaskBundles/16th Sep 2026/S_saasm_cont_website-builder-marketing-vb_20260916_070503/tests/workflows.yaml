- id: platform_claims_ship_without_the_platform
  purpose: The copy sells an editor, a shop, automations and analytics, and none of them ships behind the sign-up
  substeps:
    - kind: browser
      do: Open the console and confirm no page editor ships, with no node tree, no session protocol, no undo, and that no site generation ships anywhere behind the sign-up
      cov: C-CN-01, C-CN-02
    - kind: browser
      do: Confirm no commerce ships, with no catalogue, no cart, no payment, no ledger, and that no automation engine, no analytics pipeline, no extension runtime ships
      cov: C-CN-03, C-CN-04
    - kind: browser
      do: Search a domain and confirm no custom domain is registered, delegated, pointed or certificated, and that the journey completes with no external network call happening at run time
      cov: C-CN-05, C-CN-07
    - kind: browser
      do: Complete a sign-up and confirm no outbound email of any kind is sent, the confirmation standing on its own
      cov: C-CN-06
    - kind: browser
      do: Confirm the home document arrives server-rendered, hydrating without re-rendering the tree, carrying the hero headline, the sub-headline and the primary button in the first response of a production build served behind a static or preview server rather than a dev server
      cov: C-TR-02, C-DC-07
    - kind: browser
      do: Drive the app through the browser and record the run
      cov: C-DC-06 (earned: the browser channel writes into the reserved screenshot directory at the app root during this very run, so the directory existing and starting empty is what the run itself observes), C-DC-11 (earned: the compose file this run brings up is the one the bundle ships, and it declares no edge function, no fixed container name and no custom network for the app)
