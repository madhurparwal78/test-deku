services:
  main:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4173:4173"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_DB: deku
      POSTGRES_USER: deku_admin
      POSTGRES_PASSWORD: deku-local-dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h postgres -p 5432 -q"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

volumes:
  postgres-data:
