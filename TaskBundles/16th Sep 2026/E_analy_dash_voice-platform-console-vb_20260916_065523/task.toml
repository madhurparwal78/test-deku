schema_version = "1.4"

[task]
name = "deku/voice-platform-console-vb"
version = "1.0.0"
description = "A governed console for a metered voice AI platform, where an organisation holds projects, projects hold scoped credentials, and usage reconciles from metering rows through daily rollups to an invoice."
authors = [
  "abhishek.shaw@ethara.ai",
  "sunil.kumar@ethara.ai"
]
uuid_v5 = "39034532-ca4b-5a6a-9354-4f77b4e35bff"
keywords = ["greenfield", "enterprise", "javascript", "postgres", "voice-platform-console"]

[metadata]
category     = "Greenfield"
sub_category = "enterprise"

domain          = "analytics-reporting"
pattern         = "dashboard-analytics"
service_profile = "P1-db"
variant_axes    = ["critical_depth", "data_shape"]
capability_flags = ""
task_code       = "E_analy_dash_voice-platform-console-vb_20260916_065523"
naming_scheme   = "task-code-v1"
design_direction = "companion"
launch_surface = "custom_404,no_broken_links,security_headers,single_cta,terms_page"
grader_version  = "0.22.0"

language     = "javascript"
archetype    = "voice-platform-console"
variant      = "b"
spec_sections_given = ["overview", "roles", "features", "flow", "uiux", "frontend", "techrequirements", "datamodel", "constraints", "contract"]
turns_expected  = 170
tokens_expected = 7000000
contributor_id  = "sunil.kumar@ethara.ai"
created_at      = "2026-09-16"
canary_present  = true

difficulty           = ""
reference_model_used = ""
pass_rate            = 0.0
pass_rate_ci         = [0.0, 0.0]
calibration_trials   = 0
harbor_version       = "0.20.0"

[metadata.services]
backend = "postgres"

[agent]
timeout_sec = 18000.0

[environment]
os                = "linux"
cpus              = 4
memory_mb         = 8192
storage_mb        = 20480
build_timeout_sec = 900.0
network_mode  = "public"
allowed_hosts = []
env = { APP_PUBLIC_PORT = "4173", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://main:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_URL = "${DB_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}" }

[environment.healthcheck]
command            = "pg_isready -h postgres -p 5432 -q"
interval_sec       = 5.0
timeout_sec        = 5.0
start_period_sec   = 60.0
start_interval_sec = 2.0
retries            = 60

[verifier]
environment_mode = "separate"
timeout_sec      = 3600.0
env = { ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}", ANTHROPIC_BASE_URL = "${ANTHROPIC_BASE_URL}", APP_PUBLIC_URL = "${APP_PUBLIC_URL:-http://localhost:4173}", DATABASE_URL = "${DATABASE_URL:-postgresql://deku_app:deku-local-dev@postgres:5432/deku}", DB_ADMIN_URL = "${DB_ADMIN_URL:-postgresql://deku_admin:deku-local-dev@postgres:5432/deku}", DEKU_SERVICE_BACKEND = "postgres" }

[delivery]
format = "harbor"
schema_version = "1.4"
reward_path = "/logs/verifier/reward.json"
reward_key = "reward"
reward_range = [0.0, 1.0]
reward_full = 1.0
network_policy = "public"

[delivery.images]
main = "python@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea"
postgres = "postgres@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412"

[[artifacts]]
source      = "/app"
destination = "app"
